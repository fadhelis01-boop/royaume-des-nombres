id: vallee-des-derivees
titre: La Vallée des Dérivées
sous_titre: Vitesse instantanée, nombre dérivé, tangentes et variations
emoji: 🏔️
couleur: "#283593"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 21
prerequis: [volcan-du-second-degre]
version: 1.0.0
intro:
  - neo: "La Vallée des Dérivées ! Ici on mesure la vitesse à laquelle les choses changent."
  - mia: "La pente d'une montagne, la vitesse d'une voiture à un instant précis, la croissance d'une plante…"
  - zero: "Ma vitesse instantanée est de 0. Je suis très stable. C'est un art."

lecons:
  - id: nombre-derive
    titre: Du taux de variation au nombre dérivé
    objectif: Je calcule un taux de variation et je comprends le nombre dérivé comme une vitesse instantanée.
    mots: [taux de variation, nombre dérivé]
    etapes:
      - dialogue:
          - neo: "Je fais 120 km en 2 h : vitesse moyenne 60 km/h. Mais à 10 h 15 précises, le compteur indiquait combien ?"
          - mia: "Pour le savoir, on calcule la vitesse moyenne sur des durées de plus en plus petites… à la limite, c'est la vitesse instantanée !"
      - texte: |
          **Taux de variation** de $f$ entre $a$ et $a + h$ (la pente de la « corde ») :
          $$\frac{f(a+h) - f(a)}{h}$$

          **Nombre dérivé** en $a$ : la limite de ce taux quand $h$ tend vers 0 :
          $$f'(a) = \lim_{h \to 0} \frac{f(a+h) - f(a)}{h}$$
          C'est la **pente de la tangente** à la courbe au point d'abscisse $a$.

          Exemple : $f(x) = x^2$, $\dfrac{(a+h)^2 - a^2}{h} = 2a + h \to 2a$. Donc $f'(a) = 2a$.
      - visuel:
          type: graphe
          xmin: -1
          xmax: 4
          ymin: -2
          ymax: 10
          fonctions: [{ f: "x^2", nom: "x²" }, { f: "4*x-4", nom: "tangente en 2 : pente 4" }]
          points: [{ x: 2, y: 4, label: "(2 ; 4)" }]
      - histoire:
          titre: Newton et Leibniz
          texte: "Isaac Newton (pour étudier le mouvement des planètes) et Gottfried Wilhelm Leibniz ont inventé indépendamment le calcul différentiel à la fin du XVIIᵉ siècle. Les notations que nous utilisons, comme $\\frac{dy}{dx}$, viennent de Leibniz ; le prime $f'$ a été popularisé plus tard par Lagrange."
      - a_quoi_ca_sert: "La vitesse et l'accélération en physique, le coût marginal en économie, la vitesse de propagation d'une épidémie, l'apprentissage des intelligences artificielles (descente de gradient)…"
      - question:
          type: nombre
          vars: { a: "1..5", h: [1, 2] }
          enonce: "$f(x) = x^2$. Taux de variation entre {{a}} et {{a+h}} ?"
          reponse: "2*a+h"
          correction: "$\\frac{ {{(a+h)^2}} - {{a*a}} }{ {{h}} } = {{2*a+h}}$"
      - astuce:
          texte: "Le nombre dérivé, c'est la pente de la courbe en un point : la vitesse au moment précis où on regarde, comme l'aiguille du compteur de vitesse."
          qui: mia
    exercices:
      - type: nombre
        vars: { a: "-3..5", h: [1, 2, 3] }
        enonce: "$f(x) = x^2$. Taux de variation entre {{nb(a)}} et {{nb(a+h)}} ?"
        reponse: "2*a+h"
        correction: "{{nb(2*a+h)}}"
      - type: nombre
        vars: { a: "-5..6" }
        enonce: "$f(x) = x^2$. Que vaut $f'({{nb(a)}})$ ?"
        reponse: "2*a"
        correction: "$f'(a) = 2a = {{nb(2*a)}}$"
      - type: nombre
        vars: { m: "2..9", p: "-9..9", a: "-5..5" }
        enonce: "$f(x) = {{m}}x + ({{nb(p)}})$. Que vaut $f'({{nb(a)}})$ ?"
        reponse: "m"
        correction: "Pour une fonction affine, la pente est la même partout : $f'({{nb(a)}}) = {{m}}$."

  - id: derivees-usuelles
    titre: Les fonctions dérivées usuelles
    objectif: Je connais les dérivées des fonctions de référence.
    mots: [fonction dérivée]
    etapes:
      - dialogue:
          - mia: "Plutôt que de recalculer une limite à chaque fois, on apprend un petit tableau par cœur."
          - neo: "Avec lui, je dérive n'importe quel polynôme en quelques secondes !"
      - texte: |
          | $f(x)$ | $f'(x)$ |
          |---|---|
          | $k$ (constante) | $0$ |
          | $x$ | $1$ |
          | $x^2$ | $2x$ |
          | $x^n$ | $n\,x^{n-1}$ |
          | $\dfrac{1}{x}$ | $-\dfrac{1}{x^2}$ |
          | $\sqrt{x}$ | $\dfrac{1}{2\sqrt{x}}$ |
          | $e^x$ | $e^x$ |
          | $\ln x$ | $\dfrac{1}{x}$ |
          | $\sin x$ | $\cos x$ |
          | $\cos x$ | $-\sin x$ |
      - a_quoi_ca_sert: "Toutes les sciences utilisent ce tableau : physique, chimie, biologie, économie, ingénierie, informatique."
      - question:
          type: expression
          vars: { n: "2..7" }
          enonce: "Dérivée de $f(x) = x^{ {{n}} }$ ?"
          reponse: "{{n}}x^{{n-1}}"
          variables: [x]
          correction: "$f'(x) = {{n}}x^{ {{n-1}} }$"
      - astuce:
          texte: "(xⁿ)' = n xⁿ⁻¹ : l'exposant descend devant et on lui enlève 1. Et (eˣ)' = eˣ : l'exponentielle est sa propre dérivée."
          qui: neo
    exercices:
      - type: expression
        vars: { n: "2..9" }
        enonce: "$f(x) = x^{ {{n}} }$. Écris $f'(x)$."
        reponse: "{{n}}x^{{n-1}}"
        variables: [x]
        correction: "${{n}}x^{ {{n-1}} }$"
      - type: qcm
        vars: { f: [["\\sqrt{x}", "\\frac{1}{2\\sqrt{x}}"], ["\\frac{1}{x}", "-\\frac{1}{x^2}"], ["e^x", "e^x"], ["\\ln x", "\\frac{1}{x}"], ["\\sin x", "\\cos x"], ["\\cos x", "-\\sin x"]] }
        enonce: "Dérivée de $f(x) = {{f_0}}$ ?"
        choix: ["${{f_1}}$", "${{si(f_1=='e^x','x e^{x-1}','e^x')}}$", "${{si(f_1=='\\cos x','-\\cos x','\\sin x')}}$", "$x$"]
        correction: "$f'(x) = {{f_1}}$"
      - type: nombre
        vars: { k: "-9..9" }
        enonce: "Dérivée de la fonction constante $f(x) = {{nb(k)}}$ ?"
        reponse: "0"
        correction: "Une constante ne varie pas : sa dérivée est 0. (Zéro adore les constantes.)"

  - id: regles-derivation
    titre: Les règles de dérivation
    objectif: Je dérive une somme, un produit par une constante, un produit et un quotient.
    mots: [dérivation]
    etapes:
      - dialogue:
          - neo: "(3x² + 5x − 7)' = 6x + 5. On dérive morceau par morceau !"
          - mia: "Pour un produit, c'est plus subtil : (uv)' = u'v + uv'."
      - texte: |
          $$(u + v)' = u' + v' \qquad (ku)' = k\,u' \qquad (uv)' = u'v + uv' \qquad \left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$$

          Exemple : $(x^2 \times \sqrt{x})' = 2x\sqrt{x} + x^2 \times \dfrac{1}{2\sqrt{x}}$.
      - attention:
          texte: "$(uv)' \\neq u'v'$ ! Par exemple $(x \\cdot x)' = (x^2)' = 2x$, alors que $x' \\cdot x' = 1$."
          qui: neo
      - a_quoi_ca_sert: "Dériver n'importe quelle formule de la physique ou de l'économie, et donc étudier ses variations."
      - question:
          type: expression
          vars: { a: "2..9", b: "-9..9", c: "-9..9" }
          enonce: "Dérive $f(x) = {{a}}x^2 + ({{nb(b)}})x + ({{nb(c)}})$."
          reponse: "{{2*a}}x+({{b}})"
          variables: [x]
          correction: "$f'(x) = {{2*a}}x + ({{nb(b)}})$"
      - astuce:
          texte: "(uv)' = u'v + uv' : on dérive l'un en gardant l'autre, puis l'inverse. Et (u/v)' = (u'v − uv') / v² : le moins est au milieu, le carré en bas."
          qui: zero
    exercices:
      - type: expression
        vars: { a: "1..6", b: "-9..9", c: "-9..9", d: "-9..9" }
        enonce: "Dérive $f(x) = {{a}}x^3 + ({{nb(b)}})x^2 + ({{nb(c)}})x + ({{nb(d)}})$."
        reponse: "{{3*a}}x^2+({{2*b}})x+({{c}})"
        variables: [x]
        correction: "$f'(x) = {{3*a}}x^2 + ({{nb(2*b)}})x + ({{nb(c)}})$"
      - type: expression
        vars: { a: "1..5", b: "1..5" }
        enonce: "Dérive $f(x) = ({{a}}x + 1)({{b}}x - 2)$ (avec la règle du produit, ou en développant)."
        reponse: "{{a}}({{b}}x-2)+{{b}}({{a}}x+1)"
        variables: [x]
        correction: "$f'(x) = {{a}}({{b}}x - 2) + ({{a}}x + 1) \\times {{b}} = {{2*a*b}}x + ({{nb(b-2*a)}})$"
      - type: nombre
        vars: { a: "1..4", x: "1..3" }
        enonce: "$f(x) = \\frac{ {{a}} }{x}$. Calcule $f'({{x}})$ (une fraction ou un décimal)."
        reponse: "-a/(x*x)"
        correction: "$f'(x) = -\\frac{ {{a}} }{x^2}$ donc $f'({{x}}) = {{frac(-a,x*x)}}$"

  - id: variations-extremums
    titre: Variations et extremums
    objectif: J'utilise le signe de la dérivée pour trouver les variations et les extremums d'une fonction.
    mots: [variations, extremum, tableau de variations]
    etapes:
      - dialogue:
          - mia: "Quand la dérivée est positive, la courbe monte. Négative : elle descend !"
          - neo: "Et quand elle s'annule en changeant de signe, on est au sommet d'une colline ou au fond d'une vallée : un extremum."
      - texte: |
          - $f' > 0$ sur un intervalle → $f$ est **croissante** ;
          - $f' < 0$ → $f$ est **décroissante** ;
          - si $f'$ s'annule **en changeant de signe** en $a$, alors $f$ admet un **extremum** (maximum ou minimum) en $a$.

          Exemple : $f(x) = x^3 - 3x$, $f'(x) = 3x^2 - 3 = 3(x-1)(x+1)$ → maximum en $-1$ ($f(-1) = 2$), minimum en $1$ ($f(1) = -2$).
      - visuel:
          type: graphe
          xmin: -2.5
          xmax: 2.5
          ymin: -4
          ymax: 4
          fonctions: [{ f: "x^3-3*x", nom: "x³ − 3x" }]
          points: [{ x: -1, y: 2, label: "max" }, { x: 1, y: -2, label: "min" }]
      - a_quoi_ca_sert: "Maximiser un bénéfice, minimiser la quantité de matériau d'une boîte, trouver le moment où une épidémie atteint son pic, régler un algorithme d'apprentissage automatique…"
      - question:
          type: nombre
          vars: { a: [1, 2, 3], s: "-4..4", c: "-5..5" }
          enonce: "$f(x) = {{a}}x^2 + ({{nb(-2*a*s)}})x + ({{nb(c)}})$. En quelle valeur $f'(x) = 0$ ?"
          reponse: "s"
          correction: "$f'(x) = {{2*a}}x + ({{nb(-2*a*s)}}) = 0 \\iff x = {{nb(s)}}$ (c'est le minimum)."
      - astuce:
          texte: "f' > 0 : f monte ; f' < 0 : f descend. Un extremum est là où f' change de signe, pas seulement là où elle s'annule."
          qui: mia
    exercices:
      - type: liste
        vars: { r: "1..4" }
        enonce: "$f(x) = x^3 - {{3*r*r}}x$. Pour quelles valeurs $f'(x) = 0$ ?"
        reponse: ["r", "-r"]
        correction: "$f'(x) = 3x^2 - {{3*r*r}} = 3(x - {{r}})(x + {{r}})$ : $x = \\pm {{r}}$."
      - type: qcm
        vars: { a: "-5..5" }
        si: "a != 0"
        enonce: "Sur un intervalle, $f'(x) = {{nb(a)}}$ pour tout $x$. Alors $f$ est…"
        choix: ["{{si(a>0,'croissante','décroissante')}}", "{{si(a>0,'décroissante','croissante')}}", "constante"]
        correction: "$f'$ est {{si(a>0,'positive : f croît.','négative : f décroît.')}}"
      - type: nombre
        vars: { r: "1..3" }
        enonce: "$f(x) = x^3 - {{3*r*r}}x$. Valeur du maximum local (en $x = -{{r}}$) ?"
        reponse: "2*r^3"
        correction: "$f(-{{r}}) = -{{r^3}} + {{3*r^3}} = {{2*r^3}}$"
      - type: nombre
        vars: { l: [12, 18, 24, 30] }
        enonce: "On découpe des carrés de côté $x$ aux coins d'une plaque carrée de {{l}} cm pour faire une boîte sans couvercle de volume $V(x) = x({{l}} - 2x)^2$. Quel $x$ rend le volume maximal ?"
        reponse: "l/6"
        unite: cm
        indice: "$V'(x) = ({{l}} - 2x)({{l}} - 6x)$."
        correction: "$V'(x) = 0$ pour $x = {{l/2}}$ (volume nul) ou $x = \\frac{ {{l}} }{6} = {{l/6}}$ cm : c'est le maximum."

  - id: tangente
    titre: L'équation de la tangente
    objectif: J'écris l'équation de la tangente à une courbe en un point.
    mots: [tangente]
    etapes:
      - dialogue:
          - neo: "La tangente, c'est la droite qui « frôle » la courbe en un point, avec la même pente."
          - mia: "Sa pente, c'est f'(a). Et elle passe par le point (a ; f(a))."
      - texte: |
          La tangente à la courbe de $f$ au point d'abscisse $a$ a pour équation :
          $$y = f'(a)(x - a) + f(a)$$
          Exemple : $f(x) = x^2$ en $a = 3$ : $f(3) = 9$, $f'(3) = 6$ → $y = 6(x - 3) + 9 = 6x - 9$.
      - a_quoi_ca_sert: "Approcher une courbe par une droite (approximation affine), calculer la trajectoire d'un objet qui s'échappe d'un mouvement circulaire, les méthodes numériques (méthode de Newton)…"
      - question:
          type: expression
          vars: { a: "1..5" }
          enonce: "Équation de la tangente à $y = x^2$ au point d'abscisse {{a}} : $y = \\;?$"
          reponse: "{{2*a}}x-{{a*a}}"
          variables: [x]
          correction: "$y = {{2*a}}(x - {{a}}) + {{a*a}} = {{2*a}}x - {{a*a}}$"
      - astuce:
          texte: "y = f'(a)(x − a) + f(a) : il te faut deux nombres, la pente f'(a) et le point f(a). Calcule-les d'abord, puis remplace."
          qui: neo
    exercices:
      - type: expression
        vars: { a: "-4..4" }
        si: "a != 0"
        enonce: "Tangente à $y = x^2$ en $x = {{nb(a)}}$ : $y = \\;?$"
        reponse: "{{2*a}}x-({{a*a}})"
        variables: [x]
        correction: "$y = {{nb(2*a)}}x - {{a*a}}$"
      - type: expression
        vars: { a: "1..3" }
        enonce: "Tangente à $y = x^3$ en $x = {{a}}$ : $y = \\;?$"
        reponse: "{{3*a*a}}x-{{2*a^3}}"
        variables: [x]
        correction: "$f'({{a}}) = {{3*a*a}}$, $f({{a}}) = {{a^3}}$ : $y = {{3*a*a}}(x - {{a}}) + {{a^3}} = {{3*a*a}}x - {{2*a^3}}$"
      - type: nombre
        vars: { a: "1..4" }
        enonce: "Pente de la tangente à $y = \\frac{1}{x}$ au point d'abscisse {{a}} ?"
        reponse: "-1/(a*a)"
        correction: "$-\\frac{1}{ {{a}}^2 } = {{frac(-1,a*a)}}$"

  - id: derivee-composee
    titre: Dériver une fonction composée
    objectif: Je dérive des fonctions comme (ax + b)ⁿ, √u, e^u, ln u.
    mots: [fonction composée]
    etapes:
      - dialogue:
          - mia: "(3x + 1)⁵, je ne vais pas tout développer !"
          - neo: "Règle de la chaîne : on dérive « l'extérieur » puis on multiplie par la dérivée de « l'intérieur »."
      - texte: |
          $$\left(f(u)\right)' = u' \times f'(u)$$
          - $\left((ax+b)^n\right)' = n\,a\,(ax+b)^{n-1}$
          - $\left(\sqrt{u}\right)' = \dfrac{u'}{2\sqrt{u}}$ · $\left(e^{u}\right)' = u'\,e^{u}$ · $\left(\ln u\right)' = \dfrac{u'}{u}$
      - a_quoi_ca_sert: "Les modèles réels sont presque toujours composés : décroissance radioactive $e^{-kt}$, oscillations $\\sin(\\omega t)$, croissance logistique… et les réseaux de neurones (rétropropagation = règle de la chaîne !)."
      - question:
          type: expression
          vars: { a: "2..5", b: "1..5", n: "2..5" }
          enonce: "Dérive $f(x) = ({{a}}x + {{b}})^{ {{n}} }$."
          reponse: "{{n*a}}({{a}}x+{{b}})^{{n-1}}"
          variables: [x]
          correction: "$f'(x) = {{n}} \\times {{a}} \\times ({{a}}x + {{b}})^{ {{n-1}} } = {{n*a}}({{a}}x + {{b}})^{ {{n-1}} }$"
      - astuce:
          texte: "Pour une fonction « emboîtée », dérive l'extérieur puis multiplie par la dérivée de l'intérieur : (e^u)' = u' e^u."
          qui: zero
    exercices:
      - type: expression
        vars: { a: "2..6", b: "-5..5", n: "2..6" }
        enonce: "Dérive $f(x) = ({{a}}x + ({{nb(b)}}))^{ {{n}} }$."
        reponse: "{{n*a}}({{a}}x+({{b}}))^{{n-1}}"
        variables: [x]
        correction: "${{n*a}}({{a}}x + ({{nb(b)}}))^{ {{n-1}} }$"
      - type: expression
        vars: { k: "2..9" }
        enonce: "Dérive $f(x) = e^{ {{k}}x }$."
        reponse: "{{k}}exp({{k}}x)"
        variables: [x]
        correction: "$f'(x) = {{k}}e^{ {{k}}x }$"
      - type: expression
        vars: { a: "2..9", b: "1..9" }
        enonce: "Dérive $f(x) = \\ln({{a}}x + {{b}})$ (pour $x > 0$)."
        reponse: "{{a}}/({{a}}x+{{b}})"
        variables: [x]
        correction: "$f'(x) = \\frac{ {{a}} }{ {{a}}x + {{b}} }$"

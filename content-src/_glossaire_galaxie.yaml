# Le Grand Livre — sciences et arts (chimie, physique, biologie, Terre & Univers, musique, dessin).
# Même format que _glossaire.yaml ; « monde » indique où l'apprendre (et donc la planète).

# Chimie
- { mot: "Atome", def: "Plus petite partie d'un élément chimique : un noyau (protons et neutrons) entouré d'électrons.", exemple: "L'atome d'hydrogène a 1 proton et 1 électron.", source: "Programmes de physique-chimie, cycle 4", monde: ch-atelier-des-atomes }
- { mot: "Molécule", def: "Assemblage d'atomes liés entre eux. On l'écrit avec une formule chimique.", exemple: "H₂O : 2 atomes d'hydrogène et 1 d'oxygène.", source: "Programmes de physique-chimie, cycle 4", monde: ch-atelier-des-atomes }
- { mot: "Dissolution", def: "Mélange d'un soluté dans un solvant où le soluté devient invisible ; il ne disparaît pas et la masse se conserve.", exemple: "Le sucre se dissout dans le thé.", source: "Programmes de sciences, cycle 3", monde: ch-mare-des-etats }
- { mot: "Transformation chimique", def: "Transformation où des réactifs disparaissent et de nouvelles substances (produits) apparaissent.", exemple: "Vinaigre + bicarbonate → dioxyde de carbone (et d'autres produits).", source: "Programmes de physique-chimie, cycle 4", monde: ch-grotte-des-particules }
- { mot: "pH", def: "Nombre de 0 à 14 qui mesure l'acidité d'une solution : < 7 acide, 7 neutre, > 7 basique.", exemple: "Le jus de citron a un pH d'environ 2.", source: "Programmes de physique-chimie, cycle 4", monde: ch-atelier-des-atomes }
- { mot: "Mole", def: "Unité de quantité de matière : une mole contient 6,022 × 10²³ entités (constante d'Avogadro).", exemple: "18 g d'eau contiennent 1 mol de molécules d'eau.", source: "Programme de physique-chimie, seconde", monde: ch-tour-de-la-mole }
- { mot: "Combustion", def: "Réaction chimique entre un combustible et un comburant (souvent le dioxygène), qui libère de l'énergie.", exemple: "Le bois qui brûle dans la cheminée.", source: "Programmes de physique-chimie, cycle 4", monde: ch-grotte-des-particules }
- { mot: "Catalyseur", def: "Espèce qui accélère une réaction chimique sans être consommée.", exemple: "Les enzymes sont des catalyseurs biologiques.", source: "Programme de physique-chimie, terminale", monde: ch-laboratoire-royal }
# Physique
- { mot: "Force", def: "Action qui peut mettre en mouvement, arrêter, dévier ou déformer un objet. Elle se mesure en newtons (N).", exemple: "Le poids est une force exercée par la Terre.", source: "Programmes de physique-chimie, cycle 4", monde: ph-pic-du-mouvement }
- { mot: "Vitesse", def: "Distance parcourue par unité de temps : v = d / t.", exemple: "100 m en 10 s : 10 m/s.", source: "Programmes de physique-chimie, cycle 4", monde: ph-pic-du-mouvement }
- { mot: "Poids", def: "Force d'attraction d'un astre sur un objet : P = m × g. À ne pas confondre avec la masse.", exemple: "Sur la Lune, on pèse environ 6 fois moins que sur Terre, avec la même masse.", source: "Programmes de physique-chimie, cycle 4", monde: ph-pic-du-mouvement }
- { mot: "Tension électrique", def: "Grandeur mesurée en volts (V) avec un voltmètre branché en dérivation.", exemple: "Une pile plate fournit 4,5 V.", source: "Programmes de physique-chimie, cycle 4", monde: ph-forge-des-courants }
- { mot: "Intensité électrique", def: "Débit d'électricité dans un circuit, mesuré en ampères (A) avec un ampèremètre en série.", exemple: "En série, l'intensité est la même partout.", source: "Programmes de physique-chimie, cycle 4", monde: ph-forge-des-courants }
- { mot: "Énergie", def: "Grandeur qui se conserve et se transforme (cinétique, potentielle, thermique, électrique…). Elle se mesure en joules (J).", exemple: "Une éolienne convertit l'énergie du vent en énergie électrique.", source: "Programmes de physique-chimie, cycle 4 et lycée", monde: ph-sommet-de-l-energie }
- { mot: "Fréquence", def: "Nombre de répétitions par seconde d'un phénomène périodique, en hertz (Hz).", exemple: "Le La du diapason vibre à 440 Hz.", source: "Programmes de physique-chimie, cycle 4", monde: ph-gorge-des-ondes }
- { mot: "Réfraction", def: "Changement de direction de la lumière quand elle passe d'un milieu transparent à un autre.", exemple: "La paille semble cassée dans un verre d'eau.", source: "Programme de physique-chimie, seconde", monde: ph-gorge-des-ondes }
# Biologie
- { mot: "Cellule", def: "Unité de base de tous les êtres vivants, entourée d'une membrane, avec un noyau (sauf chez les bactéries).", exemple: "Le corps humain compte environ 30 000 milliards de cellules.", source: "Programmes de SVT, cycle 4", monde: bio-palais-du-corps }
- { mot: "Photosynthèse", def: "Fabrication de matière (sucres) par les plantes à partir de CO₂, d'eau et de lumière, avec rejet de dioxygène.", exemple: "Le bois d'un arbre vient surtout du CO₂ de l'air.", source: "Programmes de SVT, cycle 3 et 4", monde: bio-jardin-des-fonctions }
- { mot: "ADN", def: "Molécule en double hélice qui porte l'information génétique, écrite avec 4 bases (A, T, G, C).", exemple: "A s'associe à T, G à C.", source: "Programmes de SVT, cycle 4 et lycée", monde: bio-tour-de-l-adn }
- { mot: "Gène", def: "Portion d'ADN qui porte une information, souvent pour fabriquer une protéine.", exemple: "Un gène existe en plusieurs versions : les allèles.", source: "Programmes de SVT, cycle 4", monde: bio-tour-de-l-adn }
- { mot: "Écosystème", def: "Un milieu de vie, les êtres vivants qui l'habitent et toutes leurs relations.", exemple: "Une mare avec ses plantes, ses insectes, ses grenouilles.", source: "Programmes de SVT, cycle 3", monde: bio-jardin-des-fonctions }
- { mot: "Sélection naturelle", def: "Mécanisme de l'évolution : les individus les mieux adaptés à leur milieu survivent et se reproduisent davantage.", exemple: "Des bactéries résistantes aux antibiotiques deviennent plus fréquentes.", source: "Programmes de SVT, cycle 4", monde: bio-tour-de-l-adn }
- { mot: "Vaccin", def: "Préparation qui entraîne la mémoire du système immunitaire contre un microbe, sans rendre malade.", exemple: "La variole a disparu grâce à la vaccination (1980).", source: "Organisation mondiale de la santé ; programmes de SVT, cycle 4", monde: bio-tour-de-l-adn }
- { mot: "Métamorphose", def: "Grande transformation du corps au cours du cycle de vie d'un animal.", exemple: "La chenille devient papillon.", source: "Programmes de sciences, cycle 2", monde: bio-sous-bois-des-cycles }
# Terre & Univers
- { mot: "Rotation", def: "Mouvement d'un astre qui tourne sur lui-même. La Terre fait un tour en 24 heures : c'est l'alternance du jour et de la nuit.", exemple: "Quand il fait jour en France, il fait nuit en Australie.", source: "Programmes de sciences, cycle 3", monde: uni-cour-du-jour-et-de-la-nuit }
- { mot: "Révolution", def: "Mouvement d'un astre autour d'un autre. La Terre tourne autour du Soleil en environ 365 jours et 6 heures.", exemple: "Tous les 4 ans, une année bissextile compte 366 jours.", source: "Programmes de sciences, cycle 3", monde: uni-systeme-solaire }
- { mot: "Année-lumière", def: "Distance parcourue par la lumière en un an, environ 9 500 milliards de kilomètres.", exemple: "L'étoile la plus proche est à 4,2 années-lumière.", source: "Programmes de physique-chimie, cycle 4", monde: uni-lunette-de-l-astronome }
- { mot: "Effet de serre", def: "Phénomène naturel par lequel certains gaz de l'atmosphère retiennent une partie de la chaleur émise par la Terre ; renforcé par les activités humaines.", exemple: "Sans lui, la Terre serait à environ −18 °C en moyenne.", source: "GIEC ; programmes de SVT, cycle 4", monde: uni-planete-vivante }
- { mot: "Tectonique des plaques", def: "Théorie selon laquelle la surface de la Terre est découpée en plaques mobiles qui se déplacent de quelques centimètres par an.", exemple: "L'Himalaya naît de la collision de deux plaques.", source: "Programmes de SVT, cycle 4", monde: uni-planete-vivante }
- { mot: "Galaxie", def: "Immense ensemble d'étoiles, de gaz et de poussières lié par la gravitation.", exemple: "Notre galaxie, la Voie lactée, compte 100 à 400 milliards d'étoiles.", source: "Programmes de physique-chimie, lycée", monde: uni-vie-des-etoiles }
- { mot: "Climat", def: "Conditions météorologiques moyennes d'une région sur une longue période (au moins 30 ans).", exemple: "Le climat méditerranéen : étés chauds et secs.", source: "Organisation météorologique mondiale", monde: uni-planete-vivante }
# Musique
- { mot: "Pulsation", def: "Battement régulier qui sert de repère dans la musique, comme un cœur.", exemple: "On tape du pied sur la pulsation.", source: "Programmes d'éducation musicale, cycle 2", monde: mu-place-des-sons }
- { mot: "Portée", def: "Ensemble de 5 lignes sur lesquelles on écrit les notes ; plus une note est haute, plus elle est aiguë.", exemple: "En clé de sol, le sol est sur la 2ᵉ ligne.", source: "Programmes d'éducation musicale, cycle 3", monde: mu-rue-des-notes }
- { mot: "Gamme", def: "Suite de notes rangées de la plus grave à la plus aiguë, selon un schéma de tons et demi-tons.", exemple: "Gamme majeure : T T ½ T T T ½.", source: "Théorie de la musique (Danhauser)", monde: mu-theatre-des-gammes }
- { mot: "Accord", def: "Plusieurs notes jouées ensemble. L'accord parfait majeur superpose une tierce majeure et une tierce mineure.", exemple: "Do-mi-sol est l'accord de do majeur.", source: "Théorie de la musique (Danhauser)", monde: mu-theatre-des-gammes }
- { mot: "Tempo", def: "Vitesse de la pulsation, en battements par minute (BPM).", exemple: "Adagio : lent ; allegro : rapide.", source: "Programmes d'éducation musicale, cycle 3", monde: mu-place-des-sons }
- { mot: "Timbre", def: "Couleur d'un son, qui permet de reconnaître un instrument ; elle dépend du mélange des harmoniques.", exemple: "Une flûte et un violon jouant le même La ne sonnent pas pareil.", source: "Programmes de physique-chimie et d'éducation musicale", monde: mu-tour-des-harmoniques }
- { mot: "Octave", def: "Intervalle entre deux notes de même nom, la plus aiguë ayant une fréquence double.", exemple: "La4 = 440 Hz, La5 = 880 Hz.", source: "Acoustique musicale", monde: mu-tour-des-harmoniques }
# Dessin
- { mot: "Point de fuite", def: "Point de la ligne d'horizon où semblent se rejoindre les lignes parallèles qui s'éloignent.", exemple: "Les bords d'une route droite convergent vers le point de fuite.", source: "Programmes d'arts plastiques, cycle 4", monde: de-galerie-des-perspectives }
- { mot: "Couleurs primaires", def: "En peinture : rouge (magenta), jaune et bleu (cyan) ; on ne peut pas les obtenir par mélange.", exemple: "Jaune + bleu = vert.", source: "Programmes d'arts plastiques, cycle 2", monde: de-atelier-des-traits }
- { mot: "Couleurs complémentaires", def: "Couleurs opposées sur le cercle chromatique ; côte à côte, elles se renforcent.", exemple: "Rouge et vert, bleu et orange, jaune et violet.", source: "Programmes d'arts plastiques, cycle 3", monde: de-salle-des-volumes }
- { mot: "Symétrie", def: "Propriété d'une figure dont les deux moitiés se superposent par pliage le long d'un axe.", exemple: "Les ailes d'un papillon sont symétriques.", source: "Programmes de mathématiques et d'arts plastiques, cycle 3", monde: de-jardin-des-formes }
- { mot: "Ombre portée", def: "Ombre qu'un objet projette sur une surface, à l'opposé de la source de lumière.", exemple: "Le soleil à gauche, l'ombre est à droite.", source: "Programmes d'arts plastiques, cycle 3", monde: de-salle-des-volumes }
- { mot: "Clair-obscur", def: "Technique de peinture qui oppose des zones très éclairées à des zones très sombres.", exemple: "Les tableaux du Caravage.", source: "Histoire des arts, cycle 4", monde: de-musee-des-maitres }

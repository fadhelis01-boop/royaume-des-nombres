id: hg-carrefour-des-puissances
matiere: histoire
titre: Le Carrefour des Puissances
sous_titre: Spécialité HGGSP - démocratie, puissance, frontières, information, guerre et paix, mémoires, environnement
emoji: 🌐
couleur: "#4e342e"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 803
specialite: HGGSP
version: 1.0.0
intro:
  - narrateur: "Au centre du Forum, un carrefour : sept rues partent vers sept grandes questions du monde, de la démocratie athénienne aux océans."
  - mia: "C'est la spécialité HGGSP : histoire-géographie, géopolitique et sciences politiques. On croise les disciplines pour comprendre un enjeu."
  - neo: "Ici, on ne se contente pas de décrire : on compare, on définit, on argumente."

lecons:
  - id: democratie
    titre: Comprendre un régime politique, la démocratie
    classe: "1ʳᵉ"
    objectif: Je compare la démocratie directe d'Athènes et la démocratie représentative, et je connais les avancées et les reculs de la démocratie.
    mots: [démocratie, citoyenneté, représentation, souveraineté]
    etapes:
      - dialogue:
          - zero: "Athènes, c'était une démocratie parfaite : tout le monde votait !"
          - neo: "Tous les citoyens… mais les femmes, les esclaves et les étrangers n'étaient pas citoyens. Environ un habitant sur dix seulement."
      - a_quoi_ca_sert: "Comprendre comment la démocratie s'est construite, et comment elle peut reculer, aide à voter, à débattre et à défendre ses droits."
      - texte: |
          **Athènes (Vᵉ siècle av. J.-C.)** : démocratie **directe**. Les citoyens votent les lois à l'**Ecclésia** ; beaucoup de charges sont tirées au sort. Mais la citoyenneté est réservée aux hommes libres nés de parents athéniens.

          **Démocratie représentative** (XVIIIᵉ siècle) : le peuple **souverain** élit des représentants (révolutions américaine et française). Le suffrage s'élargit peu à peu : suffrage universel masculin en France en 1848, vote des femmes en 1944.

          **Avancées et reculs** : la démocratie peut s'effondrer (coup d'État, régimes autoritaires des années 1930) ou s'étendre (décolonisations, chute des dictatures en Europe dans les années 1970, fin des régimes communistes en 1989).
      - attention: "Démocratie ne veut pas seulement dire « élections » : il faut aussi des libertés (presse, opinion), la séparation des pouvoirs et l'État de droit."
      - astuce: { texte: "Directe = le peuple décide lui-même ; représentative = le peuple choisit ceux qui décident.", qui: zero }
      - retiens: "Athènes : démocratie **directe**, citoyenneté **restreinte**. Démocratie **représentative** : peuple **souverain** qui élit, suffrage élargi (1848, 1944). La démocratie connaît des **avancées** et des **reculs**."
    exercices:
      - type: classer
        enonce: "Range chaque caractéristique : démocratie directe ou représentative ?"
        categories: ["Directe", "Représentative"]
        mots: [["Les citoyens votent eux-mêmes chaque loi", 0], ["Les députés votent les lois au nom du peuple", 1], ["Des charges sont tirées au sort", 0], ["On élit un Parlement tous les cinq ans", 1]]
        correction: "Directe : le peuple décide ; représentative : il élit ceux qui décident."
      - type: qcm
        enonce: "Qui était exclu de la citoyenneté à Athènes ?"
        choix: ["Les femmes, les esclaves et les étrangers", "Les paysans", "Les hommes de plus de 50 ans", "Personne"]
        correction: "La citoyenneté était réservée aux hommes libres nés de parents athéniens."
      - type: relier
        enonce: "🔗 Relie chaque date à l'élargissement du suffrage en France."
        paires: [["1848", "suffrage universel masculin"], ["1944", "droit de vote des femmes"], ["1974", "majorité électorale à 18 ans"]]
        correction: "Le corps électoral s'élargit par étapes."
      - type: vf
        vars: { t: [["Une démocratie se résume à organiser des élections.", false], ["L'Ecclésia était l'assemblée des citoyens athéniens.", true], ["La démocratie peut reculer, comme dans les années 1930.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Démocratie = élections, libertés et État de droit ; l'Ecclésia votait les lois ; les années 1930 voient des reculs."

  - id: puissance
    titre: Les dynamiques des puissances
    classe: "1ʳᵉ"
    objectif: Je définis la puissance et je distingue hard power et soft power, en m'appuyant sur des exemples.
    mots: [puissance, hard power, soft power, influence]
    etapes:
      - dialogue:
          - mia: "Les États-Unis ont la première armée du monde. Mais pourquoi tant de gens dans le monde regardent leurs séries ?"
          - neo: "Parce que la puissance, ce n'est pas seulement la force : c'est aussi la capacité à séduire et à influencer."
      - a_quoi_ca_sert: "Lire l'actualité internationale (rivalités sino-américaines, sanctions, Jeux olympiques, culture) demande de savoir ce qui fait la puissance d'un État."
      - texte: |
          **La puissance** : la capacité d'un acteur à **imposer sa volonté** ou à **influencer** les autres.

          **Hard power** (puissance « dure ») : armée, contrainte, sanctions économiques.

          **Soft power** (puissance « douce », notion de Joseph Nye) : attractivité de la culture, de la langue, des universités, du mode de vie.

          **Les fondements de la puissance** : territoire et population, économie, technologie, armée, diplomatie, culture.

          **Exemples** : les **États-Unis** cumulent hard et soft power ; la **Chine** affirme sa puissance économique et technologique (« Nouvelles routes de la soie ») ; la **Russie** s'appuie surtout sur la force militaire et l'énergie.
      - attention: "La puissance est **relative** : on est puissant par rapport aux autres, et elle peut décliner (Empire ottoman, URSS)."
      - astuce: { texte: "Hard = contraindre, soft = séduire. Aujourd'hui on parle aussi de smart power : combiner les deux.", qui: mia }
      - retiens: "Puissance = capacité à **imposer** ou à **influencer**. **Hard power** : armée, contrainte. **Soft power** (Nye) : culture, attractivité. La puissance est **relative** et peut **décliner**."
    exercices:
      - type: classer
        enonce: "Range chaque exemple : hard power ou soft power ?"
        categories: ["Hard power", "Soft power"]
        mots: [["Des porte-avions déployés dans le monde", 0], ["Le succès mondial des films et des séries", 1], ["Des sanctions économiques contre un pays", 0], ["Des étudiants étrangers attirés par les universités", 1]]
        correction: "La force et la contrainte → hard power ; l'attractivité → soft power."
      - type: qcm
        enonce: "Quel penseur a forgé la notion de soft power ?"
        choix: ["Joseph Nye", "Karl Marx", "Montesquieu", "Clausewitz"]
        correction: "Le politiste américain **Joseph Nye**, à la fin des années 1980."
      - type: vf
        vars: { t: [["La puissance d'un État ne dépend que de son armée.", false], ["Une puissance peut décliner.", true], ["Les Nouvelles routes de la soie sont un projet chinois.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "La puissance a plusieurs fondements, elle est relative et peut décliner ; les Nouvelles routes de la soie sont chinoises."
      - type: relier
        enonce: "🔗 Relie chaque État à un levier de puissance mis en avant."
        paires: [["les États-Unis", "armée mondiale et industrie culturelle"], ["la Chine", "commerce et Nouvelles routes de la soie"], ["la Russie", "force militaire et énergie"]]
        correction: "Chaque puissance mobilise des leviers différents."

  - id: frontieres
    titre: Les frontières, des lignes qui divisent et relient
    classe: "1ʳᵉ"
    objectif: J'explique comment une frontière se trace et quelles fonctions elle remplit, de la barrière à l'espace de coopération.
    mots: [frontière, territoire, souveraineté, espace Schengen]
    etapes:
      - dialogue:
          - zero: "Une frontière, c'est juste un trait sur une carte ?"
          - neo: "C'est la limite de la souveraineté d'un État. Elle peut être un mur… ou un pont qu'on franchit sans même s'en rendre compte."
      - a_quoi_ca_sert: "Les frontières sont au cœur de l'actualité : migrations, conflits territoriaux, travail frontalier, Europe sans contrôles."
      - texte: |
          **Tracer** : une frontière résulte de l'histoire (traités, guerres, colonisation). Exemple : en 1884-1885, la conférence de Berlin organise le partage de l'Afrique entre puissances européennes.

          **Fonctions** : **barrière** (contrôler, protéger : mur entre les États-Unis et le Mexique), **filtre** (laisser passer certains flux), **interface** (échanger, coopérer : régions transfrontalières).

          **Ouverture** : dans l'**espace Schengen**, on circule sans contrôle systématique ; mais les frontières extérieures de l'Union européenne sont renforcées.

          **Nouvelles frontières** : maritimes (zones économiques exclusives), numériques.
      - attention: "Les frontières ne disparaissent pas avec la mondialisation : certaines s'ouvrent, d'autres se ferment ou se militarisent."
      - astuce: { texte: "Pour chaque frontière étudiée, pose trois questions : qui l'a tracée ? que laisse-t-elle passer ? que bloque-t-elle ?", qui: mia }
      - retiens: "Frontière = limite de **souveraineté**, héritée de l'histoire. Fonctions : **barrière**, **filtre**, **interface**. Ouvertes (**Schengen**) ou fermées (murs), elles ne disparaissent pas."
    exercices:
      - type: classer
        enonce: "Range chaque exemple : frontière-barrière ou frontière-interface ?"
        categories: ["Barrière", "Interface"]
        mots: [["Un mur surveillé entre deux pays", 0], ["Des travailleurs qui traversent chaque jour pour aller au travail", 1], ["Des contrôles renforcés aux postes-frontières", 0], ["Un hôpital partagé par deux villes voisines de pays différents", 1]]
        correction: "Bloquer → barrière ; échanger et coopérer → interface."
      - type: qcm
        enonce: "Que permet l'espace Schengen ?"
        choix: ["Circuler sans contrôle systématique aux frontières intérieures", "Utiliser une seule monnaie", "Voter dans tous les pays", "Supprimer les frontières extérieures"]
        correction: "Schengen supprime les contrôles systématiques aux frontières **intérieures**."
      - type: vf
        vars: { t: [["La conférence de Berlin (1884-1885) a organisé le partage de l'Afrique.", true], ["La mondialisation a fait disparaître les frontières.", false], ["Il existe aussi des frontières maritimes.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Berlin partage l'Afrique ; les frontières persistent ; les ZEE sont des frontières maritimes."
      - type: relier
        enonce: "🔗 Relie chaque fonction de la frontière à sa définition."
        paires: [["barrière", "empêcher le passage"], ["filtre", "trier ce qui passe"], ["interface", "favoriser les échanges"]]
        correction: "Une même frontière peut remplir plusieurs fonctions."

  - id: s-informer
    titre: "S'informer : un regard critique sur les sources"
    classe: "1ʳᵉ"
    objectif: J'analyse une information - source, auteur, date, intention - et je repère une fausse nouvelle.
    mots: [source, médias, désinformation, esprit critique]
    etapes:
      - dialogue:
          - zero: "J'ai vu une vidéo partagée un million de fois, donc c'est vrai !"
          - mia: "Le nombre de partages ne prouve rien. Qui l'a faite ? Quand ? Dans quel but ? C'est la base du travail d'historien… et de citoyen."
      - a_quoi_ca_sert: "Chaque jour, on reçoit des dizaines d'informations sur les réseaux sociaux ; savoir les vérifier protège de la manipulation et rend le débat démocratique possible."
      - texte: |
          **Une histoire des médias** : presse écrite (XIXᵉ siècle, loi sur la liberté de la presse de **1881**), radio, télévision, puis Internet et réseaux sociaux.

          **Analyser une source** : **qui** (auteur, média), **quand**, **où**, **pour qui**, **dans quel but** (informer, convaincre, vendre, manipuler).

          **Vérifier** : croiser au moins deux sources fiables, retrouver l'original d'une image (recherche inversée), distinguer **fait** et **opinion**.

          **Désinformation** : fausses nouvelles (*fake news*), images sorties de leur contexte, contenus générés par intelligence artificielle. Les **algorithmes** des réseaux montrent surtout ce qui nous ressemble (« bulles de filtre »).
      - attention: "Une information peut être vraie et présentée de façon trompeuse : une photo réelle, mais d'un autre lieu ou d'une autre année."
      - astuce: { texte: "Avant de partager, pose trois questions : qui le dit ? comment le sait-il ? qui d'autre le confirme ?", qui: neo }
      - retiens: "Analyser une source : **qui, quand, où, pour qui, pourquoi**. **Croiser** les sources, distinguer **fait** et **opinion**. Se méfier des images hors contexte et des **bulles de filtre**. Liberté de la presse : **1881**."
    exercices:
      - type: classer
        enonce: "Range chaque phrase : fait ou opinion ?"
        categories: ["Fait", "Opinion"]
        mots: [["Le texte de loi a été voté le 12 mars.", 0], ["Cette loi est une catastrophe.", 1], ["La manifestation a rassemblé des milliers de personnes selon la police.", 0], ["Le gouvernement a eu raison.", 1]]
        correction: "Un fait se vérifie ; une opinion exprime un jugement."
      - type: ordre
        enonce: "Range les étapes de vérification d'une image virale."
        items: ["Identifier qui l'a publiée en premier", "Faire une recherche d'image inversée", "Vérifier la date et le lieu d'origine", "Croiser avec des médias fiables"]
        correction: "Source, original, contexte, confirmation."
      - type: qcm
        enonce: "Qu'est-ce qu'une bulle de filtre ?"
        choix: ["Le fait que les algorithmes nous montrent surtout des contenus qui confirment nos goûts", "Un logiciel anti-virus", "Un média indépendant", "Une loi sur la presse"]
        correction: "Les algorithmes enferment chacun dans des contenus qui lui ressemblent."
      - type: vf
        vars: { t: [["Une information très partagée est forcément vraie.", false], ["Une photo réelle peut être utilisée pour tromper.", true], ["La loi sur la liberté de la presse date de 1881.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le nombre de partages ne prouve rien ; une image hors contexte trompe ; loi de 1881."

  - id: guerre-et-paix
    titre: Faire la guerre, faire la paix
    classe: Terminale
    objectif: J'explique comment les formes de la guerre ont changé et comment on construit la paix, de Clausewitz à l'ONU.
    mots: [guerre, paix, ONU, Clausewitz]
    etapes:
      - dialogue:
          - neo: "Clausewitz, un officier prussien, a écrit : la guerre est la continuation de la politique par d'autres moyens."
          - zero: "Donc une guerre a toujours un but politique ?"
          - mia: "Selon lui, oui. Mais au XXIᵉ siècle, les guerres opposent souvent des États à des groupes armés, et le modèle se brouille."
      - a_quoi_ca_sert: "Comprendre les conflits actuels (Ukraine, Proche-Orient, Sahel) et le rôle de l'ONU permet de suivre l'actualité sans s'y perdre."
      - texte: |
          **Le modèle de Clausewitz** (début du XIXᵉ siècle) : la guerre entre États, menée par des armées, au service d'un objectif **politique**.

          **Les guerres irrégulières** : terrorisme, guérillas, groupes armés non étatiques, cyberattaques. Exemple : le terrorisme d'Al-Qaïda et les attentats du 11 septembre 2001.

          **Faire la paix** : par des **traités** (Westphalie, 1648, qui pose le principe de souveraineté des États), par la **sécurité collective** : la SDN (1920), puis l'**ONU** (1945), son Conseil de sécurité et les casques bleus.

          **Limites** : le **droit de veto** des cinq membres permanents (États-Unis, Russie, Chine, Royaume-Uni, France) peut bloquer l'action du Conseil.
      - attention: "La paix n'est pas seulement l'absence de guerre : la reconstruction, la justice (tribunaux internationaux) et la réconciliation en font partie."
      - astuce: { texte: "Retiens trois dates de la paix : 1648 (Westphalie), 1920 (SDN), 1945 (ONU).", qui: zero }
      - retiens: "**Clausewitz** : la guerre, continuation de la **politique**. Aujourd'hui : guerres **irrégulières** (terrorisme, groupes armés). Paix : **traités** (1648), **sécurité collective** (SDN, **ONU** 1945), limitée par le **veto** des 5 membres permanents."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque date à son événement."
        paires: [["1648", "traités de Westphalie"], ["1920", "création de la SDN"], ["1945", "création de l'ONU"], ["2001", "attentats du 11 septembre"]]
        correction: "Westphalie, SDN, ONU, 11 septembre."
      - type: qcm
        enonce: "Quel pays n'est PAS membre permanent du Conseil de sécurité ?"
        choix: ["L'Allemagne", "La France", "La Chine", "La Russie"]
        correction: "Les cinq membres permanents : États-Unis, Russie, Chine, Royaume-Uni, France."
      - type: classer
        enonce: "Range chaque exemple : guerre classique ou guerre irrégulière ?"
        categories: ["Classique", "Irrégulière"]
        mots: [["Deux armées nationales qui s'affrontent sur un front", 0], ["Une guérilla contre une armée régulière", 1], ["Un attentat terroriste", 1], ["Une déclaration de guerre entre deux États", 0]]
        correction: "État contre État → classique ; groupes non étatiques, attentats → irrégulière."
      - type: vf
        vars: { t: [["Le droit de veto peut bloquer le Conseil de sécurité.", true], ["Pour Clausewitz, la guerre n'a pas de but politique.", false], ["La paix comprend aussi la reconstruction et la justice.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le veto bloque ; pour Clausewitz la guerre sert la politique ; la paix se construit."

  - id: histoire-et-memoires
    titre: Histoire et mémoires
    classe: Terminale
    objectif: Je distingue l'histoire et la mémoire, et j'explique le rôle de la justice et des commémorations face aux crimes de masse.
    mots: [histoire, mémoire, génocide, devoir de mémoire]
    etapes:
      - dialogue:
          - zero: "Histoire et mémoire, c'est la même chose : on se souvient du passé."
          - neo: "La mémoire est un souvenir vécu ou transmis, souvent chargé d'émotion. L'histoire est une connaissance construite à partir de sources, qui cherche à être objective."
      - a_quoi_ca_sert: "Les débats sur les statues, les commémorations ou les lois mémorielles reviennent souvent ; savoir distinguer histoire et mémoire aide à y prendre part avec rigueur."
      - texte: |
          **Mémoire** : souvenirs **subjectifs**, portés par des groupes (anciens combattants, rescapés, familles) ; elle peut être **plurielle** et conflictuelle (mémoires de la guerre d'Algérie).

          **Histoire** : savoir **critique**, fondé sur des **sources**, construit par les historiens.

          **Justice et crimes de masse** : le procès de **Nuremberg** (1945-1946) juge les dirigeants nazis et définit le **crime contre l'humanité** ; le terme **génocide** est forgé en 1944 par Raphael Lemkin. Pour le génocide des Tutsi au Rwanda (1994), un tribunal pénal international et des tribunaux populaires (gacaca) sont mis en place.

          **Commémorer** : monuments, journées nationales, musées, lois mémorielles.
      - attention: "Ce n'est pas à la loi d'écrire l'histoire : les historiens travaillent librement à partir des sources, même quand le sujet est douloureux."
      - astuce: { texte: "Mémoire = « je me souviens » (émotion) ; histoire = « je démontre » (sources).", qui: mia }
      - retiens: "**Mémoire** : subjective, plurielle. **Histoire** : critique, fondée sur des **sources**. **Nuremberg** définit le **crime contre l'humanité** ; **génocide** (Lemkin, 1944) ; Rwanda 1994 : TPIR et gacaca."
    exercices:
      - type: classer
        enonce: "Range chaque élément : histoire ou mémoire ?"
        categories: ["Histoire", "Mémoire"]
        mots: [["Un témoignage d'ancien combattant", 1], ["Un livre fondé sur l'étude d'archives", 0], ["Une cérémonie au monument aux morts", 1], ["La comparaison critique de plusieurs sources", 0]]
        correction: "Témoigner et commémorer relèvent de la mémoire ; analyser des sources, de l'histoire."
      - type: relier
        enonce: "🔗 Relie chaque élément à sa date."
        paires: [["mot « génocide » forgé par Lemkin", "1944"], ["procès de Nuremberg", "1945-1946"], ["génocide des Tutsi au Rwanda", "1994"]]
        correction: "1944, 1945-1946, 1994."
      - type: qcm
        enonce: "Quelle notion juridique le procès de Nuremberg a-t-il permis de juger ?"
        choix: ["Le crime contre l'humanité", "Le vol", "Le crime de lèse-majesté", "La fraude électorale"]
        correction: "Nuremberg juge les dirigeants nazis pour **crimes contre l'humanité**."
      - type: vf
        vars: { t: [["La mémoire est toujours objective.", false], ["L'historien travaille à partir de sources.", true], ["Une même guerre peut laisser plusieurs mémoires en conflit.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "La mémoire est subjective et plurielle ; l'histoire s'appuie sur des sources."

  - id: environnement-geopolitique
    titre: L'environnement, un enjeu géopolitique
    classe: Terminale
    objectif: J'explique pourquoi l'environnement est devenu un enjeu de rivalités et de coopération entre États.
    mots: [environnement, COP, Accord de Paris, ressources]
    etapes:
      - dialogue:
          - mia: "Le climat ne s'arrête pas aux frontières : un pays seul ne peut pas le protéger."
          - zero: "Alors tous les pays sont d'accord pour agir ?"
          - neo: "Pas si simple : qui doit faire le plus d'efforts, les pays qui ont pollué depuis longtemps ou ceux qui polluent le plus aujourd'hui ?"
      - a_quoi_ca_sert: "Le climat, l'eau et la biodiversité sont des sujets de négociation majeurs ; les comprendre éclaire les choix politiques et les métiers de la transition écologique."
      - texte: |
          **Une prise de conscience** : Sommet de la Terre de **Rio (1992)**, protocole de **Kyoto (1997)**, **Accord de Paris (2015)** : limiter le réchauffement « nettement en dessous de 2 °C ». Les **COP** réunissent chaque année les États.

          **Des rivalités** : pays développés (gros émetteurs historiques) et pays émergents (gros émetteurs actuels, comme la Chine) se renvoient la responsabilité. Les ressources (eau, terres rares, Arctique) suscitent des tensions.

          **D'autres acteurs** : ONG, scientifiques du **GIEC**, villes, entreprises, citoyens.
      - attention: "Un accord international n'est efficace que si les États appliquent leurs engagements : l'Accord de Paris ne prévoit pas de sanction."
      - astuce: { texte: "Trois dates en ordre croissant : Rio 1992, Kyoto 1997, Paris 2015.", qui: zero }
      - retiens: "Environnement = enjeu **mondial** : **Rio** 1992, **Kyoto** 1997, **Accord de Paris** 2015 (sous 2 °C), **COP** chaque année, **GIEC**. Rivalités entre pays **développés** et **émergents**, tensions sur les **ressources**."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque rendez-vous à sa date."
        paires: [["Sommet de la Terre de Rio", "1992"], ["protocole de Kyoto", "1997"], ["Accord de Paris", "2015"]]
        correction: "Rio 1992, Kyoto 1997, Paris 2015."
      - type: qcm
        enonce: "Quel est l'objectif principal de l'Accord de Paris ?"
        choix: ["Limiter le réchauffement nettement en dessous de 2 °C", "Interdire la voiture", "Supprimer toutes les frontières", "Créer une monnaie verte"]
        correction: "Limiter le réchauffement « nettement en dessous de 2 °C » par rapport à l'ère préindustrielle."
      - type: vf

id: ile-des-complexes
titre: L'Île des Complexes
sous_titre: Le nombre i, le plan complexe et la forme exponentielle
emoji: 🏝️
couleur: "#4a148c"
cycle: maitres
age: 17-18 ans et +
niveau: Terminale (maths expertes) – supérieur
ordre: 26
prerequis: [volcan-du-second-degre, archipel-des-vecteurs]
version: 1.0.0
intro:
  - mia: "Sur l'Île des Complexes existe un nombre impossible : un nombre dont le carré vaut −1 !"
  - neo: "On l'appelle i. Au début, on le trouvait « imaginaire »… aujourd'hui, il sert en électricité, en physique quantique, en traitement du son !"
  - zero: "Un nombre imaginaire ? Comme mon ami invisible ?"

lecons:
  - id: nombre-i
    titre: Le nombre i et la forme algébrique
    objectif: Je connais i² = −1 et j'écris un nombre complexe sous la forme a + ib.
    mots: [nombre complexe, partie réelle, partie imaginaire]
    etapes:
      - dialogue:
          - neo: "x² = −1 n'a pas de solution réelle. Alors on INVENTE un nombre i tel que i² = −1."
          - mia: "Et avec lui, on construit tous les nombres a + ib : les nombres complexes !"
      - texte: |
          Un **nombre complexe** s'écrit $z = a + ib$ avec $a, b$ réels et $i^2 = -1$.
          - $a = \mathrm{Re}(z)$ : **partie réelle** ; $b = \mathrm{Im}(z)$ : **partie imaginaire**.
          - On calcule comme d'habitude, en remplaçant $i^2$ par $-1$ :
          $$(2 + 3i)(1 - i) = 2 - 2i + 3i - 3i^2 = 2 + i + 3 = 5 + i$$
      - histoire:
          titre: Des nombres « impossibles »
          texte: "Au XVIᵉ siècle, les Italiens Cardan et Bombelli rencontrent des racines carrées de nombres négatifs en résolvant des équations du troisième degré… et s'aperçoivent qu'en calculant avec elles, on retrouve des solutions bien réelles ! Le symbole i a été introduit par Euler en 1777."
      - a_quoi_ca_sert: "L'électricité alternative (impédances), le traitement du signal (son, images, compression MP3/JPEG), la mécanique quantique, les fractales (ensemble de Mandelbrot)…"
      - question:
          type: champs
          vars: { a: "-6..6", b: "-6..6", c: "-6..6", d: "-6..6" }
          enonce: "Calcule $({{nb(a)}} + ({{nb(b)}})i) + ({{nb(c)}} + ({{nb(d)}})i)$."
          champs:
            - { avant: "partie réelle :", reponse: "a+c" }
            - { avant: "partie imaginaire :", reponse: "b+d" }
          correction: "${{nb(a+c)}} + ({{nb(b+d)}})i$"
      - astuce:
          texte: "i² = −1 : c'est la seule chose nouvelle. Pour le reste, calcule avec i comme avec une lettre, puis remplace i² par −1."
          qui: mia
    exercices:
      - type: champs
        vars: { a: "-5..5", b: "-5..5", c: "-5..5", d: "-5..5" }
        enonce: "Calcule $({{nb(a)}} + ({{nb(b)}})i)({{nb(c)}} + ({{nb(d)}})i)$."
        champs:
          - { avant: "Re :", reponse: "a*c - b*d" }
          - { avant: "Im :", reponse: "a*d + b*c" }
        correction: "$= {{nb(a*c)}} + ({{nb(a*d)}})i + ({{nb(b*c)}})i + ({{nb(b*d)}})i^2 = {{nb(a*c-b*d)}} + ({{nb(a*d+b*c)}})i$"
      - type: qcm
        vars: { n: [2, 3, 4, 5, 6, 7, 8] }
        enonce: "Que vaut $i^{ {{n}} }$ ?"
        choix: ["{{si(n%4==0,'1',si(n%4==1,'i',si(n%4==2,'−1','−i')))}}", "{{si(n%4==0,'−1',si(n%4==1,'−i',si(n%4==2,'1','i')))}}", "{{si(n%4==0,'i',si(n%4==1,'1',si(n%4==2,'−i','−1')))}}", "0"]
        correction: "Les puissances de i forment un cycle : i, −1, −i, 1. Avec {{n}} = 4 × {{ent(n/4)}} + {{n%4}}…"
      - type: nombre
        vars: { b: "2..9" }
        enonce: "$(i \\times {{b}})^2 = ?$"
        reponse: "-b*b"
        correction: "${{b}}^2 \\times i^2 = -{{b*b}}$"

  - id: conjugue-module
    titre: Conjugué, module et division
    objectif: Je calcule le conjugué, le module, et je divise deux complexes.
    mots: [conjugué, module]
    etapes:
      - dialogue:
          - mia: "Le conjugué de a + ib, c'est a − ib : on change le signe de la partie imaginaire."
          - neo: "Et z × z̄ = a² + b², un nombre réel ! Pratique pour diviser."
      - texte: |
          - **Conjugué** : $\bar z = a - ib$.
          - **Module** : $|z| = \sqrt{a^2 + b^2}$ (la « longueur » de $z$), et $z\bar z = |z|^2$.
          - **Diviser** : on multiplie en haut et en bas par le conjugué du dénominateur :
          $$\frac{1 + 2i}{1 - i} = \frac{(1 + 2i)(1 + i)}{(1 - i)(1 + i)} = \frac{-1 + 3i}{2}$$
      - a_quoi_ca_sert: "Le module mesure l'amplitude d'un signal ou d'un courant, la division sert à calculer des impédances en électricité."
      - question:
          type: nombre
          vars: { t: [[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17]], s: [1, -1] }
          enonce: "Module de $z = {{t_0}} + ({{nb(s*t_1)}})i$ ?"
          reponse: "t_2"
          correction: "$\\sqrt{ {{t_0}}^2 + {{t_1}}^2 } = {{t_2}}$"
      - astuce:
          texte: "Pour diviser par un complexe, multiplie en haut et en bas par son conjugué : le bas devient un nombre réel."
          qui: neo
    exercices:
      - type: champs
        vars: { a: "-9..9", b: "-9..9" }
        si: "b != 0"
        enonce: "Conjugué de $z = {{nb(a)}} + ({{nb(b)}})i$ : $\\bar z = $"
        champs:
          - { avant: "Re :", reponse: "a" }
          - { avant: "Im :", reponse: "-b" }
        correction: "$\\bar z = {{nb(a)}} + ({{nb(-b)}})i$"
      - type: nombre
        vars: { a: "-6..6", b: "-6..6" }
        enonce: "Calcule $z \\bar z$ pour $z = {{nb(a)}} + ({{nb(b)}})i$."
        reponse: "a*a + b*b"
        correction: "$a^2 + b^2 = {{a*a+b*b}}$"
      - type: champs
        vars: { a: "-4..4", b: "-4..4", c: "1..3", d: "-3..3" }
        si: "d != 0 && (a*c + b*d) % (c*c + d*d) == 0 && (b*c - a*d) % (c*c + d*d) == 0"
        enonce: "Calcule $\\dfrac{ {{nb(a)}} + ({{nb(b)}})i }{ {{c}} + ({{nb(d)}})i }$."
        champs:
          - { avant: "Re :", reponse: "(a*c + b*d)/(c*c + d*d)" }
          - { avant: "Im :", reponse: "(b*c - a*d)/(c*c + d*d)" }
        correction: "On multiplie par le conjugué ${{c}} - ({{nb(d)}})i$ : résultat ${{nb((a*c+b*d)/(c*c+d*d))}} + ({{nb((b*c-a*d)/(c*c+d*d))}})i$"

  - id: plan-complexe
    titre: Le plan complexe et la forme exponentielle
    objectif: Je représente un complexe dans le plan et j'utilise la forme r e^{iθ}.
    mots: [argument, forme exponentielle, plan complexe]
    etapes:
      - dialogue:
          - neo: "Chaque nombre complexe a + ib est un POINT du plan : (a ; b). Les complexes, c'est de la géométrie !"
          - mia: "Et on peut le repérer autrement : sa distance à O (le module r) et son angle (l'argument θ)."
      - visuel:
          type: graphe
          xmin: -1
          xmax: 5
          ymin: -1
          ymax: 4
          pas_x: 1
          pas_y: 1
          points: [{ x: 3, y: 3, label: "z = 3 + 3i" }]
          segments: [{ x1: 0, y1: 0, x2: 3, y2: 3 }]
        legende: "Module 3√2 ≈ 4,24 ; argument π/4 (45°)."
      - texte: |
          $$z = a + ib = r(\cos\theta + i\sin\theta) = r\,e^{i\theta} \qquad r = |z|, \quad \theta = \arg z$$

          - **Multiplier** deux complexes : on **multiplie les modules** et on **additionne les arguments** → une multiplication par $e^{i\theta}$ est une **rotation** d'angle $\theta$ !
          - **Formule d'Euler** : $e^{i\pi} + 1 = 0$ — elle relie les cinq nombres les plus célèbres : 0, 1, $e$, $i$, $\pi$.
      - a_quoi_ca_sert: "Les rotations en infographie et en robotique, les ondes (son, lumière, radio), l'analyse de Fourier qui permet la compression des images et de la musique."
      - question:
          type: nombre
          vars: { a: [1, 2, 3, 4] }
          enonce: "Argument (en degrés, entre 0 et 360) de $z = {{a}} + {{a}}i$ ?"
          reponse: "45"
          unite: °
          correction: "Parties réelle et imaginaire égales et positives : angle de 45° (π/4)."
      - astuce:
          texte: "La forme r e^(iθ) transforme les multiplications en rotations : multiplier par i, c'est tourner d'un quart de tour."
          qui: zero
    exercices:
      - type: qcm
        vars: { z: [["i", "90°"], ["-1", "180°"], ["-i", "270°"], ["1", "0°"]] }
        enonce: "Argument de $z = {{z_0}}$ ?"
        choix: ["{{z_1}}", "{{si(z_1=='90°','180°','90°')}}", "{{si(z_1=='270°','0°','270°')}}", "45°"]
        correction: "Le point {{z_0}} est sur un axe : l'argument est {{z_1}}."
      - type: nombre
        vars: { r1: "2..5", r2: "2..5" }
        enonce: "$|z_1| = {{r1}}$ et $|z_2| = {{r2}}$. Que vaut $|z_1 z_2|$ ?"
        reponse: "r1*r2"
        correction: "Les modules se multiplient : {{r1*r2}}."
      - type: nombre
        vars: { t1: [30, 45, 60], t2: [30, 60, 90, 120] }
        enonce: "$\\arg z_1 = {{t1}}°$ et $\\arg z_2 = {{t2}}°$. Que vaut $\\arg(z_1 z_2)$ (en degrés) ?"
        reponse: "t1+t2"
        unite: °
        correction: "Les arguments s'additionnent : {{t1+t2}}°."
      - type: nombre
        enonce: "Que vaut $e^{i\\pi} + 1$ ?"
        reponse: "0"
        correction: "Identité d'Euler : $e^{i\\pi} = -1$, donc $e^{i\\pi} + 1 = 0$. (Zéro est très ému.)"

  - id: equations-complexes
    titre: Résoudre ax² + bx + c = 0 dans ℂ
    objectif: Je résous une équation du second degré à discriminant négatif.
    mots: [discriminant négatif]
    etapes:
      - dialogue:
          - mia: "Avant, Δ < 0 voulait dire « pas de solution ». Sur l'Île des Complexes, il y en a toujours deux !"
      - texte: |
          Si $\Delta < 0$, l'équation $az^2 + bz + c = 0$ (coefficients réels) a deux solutions **complexes conjuguées** :
          $$z_{1,2} = \frac{-b \pm i\sqrt{-\Delta}}{2a}$$
          Exemple : $z^2 + 2z + 5 = 0$ : $\Delta = 4 - 20 = -16$, $z = \frac{-2 \pm 4i}{2} = -1 \pm 2i$.

          **Théorème fondamental de l'algèbre** (Gauss, 1799) : toute équation polynomiale de degré $n$ a exactement $n$ solutions dans $\mathbb{C}$ (comptées avec leur multiplicité).
      - a_quoi_ca_sert: "L'étude des circuits électriques et des systèmes mécaniques oscillants (amortisseurs de voiture, ponts) : les solutions complexes décrivent des oscillations."
      - question:
          type: champs
          vars: { p: "-4..4", q: "1..5" }
          enonce: "Résous $z^2 + ({{nb(-2*p)}})z + {{p*p+q*q}} = 0$ : solutions $p \\pm iq$ avec $q > 0$."
          champs:
            - { avant: "p =", reponse: "p" }
            - { avant: "q =", reponse: "q" }
          correction: "$\\Delta = {{nb(4*p*p - 4*(p*p+q*q))}}$, $\\sqrt{-\\Delta} = {{2*q}}$ : $z = {{nb(p)}} \\pm {{q}}i$"
      - astuce:
          texte: "Quand Δ < 0, remplace √Δ par i√|Δ| : les deux solutions sont conjuguées l'une de l'autre."
          qui: mia
    exercices:
      - type: champs
        vars: { p: "-5..5", q: "1..6" }
        enonce: "Solutions de $z^2 + ({{nb(-2*p)}})z + {{p*p+q*q}} = 0$ sous la forme $p \\pm iq$ ($q > 0$) :"
        champs:
          - { avant: "p =", reponse: "p" }
          - { avant: "q =", reponse: "q" }
        correction: "$z = {{nb(p)}} \\pm {{q}}i$"
      - type: nombre
        vars: { p: "-5..5", q: "1..6" }
        enonce: "Discriminant de $z^2 + ({{nb(-2*p)}})z + {{p*p+q*q}}$ ?"
        reponse: "-4*q*q"
        correction: "$\\Delta = {{nb(4*p*p)}} - {{4*(p*p+q*q)}} = {{nb(-4*q*q)}}$"
      - type: nombre
        vars: { n: "2..8" }
        enonce: "Combien de solutions complexes (comptées avec multiplicité) a une équation polynomiale de degré {{n}} ?"
        reponse: "n"
        correction: "Théorème fondamental de l'algèbre : {{n}}."

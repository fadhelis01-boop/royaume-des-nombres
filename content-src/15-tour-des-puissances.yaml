id: tour-des-puissances
titre: La Tour des Puissances
sous_titre: Carrés, cubes, puissances de 10, notation scientifique et racines
emoji: 🚀
couleur: "#c62828"
cycle: explorateurs
age: 12-15 ans
niveau: 4ᵉ – 2nde
ordre: 15
prerequis: [royaume-des-relatifs]
version: 1.0.0
intro:
  - zero: "La Tour des Puissances… c'est MA tour ! 10, 100, 1 000, 1 000 000… UN MILLIARD ! 🤯"
  - neo: "Les puissances servent à écrire de très grands et de très petits nombres en un clin d'œil."
  - mia: "La distance d'une étoile, la taille d'un virus… tout devient facile à écrire !"

lecons:
  - id: carres-cubes
    titre: Carrés, cubes et puissances
    objectif: Je calcule une puissance d'un nombre et je connais le vocabulaire (exposant).
    mots: [puissance, exposant, carré, cube]
    etapes:
      - dialogue:
          - mia: "2 × 2 × 2 × 2 × 2… c'est long à écrire. On écrit 2⁵ !"
          - neo: "Le petit 5 en haut, c'est l'EXPOSANT : il dit combien de fois on multiplie 2 par lui-même."
      - texte: |
          $$a^n = \underbrace{a \times a \times \cdots \times a}_{n \text{ facteurs}}$$

          - $a^2$ se lit « a au **carré** », $a^3$ « a au **cube** ».
          - Par convention : $a^1 = a$ et $a^0 = 1$ (pour $a \neq 0$).
          - $(-2)^4 = 16$ (nombre pair de signes −) mais $(-2)^3 = -8$.
      - attention:
          texte: "$2^5 \\neq 2 \\times 5$ ! $2^5 = 32$ alors que $2 \\times 5 = 10$. Et $-3^2 = -9$ (le carré s'applique à 3 seulement) alors que $(-3)^2 = 9$."
          qui: neo
      - a_quoi_ca_sert: "Les aires (m²) et volumes (m³), la croissance des bactéries (qui doublent), la mémoire des ordinateurs (2¹⁰ = 1 024 octets), les intérêts composés…"
      - question:
          type: nombre
          vars: { a: "2..5", n: "2..5" }
          enonce: "${{a}}^{ {{n}} } = ?$"
          reponse: "a^n"
          correction: "${{a}}^{ {{n}} } = {{a^n}}$"
      - astuce:
          texte: "L'exposant compte combien de fois on multiplie le nombre par lui-même : 2³ = 2 × 2 × 2 = 8, et pas 2 × 3 !"
          qui: mia
    exercices:
      - type: nombre
        vars: { a: "2..5", n: "3..4" }
        enonce: "${{a}}^{ {{n}} } = ?$"
        reponse: "a^n"
        niveau: 2
        erreurs:
          - { valeur: "a*n", message: "${{a}}^{ {{n}} }$, ce n'est pas {{a}} × {{n}} : c'est {{a}} multiplié par lui-même {{n}} fois." }
        correction: "{{a^n}}"
      - type: nombre
        vars: { a: "2..9", n: "2..4" }
        enonce: "${{a}}^{ {{n}} } = ?$"
        reponse: "a^n"
        correction: "{{nb(a^n)}}"
      - type: nombre
        vars: { a: "2..5", n: "2..5" }
        enonce: "$(-{{a}})^{ {{n}} } = ?$"
        reponse: "(-a)^n"
        correction: "{{si(n%2==0,'Exposant pair : positif.','Exposant impair : négatif.')}} {{nb((-a)^n)}}"
      - type: nombre
        vars: { a: "2..99" }
        enonce: "${{a}}^0 = ?$"
        reponse: "1"
        correction: "Tout nombre non nul à la puissance 0 vaut 1."
      - type: nombre
        vars: { n: "5..10" }
        enonce: "Une bactérie se divise en 2 toutes les heures. Combien y en a-t-il après {{n}} heures ?"
        reponse: "2^n"
        correction: "$2^{ {{n}} } = {{nb(2^n)}}$"
      - type: qcm
        enonce: "Que vaut $-3^2$ ?"
        choix: ["−9", "9", "−6", "6"]
        correction: "Le carré s'applique seulement à 3 : $-(3^2) = -9$."

  - id: puissances-de-10
    titre: Puissances de 10 et notation scientifique
    objectif: J'utilise les puissances de 10 et j'écris un nombre en notation scientifique.
    mots: [notation scientifique]
    etapes:
      - dialogue:
          - zero: "10³ = 1 000 : trois Zéros ! 10⁶ = un million : six Zéros ! Je suis PARTOUT !"
          - mia: "Et 10⁻³ ? C'est 0,001 : un millième. Zéro passe derrière la virgule !"
      - texte: |
          - $10^n = 1\underbrace{00\ldots0}_{n \text{ zéros}}$ · $10^{-n} = 0{,}\underbrace{0\ldots0}_{n-1}1 = \frac{1}{10^n}$
          - **Notation scientifique** : $a \times 10^n$ avec $1 \le a < 10$.
            - Distance Terre-Soleil ≈ 150 000 000 km = $1{,}5 \times 10^8$ km
            - Taille d'un globule rouge ≈ 0,000 007 m = $7 \times 10^{-6}$ m
      - astuce:
          texte: "Pour écrire 45 000 en notation scientifique : place la virgule après le premier chiffre (4,5) et compte de combien de rangs elle a « bougé » : 4 → $4{,}5 \\times 10^4$."
          qui: neo
      - a_quoi_ca_sert: "L'astronomie (années-lumière), la biologie (cellules, virus), l'informatique (gigaoctets), la physique, la chimie (le nombre d'Avogadro ≈ 6 × 10²³)…"
      - question:
          type: nombre
          vars: { n: "2..9" }
          enonce: "Combien de zéros dans l'écriture de $10^{ {{n}} }$ ?"
          reponse: "n"
          correction: "$10^{ {{n}} }$ = 1 suivi de {{n}} zéros."
    exercices:
      - type: nombre
        vars: { a: "11..99", n: "3..6" }
        si: "a % 10 != 0"
        enonce: "Écris en notation scientifique ${{nb(a*10^n)}} = {{nb(a/10)}} \\times 10^{?}$. Que vaut l'exposant ?"
        reponse: "n+1"
        correction: "${{nb(a*10^n)}} = {{nb(a/10)}} \\times 10^{ {{n+1}} }$"
      - type: nombre
        vars: { a: "2..9", n: "2..5" }
        enonce: "Écris en notation décimale : ${{a}} \\times 10^{-{{n}} }$"
        reponse: "a*10^(-n)"
        correction: "{{nb(a*10^(-n))}}"
      - type: nombre
        vars: { a: "2..9", b: "2..9", m: "2..5", n: "2..5" }
        enonce: "$({{a}} \\times 10^{ {{m}} }) \\times ({{b}} \\times 10^{ {{n}} }) = {{a*b}} \\times 10^{?}$"
        reponse: "m+n"
        correction: "On multiplie {{a}} × {{b}} = {{a*b}} et on additionne les exposants : $10^{ {{m+n}} }$."
      - type: qcm
        enonce: "Quelle écriture est en notation scientifique ?"
        choix: ["$3{,}2 \\times 10^{5}$", "$32 \\times 10^{4}$", "$0{,}32 \\times 10^{6}$", "$320 \\times 10^{3}$"]
        correction: "Le nombre devant doit être entre 1 et 10 (10 exclu) : 3,2."
      - type: comparer
        vars: { a: "1..9", b: "1..9", m: "3..8", n: "3..8" }
        si: "m != n"
        enonce: "Compare."
        gauche: "a*10^m"
        droite: "b*10^n"
        gauche_affiche: "${{a}} \\times 10^{ {{m}} }$"
        droite_affiche: "${{b}} \\times 10^{ {{n}} }$"
        correction: "En notation scientifique, on compare d'abord les exposants : {{m}} et {{n}}."

  - id: regles-puissances
    titre: Les règles de calcul sur les puissances
    objectif: J'applique les règles du produit, du quotient et de la puissance d'une puissance.
    mots: [exposant]
    etapes:
      - dialogue:
          - neo: "2³ × 2⁴ = (2×2×2) × (2×2×2×2) = 2⁷. On ADDITIONNE les exposants !"
          - mia: "Et (2³)² = 2³ × 2³ = 2⁶ : on MULTIPLIE les exposants."
      - texte: |
          Pour $a \neq 0$ :
          $$a^m \times a^n = a^{m+n} \qquad \frac{a^m}{a^n} = a^{m-n} \qquad (a^m)^n = a^{mn} \qquad (ab)^n = a^n b^n \qquad a^{-n} = \frac{1}{a^n}$$
      - attention:
          texte: "Ces règles marchent seulement avec la MÊME base ! $2^3 \\times 3^4$ ne se simplifie pas en $6^7$. Et $a^m + a^n$ ne se simplifie pas non plus !"
          qui: neo
      - a_quoi_ca_sert: "Calculer avec des nombres gigantesques sans calculatrice, comprendre les unités (kilo × kilo = méga), la puissance de calcul des ordinateurs…"
      - question:
          type: nombre
          vars: { m: "2..9", n: "2..9" }
          enonce: "$5^{ {{m}} } \\times 5^{ {{n}} } = 5^{?}$"
          reponse: "m+n"
          correction: "On additionne : {{m}} + {{n}} = {{m+n}}."
      - astuce:
          texte: "Même base : on multiplie → on additionne les exposants ; on divise → on soustrait. 10³ × 10² = 10⁵ : compte les zéros, ça marche !"
          qui: neo
    exercices:
      - type: nombre
        vars: { a: [2, 3, 7, 10], m: "2..9", n: "2..9" }
        enonce: "${{a}}^{ {{m}} } \\times {{a}}^{ {{n}} } = {{a}}^{?}$"
        reponse: "m+n"
        correction: "Exposant {{m+n}}."
      - type: nombre
        vars: { a: [2, 3, 7, 10], m: "5..12", n: "2..4" }
        enonce: "$\\frac{ {{a}}^{ {{m}} } }{ {{a}}^{ {{n}} } } = {{a}}^{?}$"
        reponse: "m-n"
        correction: "Exposant {{m}} − {{n}} = {{m-n}}."
      - type: nombre
        vars: { a: [2, 3, 10], m: "2..5", n: "2..4" }
        enonce: "$({{a}}^{ {{m}} })^{ {{n}} } = {{a}}^{?}$"
        reponse: "m*n"
        correction: "Exposant {{m}} × {{n}} = {{m*n}}."
      - type: nombre
        vars: { a: [2, 4, 5, 10], n: "1..3" }
        enonce: "${{a}}^{-{{n}} } = ?$ (en écriture décimale)"
        reponse: "a^(-n)"
        correction: "$\\frac{1}{ {{a}}^{ {{n}} } } = \\frac{1}{ {{a^n}} } = {{nb(a^(-n))}}$"

  - id: racines-carrees
    titre: Les racines carrées
    objectif: Je connais la racine carrée et je calcule les racines des carrés parfaits.
    mots: [racine carrée]
    etapes:
      - dialogue:
          - mia: "Un carré a une aire de 49 cm². Combien mesure son côté ?"
          - neo: "Le nombre qui, au carré, donne 49… c'est 7 ! On dit que 7 est la RACINE CARRÉE de 49 : √49 = 7."
      - texte: |
          La **racine carrée** de $a$ (avec $a \ge 0$) est le nombre **positif** dont le carré est $a$ : $\sqrt{a}^2 = a$.

          - $\sqrt{0}=0$, $\sqrt{1}=1$, $\sqrt{4}=2$, $\sqrt{9}=3$, $\sqrt{16}=4$, $\sqrt{25}=5$, $\sqrt{100}=10$…
          - $\sqrt{2} \approx 1{,}414$ n'est pas un nombre décimal (ses décimales ne s'arrêtent jamais).
          - $\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$, mais $\sqrt{a + b} \neq \sqrt{a} + \sqrt{b}$ !
      - histoire:
          titre: Le secret de √2
          texte: "Les Grecs pensaient que tout nombre était une fraction. Mais la diagonale d'un carré de côté 1 mesure √2, et on a démontré (sans doute au Vᵉ siècle av. J.-C.) que √2 ne peut PAS s'écrire comme une fraction. Ce fut un choc : les nombres « irrationnels » venaient d'être découverts. Tu verras la preuve dans le Temple de la Logique !"
      - a_quoi_ca_sert: "Trouver le côté d'un carré à partir de son aire, Pythagore, la physique (vitesse de chute), les statistiques (écart-type)…"
      - question:
          type: nombre
          vars: { n: "2..15" }
          enonce: "$\\sqrt{ {{n*n}} } = ?$"
          reponse: "n"
          correction: "${{n}}^2 = {{n*n}}$, donc $\\sqrt{ {{n*n}} } = {{n}}$."
      - astuce:
          texte: "La racine carrée répond à la question « quel nombre multiplié par lui-même donne… ? ». √49 = 7 car 7 × 7 = 49. Apprends les carrés jusqu'à 15²."
          qui: zero
    exercices:
      - type: nombre
        vars: { n: "2..20" }
        enonce: "$\\sqrt{ {{n*n}} } = ?$"
        reponse: "n"
        correction: "{{n}}"
      - type: nombre
        vars: { n: "3..12" }
        enonce: "Un carré a une aire de {{n*n}} m². Longueur de son côté ?"
        reponse: "n"
        unite: m
        correction: "$\\sqrt{ {{n*n}} } = {{n}}$ m."
      - type: champs
        vars: { n: [2, 3, 5, 6, 7, 10, 11, 13, 15, 17, 20, 30, 50, 80, 90] }
        si: "round(sqrt(n)) * round(sqrt(n)) != n"
        enonce: "Encadre $\\sqrt{ {{n}} }$ entre deux entiers consécutifs."
        champs:
          - { reponse: "ent(sqrt(n))", apres: "<" }
          - { avant: "√{{n}} <", reponse: "ent(sqrt(n))+1" }
        correction: "${{ent(sqrt(n))}}^2 = {{ent(sqrt(n))^2}} < {{n}} < {{(ent(sqrt(n))+1)^2}} = {{ent(sqrt(n))+1}}^2$"
      - type: vf
        vars: { a: [9, 16, 25, 36], b: [16, 9, 144, 64] }
        enonce: "Vrai ou faux : $\\sqrt{ {{a}} + {{b}} } = \\sqrt{ {{a}} } + \\sqrt{ {{b}} }$"
        reponse: "sqrt(a+b) == sqrt(a) + sqrt(b)"
        correction: "$\\sqrt{ {{a+b}} } \\approx {{nb(round(sqrt(a+b),3))}}$ alors que $\\sqrt{ {{a}} } + \\sqrt{ {{b}} } = {{sqrt(a)+sqrt(b)}}$. La racine d'une somme n'est pas la somme des racines !"
      - type: nombre
        vars: { a: [2, 3, 5], k: [4, 9, 16, 25] }
        enonce: "Simplifie : $\\sqrt{ {{k*a}} } = ?\\sqrt{ {{a}} }$"
        reponse: "sqrt(k)"
        correction: "$\\sqrt{ {{k*a}} } = \\sqrt{ {{k}} } \\times \\sqrt{ {{a}} } = {{sqrt(k)}}\\sqrt{ {{a}} }$"

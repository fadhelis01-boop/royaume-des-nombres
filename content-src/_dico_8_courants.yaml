- { m: travailler, n: v, d: "Faire des efforts pour réaliser quelque chose ; exercer un métier.", e: "Elle travaille à l'hôpital.", s: [bosser, œuvrer], f: [travail, travailleur], t: verbes }
- { m: inventer, n: v, d: "Créer quelque chose de nouveau ; imaginer une histoire.", e: "Qui a inventé l'imprimerie ?", f: [invention, inventeur], t: verbes }

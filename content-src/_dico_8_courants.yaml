- { m: tomber, n: v, d: "Être entraîné vers le bas, perdre l'équilibre.", e: "Les feuilles tombent en automne.", f: [chute, retomber], t: verbes }
- { m: aider, n: v, d: "Apporter son soutien à quelqu'un.", e: "Aide-moi à porter ce carton.", s: [secourir, épauler], f: [aide, entraide], t: verbes }
- { m: partager, n: v, d: "Diviser en parts ; donner une partie de ce que l'on a.", e: "Partageons le gâteau.", f: [partage, part], t: verbes }
- { m: offrir, n: v, d: "Donner en cadeau ; proposer.", e: "Je t'offre ce livre.", f: [offre], t: verbes }
- { m: recevoir, n: v, d: "Obtenir ce que l'on vous donne ou envoie ; accueillir.", e: "J'ai reçu une lettre.", a: [envoyer, donner], f: [réception], t: verbes }
- { m: envoyer, n: v, d: "Faire partir quelque chose ou quelqu'un vers une destination.", e: "J'envoie une carte postale.", a: [recevoir], f: [envoi, renvoyer], t: verbes }
- { m: connaître, n: v, d: "Savoir ce qu'est quelqu'un ou quelque chose.", e: "Je connais cette chanson.", a: [ignorer], f: [connaissance, reconnaître, inconnu], t: verbes }

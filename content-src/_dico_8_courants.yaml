- { m: sale, n: a, d: "Qui n'est pas propre.", e: "Ses bottes sont sales.", a: [propre], f: [saleté, salir], t: qualités }
- { m: plein, n: a, d: "Rempli. Féminin : pleine.", e: "Un verre plein d'eau.", a: [vide], f: [remplir, plénitude], t: qualités }
- { m: vide, n: a, d: "Qui ne contient rien.", e: "La boîte est vide.", a: [plein], f: [vider], t: qualités }
- { m: possible, n: a, d: "Qui peut exister ou se faire.", e: "Tout est possible.", a: [impossible], f: [possibilité], t: qualités }
- { m: important, n: a, d: "Qui a beaucoup de valeur, de conséquence.", e: "C'est un jour important.", s: [essentiel, capital], a: [insignifiant], f: [importance], t: qualités }
- { m: dangereux, n: a, d: "Qui peut causer un mal, un accident. Féminin : dangereuse.", e: "Ce virage est dangereux.", a: [inoffensif, sûr], f: [danger], t: qualités }
- { m: célébrer, n: v, d: "Fêter un événement.", e: "Nous célébrons la fin de l'année.", s: [fêter], f: [célébration], l: 2, t: verbes }
- { m: découvrir, n: v, d: "Trouver ce qui était caché ou inconnu ; enlever ce qui couvre.", e: "Les explorateurs ont découvert une île.", f: [découverte, découvreur], t: verbes }
- { m: imaginer, n: v, d: "Se représenter dans l'esprit ; inventer.", e: "Imagine un pays où les mots seraient vivants.", f: [imagination, imaginaire], t: verbes }
- { m: raconter, n: v, d: "Faire le récit de quelque chose.", e: "Raconte-moi une histoire.", s: [narrer, conter], f: [conte], t: verbes }

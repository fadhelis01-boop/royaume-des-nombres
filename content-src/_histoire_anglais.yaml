# L'histoire de la planète Anglais : l'Archipel de l'Écho (premier monde, 2.4).
prologue:
  - narrateur: "Au bord de la Galaxie flotte un archipel où l'on parle une autre langue : l'anglais. Ses habitants chantaient, comptaient, racontaient… et leurs mots arrivaient jusqu'aux autres planètes."
  - narrateur: "Le Grand Neutre a soufflé un brouillard gris : les mots anglais se sont perdus en route. Il ne reste qu'un écho : « Hel… lo… »"
  - zero-surprise: "« Hello » ? Ça veut dire quoi ? C'est le nom d'un hamster ?"
  - mia: "Ça veut dire « bonjour » ! Une nouvelle langue, c'est une nouvelle façon de dire le monde. Écoute bien, répète à voix haute : ta bouche apprend aussi."
  - neo: "Chaque mot que tu retrouves fait reculer le brouillard. Let's go !"
arcs:
  - id: anglais-arc-1
    titre: "Livre I — Les premiers mots"
    sous_titre: "Se présenter, les couleurs, compter, les animaux, la famille, la classe"
    final: en-ile-des-premiers-mots
    fin:
      - narrateur: "Le brouillard se déchire. Sur la plage, les habitants de l'Archipel crient : « Thank you! »"
      - mia-joie: "Tu sais saluer, compter, dire les couleurs et parler de ta famille. Bravo ! D'autres îles t'attendent : la Baie des Familles est déjà en vue !"
  - id: anglais-arc-2
    titre: "Livre II — Parler de soi et du monde"
    sous_titre: "La famille, la journée, le présent, le passé et l'avenir"
    final: en-cote-du-passe
    fin:
      - narrateur: "Le dernier banc de brouillard se dissout au-dessus de la Côte du Passé. Toutes les îles de l'Archipel se répondent, d'une falaise à l'autre."
      - neo: "Tu sais raconter ta journée, ton passé et tes projets en anglais. Ce n'est plus un écho : c'est ta voix."
  - id: anglais-arc-3
    titre: "Livre III — Raconter, convaincre, comprendre le monde"
    sous_titre: "Récits, brevet, débats et actualité"
    final: en-ile-du-monde
    fin:
      - narrateur: "Sur l'Île du Monde, les voix de toute la planète se répondent enfin. L'Archipel de l'Écho n'a plus besoin de cloche : il parle."
      - mia: "Tu racontes, tu argumentes, tu comprends un article en anglais. Tu n'apprends plus une langue : tu t'en sers."
chapitres:
  en-ile-des-premiers-mots:
    titre: "L'Île des Premiers Mots"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Sur l'Île des Premiers Mots, la cloche de l'Écho ne sonne plus. Les habitants n'osent plus parler."
      - mia: "Écoute, répète, joue : c'est comme ça qu'on apprend une langue, même tout petit."
    apres:
      - narrateur: "Ding, dong ! La cloche de l'Écho sonne et tous les habitants se disent « Hello! » en riant."
  en-baie-des-familles:
    titre: "La Baie des Familles"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Dans la Baie des Familles, le brouillard a effacé les noms. Les habitants ne savent plus se présenter."
      - mia: "Parle de toi : ta famille, ce que tu aimes, ce que tu sais faire. Chaque phrase rend un nom à quelqu'un."
    apres:
      - narrateur: "« This is my mother! », « I can swim! » : les voix reviennent de maison en maison, et la cloche de la Baie sonne."
  en-ile-du-quotidien:
    titre: "L'Île du Quotidien"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Sur l'Île du Quotidien, les horloges se sont figées. Personne ne sait plus raconter sa journée."
      - neo: "Le matin, l'école, la ville, les loisirs : raconte une vraie journée et les aiguilles repartiront."
    apres:
      - narrateur: "Tic, tac ! Les horloges repartent. « It's half past seven! » crie le boulanger en ouvrant sa boutique."
  en-detroit-du-present:
    titre: "Le Détroit du Présent"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Les bateaux du Détroit du Présent restent à quai : leurs capitaines confondent ce qu'ils font d'habitude et ce qu'ils font maintenant."
      - mia: "Le présent simple pour les habitudes, le -ing pour l'instant présent. Guide-les, et les voiles se gonfleront."
    apres:
      - narrateur: "« We are sailing! » Les bateaux quittent le port et traversent le détroit jusqu'au Royaume-Uni."
  en-cote-du-passe:
    titre: "La Côte du Passé"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Sur la Côte du Passé, les châteaux sont fermés. Leurs portes ne s'ouvrent qu'à ceux qui savent raconter."
      - zero: "Yesterday, I went… euh… je suis allé jusqu'ici ! C'est un bon début ?"
    apres:
      - narrateur: "« Once upon a time, there was… » Les portes des châteaux s'ouvrent une à une, et les histoires d'autrefois s'envolent dans l'Archipel."
  en-archipel-des-recits:
    titre: "L'Archipel des Récits"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Sur l'Archipel des Récits, les conteurs ont perdu le fil : ils ne savent plus dire ce qu'ils ont vécu ni ce qu'ils étaient en train de faire."
      - neo: "Present perfect, past continuous, conseils : rends-leur leurs histoires."
    apres:
      - narrateur: "« I have never seen such a sunset! » Les conteurs reprennent leurs récits au coin du feu, et l'Archipel s'illumine."
  en-baie-du-brevet:
    titre: "La Baie du Brevet"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "Le phare de la Baie du Brevet est éteint. Il ne se rallume que pour qui sait imaginer, rapporter et argumenter."
      - mia: "If you light it, the ships will find their way."
    apres:
      - narrateur: "Le phare s'allume. Sa lumière balaie la baie et montre aux navires la route du lycée."
  en-ile-du-monde:
    titre: "L'Île du Monde"
    objet: "la cloche de l'Écho"
    avant:
      - narrateur: "L'Île du Monde capte toutes les voix de la planète, mais le brouillard les brouille en un bruit sans fin."
      - zero: "Ça doit être… euh… « It must be » un podcast cassé ?"
    apres:
      - narrateur: "Le bruit devient musique : des milliers de voix anglophones, de Londres à Lagos, de Sydney à Mumbai, résonnent clairement."

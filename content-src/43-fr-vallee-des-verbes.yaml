id: fr-vallee-des-verbes
matiere: francais
titre: La Vallée des Verbes
sous_titre: Le verbe, l'infinitif, le sujet et l'accord
emoji: 🏃
couleur: "#e65100"
cycle: graines
age: 7-9 ans
niveau: CE1 – CE2
ordre: 43
prerequis: [fr-foret-des-noms]
version: 1.0.0
intro:
  - neo: "Ici, tout bouge ! Les cailloux sautent, les rivières courent. Le verbe, c'est le moteur de la phrase."
  - mia: "Et le sujet, c'est le pilote. Il dit au verbe comment s'écrire."
  - zero: "Moi je suis un verbe : je MANGE. Je DORS. Je REMANGE. 😳"

lecons:
  - id: le-verbe
    titre: "Le verbe : le mot qui bouge"
    objectif: Je repère le verbe d'une phrase grâce à trois tests.
    mots: [verbe]
    etapes:
      - dialogue:
          - zero: "Comment je trouve le verbe ? Il porte un chapeau spécial ?"
          - neo: "Mieux : il change quand on change de moment. « Aujourd'hui je saute, hier j'ai sauté, demain je sauterai. »"
      - a_quoi_ca_sert: "Le verbe est le cœur de la phrase : il dit ce qui se passe. Sans verbe, pas d'action, pas d'histoire !"
      - texte: |
          Le **verbe** dit ce que fait le sujet (une **action** : courir, manger) ou comment il est (un **état** : être, sembler).

          **Trois tests** pour le trouver :
          1. Je change le temps : **hier… / demain…** → le verbe change (*il court → il courra*).
          2. J'entoure avec **ne … pas** : *il **ne** court **pas*** → « court » est le verbe.
          3. Je cherche **qui** fait l'action : la réponse est le sujet, et le verbe est juste après.
      - astuce:
          texte: "Le test du « ne… pas » est le plus rapide : le verbe est toujours pris en sandwich !"
          qui: mia
      - retiens: "Le verbe **change avec le temps** (hier, demain) et se met **entre ne… et pas**."
    exercices:
      - type: surligner
        vars: { t: ["Le chat [mange] sa pâtée.", "Lya [dessine] une étoile.", "Les enfants [jouent] dans la cour.", "Mon père [lit] le journal.", "Les oiseaux [chantent] au printemps.", "Nous [regardons] un film.", "Le vent [souffle] très fort.", "Tu [écris] une lettre."] }
        enonce: "Touche le verbe de la phrase."
        phrase: "{{t}}"
        correction: "Le verbe change quand on dit « hier » ou « demain »."
      - type: classer
        vars: { t: [[courir, chapeau, manger, jardin], [chanter, gâteau, dormir, école], [sauter, cheval, lire, maison], [écrire, fleur, jouer, lapin]] }
        enonce: "Verbe ou pas verbe ?"
        categories: ["verbe", "pas un verbe"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "On peut conjuguer un verbe : je cours, tu manges…"
      - type: qcm
        vars: { t: [["Le lapin mange une carotte.", "mange", "lapin", "carotte"], ["Ma sœur chante très bien.", "chante", "sœur", "bien"], ["Les poissons nagent dans l'eau.", "nagent", "poissons", "eau"], ["Zéro dort sur un coussin.", "dort", "Zéro", "coussin"]] }
        enonce: "« {{t_0}} » Quel est le verbe ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_1}} » : on peut dire « ne {{t_1}} pas »."

  - id: infinitif
    titre: "L'infinitif : le verbe au repos"
    objectif: Je retrouve l'infinitif d'un verbe conjugué et je connais les trois groupes.
    mots: [infinitif, groupe]
    etapes:
      - dialogue:
          - mia: "Quand un verbe se repose, il reprend son nom de famille : son infinitif. « Il chante » vient de « chanter »."
          - neo: "Astuce : dis « il faut… » devant. Il faut chanter, il faut finir, il faut prendre."
      - a_quoi_ca_sert: "L'infinitif est le nom de famille du verbe : c'est sous cette forme qu'on le cherche dans le dictionnaire et qu'on apprend à le conjuguer."
      - texte: |
          L'**infinitif** est le « nom » du verbe, celui qu'on trouve dans le dictionnaire : **chanter, finir, prendre**.

          Les verbes sont rangés en **trois groupes** :
          - **1er groupe** : infinitif en **-er** (chanter, jouer, manger). Sauf *aller* !
          - **2e groupe** : infinitif en **-ir** et « nous …**issons** » (finir → nous fin**issons**, grandir → nous grand**issons**).
          - **3e groupe** : tous les autres (prendre, voir, partir, faire, aller…).
      - astuce:
          texte: "Pour trouver l'infinitif, mets « il faut » devant : « nous courons » → il faut **courir**."
          qui: neo
      - retiens: "Infinitif = le verbe **non conjugué**. **-er** → 1er groupe (sauf aller) ; **-ir** + « issons » → 2e ; les autres → 3e."
    exercices:
      - type: mot
        vars: { t: [["il chante", "chanter"], ["nous jouons", "jouer"], ["tu finis", "finir"], ["elles grandissent", "grandir"], ["je prends", "prendre"], ["vous faites", "faire"], ["il va", "aller"], ["nous voyons", "voir"], ["tu cours", "courir"], ["ils lisent", "lire"], ["je dors", "dormir"], ["elle écrit", "écrire"]] }
        enonce: "Quel est l'infinitif de « {{t_0}} » ?"
        reponse: "{{t_1}}"
        correction: "Il faut {{t_1}} : l'infinitif est « {{t_1}} »."
      - type: classer
        vars: { t: [[chanter, finir, prendre], [jouer, grandir, voir], [danser, choisir, faire], [regarder, obéir, partir], [manger, remplir, dire]] }
        enonce: "Range chaque verbe dans son groupe."
        categories: ["1er groupe", "2e groupe", "3e groupe"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 2]]
        correction: "-er → 1er ; -ir avec « nous …issons » → 2e ; les autres → 3e."
      - type: qcm
        vars: { v: [chanter, finir, prendre, aller, courir, grandir, jouer, voir, choisir, faire, réussir, partir, dormir, obéir, parler] }
        enonce: "« {{v}} » est un verbe du…"
        choix: ["{{si(groupe(v)==1,'1er groupe',si(groupe(v)==2,'2e groupe','3e groupe'))}}", "{{si(groupe(v)==1,'2e groupe',si(groupe(v)==2,'3e groupe','1er groupe'))}}", "{{si(groupe(v)==1,'3e groupe',si(groupe(v)==2,'1er groupe','2e groupe'))}}"]
        niveau: 2
        explications: ["", "Regarde la fin de l'infinitif, et pour -ir, dis « nous ... » : « nous {{conj(v,'present',4)}} ».", "Regarde la fin de l'infinitif, et pour -ir, dis « nous ... » : « nous {{conj(v,'present',4)}} »."]
        correction: "« nous {{conj(v,'present',4)}} » : {{v}} est du {{groupe(v)}}{{si(groupe(v)==1,'er','e')}} groupe."

  - id: le-sujet
    titre: "Le sujet : le pilote du verbe"
    objectif: Je trouve le sujet en demandant « qui est-ce qui… ? » devant le verbe.
    mots: [sujet]
    etapes:
      - dialogue:
          - neo: "Pour trouver le sujet, je pose la question magique : « Qui est-ce qui » + verbe ?"
          - zero: "« Qui est-ce qui mange ? » … MOI ! Zéro ! Je suis le sujet !"
      - a_quoi_ca_sert: "Trouver le sujet, c'est savoir qui fait l'action, et donc bien accorder le verbe : « les enfants jouent », pas « jouent » tout seul."
      - texte: |
          Le **sujet** dit **qui** fait l'action. Je le trouve avec la question **« Qui est-ce qui … ? »** (ou « Qu'est-ce qui … ? »).

          *Les enfants jouent.* → Qui est-ce qui joue ? → **les enfants** : c'est le sujet.

          Le sujet peut être un **nom** (*le chat*), un **groupe** (*le petit chat noir*), un **pronom** (*il*), un **nom propre** (*Léa*).
      - astuce:
          texte: "Pose la question « Qui est-ce qui… ? » devant le verbe, ou encadre avec « C'est… qui » : « C'est le chat qui dort. » Le sujet est piégé !"
          qui: neo
      - retiens: "**Qui est-ce qui** + verbe ? La réponse est le **sujet**. Il commande l'accord du verbe."
    exercices:
      - type: surligner
        vars: { t: ["[Le chien] aboie fort.", "[Lya] lit une histoire.", "[Les élèves] écoutent la maîtresse.", "[Mon petit frère] dort encore.", "Dans le ciel, [les nuages] passent.", "[Nous] partons demain.", "[La pluie] tombe sur le toit."] }
        enonce: "Touche le sujet (qui est-ce qui… ?)."
        phrase: "{{t}}"
        correction: "Pose la question « Qui est-ce qui » + verbe."
      - type: qcm
        vars: { t: [["Le soleil brille.", "le soleil", "brille"], ["Les chats chassent les souris.", "les chats", "les souris"], ["Ce matin, Tom mange une tartine.", "Tom", "ce matin"], ["Dans la forêt vivent des loups.", "des loups", "la forêt"]] }
        enonce: "« {{t_0}} » Quel est le sujet ?"
        choix: ["{{t_1}}", "{{t_2}}"]
        niveau: 2
        explications: ["", "Pose la question : qui est-ce qui fait l'action ?"]
        correction: "Le sujet est « {{t_1}} »."
      - type: qcm
        vars: { t: [["Dans la forêt vivait un vieux loup.", "un vieux loup", "la forêt", "vivait"], ["Au loin brillent les étoiles.", "les étoiles", "au loin", "brillent"], ["Sur la branche chantait un merle.", "un merle", "la branche", "chantait"], ["Que dit la maîtresse ?", "la maîtresse", "que", "dit"], ["Dans la cour jouent les enfants.", "les enfants", "la cour", "jouent"]] }
        enonce: "Attention, sujet inversé ! Dans « {{t_0}} », quel est le sujet ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}} : qui est-ce qui fait l'action ? Le sujet peut être placé après le verbe."


  - id: pronoms
    titre: "Les pronoms personnels : je, tu, il, elle, nous, vous, ils, elles"
    objectif: Je remplace un sujet par le bon pronom personnel.
    mots: [pronom]
    etapes:
      - dialogue:
          - mia: "« Lya mange. Lya lit. Lya dort. » C'est lourd ! On dit plutôt : « Elle mange. Elle lit. Elle dort. »"
          - neo: "« Elle » est un pronom : il remplace le nom pour éviter les répétitions."
      - a_quoi_ca_sert: "Les pronoms évitent de répéter sans arrêt les mêmes noms : « Léo prend son vélo. Il part. » au lieu de « Léo… Léo… Léo… »."
      - texte: |
          | | singulier | pluriel |
          |---|---|---|
          | 1re personne (qui parle) | **je** | **nous** |
          | 2e personne (à qui on parle) | **tu** | **vous** |
          | 3e personne (de qui on parle) | **il, elle, on** | **ils, elles** |

          *Le chat* → **il** ; *la souris* → **elle** ; *Léa et moi* → **nous** ; *les filles* → **elles** ; *Tom et Léa* → **ils**.
      - attention:
          texte: "Un groupe mélangé (garçons et filles) se remplace par **ils**."
          qui: neo
      - astuce:
          texte: "Je, tu, il/elle/on, nous, vous, ils/elles : récite-les comme une comptine, toujours dans le même ordre, et la conjugaison suivra."
          qui: mia
      - retiens: "Masculin → **il / ils** ; féminin → **elle / elles** ; moi + quelqu'un → **nous** ; toi + quelqu'un → **vous**."
    exercices:
      - type: qcm
        vars: { t: [["Le chien", "il", "elle", "ils"], ["La poule", "elle", "il", "elles"], ["Les garçons", "ils", "il", "elles"], ["Les filles", "elles", "ils", "elle"], ["Tom et Léa", "ils", "elles", "nous"], ["Papa et moi", "nous", "vous", "ils"], ["Ta sœur et toi", "vous", "nous", "elles"], ["Lya", "elle", "il", "nous"]] }
        enonce: "Par quel pronom remplacer « {{t_0}} » ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_0}} → {{t_1}}."
      - type: mot
        vars: { t: [["Le lapin mange.", "Il mange."], ["La maîtresse explique.", "Elle explique."], ["Les oiseaux chantent.", "Ils chantent."], ["Léa et moi jouons.", "Nous jouons."], ["Les poules picorent.", "Elles picorent."]] }
        enonce: "Réécris en remplaçant le sujet par un pronom : {{t_0}}"
        reponse: "{{t_1}}"
        niveau: 2
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Lya et moi", "nous", "vous", "ils"], ["Toi et Néo", "vous", "nous", "ils"], ["Léa et Lucie", "elles", "ils", "nous"], ["Tom et Léa", "ils", "elles", "vous"], ["Ma mère et moi", "nous", "elles", "vous"], ["Ton frère et toi", "vous", "ils", "nous"]] }
        enonce: "Quel pronom remplace « {{t_0}} » ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}} — avec « moi », c'est nous ; avec « toi », c'est vous ; un seul garçon dans le groupe, c'est ils."


  - id: present-premier-groupe
    titre: "Le présent des verbes en -er"
    objectif: Je conjugue au présent les verbes du 1er groupe avec les terminaisons e, es, e, ons, ez, ent.
    mots: [présent, terminaison]
    etapes:
      - dialogue:
          - zero: "Je chante, tu chantes, il chante… Pourquoi « tu » a un S ? Il est plus important ?"
          - neo: "Chaque personne a sa terminaison. Pour les verbes en -er, c'est toujours la même chanson : e, es, e, ons, ez, ent."
      - texte: |
          Au **présent**, on garde le **radical** (chant-) et on ajoute la terminaison :

          | | chanter |
          |---|---|
          | je | chant**e** |
          | tu | chant**es** |
          | il, elle, on | chant**e** |
          | nous | chant**ons** |
          | vous | chant**ez** |
          | ils, elles | chant**ent** |
      - attention:
          texte: "Avec **ils / elles**, on écrit **-ent** mais on ne l'entend pas : *ils chant**ent*** se prononce comme *il chante* !"
          qui: neo
      - astuce:
          texte: "Avec **tu**, il y a presque toujours un **s** à la fin du verbe. Retiens : « tu… s » !"
          qui: mia
      - retiens: "1er groupe au présent : **e, es, e, ons, ez, ent**. Le **-ent** de ils/elles est **muet**."
      - vraie_vie:
          titre: Défi dans la vraie vie
          texte: "Pendant le repas, raconte ce que fait chaque personne de ta famille avec un verbe en -er : « Papa coupe le pain, nous mangeons, ma sœur parle… »"
    exercices:
      - type: mot
        vars: { v: [chanter, danser, jouer, parler, regarder, marcher, sauter, aimer, écouter, dessiner, porter, chercher, trouver, rêver, crier, arriver, entrer, rester], p: "1..6", g: [m, f] }
        enonce: "Conjugue au présent : {{pronom(p, g)}} … ({{v}})"
        reponse: ["{{conj(v, 'present', p)}}", "{{conjp(v, 'present', p, g)}}"]
        correction: "{{conjp(v, 'present', p, g)}}"
      - type: qcm
        vars: { v: [chanter, danser, jouer, parler, regarder, marcher, sauter, écouter], p: [2, 4, 5, 6] }
        enonce: "Quelle forme est juste ? {{pronom(p)}} …"
        choix: ["{{conj(v,'present',p)}}", "{{conj(v,'present',si(p==2,3,si(p==6,3,si(p==4,5,4))))}}", "{{conj(v,'present',si(p==2,4,si(p==6,4,si(p==4,6,6))))}}"]
        correction: "{{conjp(v,'present',p)}}"
      - type: surligner
        vars: { t: ["Les enfants [jouent] dans le jardin.", "Tu [chantes] très bien.", "Nous [regardons] les étoiles.", "Vous [dessinez] un bateau.", "Elles [écoutent] la radio."] }
        enonce: "Touche le verbe conjugué."
        phrase: "{{t}}"
        correction: "Regarde la terminaison : elle dépend du sujet."

  - id: etre-avoir-aller
    titre: "Être, avoir, aller, faire au présent"
    objectif: Je conjugue au présent les quatre verbes les plus utilisés de la langue.
    mots: [être, avoir, aller, faire]
    etapes:
      - dialogue:
          - mia: "Ces quatre verbes sont partout ! Et ils n'en font qu'à leur tête : il faut les apprendre par cœur."
          - zero: "Je suis, tu es, il est… On dirait une chanson. Une chanson très bizarre."
      - a_quoi_ca_sert: "Être, avoir et aller sont les verbes les plus utilisés du français : ils servent dans presque toutes les phrases et pour fabriquer d'autres temps."
      - texte: |
          | | être | avoir | aller | faire |
          |---|---|---|---|---|
          | je / j' | suis | ai | vais | fais |
          | tu | es | as | vas | fais |
          | il, elle | est | a | va | fait |
          | nous | sommes | avons | allons | faisons |
          | vous | êtes | avez | allez | **faites** |
          | ils, elles | sont | ont | vont | font |
      - attention:
          texte: "On dit « vous **faites** » et jamais « vous faisez » !"
          qui: neo
      - astuce:
          texte: "Pour « avoir », retiens la chanson : j'ai, tu as, il a, nous avons, vous avez, ils ont. Et « ils ont » ne s'écrit jamais « ils on »."
          qui: zero
      - retiens: "Je **suis**, j'**ai**, je **vais**, je **fais**… À réciter comme une chanson."
    exercices:
      - type: mot
        vars: { v: [être, avoir, aller, faire], p: "1..6", g: [m, f] }
        enonce: "Conjugue au présent : {{pronom(p, g)}} … ({{v}})"
        reponse: ["{{conj(v, 'present', p)}}", "{{conjp(v, 'present', p, g)}}"]
        correction: "{{conjp(v, 'present', p, g)}}"
      - type: qcm
        vars: { t: [["vous", "faites", "faisez", "faisons"], ["ils", "sont", "ont", "sommes"], ["nous", "allons", "allez", "vont"], ["tu", "as", "a", "es"], ["il", "est", "es", "ai"], ["ils", "vont", "allent", "vons"], ["j'", "ai", "as", "a"]] }
        enonce: "Complète : {{t_0}} …"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_0}} {{t_1}}"
      - type: dictee
        vars: { m: ["Je suis content.", "Nous avons un chien.", "Ils vont à l'école.", "Vous faites un gâteau.", "Tu es mon ami.", "Elle a dix ans."] }
        enonce: "Écoute et écris la phrase."
        dictee: "{{m}}"
        niveau: 2
        correction: "{{m}}"

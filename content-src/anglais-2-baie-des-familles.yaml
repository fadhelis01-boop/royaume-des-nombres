id: en-baie-des-familles
matiere: anglais
titre: La Baie des Familles
sous_titre: La famille, le corps, les jours et les mois, ce que j'aime, ce que je sais faire, la météo
emoji: 🏡
couleur: "#2a7fc4"
cycle: graines
age: 9-10 ans
niveau: CM1
ordre: 702
version: 1.0.0
intro:
  - narrateur: "Dans la Baie des Familles, les maisons sont accrochées aux falaises. Le brouillard a effacé les noms de chacun."
  - mia: "Ici, on va parler de soi : sa famille, ce qu'on aime, ce qu'on sait faire. Écoute, répète, puis fais tes propres phrases."
  - zero: "My name is Zéro and I like… euh… tout ?"

lecons:
  - id: my-family
    titre: My family - ma famille
    objectif: Je présente les membres de ma famille avec « This is my… » et « I have got… ».
    mots: [mother, father, sister, brother, famille]
    etapes:
      - dialogue:
          - zero: "Sur cette photo, il y a plein de monde. Comment je présente ma famille en anglais ?"
          - mia: "Tu montres chaque personne et tu dis « This is my mother », « This is my brother »…"
      - a_quoi_ca_sert: "Montrer tes photos à un correspondant anglais, parler de tes frères et sœurs dans un jeu en ligne : ta famille, c'est le premier sujet de conversation."
      - texte: |
          - **mother** (mum) = mère · **father** (dad) = père
          - **sister** = sœur · **brother** = frère
          - **grandmother** (grandma) · **grandfather** (grandpa)

          Pour présenter : **This is my sister.** = Voici ma sœur.
          Pour compter : **I have got two brothers.** = J'ai deux frères.
      - visuel: { type: parole, langue: en-GB, mots: [{ texte: "This is my mother.", sens: "Voici ma mère.", emoji: "👩" }, { texte: "This is my father.", sens: "Voici mon père.", emoji: "👨" }, { texte: "I have got a sister.", sens: "J'ai une sœur.", emoji: "👧" }, { texte: "I have got two brothers.", sens: "J'ai deux frères.", emoji: "👦" }] }
        legende: "Écoute, puis présente ta propre famille à voix haute."
      - astuce: { texte: "« my » ne change jamais : my mother, my father, my brothers. Pas de féminin, pas de pluriel !", qui: neo }
      - retiens: "**This is my…** = voici mon, ma… · **I have got…** = j'ai… · **mother**, **father**, **sister**, **brother**."
    exercices:
      - type: qcm
        vars: { t: [["mother", "mère", "sœur", "grand-mère"], ["father", "père", "frère", "grand-père"], ["sister", "sœur", "mère", "cousine"], ["brother", "frère", "père", "oncle"], ["grandmother", "grand-mère", "mère", "tante"]] }
        visuel: { type: parole, langue: en-GB, mots: [{ texte: "{{t_0}}" }], cache: true }
        enonce: "🎧 Écoute. Qui est-ce ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » = {{t_1}}."
      - type: relier
        enonce: "🔗 Relie chaque mot anglais à sa traduction."
        paires: [["mother", "mère"], ["father", "père"], ["sister", "sœur"], ["brother", "frère"]]
        correction: "mother = mère, father = père, sister = sœur, brother = frère."
      - type: ordre
        enonce: "Remets les mots dans l'ordre pour dire « Voici ma sœur »."
        items: ["This", "is", "my", "sister."]
        correction: "This is my sister."
      - type: mot
        vars: { t: [["frère", "brother"], ["sœur", "sister"], ["père", "father"], ["mère", "mother"]] }
        enonce: "Écris en anglais : **{{t_0}}**"
        reponse: "{{t_1}}"
        correction: "{{t_0}} = **{{t_1}}**."
      - type: qcm
        enonce: "Comment dit-on « J'ai deux frères » ?"
        choix: ["I have got two brothers.", "I am two brothers.", "My two brother.", "I have got two brother."]
        correction: "**I have got** = j'ai, et « brothers » prend un s au pluriel."

  - id: my-body
    titre: My body - le corps
    objectif: Je nomme les parties du corps et je décris une personne avec « She has got… ».
    mots: [head, eyes, hair, hand, corps]
    etapes:
      - dialogue:
          - neo: "Un habitant a perdu son chat. Il le décrit, mais je ne comprends pas : « It has got green eyes »."
          - mia: "« Il a des yeux verts » ! Apprenons les parties du corps pour décrire n'importe qui."
      - a_quoi_ca_sert: "Jouer à « Jacques a dit » en anglais (Simon says), décrire ton personnage préféré, expliquer où tu as mal chez un médecin en voyage."
      - texte: |
          - **head** = tête · **eyes** = yeux · **ears** = oreilles · **nose** = nez · **mouth** = bouche
          - **hair** = cheveux · **arm** = bras · **hand** = main · **leg** = jambe · **foot** = pied

          Pour décrire : **She has got long hair.** = Elle a les cheveux longs. **He has got blue eyes.** = Il a les yeux bleus.
      - visuel: { type: parole, langue: en-GB, mots: [{ texte: "head", sens: "tête", emoji: "🙂" }, { texte: "eyes", sens: "yeux", emoji: "👀" }, { texte: "nose", sens: "nez", emoji: "👃" }, { texte: "mouth", sens: "bouche", emoji: "👄" }, { texte: "hand", sens: "main", emoji: "✋" }, { texte: "foot", sens: "pied", emoji: "🦶" }] }
        legende: "Touche, écoute, et montre la partie de ton corps en la disant."
      - attention: "**I have got**, **you have got**… mais **he / she / it has got**."
      - astuce: { texte: "Joue à « Simon says » : « Simon says touch your nose! » Tu touches seulement si tu entends « Simon says ».", qui: zero }
      - retiens: "**head**, **eyes**, **nose**, **mouth**, **hand**, **leg**. **He / She has got** = il / elle a."
    exercices:
      - type: qcm
        vars: { t: [["head", "la tête", "la main", "le pied"], ["eyes", "les yeux", "les oreilles", "le nez"], ["hand", "la main", "le bras", "la jambe"], ["nose", "le nez", "la bouche", "les yeux"], ["leg", "la jambe", "le bras", "la tête"]] }
        visuel: { type: parole, langue: en-GB, mots: [{ texte: "{{t_0}}" }], cache: true }
        enonce: "🎧 Écoute. Quelle partie du corps ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » = {{t_1}}."
      - type: relier
        enonce: "🔗 Relie chaque partie du corps à son nom anglais."
        paires: [["👀", "eyes"], ["👃", "nose"], ["✋", "hand"], ["🦶", "foot"]]
        correction: "👀 eyes, 👃 nose, ✋ hand, 🦶 foot."
      - type: qcm
        enonce: "Comment dit-on « Elle a les yeux bleus » ?"
        choix: ["She has got blue eyes.", "She have got blue eyes.", "She has got eyes blue.", "She is blue eyes."]
        correction: "**she has got**, et la couleur avant le nom : **blue eyes**."
      - type: mot
        vars: { t: [["tête", "head"], ["main", "hand"], ["nez", "nose"], ["bouche", "mouth"]] }
        enonce: "Écris en anglais : **{{t_0}}**"
        reponse: "{{t_1}}"
        correction: "{{t_0}} = **{{t_1}}**."

  - id: days-months
    titre: Days and months - les jours et les mois
    objectif: Je dis les jours de la semaine, les mois et la date de mon anniversaire.
    mots: [Monday, Sunday, January, birthday, jour]
    etapes:
      - dialogue:
          - zero: "Mon anniversaire, c'est quand déjà ? En anglais, je ne sais pas le dire !"
          - mia: "« My birthday is in May. » Apprenons les jours et les mois : ils prennent toujours une majuscule en anglais."
      - a_quoi_ca_sert: "Inviter un ami à ton anniversaire, lire un programme de cinéma ou un calendrier en anglais, savoir quel jour tombe ton match."
      - texte: |
          Les **jours** : **Monday** (lundi), **Tuesday**, **Wednesday**, **Thursday**, **Friday**, **Saturday**, **Sunday** (dimanche).

          Les **mois** : January, February, March, April, May, June, July, August, September, October, November, December.

          **My birthday is in May.** = Mon anniversaire est en mai.
      - visuel: { type: parole, langue: en-GB, mots: [{ texte: "Monday", sens: "lundi" }, { texte: "Wednesday", sens: "mercredi" }, { texte: "Saturday", sens: "samedi" }, { texte: "Sunday", sens: "dimanche" }, { texte: "My birthday is in May.", sens: "Mon anniversaire est en mai.", emoji: "🎂" }] }
        legende: "Écoute surtout « Wednesday » : le d ne se prononce pas !"
      - attention: "En anglais, les jours et les mois prennent une **majuscule** : **Monday**, **May**."
      - astuce: { texte: "Sunday, c'est le jour du soleil (sun) ; Monday, celui de la lune (moon). Les noms racontent une histoire !", qui: neo }
      - retiens: "Les jours et les mois prennent une **majuscule**. **Monday** = lundi, **Sunday** = dimanche. **My birthday is in…** = mon anniversaire est en…"
    exercices:
      - type: qcm
        vars: { t: [["Monday", "lundi", "mardi", "dimanche"], ["Wednesday", "mercredi", "lundi", "jeudi"], ["Friday", "vendredi", "samedi", "jeudi"], ["Saturday", "samedi", "dimanche", "vendredi"], ["Sunday", "dimanche", "samedi", "lundi"]] }
        visuel: { type: parole, langue: en-GB, mots: [{ texte: "{{t_0}}" }], cache: true }
        enonce: "🎧 Écoute. Quel jour est-ce ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » = {{t_1}}."
      - type: ordre
        enonce: "Range les jours dans l'ordre de la semaine, en commençant par lundi."
        items: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
        correction: "Monday, Tuesday, Wednesday, Thursday, Friday."
      - type: relier
        enonce: "🔗 Relie chaque mois anglais au mois français."
        paires: [["January", "janvier"], ["March", "mars"], ["July", "juillet"], ["December", "décembre"]]
        correction: "January = janvier, March = mars, July = juillet, December = décembre."
      - type: mot
        vars: { t: [["dimanche", "Sunday"], ["lundi", "Monday"], ["samedi", "Saturday"], ["vendredi", "Friday"]] }
        enonce: "Écris en anglais (avec la majuscule) : **{{t_0}}**"
        reponse: "{{t_1}}"
        correction: "{{t_0}} = **{{t_1}}**, avec une majuscule."

  - id: food-i-like
    titre: I like… I don't like… - ce que j'aime
    objectif: Je dis ce que j'aime et ce que je n'aime pas manger, et je pose la question « Do you like…? ».
    mots: [like, apple, pizza, chips, aimer]
    etapes:
      - dialogue:
          - zero: "I like pizza ! I like chocolate ! I like… tout !"
          - mia: "Et ce que tu n'aimes pas ? On dit « I don't like broccoli »."
      - a_quoi_ca_sert: "Commander au restaurant en voyage, dire à ta famille d'accueil ce que tu aimes, faire un sondage dans ta classe."
      - texte: |
          - **I like apples.** = J'aime les pommes. 😋
          - **I don't like fish.** = Je n'aime pas le poisson. 😖
          - **Do you like pizza?** → **Yes, I do.** / **No, I don't.**

          Quelques aliments : **apple** (pomme), **bread** (pain), **cheese** (fromage), **chips** (frites), **chicken** (poulet), **milk** (lait).
      - visuel: { type: parole, langue: en-GB, mots: [{ texte: "I like apples.", sens: "J'aime les pommes.", emoji: "🍎" }, { texte: "I don't like fish.", sens: "Je n'aime pas le poisson.", emoji: "🐟" }, { texte: "Do you like pizza?", sens: "Aimes-tu la pizza ?", emoji: "🍕" }, { texte: "Yes, I do.", sens: "Oui.", emoji: "👍" }, { texte: "No, I don't.", sens: "Non.", emoji: "👎" }] }
        legende: "Écoute, puis dis trois choses que tu aimes et une que tu n'aimes pas."
      - astuce: { texte: "« don't » = « do not ». Pour dire non, glisse « don't » entre « I » et « like ».", qui: mia }
      - retiens: "**I like…** = j'aime · **I don't like…** = je n'aime pas · **Do you like…?** → **Yes, I do.** / **No, I don't.**"
    exercices:
      - type: qcm
        vars: { t: [["I like apples.", "J'aime les pommes.", "Je n'aime pas les pommes.", "Tu aimes les pommes ?"], ["I don't like fish.", "Je n'aime pas le poisson.", "J'aime le poisson.", "Aimes-tu le poisson ?"], ["Do you like pizza?", "Aimes-tu la pizza ?", "J'aime la pizza.", "Je n'aime pas la pizza."], ["I like cheese.", "J'aime le fromage.", "Je n'aime pas le fromage.", "Tu aimes le pain ?"]] }
        visuel: { type: parole, langue: en-GB, mots: [{ texte: "{{t_0}}" }], cache: true }
        enonce: "🎧 Écoute. Que veut dire cette phrase ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » = {{t_1}}"
      - type: ordre
        enonce: "Remets les mots dans l'ordre : « Je n'aime pas le poisson »."
        items: ["I", "don't", "like", "fish."]
        correction: "I don't like fish."
      - type: qcm
        enonce: "On te demande « Do you like chocolate? » et tu adores ça. Tu réponds :"
        choix: ["Yes, I do.", "No, I don't.", "Yes, I like.", "I am chocolate."]
        correction: "On reprend « do » : **Yes, I do.**"
      - type: relier
        enonce: "🔗 Relie chaque aliment à sa traduction."
        paires: [["bread", "pain"], ["cheese", "fromage"], ["milk", "lait"], ["chicken", "poulet"]]
        correction: "bread = pain, cheese = fromage, milk = lait, chicken = poulet."

  - id: animals-can
    titre: I can… - ce que je sais faire
    objectif: Je dis ce que je sais faire ou pas avec « I can » et « I can't ».
    mots: [can, swim, run, jump, savoir]
    etapes:
      - dialogue:
          - neo: "Le dauphin nage, l'oiseau vole… et toi, Zéro ?"
          - zero: "I can… dormir ! Ça compte ?"
          - mia: "« I can sleep! » Oui, ça compte. Et « I can't fly » : je ne sais pas voler."
      - a_quoi_ca_sert: "Te présenter dans un club de sport ou un camp de vacances : dire si tu sais nager, faire du vélo ou jouer d'un instrument."
      - texte: |
          - **I can swim.** = Je sais nager. · **I can't fly.** = Je ne sais pas voler.
          - **Can you ride a bike?** → **Yes, I can.** / **No, I can't.**

          Verbes utiles : **swim** (nager), **run** (courir), **jump** (sauter), **fly** (voler), **sing** (chanter), **dance** (danser).
      - visuel: { type: parole, langue: en-GB, mots: [{ texte: "I can swim.", sens: "Je sais nager.", emoji: "🏊" }, { texte: "I can't fly.", sens: "Je ne sais pas voler.", emoji: "🕊️" }, { texte: "Can you run fast?", sens: "Sais-tu courir vite ?", emoji: "🏃" }, { texte: "Yes, I can.", sens: "Oui.", emoji: "👍" }] }
        legende: "Écoute, puis dis deux choses que tu sais faire."
      - attention: "Après **can**, le verbe ne change jamais : **she can swim** (pas « she cans swims »)."
      - astuce: { texte: "Mime le verbe en le disant : bras qui nagent pour « swim », saut pour « jump ». Ton corps retient le mot.", qui: zero }
      - retiens: "**I can** = je sais / je peux · **I can't** = je ne sais pas · **Can you…?** → **Yes, I can.** / **No, I can't.**"
    exercices:
      - type: qcm
        vars: { t: [["swim", "nager", "courir", "voler"], ["run", "courir", "sauter", "chanter"], ["jump", "sauter", "nager", "danser"], ["fly", "voler", "sauter", "courir"], ["sing", "chanter", "danser", "nager"]] }
        visuel: { type: parole, langue: en-GB, mots: [{ texte: "{{t_0}}" }], cache: true }
        enonce: "🎧 Écoute. Que veut dire ce verbe ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » = {{t_1}}."
      - type: qcm
        enonce: "Comment dit-on « Le poisson ne sait pas voler » ?"
        choix: ["The fish can't fly.", "The fish can flies.", "The fish don't fly can.", "The fish not can fly."]
        correction: "**can't** + le verbe sans changement : **can't fly**."
      - type: ordre
        enonce: "Remets les mots dans l'ordre : « Sais-tu nager ? »"
        items: ["Can", "you", "swim?"]
        correction: "Can you swim?"
      - type: mot
        vars: { t: [["nager", "swim"], ["courir", "run"], ["sauter", "jump"], ["chanter", "sing"]] }
        enonce: "Écris le verbe anglais : **{{t_0}}**"
        reponse: "{{t_1}}"
        correction: "{{t_0}} = **{{t_1}}**."

  - id: weather-clothes
    titre: The weather - la météo et les vêtements
    objectif: Je dis le temps qu'il fait et ce que je porte.
    mots: [sunny, rainy, cold, coat, météo]
    etapes:
      - dialogue:
          - mia: "Le brouillard se lève sur la Baie ! « It's sunny! »"
          - zero: "Et quand il pleut ? « It's… wet ? »"
          - neo: "On dit « It's rainy »… et on met son « raincoat » !"
      - a_quoi_ca_sert: "Écouter la météo d'un pays anglophone, préparer ta valise pour un voyage, raconter ta journée dans un message."
      - texte: |
          **What's the weather like?** = Quel temps fait-il ?

          - **It's sunny.** ☀️ Il fait beau. · **It's rainy.** 🌧️ Il pleut. · **It's cloudy.** ☁️ C'est nuageux.
          - **It's hot.** Il fait chaud. · **It's cold.** Il fait froid. · **It's windy.** Il y a du vent.

          **I'm wearing a coat.** = Je porte un manteau. Autres vêtements : **hat** (chapeau), **T-shirt**, **shoes** (chaussures).
      - visuel: { type: parole, langue: en-GB, mots: [{ texte: "It's sunny.", sens: "Il fait beau.", emoji: "☀️" }, { texte: "It's rainy.", sens: "Il pleut.", emoji: "🌧️" }, { texte: "It's cold.", sens: "Il fait froid.", emoji: "🥶" }, { texte: "I'm wearing a coat.", sens: "Je porte un manteau.", emoji: "🧥" }] }
        legende: "Regarde par la fenêtre et dis le temps qu'il fait en anglais."
      - astuce: { texte: "Beaucoup de mots de météo finissent par -y : sun → sunny, rain → rainy, cloud → cloudy, wind → windy.", qui: neo }
      - retiens: "**It's sunny**, **It's rainy**, **It's cold**, **It's hot**. **I'm wearing…** = je porte…"
    exercices:
      - type: qcm
        vars: { t: [["It's sunny.", "Il fait beau.", "Il pleut.", "Il fait froid."], ["It's rainy.", "Il pleut.", "Il fait beau.", "Il y a du vent."], ["It's cold.", "Il fait froid.", "Il fait chaud.", "Il pleut."], ["It's windy.", "Il y a du vent.", "Il neige.", "Il fait beau."]] }
        visuel: { type: parole, langue: en-GB, mots: [{ texte: "{{t_0}}" }], cache: true }
        enonce: "🎧 Écoute. Quel temps fait-il ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » = {{t_1}}"
      - type: relier
        enonce: "🔗 Relie chaque météo au bon vêtement."
        paires: [["It's rainy.", "a raincoat"], ["It's cold.", "a scarf"], ["It's sunny.", "a cap"]]
        correction: "Pluie → imperméable (raincoat), froid → écharpe (scarf), soleil → casquette (cap)."
      - type: mot
        vars: { t: [["soleil", "sun"], ["pluie", "rain"], ["vent", "wind"], ["nuage", "cloud"]] }
        enonce: "Écris le mot anglais : **{{t_0}}**"
        reponse: "{{t_1}}"
        correction: "{{t_0}} = **{{t_1}}**."
      - type: ordre
        enonce: "Remets les mots dans l'ordre : « Je porte un manteau »."
        items: ["I'm", "wearing", "a", "coat."]
        correction: "I'm wearing a coat."

id: en-patio-des-lettres-hispaniques
matiere: anglais
titre: Le Patio des Lettres hispaniques
sous_titre: Spécialité LLCER espagnol - grands auteurs, outils de la langue, commenter en espagnol, histoire et cultures hispaniques
emoji: 🌵
couleur: "#c62828"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 711
specialite: LLCER espagnol
version: 1.0.0
intro:
  - narrateur: "Au bout de l'Archipel, un patio ombragé : une fontaine, des azulejos, des livres de Cervantes, de Lorca et de García Márquez sur un banc."
  - mia: "La LLCER espagnol, c'est l'espagnol par la littérature et les cultures de l'Espagne et de l'Amérique latine."
  - neo: "¡Vamos! On lit, on commente, on traduit, on découvre vingt pays."

lecons:
  - id: llcer-es-auteurs
    titre: Grands auteurs et œuvres hispaniques
    classe: "1ʳᵉ"
    objectif: Je situe les grands auteurs d'Espagne et d'Amérique latine et leurs œuvres majeures.
    mots: [Siècle d'or, réalisme magique, Cervantes, Lorca]
    etapes:
      - dialogue:
          - zero: "L'espagnol, c'est la langue de l'Espagne, c'est tout ?"
          - neo: "C'est la langue officielle d'une vingtaine de pays, parlée par plus de 500 millions de personnes. Ses littératures viennent des deux côtés de l'Atlantique."
      - a_quoi_ca_sert: "Connaître les grandes œuvres permet de les citer et de les relier dans les commentaires ; c'est aussi la base d'études de langues, de lettres ou de relations internationales."
      - texte: |
          **Le Siècle d'or** (XVIᵉ et XVIIᵉ siècles) : **Cervantes**, *Don Quijote de la Mancha* (1605 et 1615), souvent considéré comme le premier roman moderne ; le théâtre de **Lope de Vega** et **Calderón** (*La vida es sueño*).

          **Le XXᵉ siècle en Espagne** : **Federico García Lorca**, poète et dramaturge (*La casa de Bernarda Alba*), assassiné en 1936 au début de la guerre civile.

          **L'Amérique latine** :
          - **Gabriel García Márquez** (Colombie), *Cien años de soledad* (1967), le **réalisme magique** : le merveilleux raconté comme ordinaire ;
          - **Jorge Luis Borges** (Argentine), contes vertigineux sur le temps et l'infini ;
          - **Pablo Neruda** (Chili), poète, prix Nobel 1971.

          **Les femmes** : Frida Kahlo en peinture, Gabriela Mistral (premier prix Nobel de littérature latino-américain, 1945), Isabel Allende.
      - visuel: { type: parole, langue: es-ES, mots: [{ texte: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme…", sens: "Dans un village de la Manche, dont je ne veux pas me rappeler le nom…", emoji: "🐴" }, { texte: "La vida es sueño.", sens: "La vie est un songe.", emoji: "💭" }] }
        legende: "Écoute la première phrase de Don Quichotte."
      - astuce: { texte: "Associe chaque auteur à un pays et à une image : Cervantes et son chevalier, García Márquez et le village de Macondo, Lorca et l'Andalousie.", qui: mia }
      - retiens: "**Siècle d'or** : Cervantes (*Don Quijote*), Lope de Vega, Calderón. **Lorca** (Espagne, XXᵉ). Amérique latine : **García Márquez** et le **réalisme magique**, **Borges**, **Neruda**, Gabriela Mistral."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque auteur à son pays."
        paires: [["Cervantes", "l'Espagne"], ["Gabriel García Márquez", "la Colombie"], ["Jorge Luis Borges", "l'Argentine"], ["Pablo Neruda", "le Chili"]]
        correction: "Des deux côtés de l'Atlantique."
      - type: qcm
        enonce: "Qu'est-ce que le réalisme magique ?"
        choix: ["Raconter le merveilleux comme s'il était ordinaire", "Un roman de chevalerie", "Une pièce de théâtre classique", "Un poème sans rimes"]
        correction: "Dans *Cien años de soledad*, des événements extraordinaires sont racontés calmement, comme des faits quotidiens."
      - type: relier
        enonce: "🔗 Relie chaque œuvre à son auteur."
        paires: [["Don Quijote de la Mancha", "Cervantes"], ["La casa de Bernarda Alba", "García Lorca"], ["Cien años de soledad", "García Márquez"], ["La vida es sueño", "Calderón"]]
        correction: "Quatre œuvres majeures."
      - type: vf
        vars: { t: [["L'espagnol est langue officielle d'une vingtaine de pays.", true], ["Le Siècle d'or est le XXᵉ siècle espagnol.", false], ["Lorca est mort au début de la guerre civile espagnole.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Une vingtaine de pays ; le Siècle d'or couvre les XVIᵉ et XVIIᵉ siècles ; Lorca est assassiné en 1936."

  - id: llcer-es-langue
    titre: Les outils de la langue - ser, estar, subjonctif
    classe: "1ʳᵉ"
    objectif: J'emploie correctement ser et estar et je reconnais le subjonctif après les expressions qui l'exigent.
    mots: [ser, estar, subjonctif, gustar]
    etapes:
      - dialogue:
          - zero: "« Être », c'est ser ou estar ?"
          - mia: "Les deux ! Ser dit ce qu'une chose est par nature, estar dit dans quel état ou à quel endroit elle se trouve."
      - a_quoi_ca_sert: "Ces points reviennent dans toutes les productions écrites et orales ; les maîtriser rend ton espagnol précis et naturel."
      - texte: |
          **Ser** : l'identité, la nature, la profession, l'origine, l'heure. *Soy francés. Es médico. Son las tres.*

          **Estar** : l'état passager, le lieu, le résultat d'une action, l'action en cours. *Estoy cansado. Madrid está en España. Estoy leyendo.*

          **Le subjonctif** s'emploie après :
          - les verbes de **volonté** ou de **sentiment** (*quiero que vengas*, *me alegra que estés aquí*) ;
          - **cuando** + futur (*cuando llegues, te llamo*) ;
          - **para que** (*para que lo sepas*).

          **Gustar** fonctionne à l'envers du français : *me gusta el libro* (le livre me plaît), *me gustan los libros*.
      - visuel: { type: parole, langue: es-ES, mots: [{ texte: "Estoy cansado, pero soy feliz.", sens: "Je suis fatigué, mais je suis heureux.", emoji: "😴" }, { texte: "Cuando llegues, te llamo.", sens: "Quand tu arriveras, je t'appellerai.", emoji: "📞" }] }
        legende: "Écoute ser et estar dans la même phrase."
      - astuce: { texte: "Ser = ce que c'est (pour toujours ou par nature) ; estar = comment ça va ou où c'est (maintenant).", qui: neo }
      - retiens: "**Ser** : identité, nature, origine, heure. **Estar** : état, lieu, action en cours. **Subjonctif** après volonté, sentiment, *cuando* + futur, *para que*. **Gustar** : *me gusta* + singulier, *me gustan* + pluriel."
    exercices:
      - type: qcm
        vars: { t: [["Madrid ___ en España.", "está", "es"], ["Mi padre ___ médico.", "es", "está"], ["Hoy ___ muy cansada.", "estoy", "soy"], ["___ las cinco de la tarde.", "Son", "Están"]] }
        enonce: "Complète : {{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}"]
        correction: "**{{t_1}}**."
      - type: classer
        enonce: "Range chaque emploi : ser ou estar ?"
        categories: ["Ser", "Estar"]
        mots: [["L'origine (de Francia)", 0], ["Un état passager (enfermo)", 1], ["La profession (profesor)", 0], ["Un lieu (en casa)", 1]]
        correction: "Nature, origine, profession → ser ; état, lieu → estar."
      - type: qcm
        enonce: "Complète : « Quiero que tú ___ conmigo. »"
        choix: ["vengas", "vienes", "venir", "vendrás"]
        correction: "Après un verbe de volonté, **subjonctif** : *vengas*."
      - type: qcm
        enonce: "Complète : « Me ___ las películas de terror. »"
        choix: ["gustan", "gusta", "gusto", "gustamos"]
        correction: "Le sujet est *las películas* (pluriel) : *me gust**an***."

  - id: llcer-es-commentaire
    titre: Commenter et traduire en espagnol
    classe: Terminale
    objectif: J'utilise le vocabulaire du commentaire en espagnol et j'évite les faux amis en traduction.
    mots: [comentario, falso amigo, traducción, narrador]
    etapes:
      - dialogue:
          - neo: "« Estoy embarazada », dit une jeune fille gênée. Traduis, Zéro !"
          - zero: "Je suis embarrassée ?"
          - mia: "Non : « je suis enceinte ». Un faux ami célèbre !"
      - a_quoi_ca_sert: "Commenter en espagnol et traduire sans contresens sont deux compétences évaluées ; elles servent dans les métiers de la traduction, du tourisme et de l'international."
      - texte: |
          **Le vocabulaire du commentaire** :
          - *el texto trata de…* (le texte parle de…) ;
          - *el narrador*, *el protagonista*, *el autor* ;
          - *el autor utiliza una metáfora para…* ;
          - *esto muestra que…*, *sin embargo* (cependant), *por lo tanto* (donc), *además* (de plus) ;
          - *en conclusión*.

          **Les faux amis** : *embarazada* = enceinte ; *constipado* = enrhumé ; *éxito* = succès ; *largo* = long ; *carpeta* = classeur ; *exquisito* = délicieux.

          **Traduire** : respecter les temps (le **passé simple** espagnol, *pretérito indefinido*, se traduit souvent par le passé simple dans un récit), garder le ton, ne pas calquer les tournures.
      - visuel: { type: parole, langue: es-ES, mots: [{ texte: "El texto trata de la emigración.", sens: "Le texte parle de l'émigration.", emoji: "🧳" }, { texte: "Sin embargo, el narrador duda.", sens: "Cependant, le narrateur doute.", emoji: "🤔" }] }
        legende: "Deux phrases utiles pour commenter."
      - astuce: { texte: "Quand un mot espagnol ressemble trop au français, méfie-toi et vérifie dans le contexte.", qui: zero }
      - retiens: "Commenter : *el texto trata de*, *el narrador*, *esto muestra que*, *sin embargo*, *por lo tanto*. Faux amis : *embarazada* (enceinte), *constipado* (enrhumé), *éxito* (succès), *largo* (long)."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque faux ami à sa vraie traduction."
        paires: [["embarazada", "enceinte"], ["constipado", "enrhumé"], ["éxito", "succès"], ["largo", "long"]]
        correction: "Ces mots ressemblent au français mais n'ont pas le même sens."
      - type: relier
        enonce: "🔗 Relie chaque connecteur à son sens."
        paires: [["sin embargo", "cependant"], ["por lo tanto", "donc"], ["además", "de plus"]]
        correction: "Des connecteurs pour argumenter en espagnol."
      - type: qcm
        enonce: "Comment dire « le texte parle de la mémoire » ?"
        choix: ["El texto trata de la memoria.", "El texto habla la memoria.", "El texto es memoria.", "El texto está de la memoria."]
        correction: "*Tratar de* = parler de, porter sur."
      - type: vf
        vars: { t: [["« Éxito » signifie « sortie ».", false], ["« Por lo tanto » sert à conclure.", true], ["On traduit le sens et le ton, pas mot à mot.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "*Éxito* = succès (la sortie se dit *salida*) ; *por lo tanto* = donc ; on traduit le sens."

  - id: llcer-es-histoire
    titre: Histoire et cultures du monde hispanique
    classe: Terminale
    objectif: Je situe les grands repères historiques de l'Espagne et de l'Amérique latine utiles pour comprendre les œuvres.
    mots: [guerra civil, franquismo, independencia, Transición]
    etapes:
      - dialogue:
          - mia: "*Guernica* de Picasso, les poèmes de Machado, les romans de l'exil : tous parlent de la guerre civile."
          - neo: "Pour comprendre les œuvres, il faut connaître l'histoire qui les a fait naître."
      - a_quoi_ca_sert: "Les textes de LLCER renvoient souvent à l'histoire ; ces repères permettent de les comprendre et de les commenter avec justesse."
      - texte: |
          **1492** : fin de la Reconquista (prise de Grenade) et arrivée de Christophe Colomb en Amérique ; début de la colonisation.

          **Début du XIXᵉ siècle** : **indépendances** de l'Amérique latine (Simón Bolívar, José de San Martín).

          **1936-1939** : **guerre civile espagnole** entre républicains et nationalistes du général Franco.

          **1939-1975** : **dictature franquiste** ; censure, exil de nombreux artistes.

          **1975-1978** : la **Transición** démocratique, Constitution de 1978.

          **XXᵉ siècle en Amérique latine** : révolutions (Mexique 1910, Cuba 1959), dictatures militaires (Chili 1973-1990, Argentine 1976-1983) et **mémoire** des disparus.
      - astuce: { texte: "Retiens trois dates rondes : 1492, 1936, 1975.", qui: zero }
      - retiens: "**1492** : Grenade et Colomb. Début du XIXᵉ : **indépendances** (Bolívar). **1936-1939** : guerre civile. **1939-1975** : franquisme. **1978** : Constitution démocratique. Amérique latine : révolutions, dictatures, mémoire."
    exercices:
      - type: ordre
        enonce: "Range ces événements dans l'ordre chronologique."
        items: ["L'arrivée de Colomb en Amérique", "Les indépendances latino-américaines", "La guerre civile espagnole", "La Constitution démocratique espagnole"]
        correction: "1492, début du XIXᵉ siècle, 1936-1939, 1978."
      - type: nombre
        enonce: "En quelle année meurt Franco, ce qui ouvre la transition démocratique ?"
        reponse: "1975"
        correction: "En **1975**."
      - type: relier
        enonce: "🔗 Relie chaque figure à son rôle."
        paires: [["Simón Bolívar", "un libérateur de l'Amérique du Sud"], ["Francisco Franco", "le dictateur espagnol de 1939 à 1975"], ["Christophe Colomb", "l'arrivée en Amérique en 1492"]]
        correction: "Trois figures de l'histoire hispanique."
      - type: vf
        vars: { t: [["La guerre civile espagnole a duré de 1936 à 1939.", true], ["La révolution cubaine a eu lieu en 1959.", true], ["Les pays d'Amérique latine sont devenus indépendants au XXIᵉ siècle.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Guerre civile 1936-1939 ; Cuba 1959 ; indépendances au début du XIXᵉ siècle."

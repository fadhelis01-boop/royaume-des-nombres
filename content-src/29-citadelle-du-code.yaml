  - id: bases-de-donnees-sql
    titre: Les bases de données et SQL
    classe: Terminale
    objectif: Je lis une table, je comprends clé primaire et clé étrangère, et j'écris une requête SQL simple.
    mots: [table, clé primaire, requête, SQL]
    etapes:
      - dialogue:
          - mia: "Une médiathèque a 50 000 livres et 3 000 adhérents. Comment savoir qui a emprunté quoi ?"
          - neo: "Avec une base de données : des tables reliées entre elles, et un langage pour les interroger, SQL."
      - a_quoi_ca_sert: "Tous les sites (boutiques, réseaux sociaux, Parcoursup) reposent sur des bases de données ; SQL est l'un des langages les plus demandés dans les métiers du numérique."
      - texte: |
          **Table** : des lignes (enregistrements) et des colonnes (attributs). Exemple : Livre(id, titre, annee).

          **Clé primaire** : un attribut qui identifie **chaque ligne de façon unique** (id).

          **Clé étrangère** : un attribut qui fait référence à la clé primaire d'une **autre table** (Emprunt.id_livre → Livre.id).

          **Requête SQL** :
          `SELECT titre FROM Livre WHERE annee > 2000;`
          choisit la colonne titre, dans la table Livre, pour les lignes où l'année dépasse 2000. On peut trier avec `ORDER BY` et relier deux tables avec `JOIN`.
      - attention: "Deux lignes ne peuvent pas avoir la même clé primaire : c'est ce qui garantit qu'on ne confond pas deux livres de même titre."
      - astuce: { texte: "Lis une requête comme une phrase : SELECT = je veux, FROM = dans, WHERE = seulement si.", qui: zero }
      - retiens: "Table = lignes et colonnes ; **clé primaire** unique ; **clé étrangère** vers une autre table ; `SELECT … FROM … WHERE …` pour interroger."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque mot clé SQL à son rôle."
        paires: [["SELECT", "choisir les colonnes"], ["FROM", "indiquer la table"], ["WHERE", "filtrer les lignes"], ["ORDER BY", "trier le résultat"]]
        correction: "SELECT colonnes FROM table WHERE condition ORDER BY tri."
      - type: qcm
        enonce: "Quelle requête donne les titres des livres parus après 2010 ?"
        choix: ["`SELECT titre FROM Livre WHERE annee > 2010`", "`SELECT Livre FROM titre WHERE annee > 2010`", "`SELECT annee FROM Livre`", "`WHERE titre FROM Livre`"]
        correction: "On choisit la colonne titre, dans la table Livre, avec la condition annee > 2010."
      - type: vf
        vars: { t: [["Deux lignes d'une table peuvent avoir la même clé primaire.", false], ["Une clé étrangère fait référence à une autre table.", true], ["WHERE sert à filtrer les lignes.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Clé primaire unique ; clé étrangère vers une autre table ; WHERE filtre."
      - type: qcm
        enonce: "Dans la table Eleve(num, nom, classe), quel attribut est le meilleur choix de clé primaire ?"
        choix: ["num", "nom", "classe", "aucun"]
        correction: "Deux élèves peuvent avoir le même nom ou la même classe ; le **numéro** est unique."

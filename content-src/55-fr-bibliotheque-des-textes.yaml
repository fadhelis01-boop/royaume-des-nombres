id: fr-bibliotheque-des-textes
matiere: francais
titre: La Bibliothèque des Textes
sous_titre: Comprendre, déduire, reconnaître les genres et les types de textes
emoji: 📚
couleur: "#4e342e"
cycle: explorateurs
age: 8-15 ans
niveau: CE2 – 3ᵉ
ordre: 55
prerequis: [fr-atelier-de-l-ecrivain]
version: 1.0.0
intro:
  - neo: "Le dernier éclat du Sablier est caché dans un livre. Pour le trouver, il faut vraiment comprendre ce qu'on lit."
  - mia: "Même ce qui n'est pas écrit en toutes lettres ! On appelle ça lire entre les lignes."
  - zero: "Lire entre les lignes ? Mais il n'y a rien entre les lignes ! …Ah. C'est une image. D'accord. 😳"

lecons:
  - id: le-corbeau-et-le-renard
    titre: "Une fable de La Fontaine : Le Corbeau et le Renard"
    objectif: Je lis une fable, je comprends l'histoire et je trouve sa morale.
    mots: [fable, morale, La Fontaine]
    etapes:
      - dialogue:
          - mia: "Jean de La Fontaine a écrit ses fables il y a plus de 350 ans. Des animaux qui parlent… pour faire réfléchir les humains !"
      - texte: |
          **Le Corbeau et le Renard** — Jean de La Fontaine (1668)

          Maître Corbeau, sur un arbre perché,
          Tenait en son bec un fromage.
          Maître Renard, par l'odeur alléché,
          Lui tint à peu près ce langage :
          « Hé ! bonjour, Monsieur du Corbeau.
          Que vous êtes joli ! que vous me semblez beau !
          Sans mentir, si votre ramage
          Se rapporte à votre plumage,
          Vous êtes le Phénix des hôtes de ces bois. »
          À ces mots le Corbeau ne se sent pas de joie ;
          Et pour montrer sa belle voix,
          Il ouvre un large bec, laisse tomber sa proie.
          Le Renard s'en saisit, et dit : « Mon bon Monsieur,
          Apprenez que tout flatteur
          Vit aux dépens de celui qui l'écoute :
          Cette leçon vaut bien un fromage, sans doute. »
          Le Corbeau, honteux et confus,
          Jura, mais un peu tard, qu'on ne l'y prendrait plus.
      - texte: |
          **Petit lexique** : *alléché* = attiré ; *ramage* = le chant des oiseaux ; *le Phénix* = un oiseau magique, le plus beau de tous ; *flatteur* = celui qui fait des compliments pour obtenir quelque chose ; *aux dépens de* = en profitant de.
      - retiens: "Une **fable** est un récit court, souvent avec des animaux, qui donne une **leçon** : la **morale**."
    exercices:
      - type: qcm
        vars: { t: [["Que tient le corbeau dans son bec ?", "un fromage", "une graine", "un ver"], ["Pourquoi le renard fait-il des compliments au corbeau ?", "pour obtenir le fromage", "parce qu'il l'aime beaucoup", "pour l'inviter à dîner"], ["Que fait le corbeau pour montrer sa belle voix ?", "il ouvre son bec", "il s'envole", "il chante une chanson entière"], ["Comment se sent le corbeau à la fin ?", "honteux et confus", "fier et joyeux", "en colère et affamé"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Quelle est la morale de la fable ?", "Il ne faut pas écouter les flatteurs.", "Il faut partager son fromage.", "Les corbeaux chantent mal."], ["Que veut dire « flatteur » ?", "quelqu'un qui fait des compliments intéressés", "quelqu'un qui vole", "quelqu'un qui chante"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        niveau: 2
        correction: "{{t_1}}"
      - type: vf
        vars: { t: [["Le renard est sincère quand il dit que le corbeau est beau.", false], ["Le corbeau perd son fromage parce qu'il est vaniteux.", true], ["La fable se passe dans une ville.", false], ["Le corbeau promet de ne plus se faire avoir.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Relis la fable : la réponse y est (parfois entre les lignes)."

  - id: la-cigale-et-la-fourmi
    titre: "La Cigale et la Fourmi : lire entre les lignes"
    objectif: Je comprends l'implicite (ce que le texte laisse deviner sans le dire).
    mots: [implicite, inférence]
    etapes:
      - texte: |
          **La Cigale et la Fourmi** — Jean de La Fontaine (1668)

          La Cigale, ayant chanté
          Tout l'été,
          Se trouva fort dépourvue
          Quand la bise fut venue :
          Pas un seul petit morceau
          De mouche ou de vermisseau.
          Elle alla crier famine
          Chez la Fourmi sa voisine,
          La priant de lui prêter
          Quelque grain pour subsister
          Jusqu'à la saison nouvelle.
          « Je vous paierai, lui dit-elle,
          Avant l'août, foi d'animal,
          Intérêt et principal. »
          La Fourmi n'est pas prêteuse :
          C'est là son moindre défaut.
          « Que faisiez-vous au temps chaud ?
          Dit-elle à cette emprunteuse.
          — Nuit et jour à tout venant
          Je chantais, ne vous déplaise.
          — Vous chantiez ? j'en suis fort aise.
          Eh bien ! dansez maintenant. »
      - dialogue:
          - neo: "La fable ne dit jamais « la fourmi refuse ». Pourtant on le comprend ! C'est de l'implicite."
          - mia: "« Dansez maintenant » veut dire : « débrouillez-vous, je ne vous donnerai rien ». Il faut lire entre les lignes."
      - retiens: "**L'implicite** : ce que le texte fait **comprendre sans le dire**. Je cherche des **indices** et je **déduis**."
    exercices:
      - type: qcm
        vars: { t: [["« La bise fut venue » : à quelle saison sommes-nous ?", "l'hiver", "l'été", "le printemps"], ["Que demande la cigale à la fourmi ?", "de la nourriture", "une chanson", "un abri pour dormir"], ["La fourmi accepte-t-elle de prêter ?", "non, elle refuse", "oui, tout de suite", "oui, mais plus tard"], ["« Dansez maintenant » veut dire :", "débrouillez-vous seule", "venez danser avec moi", "je vais chanter pour vous"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Pourquoi la cigale n'a-t-elle rien à manger ?", "elle a chanté au lieu de faire des provisions", "la fourmi lui a tout volé", "il n'y avait pas de nourriture cet été-là"], ["« La Fourmi n'est pas prêteuse : c'est là son moindre défaut » signifie :", "elle a d'autres défauts, encore pires", "elle n'a aucun défaut", "elle prête toujours"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        niveau: 2
        correction: "{{t_1}}"
      - type: vf
        vars: { t: [["La cigale a travaillé tout l'été.", false], ["La fourmi est prévoyante.", true], ["La cigale propose de rembourser.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Cherche les indices dans le texte."

  - id: inferences
    titre: "Déduire grâce aux indices"
    objectif: Je déduis une information qui n'est pas écrite, à partir d'indices du texte.
    mots: [indice, déduction]
    etapes:
      - dialogue:
          - neo: "« Léa ferma son parapluie et secoua ses bottes. » Il pleuvait ! Ce n'est pas écrit… mais les indices le disent."
      - texte: |
          Pour **déduire** :
          1. Je repère les **indices** (mots, actions, lieux, émotions).
          2. Je me demande ce qu'ils **font comprendre**.
          3. Je vérifie que ma déduction **ne contredit** rien dans le texte.
      - retiens: "Indices + ce que je sais = **déduction**. Je justifie toujours avec un mot du texte."
    exercices:
      - type: qcm
        vars: { t: [["Léa ferma son parapluie et secoua ses bottes.", "Il pleuvait dehors.", "Il faisait très chaud.", "Léa revenait de la plage."], ["Tom bâilla, frotta ses yeux et éteignit la lumière.", "Tom allait dormir.", "Tom se réveillait.", "Tom était en colère."], ["Mia souffla les huit bougies sous les applaudissements.", "C'était son anniversaire : elle a huit ans.", "Il y avait une panne de courant.", "Mia était à l'école."], ["Le chien remuait la queue en voyant son maître rentrer.", "Le chien était content.", "Le chien avait peur.", "Le chien dormait."], ["La boulangerie avait encore son rideau baissé et la rue était vide.", "Il était très tôt le matin.", "C'était midi.", "La boulangerie vendait beaucoup."]] }
        enonce: "« {{t_0}} » — Que peut-on déduire ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Ses mains tremblaient et son cœur battait très fort.", "la peur", "la joie", "l'ennui"], ["Il éclata de rire et sauta de joie.", "le bonheur", "la tristesse", "la colère"], ["Elle claqua la porte et ne dit plus un mot.", "la colère", "la joie", "la surprise"], ["Ses yeux s'emplirent de larmes.", "la tristesse", "la colère", "l'impatience"]] }
        enonce: "« {{t_0}} » — Quelle émotion ressent le personnage ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Tom bâilla, posa son livre et éteignit la lampe.", "Il allait dormir.", "Il partait à l'école.", "Il commençait ses devoirs."], ["Mia souffla les huit bougies sous les applaudissements.", "C'était son anniversaire : elle a huit ans.", "C'était Noël.", "Elle avait froid."], ["Le sol était tout blanc et les enfants mettaient leurs gants.", "Il avait neigé.", "C'était l'été.", "Il y avait du sable."], ["Néo regardait sa montre toutes les minutes en tapant du pied.", "Il était impatient.", "Il était endormi.", "Il était très calme."]] }
        enonce: "Lis bien les indices : « {{t_0}} » Que peut-on deviner ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"


  - id: types-de-textes
    titre: "Les types de textes"
    objectif: Je reconnais un texte narratif, descriptif, explicatif, argumentatif, poétique ou théâtral.
    mots: [type de texte, genre]
    etapes:
      - dialogue:
          - mia: "Un conte raconte, une recette explique, une publicité veut convaincre, un poème joue avec les mots…"
      - texte: |
          - **Narratif** : raconte une histoire (conte, roman, récit).
          - **Descriptif** : fait voir (portrait, paysage).
          - **Explicatif** : fait comprendre (documentaire, recette, notice).
          - **Argumentatif** : veut convaincre (débat, publicité, lettre de réclamation).
          - **Poétique** : joue avec les sons et les images (vers, rimes).
          - **Théâtral** : des dialogues entre personnages, avec des didascalies (indications de jeu).
      - retiens: "Je me demande : ce texte veut-il **raconter, décrire, expliquer, convaincre, émouvoir** ou être **joué** ?"
    exercices:
      - type: qcm
        vars: { t: [["Il était une fois une princesse qui vivait dans un château…", "narratif", "explicatif", "argumentatif"], ["Mélangez la farine et les œufs, puis ajoutez le lait.", "explicatif", "narratif", "poétique"], ["Achetez nos chaussures : elles sont les plus confortables du monde !", "argumentatif", "descriptif", "narratif"], ["La mer était d'un bleu profond, bordée de falaises blanches.", "descriptif", "argumentatif", "théâtral"], ["HARPAGON (criant) : Au voleur ! au voleur !", "théâtral", "explicatif", "descriptif"], ["Les volcans se forment quand le magma remonte à la surface.", "explicatif", "narratif", "poétique"]] }
        enonce: "« {{t_0}} » — Quel type de texte ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [["un conte", "une recette", "une publicité", "un poème"], ["un roman", "une notice de montage", "un débat", "une chanson en vers"]] }
        enonce: "Range chaque texte selon son but principal."
        categories: [raconter, expliquer, convaincre, émouvoir]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 2], ["{{t_3}}", 3]]
        correction: "Chaque type de texte a un but."
      - type: qcm
        vars: { t: [["narratif", "raconter une histoire", "convaincre", "donner des consignes"], ["descriptif", "faire voir un lieu ou un personnage", "raconter", "convaincre"], ["explicatif", "faire comprendre", "faire rire", "raconter"], ["argumentatif", "convaincre, défendre une opinion", "décrire", "raconter"], ["injonctif (recette, règle du jeu)", "dire quoi faire", "raconter", "émouvoir"]] }
        enonce: "Quel est le but d'un texte {{t_0}} ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"


  - id: le-conte
    titre: "Le conte et ses personnages"
    objectif: Je reconnais les caractéristiques du conte et les rôles des personnages.
    mots: [conte, héros, adjuvant, opposant]
    etapes:
      - dialogue:
          - zero: "Il était une fois un hamster qui trouva une graine magique… C'est un conte ! J'en suis le héros. 😳"
      - texte: |
          Le **conte** : une formule d'ouverture (*Il était une fois*), un lieu et une époque **imprécis**, du **merveilleux** (fées, objets magiques, animaux qui parlent), une **fin heureuse** le plus souvent.

          Les rôles des personnages :
          - le **héros** (celui qui part à l'aventure),
          - l'**opposant** (celui qui l'en empêche : sorcière, loup, ogre),
          - l'**adjuvant** (celui qui l'aide : fée, animal ami, objet magique).
      - retiens: "Conte = **Il était une fois**, **merveilleux**, **fin heureuse**. Rôles : **héros, opposant, adjuvant**."
    exercices:
      - type: qcm
        vars: { t: [["Dans « Le Petit Chaperon rouge », le loup est…", "l'opposant", "l'adjuvant", "le héros"], ["Dans « Cendrillon », la fée marraine est…", "l'adjuvant", "l'opposant", "le héros"], ["Dans « Le Petit Poucet », l'ogre est…", "l'opposant", "l'adjuvant", "le roi"], ["Dans « Le Chat botté », le chat est…", "l'adjuvant", "l'opposant", "l'ogre"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Quelle phrase ouvre souvent un conte ?", "Il était une fois…", "Hier matin, à Paris…", "Mesdames et messieurs…"], ["Qu'est-ce qui est typique du conte ?", "le merveilleux (fées, magie)", "des dates précises", "des chiffres et des graphiques"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [["Cendrillon", "la marâtre", "la fée marraine"], ["Blanche-Neige", "la reine", "les sept nains"], ["le Petit Chaperon rouge", "le loup", "le chasseur"]] }
        enonce: "Héros, opposant ou adjuvant ?"
        categories: [héros, opposant, adjuvant]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 2]]
        correction: "L'opposant gêne le héros ; l'adjuvant l'aide."


  - id: texte-documentaire
    titre: "Lire un texte documentaire"
    objectif: Je trouve une information précise dans un texte documentaire.
    mots: [documentaire, information]
    etapes:
      - texte: |
          **Les abeilles**

          Une ruche peut abriter jusqu'à 50 000 abeilles. On y trouve une seule **reine**, qui pond les œufs, des **ouvrières**, qui récoltent le nectar et fabriquent le miel, et des **faux bourdons**, les mâles.
          Une ouvrière vit environ six semaines en été. Pour produire un kilogramme de miel, les abeilles doivent butiner plusieurs millions de fleurs.
          Les abeilles communiquent par une danse : elle indique aux autres la direction et la distance des fleurs.
      - retiens: "Dans un documentaire, je **repère les mots-clés** de la question, puis je **cherche** la phrase qui y répond."
    exercices:
      - type: qcm
        vars: { t: [["Combien y a-t-il de reines dans une ruche ?", "une seule", "des milliers", "deux"], ["Que font les ouvrières ?", "elles récoltent le nectar et fabriquent le miel", "elles pondent les œufs", "elles dorment tout l'été"], ["Comment les abeilles communiquent-elles ?", "par une danse", "par des cris", "par des messages écrits"], ["Combien de temps vit une ouvrière en été ?", "environ six semaines", "dix ans", "un jour"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: nombre
        enonce: "D'après le texte, combien d'abeilles une ruche peut-elle abriter, au maximum ?"
        reponse: "50000"
        correction: "Jusqu'à 50 000 abeilles."
      - type: vf
        vars: { t: [["Les faux bourdons sont les mâles.", true], ["Il faut quelques fleurs seulement pour faire un kilo de miel.", false], ["La danse indique la direction des fleurs.", true]] }
        enonce: "Vrai ou faux, d'après le texte : {{t_0}}"
        reponse: "t_1"
        correction: "Relis la phrase qui en parle."

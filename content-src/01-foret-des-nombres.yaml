id: foret-des-nombres
titre: La Forêt des Nombres
sous_titre: Compter, lire, écrire et ranger les nombres
emoji: 🌳
couleur: "#3f9b4f"
decor: img/decors/foret-des-nombres.webp
cycle: graines
age: 7-9 ans
niveau: CP – CM1
ordre: 1
prerequis: []
version: 1.0.0
intro:
  - neo: "Bienvenue dans la Forêt des Nombres ! Ici, chaque arbre porte un nombre."
  - mia: "Et si on apprenait à les lire, à les écrire et à les ranger ? Ça va être magique !"
  - zero: "Moi, je suis Zéro. Je ne vaux rien… mais quand je change de place, tout change !"
  - neo: "On verra ça, Zéro. Défi accepté !"

lecons:
  # ------------------------------------------------------------------
  - id: compter-par-dix
    titre: Compter vite en faisant des paquets de 10
    objectif: Je sais compter une grande collection en faisant des paquets de 10.
    mots: [dizaine, unité]
    etapes:
      - dialogue:
          - zero: "J'ai ramassé plein de noisettes ! Une, deux, trois… euh… j'ai perdu le compte."
          - mia: "Et si on essayait autrement ? On fait des petits tas de 10 !"
          - neo: "Bonne idée. Compter des paquets, c'est plus rapide et on se trompe moins."
      - texte: |
          Quand il y a **beaucoup** d'objets, on les range par **paquets de 10**.

          Un paquet de 10, ça s'appelle une **dizaine**.
          Les objets qui restent tout seuls s'appellent des **unités**.
      - visuel:
          type: blocs
          nombre: 34
        legende: "3 paquets de 10 et 4 tout seuls : 34 noisettes."
      - astuce:
          texte: "Fais des paquets de 10 : il est bien plus facile de compter 4 paquets et 3 restants (43) que 43 objets un par un."
          qui: mia
      - retiens: "**10 unités = 1 dizaine.** Pour compter vite : je compte les dizaines (10, 20, 30…), puis j'ajoute les unités."
      - a_quoi_ca_sert: "Les caissiers comptent les pièces par piles de 10, les maîtresses comptent les élèves par rangées, les fermiers rangent les œufs par boîtes. Faire des paquets, c'est le secret pour compter beaucoup sans se tromper !"
      - exemple:
          titre: Compter 52 billes
          enonce: Il y a 5 sacs de 10 billes et 2 billes à côté. Combien de billes ?
          etapes:
            - "Je compte les sacs de 10 : 10, 20, 30, 40, 50."
            - "J'ajoute les 2 billes seules : 51, 52."
          reponse: Il y a 52 billes.
      - question:
          type: nombre
          vars: { d: "2..9", u: "1..9" }
          enonce: "Combien y a-t-il de cubes ?"
          visuel: { type: blocs, nombre: "=d*10+u" }
          reponse: "d*10+u"
          indice: "Compte d'abord les barres de 10 : 10, 20, 30… puis ajoute les petits cubes."
          correction: "{{d}} dizaines et {{u}} unités : {{d*10+u}}."
      - vraie_vie:
          titre: Défi dans la vraie vie
          texte: "Prends une grosse poignée de pâtes (ou de boutons). Fais des tas de 10. Combien de tas ? Combien de pâtes en tout ? Demande à un adulte de vérifier en comptant une par une : c'est beaucoup plus long !"
          materiel: "des pâtes, des boutons ou des Lego"
    exercices:
      - type: blocs
        vars: { n: "11..99" }
        enonce: "Construis le nombre {{n}} avec des barres de dix et des petits cubes."
        cible: "n"
        correction: "{{n}} = {{ent(n/10)}} × 10 + {{n%10}} : {{ent(n/10)}} barres de dix et {{n%10}} petits cubes."
      - type: nombre
        vars: { d: "1..9", u: "0..9" }
        enonce: "Combien y a-t-il de cubes ?"
        visuel: { type: blocs, nombre: "=d*10+u" }
        reponse: "d*10+u"
        indice: "Les barres valent 10. Compte de 10 en 10, puis ajoute les petits cubes."
        correction: "{{d}} barres de 10 = {{d*10}}, plus {{u}} : {{d*10+u}}."
      - type: nombre
        vars: { d: "2..9", u: "1..9" }
        enonce: "{{d}} paquets de 10 et {{u}} unités, cela fait combien ?"
        reponse: "d*10+u"
        correction: "{{d}} dizaines = {{d*10}}. {{d*10}} + {{u}} = {{d*10+u}}."
      - type: champs
        vars: { n: "11..99" }
        si: "n % 10 != 0"
        enonce: "Dans {{n}}, combien de dizaines et combien d'unités ?"
        champs:
          - { reponse: "ent(n/10)", apres: "dizaines" }
          - { reponse: "n % 10", apres: "unités" }
        correction: "{{n}} = {{ent(n/10)}} × 10 + {{n%10}} : {{ent(n/10)}} barres de dix et {{n%10}} petits cubes."
      - type: nombre
        vars: { d: "3..9" }
        enonce: "Combien d'unités y a-t-il dans {{d}} dizaines ?"
        reponse: "d*10"
        correction: "1 dizaine = 10 unités, donc {{d}} dizaines = {{d*10}} unités."
      - type: qcm
        vars: { d: "2..8", u: "1..9" }
        enonce: "Quel nombre a {{d}} dizaines et {{u}} unités ?"
        choix: ["{{d*10+u}}", "{{u*10+d}}", "{{d+u}}", "{{d*10+u+10}}"]
        si: "u != d"
        correction: "{{d}} dizaines, c'est {{d*10}}. Plus {{u}} unités : {{d*10+u}}."

  # ------------------------------------------------------------------
  - id: centaines
    titre: Les centaines et la place des chiffres
    objectif: Je sais lire et écrire les nombres jusqu'à 1 000 et je comprends la valeur de chaque chiffre.
    mots: [centaine, chiffre, nombre]
    etapes:
      - dialogue:
          - zero: "Regardez ! Je suis tout seul : 0. Je me mets derrière 1 : 10 ! Encore un ami Zéro : 100 !"
          - zero-surprise: "CENT ! 😳 Pourquoi tout le monde est impressionné ?"
          - mia: "Parce que la PLACE d'un chiffre change sa valeur, Zéro !"
          - zero: "…C'est évident."
      - texte: |
          **10 dizaines = 1 centaine**, c'est-à-dire 100.

          Dans un nombre, chaque chiffre a une **place** :
          - le chiffre de droite compte les **unités** ;
          - celui d'avant compte les **dizaines** ;
          - celui encore avant compte les **centaines**.
      - visuel:
          type: abaque
          nombre: 347
        legende: "347 = 3 centaines, 4 dizaines et 7 unités."
      - visuel:
          type: blocs
          nombre: 347
      - attention:
          texte: "Un **chiffre**, c'est un signe (0, 1, 2… 9). Un **nombre**, c'est une quantité qu'on écrit avec des chiffres. 347 est un nombre écrit avec 3 chiffres — comme un mot écrit avec des lettres !"
          qui: neo
      - astuce:
          texte: "Zéro sert à **garder la place vide**. Dans 405, il n'y a aucune dizaine, mais sans le 0 on lirait 45 !"
          qui: zero
      - a_quoi_ca_sert: "Le prix d'un vélo (249 €), le nombre de pages d'un livre, le nombre de places dans un stade… Bien lire chaque chiffre évite de grosses erreurs : 905 € ou 95 €, ce n'est pas pareil !"
      - question:
          type: nombre
          vars: { n: "101..999" }
          enonce: "Quel est le chiffre des dizaines dans {{n}} ?"
          reponse: "chiffre(n,1)"
          correction: "{{n}} : {{chiffre(n,2)}} centaines, {{chiffre(n,1)}} dizaines, {{chiffre(n,0)}} unités."
      - explique:
          texte: "Dans 347, comment sais-tu que le 4 vaut 40 ?"
          qui: neo
          choix:
            - { texte: "Il est à la place des dizaines : 4 dizaines = 40", ok: true, retour: "Exactement ! C'est la PLACE du chiffre qui donne sa valeur." }
            - { texte: "Parce que 4 est plus petit que 7", ok: false, retour: "Hmm, la taille du chiffre ne compte pas : c'est sa place qui compte. Regarde le tableau." }
            - { texte: "Je l'ai vu sur les blocs : 4 barres de 10", ok: true, retour: "Très bien vu ! Les 4 barres de dix font 40." }
    exercices:
      - type: blocs
        vars: { n: "101..599" }
        enonce: "Construis le nombre {{n}} avec les blocs."
        cible: "n"
        correction: "{{n}} = {{chiffre(n,2)}} × 100 + {{chiffre(n,1)}} × 10 + {{chiffre(n,0)}}."
      - type: nombre
        vars: { c: "2..9", u: "2..9" }
        enonce: "Écris en chiffres : {{c}} centaines et {{u}} unités."
        reponse: "c*100+u"
        niveau: 2
        erreurs:
          - { valeur: "c*10+u", message: "Tu as oublié de garder la place des dizaines ! Sans le 0 de Zéro, le {{c}} ne vaut que des dizaines." }
        correction: "{{c}} centaines, 0 dizaine, {{u}} unités : {{c*100+u}}."
      - type: champs
        vars: { n: "101..999" }
        enonce: "Décompose {{n}}."
        visuel: { type: abaque, nombre: "=n", vide: true }
        champs:
          - { reponse: "chiffre(n,2)", apres: "centaines" }
          - { reponse: "chiffre(n,1)", apres: "dizaines" }
          - { reponse: "chiffre(n,0)", apres: "unités" }
        correction: "{{n}} = {{chiffre(n,2)*100}} + {{chiffre(n,1)*10}} + {{chiffre(n,0)}}."
      - type: nombre
        vars: { c: "1..9", d: "0..9", u: "0..9" }
        enonce: "Écris le nombre : {{c}} centaines, {{d}} dizaines et {{u}} unités."
        reponse: "c*100+d*10+u"
        correction: "{{c}} centaines = {{c*100}}, {{d}} dizaines = {{d*10}}, et {{u}} unités : {{c*100+d*10+u}}."
      - type: nombre
        vars: { c: "1..9", u: "1..9" }
        enonce: "Écris le nombre : {{c}} centaines et {{u}} unités (et aucune dizaine)."
        reponse: "c*100+u"
        indice: "Quand il n'y a pas de dizaine, Zéro garde la place !"
        correction: "On écrit 0 aux dizaines : {{c*100+u}}."
      - type: qcm
        vars: { n: "101..999", r: [1, 2] }
        si: "chiffre(n,r) != 0"
        enonce: "Dans {{n}}, combien vaut le chiffre {{chiffre(n,r)}} qui est à la place des {{si(r==0,'unités',si(r==1,'dizaines','centaines'))}} ?"
        choix: ["{{chiffre(n,r)*10^r}}", "{{chiffre(n,r)}}", "{{chiffre(n,r)*10^(r+1)}}", "{{chiffre(n,r)*10^(r+2)}}"]
        correction: "À la place des {{si(r==0,'unités',si(r==1,'dizaines','centaines'))}}, le chiffre {{chiffre(n,r)}} vaut {{chiffre(n,r)*10^r}}."
      - type: nombre
        vars: { c: "2..9" }
        enonce: "Combien de dizaines dans {{c}} centaines ?"
        reponse: "c*10"
        correction: "1 centaine = 10 dizaines, donc {{c}} centaines = {{c*10}} dizaines."
      - type: nombre
        vars: { n: "100..999" }
        enonce: "Écris en chiffres : **{{lettres(n)}}**."
        reponse: "n"
        correction: "{{lettres(n)}} = {{n}}."
      - type: qcm
        vars: { n: "100..999" }
        si: "chiffre(n,1) == 0 || chiffre(n,0) == 0"
        enonce: "Comment s'écrit **{{lettres(n)}}** en chiffres ?"
        choix: ["{{n}}", "{{chiffre(n,2)}}{{chiffre(n,1)*10+chiffre(n,0)}}", "{{n*10}}", "{{chiffre(n,2)*1000+chiffre(n,1)*10+chiffre(n,0)}}"]
        correction: "On place chaque chiffre à sa place, et Zéro garde les places vides : {{n}}."

  # ------------------------------------------------------------------
  - id: nombres-en-lettres
    titre: Écrire les nombres en lettres
    objectif: J'écris en lettres les nombres jusqu'à mille, avec les bons traits d'union.
    mots: [lettres, écrire, orthographe, nombre]
    autrement:
      texte: "Les nombres en lettres se construisent comme des Lego : on a une petite boîte de mots (un, deux… seize, vingt, trente… cent, mille) et on les assemble. 74, c'est soixante + quatorze : soixante-quatorze. Avec l'orthographe de 1990, on relie toutes les briques par des traits d'union."
      visuel: { type: tableau, lignes: [["nombre", "les briques", "en lettres"], ["21", "vingt + et + un", "vingt-et-un"], ["74", "soixante + quatorze", "soixante-quatorze"], ["90", "quatre + vingt + dix", "quatre-vingt-dix"], ["300", "trois + cents", "trois-cents"]] }
      legende: "Chaque nombre se construit avec les briques de base."
    etapes:
      - dialogue:
          - neo: "Je dois écrire un chèque de 80 € pour le marchand… En lettres ! « Huitante » ?"
          - mia: "Ça, c'est en Suisse ! En France, on dit quatre-vingts : quatre fois vingt."
          - zero: "Et moi, « zéro », c'est facile : quatre lettres, pas de piège !"
      - a_quoi_ca_sert: "Écrire un chèque, remplir un formulaire, lire un livre où les nombres sont en lettres, faire une dictée : savoir écrire les nombres en lettres, c'est indispensable."
      - texte: |
          Pour écrire un nombre en lettres, on assemble des **mots de base** :

          - de **un** à **seize** : un, deux, trois… dix, onze, douze, treize, quatorze, quinze, seize ;
          - les dizaines : **vingt, trente, quarante, cinquante, soixante** ; ensuite soixante-dix (60 + 10), quatre-vingts (4 × 20), quatre-vingt-dix (4 × 20 + 10) ;
          - **cent** et **mille**.

          Depuis l'orthographe rectifiée de **1990**, on met des **traits d'union entre tous les mots** : vingt-et-un, deux-cent-trois. L'ancienne règle (traits d'union seulement sous cent, sauf autour de « et ») reste acceptée.
      - attention: "**Vingt** et **cent** prennent un **s** quand ils sont multipliés et terminent le nombre : quatre-vingts, trois-cents. Mais quatre-vingt-deux, trois-cent-cinq (pas de s, ils ne terminent pas). **Mille** ne prend jamais de s : deux-mille."
      - astuce: { texte: "Dis le nombre à voix haute en tapant dans tes mains à chaque mot : chaque tape est un mot, et entre deux tapes on met un trait d'union.", qui: mia }
      - retiens: "On assemble les mots de base avec des **traits d'union**. **Vingt** et **cent** prennent un **s** quand ils sont multipliés et en fin de nombre ; **mille** est invariable."
    exercices:
      - type: mot
        vars: { t: [[17, "dix-sept", "dix-sept"], [21, "vingt-et-un", "vingt et un"], [35, "trente-cinq", "trente-cinq"], [48, "quarante-huit", "quarante-huit"], [56, "cinquante-six", "cinquante-six"], [61, "soixante-et-un", "soixante et un"], [72, "soixante-douze", "soixante-douze"], [80, "quatre-vingts", "quatre-vingts"], [91, "quatre-vingt-onze", "quatre-vingt-onze"], [99, "quatre-vingt-dix-neuf", "quatre-vingt-dix-neuf"]] }
        enonce: "Écris en lettres : **{{t_0}}**"
        reponse: ["{{t_1}}", "{{t_2}}"]
        correction: "{{t_0}} s'écrit **{{t_1}}**."
      - type: mot
        vars: { t: [[100, "cent", "cent"], [200, "deux-cents", "deux cents"], [205, "deux-cent-cinq", "deux cent cinq"], [300, "trois-cents", "trois cents"], [480, "quatre-cent-quatre-vingts", "quatre cent quatre-vingts"], [600, "six-cents", "six cents"], [1000, "mille", "mille"]] }
        enonce: "Écris en lettres : **{{t_0}}**"
        reponse: ["{{t_1}}", "{{t_2}}"]
        niveau: 2
        correction: "{{t_0}} s'écrit **{{t_1}}** (ou {{t_2}} avec l'ancienne règle)."
      - type: nombre
        vars: { n: "20..999" }
        enonce: "Écris en chiffres : **{{lettres(n)}}**"
        reponse: "n"
        correction: "{{lettres(n)}} = {{n}}."
      - type: qcm
        vars: { t: [["quatre-vingts", "quatre-vingt", "quatres-vingts", "quatre-vingtx"], ["trois-cents", "trois-cent", "troix-cents", "trois-cens"], ["deux-mille", "deux-milles", "deux-mils", "deux-mile"], ["quatre-vingt-trois", "quatre-vingts-trois", "quatres-vingt-trois", "quatre-vingt-troi"]] }
        enonce: "Quelle écriture est correcte ?"
        choix: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "La bonne écriture : **{{t_0}}**. Vingt et cent prennent un s seulement s'ils sont multipliés et terminent le nombre ; mille est invariable."
      - type: vf
        enonce: "Vrai ou faux : on écrit « deux-milles »."
        reponse: false
        correction: "Faux : **mille** ne prend jamais de s. On écrit deux-mille."

  - id: comparer-ranger
    titre: Comparer et ranger les nombres
    objectif: Je sais comparer deux nombres avec <, > ou = et ranger des nombres.
    mots: [comparer, inférieur, supérieur]
    etapes:
      - dialogue:
          - neo: "Qui a le plus de glands : l'écureuil avec 48 ou celui avec 84 ?"
          - zero: "Moi je sais ! Ils ont les mêmes chiffres, donc c'est pareil !"
          - mia: "Pas du tout, Zéro ! Regarde les dizaines : 4 dizaines contre 8 dizaines."
          - neo: "Ah… 84, c'est beaucoup plus. Vérifions toujours la place des chiffres !"
      - texte: |
          Pour comparer deux nombres :
          1. Celui qui a **le plus de chiffres** est le plus grand (100 > 99).
          2. S'ils ont autant de chiffres, je compare **de gauche à droite** : d'abord les centaines, puis les dizaines, puis les unités.
      - visuel:
          type: droite
          min: 40
          max: 90
          pas: 5
          marques: [48, 84]
          etiquettes: tout
      - astuce:
          texte: "Le signe **<** est une bouche de crocodile affamé : elle s'ouvre toujours vers le plus grand nombre ! 3 < 8 se lit « 3 est plus petit que 8 »."
          qui: mia
      - retiens: "**<** veut dire « est plus petit que », **>** veut dire « est plus grand que », **=** veut dire « est égal à »."
      - a_quoi_ca_sert: "Comparer les prix pour choisir le moins cher, savoir qui a gagné une partie, trouver la plus grande montagne… On compare des nombres tous les jours !"
      - question:
          type: comparer
          vars: { a: "10..999", b: "10..999" }
          enonce: "Choisis le bon signe."
          gauche: "a"
          droite: "b"
          correction: "On compare de gauche à droite, chiffre par chiffre."
    exercices:
      - type: comparer
        vars: { a: "10..99", b: "10..99" }
        enonce: "Choisis le bon signe."
        gauche: "a"
        droite: "b"
        correction: "On compare d'abord les dizaines, puis les unités."
      - type: comparer
        vars: { a: "100..999", x: [1, 10, 100] }
        si: "a+x <= 999"
        enonce: "Choisis le bon signe."
        gauche: "a"
        droite: "a + x*choix(1,-1)"
        correction: "Regarde le premier chiffre qui est différent."
      - type: comparer
        vars: { d: "1..9", u: "1..9" }
        si: "d != u"
        enonce: "Attention aux chiffres échangés ! Choisis le bon signe."
        gauche: "d*10+u"
        droite: "u*10+d"
        correction: "On regarde les dizaines : {{d}} dizaines et {{u}} dizaines."
      - type: ordre
        vars: { a: "10..999", b: "10..999", c: "10..999", d: "10..999" }
        enonce: "Range ces nombres du plus petit au plus grand."
        si: "a!=b && a!=c && a!=d && b!=c && b!=d && c!=d"
        items: ["{{kieme(1,a,b,c,d)}}", "{{kieme(2,a,b,c,d)}}", "{{kieme(3,a,b,c,d)}}", "{{kieme(4,a,b,c,d)}}"]
        correction: "On compare d'abord le nombre de chiffres, puis les chiffres de gauche à droite."
      - type: qcm
        vars: { a: "100..989" }
        enonce: "Quel nombre est juste après {{a}} ?"
        choix: ["{{a+1}}", "{{a-1}}", "{{a+10}}", "{{a+100}}"]
        correction: "Juste après, c'est 1 de plus : {{a}} + 1 = {{a+1}}."
      - type: vf
        vars: { a: "100..999", b: "10..99" }
        enonce: "Vrai ou faux : {{b}} > {{a}} ?"
        reponse: false
        correction: "{{a}} a 3 chiffres et {{b}} en a seulement 2 : {{a}} est plus grand."

  # ------------------------------------------------------------------
  - id: ordinaux
    titre: Premier, deuxième, troisième… les nombres ordinaux
    objectif: Je dis et j'écris le rang d'un objet dans une file ou une liste (1ᵉʳ, 2ᵉ, 10ᵉ…).
    mots: [ordinal, rang, premier, dernier]
    autrement:
      texte: "Dans la file de la cantine, le 1ᵉʳ est devant tout le monde. Si tu es 5ᵉ, il y a 4 enfants devant toi. Ton rang, c'est le nombre d'enfants devant toi, plus toi !"
      visuel: { type: motif, elements: ["🧒 1ᵉʳ", "👧 2ᵉ", "🧒 3ᵉ", "👦 4ᵉ", "**🙋 5ᵉ**"] }
      legende: "Devant le 5ᵉ, il y a 4 enfants."
    etapes:
      - dialogue:
          - zero: "J'ai gagné la course ! On m'a donné le numéro 1… c'est bien ?"
          - mia: "Si tu es arrivé le premier, oui ! Un nombre peut dire « combien », mais aussi « à quelle place » : c'est un nombre ordinal."
          - neo: "Combien de coureurs ? 6. À quelle place est Zéro ? 1ᵉʳ. Ce n'est pas la même question !"
      - a_quoi_ca_sert: "Les places d'une course, les étages d'un immeuble, les jours du mois (le 1ᵉʳ mai), les chapitres d'un livre, les rangs d'un cinéma : partout, on dit à quelle place on est."
      - texte: |
          Un **nombre ordinal** dit le **rang**, c'est-à-dire la place, dans une file ou une liste rangée dans un ordre.

          - On dit **premier** (1ᵉʳ, ou 1ʳᵉ au féminin), puis **deuxième** (2ᵉ), **troisième** (3ᵉ)… on ajoute **-ième** au nombre : cinq → cinq**uième**, neuf → neu**vième**, vingt-et-un → vingt-et-un**ième**.
          - Le rang dépend du **sens** : on compte à partir du début de la file (la tête).
          - Devant le **5ᵉ**, il y a **4** éléments : le rang, c'est le nombre d'éléments devant, **plus un**.
      - visuel: { type: motif, elements: ["🏁", "🐹 1ᵉʳ", "🐰 2ᵉ", "🦊 3ᵉ", "🐻 4ᵉ", "🐸 5ᵉ"] }
        legende: "La file part du drapeau : le hamster est 1ᵉʳ, la grenouille 5ᵉ."
      - attention: "On écrit 1ᵉʳ (premier), 1ʳᵉ (première), 2ᵉ, 3ᵉ… et pas « 2ème »."
      - astuce: { texte: "Pour savoir combien il y a de monde devant toi, enlève 1 à ton rang : 8ᵉ → 7 devant toi.", qui: neo }
      - retiens: "Un nombre ordinal donne un **rang** : 1ᵉʳ, 2ᵉ, 3ᵉ… Devant le **n**ᵉ, il y a **n − 1** éléments."
    exercices:
      - type: nombre
        vars: { n: "3..20" }
        enonce: "Dans la file de la cantine, Lya est {{n}}ᵉ. Combien d'enfants sont devant elle ?"
        reponse: "n-1"
        correction: "Devant la {{n}}ᵉ, il y a {{n}} − 1 = {{n-1}} enfants."
        erreurs: [{ valeur: "n", message: "Le rang compte aussi Lya elle-même ! Les enfants DEVANT elle sont un de moins." }]
      - type: nombre
        vars: { n: "2..25" }
        enonce: "{{n}} enfants sont devant Néo dans la file. À quel rang est Néo ? (écris seulement le nombre)"
        reponse: "n+1"
        correction: "{{n}} devant lui, puis lui : il est {{n+1}}ᵉ."
      - type: qcm
        vars: { r: [["troisième", "🍇", "🍓", "🍌"], ["premier", "🍎", "🍌", "🍒"], ["cinquième", "🍒", "🍓", "🍎"], ["quatrième", "🍓", "🍇", "🍒"], ["deuxième", "🍌", "🍎", "🍇"]] }
        enonce: "Voici une file de fruits, de gauche à droite : 🍎 🍌 🍇 🍓 🍒. Quel fruit est le {{r_0}} ?"
        choix: ["{{r_1}}", "{{r_2}}", "{{r_3}}"]
        correction: "En partant de la gauche : 🍎 1ᵉʳ, 🍌 2ᵉ, 🍇 3ᵉ, 🍓 4ᵉ, 🍒 5ᵉ."
      - type: qcm
        vars: { r: [[2, "B", "C", "A"], [5, "E", "F", "D"], [7, "G", "H", "F"], [10, "J", "K", "I"], [13, "M", "N", "L"]] }
        enonce: "Dans l'alphabet, quelle est la {{r_0}}ᵉ lettre ?"
        choix: ["{{r_1}}", "{{r_2}}", "{{r_3}}"]
        correction: "A, B, C… la {{r_0}}ᵉ lettre est **{{r_1}}**."
      - type: mot
        vars: { r: [["5ᵉ", "cinquième"], ["9ᵉ", "neuvième"], ["4ᵉ", "quatrième"], ["1ᵉʳ", "premier"], ["20ᵉ", "vingtième"], ["11ᵉ", "onzième"], ["3ᵉ", "troisième"]] }
        enonce: "Écris en lettres : **{{r_0}}**"
        reponse: "{{r_1}}"
        correction: "{{r_0}} se dit **{{r_1}}**."
      - type: qcm
        vars: { j: [["jeudi", 4, 3, 5], ["mardi", 2, 1, 3], ["samedi", 6, 5, 7], ["vendredi", 5, 4, 6]] }
        enonce: "La semaine commence lundi (1ᵉʳ jour). Quel est le rang de {{j_0}} ?"
        choix: ["{{j_1}}ᵉ", "{{j_2}}ᵉ", "{{j_3}}ᵉ"]
        correction: "Lundi 1ᵉʳ, mardi 2ᵉ, mercredi 3ᵉ, jeudi 4ᵉ, vendredi 5ᵉ, samedi 6ᵉ, dimanche 7ᵉ."
      - type: vf
        vars: { n: "5..30" }
        enonce: "Vrai ou faux : le {{n}}ᵉ coureur a {{n}} coureurs devant lui."
        reponse: false
        correction: "Faux : devant le {{n}}ᵉ, il y a {{n-1}} coureurs."

  - id: droite-numerique
    titre: La droite des nombres
    objectif: Je sais placer un nombre sur une droite graduée et trouver ses voisins.
    mots: [droite graduée, encadrer]
    etapes:
      - dialogue:
          - mia: "Imagine que les nombres sont des maisons, toutes alignées le long d'une rue."
          - neo: "Plus on va vers la droite, plus les nombres sont grands. C'est la droite graduée !"
      - visuel:
          type: droite
          min: 0
          max: 20
          pas: 1
          etiquettes: [0, 5, 10, 15, 20]
          point: { v: 13, label: "13" }
      - texte: |
          Sur une **droite graduée**, les nombres sont rangés dans l'ordre, avec toujours le même écart entre deux traits.

          Pour placer un nombre, je repère les nombres écrits autour, puis je **compte les traits**.
      - texte: |
          **Encadrer** un nombre, c'est dire entre quels nombres il se trouve.
          Par exemple : 30 < 37 < 40. On a encadré 37 **entre deux dizaines**.
      - a_quoi_ca_sert: "Les règles, les thermomètres, les jauges d'essence, les frises du temps en histoire… ce sont toutes des droites graduées !"
      - question:
          type: droite
          vars: { n: "1..19" }
          enonce: "Touche la droite là où se trouve {{n}}."
          min: 0
          max: 20
          pas: 1
          cible: "n"
          tolerance: 0.5
      - astuce:
          texte: "Sur une droite graduée, regarde d'abord combien vaut un petit pas : compte les graduations entre deux nombres écrits."
          qui: neo
    exercices:
      - type: sauts
        vars: { a: "0..40", b: "45..95" }
        enonce: "Fais aller la grenouille de {{a}} à {{b}} avec le moins de sauts possible."
        depart: "a"
        cible: "b"
        min: 0
        max: 100
        sauts_permis: [10, 1, -10, -1]
        correction: "De {{a}} à {{b}}, il y a {{b-a}} : des sauts de 10 d'abord ({{ent((b-a)/10)}}), puis des sauts de 1 ({{(b-a)%10}})."
      - type: droite
        vars: { n: "1..19" }
        enonce: "Place {{n}} sur la droite."
        min: 0
        max: 20
        pas: 1
        cible: "n"
        tolerance: 0.5
      - type: droite
        vars: { n: "5..95" }
        si: "n % 5 == 0"
        enonce: "Place {{n}} sur la droite (les traits vont de 5 en 5)."
        min: 0
        max: 100
        pas: 5
        cible: "n"
        tolerance: 2.5
      - type: champs
        vars: { n: "11..99" }
        si: "n % 10 != 0"
        enonce: "Encadre {{n}} entre deux dizaines."
        champs:
          - { reponse: "ent(n/10)*10", apres: "<" }
          - { avant: "{{n}} <", reponse: "ent(n/10)*10+10" }
        correction: "{{ent(n/10)*10}} < {{n}} < {{ent(n/10)*10+10}}."
      - type: nombre
        vars: { a: "0..80", p: [2, 5, 10] }
        si: "a % p == 0"
        enonce: "Sur une droite, les traits vont de {{p}} en {{p}}. Après {{a}}, {{a+p}}, {{a+2*p}}, quel nombre vient ensuite ?"
        reponse: "a+3*p"
        correction: "On ajoute {{p}} à chaque fois : {{a+2*p}} + {{p}} = {{a+3*p}}."
      - type: champs
        vars: { n: "101..998" }
        enonce: "Quels sont les voisins de {{n}} ?"
        champs:
          - { reponse: "n-1", apres: "<" }
          - { avant: "{{n}} <", reponse: "n+1" }
        correction: "Le nombre d'avant est {{n-1}}, celui d'après est {{n+1}}."

  # ------------------------------------------------------------------
  - id: tableaux-diagrammes
    titre: Ranger des informations - tableaux et diagrammes
    objectif: Je lis et je remplis un tableau (même à double entrée) et un diagramme en barres.
    mots: [tableau, diagramme, données, double entrée]
    autrement:
      texte: "Un tableau à double entrée, c'est comme la bataille navale : pour trouver une case, on suit une ligne avec un doigt et une colonne avec l'autre doigt. Là où les deux doigts se rencontrent, c'est la réponse."
      visuel: { type: tableau, lignes: [["", "🍎 pomme", "🍌 banane"], ["Lya", "3", "1"], ["Néo", "2", "4"]] }
      legende: "Ligne « Néo », colonne « banane » : les doigts se rencontrent sur 4."
    etapes:
      - dialogue:
          - neo: "J'ai demandé à toute la classe son fruit préféré… et j'ai tout noté sur un papier en vrac. Je n'y comprends plus rien !"
          - mia: "Il faut ranger tes informations ! Un tableau ou un diagramme, et on voit tout d'un seul coup d'œil."
          - zero: "Moi je range tout dans ma joue. Mais c'est moins pratique pour lire."
      - a_quoi_ca_sert: "Les horaires de bus, l'emploi du temps de la classe, les résultats d'un match, la météo de la semaine : ce sont des tableaux et des diagrammes. Ils rangent beaucoup d'informations en peu de place."
      - texte: |
          - Un **tableau** range des informations en **lignes** (→) et en **colonnes** (↓). La première ligne et la première colonne disent **de quoi on parle**.
          - Dans un **tableau à double entrée**, une case se trouve au croisement d'**une ligne** et d'**une colonne**.
          - Un **diagramme en barres** dessine chaque nombre par une barre : plus la barre est **haute**, plus le nombre est **grand**.
      - visuel: { type: diagramme, titre: "Fruits préférés de la classe", barres: [{ label: "pomme", v: 7 }, { label: "banane", v: 4 }, { label: "fraise", v: 9 }, { label: "kiwi", v: 2 }] }
        legende: "La barre la plus haute : la fraise, choisie par 9 élèves."
      - astuce: { texte: "Pour lire une case, pose un doigt sur le nom de la ligne et un doigt sur le nom de la colonne, puis fais-les glisser jusqu'à ce qu'ils se rencontrent.", qui: mia }
      - retiens: "Dans un tableau, une case = **une ligne** + **une colonne**. Dans un diagramme en barres, la barre la **plus haute** montre le **plus grand** nombre."
    exercices:
      - type: nombre
        vars: { a: "2..9", b: "2..9", c: "2..9", d: "2..9" }
        visuel: { type: tableau, lignes: [["", "🍎 pommes", "🍌 bananes"], ["Lya", "=a", "=b"], ["Néo", "=c", "=d"]] }
        enonce: "Combien de bananes a Néo ?"
        reponse: "d"
        correction: "Ligne « Néo », colonne « bananes » : {{d}}."
      - type: nombre
        vars: { a: "2..9", b: "2..9", c: "2..9", d: "2..9" }
        visuel: { type: tableau, lignes: [["", "🍎 pommes", "🍌 bananes"], ["Lya", "=a", "=b"], ["Néo", "=c", "=d"]] }
        enonce: "Combien de fruits a Lya en tout ?"
        reponse: "a+b"
        niveau: 2
        correction: "Lya : {{a}} pommes + {{b}} bananes = {{a+b}} fruits."
      - type: nombre
        vars: { a: "3..12", b: "3..12", c: "3..12" }
        si: "a != b && b != c && a != c"
        visuel: { type: diagramme, titre: "Animaux préférés", barres: [{ label: "chat", v: "=a" }, { label: "chien", v: "=b" }, { label: "lapin", v: "=c" }] }
        enonce: "Combien d'élèves préfèrent le chien ?"
        reponse: "b"
        correction: "La barre « chien » monte jusqu'à {{b}}."
      - type: qcm
        vars: { a: "3..12", b: "3..12", c: "3..12" }
        si: "a > b && a > c && b != c"
        visuel: { type: diagramme, titre: "Couleurs préférées", barres: [{ label: "bleu", v: "=b" }, { label: "rouge", v: "=a" }, { label: "vert", v: "=c" }] }
        enonce: "Quelle couleur a été choisie le plus souvent ?"
        choix: ["rouge", "bleu", "vert"]
        correction: "La barre la plus haute est celle du rouge ({{a}})."
      - type: nombre
        vars: { a: "4..12", b: "2..9" }
        si: "a > b"
        visuel: { type: diagramme, titre: "Livres lus ce mois-ci", barres: [{ label: "Tom", v: "=a" }, { label: "Ana", v: "=b" }] }
        enonce: "Combien de livres Tom a-t-il lus de plus qu'Ana ?"
        reponse: "a-b"
        niveau: 2
        correction: "{{a}} − {{b}} = {{a-b}} livres de plus."

  - id: pair-impair
    titre: Pair, impair et compter de 2 en 2, de 5 en 5
    objectif: Je reconnais les nombres pairs et impairs et je sais compter par bonds.
    mots: [pair, impair]
    etapes:
      - dialogue:
          - neo: "Pour danser, il faut se mettre par deux. Si tout le monde a un partenaire, le nombre est PAIR !"
          - zero: "Et s'il reste quelqu'un tout seul ?"
          - mia: "Alors le nombre est IMPAIR. Pauvre petit danseur…"
      - visuel:
          type: objets
          groupes: [2, 2, 2, 1]
          emoji: "🐿️"
        legende: "7 écureuils : il en reste un tout seul, 7 est impair."
      - texte: |
          Un nombre est **pair** quand on peut le partager en **deux groupes égaux** (ou faire des paires sans reste).

          **Le truc :** il suffit de regarder **le chiffre des unités** !
          - il finit par **0, 2, 4, 6 ou 8** → pair ;
          - il finit par **1, 3, 5, 7 ou 9** → impair.
      - astuce:
          texte: "Compter de 2 en 2 : 2, 4, 6, 8, 10… Compter de 5 en 5 : 5, 10, 15, 20… (ça finit toujours par 5 ou 0 !). Compter de 10 en 10 : seul le chiffre des dizaines change."
          qui: neo
      - a_quoi_ca_sert: "Dans une rue, les maisons paires sont d'un côté et les impaires de l'autre ! Et compter par bonds, c'est ce qu'on fait pour compter l'argent (pièces de 2 €, billets de 5 €…)."
      - question:
          type: qcm
          vars: { n: "10..999" }
          enonce: "{{n}} est-il pair ou impair ?"
          choix: ["{{si(n%2==0,'pair','impair')}}", "{{si(n%2==0,'impair','pair')}}"]
          ordre_fixe: true
          correction: "{{n}} finit par {{n%10}}, il est donc {{si(n%2==0,'pair','impair')}}."
    exercices:
      - type: partage
        vars: { k: "3..8" }
        enonce: "Partage les {{2*k}} chaussettes en 2 tas égaux. ({{2*k}} est-il pair ?)"
        total: "2*k"
        parts: "2"
        emoji: "🧦"
        correction: "{{k}} et {{k}} : on peut faire 2 tas égaux, donc {{2*k}} est pair."
      - type: qcm
        vars: { n: "10..9999" }
        enonce: "{{n}} est-il pair ou impair ?"
        choix: ["{{si(n%2==0,'pair','impair')}}", "{{si(n%2==0,'impair','pair')}}"]
        ordre_fixe: true
        correction: "On regarde le chiffre des unités : {{n%10}}. Donc {{n}} est {{si(n%2==0,'pair','impair')}}."
      - type: nombre
        vars: { p: [2, 5, 10], k: "1..12" }
        enonce: "Compte de {{p}} en {{p}} : {{p*k}}, {{p*k+p}}, {{p*k+2*p}}, … Quel est le nombre suivant ?"
        reponse: "p*k+3*p"
        correction: "On ajoute {{p}} : {{p*k+2*p}} + {{p}} = {{p*k+3*p}}."
      - type: nombre
        vars: { n: "5..40" }
        enonce: "Quel est le plus petit nombre pair plus grand que {{n}} ?"
        reponse: "si(n%2==0, n+2, n+1)"
        correction: "Les nombres pairs vont de 2 en 2. Après {{n}}, le premier pair est {{si(n%2==0, n+2, n+1)}}."
      - type: vf
        vars: { a: "1..50", b: "1..50" }
        si: "a%2 == 1 && b%2 == 1"
        enonce: "{{a}} et {{b}} sont impairs. Vrai ou faux : {{a}} + {{b}} est pair ?"
        reponse: true
        correction: "{{a}} + {{b}} = {{a+b}}, qui est pair. Impair + impair donne toujours un nombre pair : les deux « danseurs seuls » forment une paire !"
      - type: nombre
        vars: { n: "6..30" }
        si: "n % 2 == 0"
        enonce: "{{n}} enfants se mettent par deux. Combien de paires ?"
        visuel: { type: objets, groupes: "=n", emoji: "🧒" }
        reponse: "n/2"
        correction: "{{n}} partagé en paires : {{n/2}} paires."

  # ------------------------------------------------------------------
  - id: grands-nombres
    titre: Les grands nombres jusqu'au milliard
    objectif: Je sais lire et écrire les grands nombres en les découpant en classes de 3 chiffres.
    mots: [millier, million, milliard, classe]
    etapes:
      - dialogue:
          - neo: "La Terre compte environ 8 milliards d'habitants. Comment on écrit ça ?"
          - zero: "Avec BEAUCOUP de moi ! 8 000 000 000. Neuf Zéros ! UN MILLIARD… HUIT MILLIARDS !!! 🤯"
          - mia: "Pour ne pas se perdre, on fait des paquets de 3 chiffres, en partant de la droite."
      - texte: |
          On sépare les chiffres en **classes** de 3, en partant de la droite, et on laisse un **petit espace** entre les classes :

          | milliards | millions | milliers | unités |
          |---|---|---|---|
          | 8 | 000 | 000 | 000 |

          - 1 000 = **mille**
          - 1 000 000 = **un million** (mille milliers)
          - 1 000 000 000 = **un milliard** (mille millions)
      - visuel:
          type: abaque
          nombre: 2507340
          classes: true
        legende: "2 507 340 se lit : deux millions cinq-cent-sept-mille-trois-cent-quarante."
      - astuce:
          texte: "Pour lire un grand nombre, je lis chaque classe comme un petit nombre, puis je dis son nom : « 2 millions, 507 mille, 340 »."
          qui: mia
      - a_quoi_ca_sert: "Le nombre d'habitants d'un pays, la distance de la Terre au Soleil (150 millions de km), le budget d'une ville… Les journaux et les scientifiques utilisent les grands nombres tous les jours."
      - question:
          type: nombre
          vars: { a: "1..9", b: "100..999" }
          enonce: "Écris en chiffres : {{a}} millions {{b}} mille."
          reponse: "a*1000000 + b*1000"
          correction: "{{a}} millions = {{a*1000000}} ; {{b}} mille = {{b*1000}} ; total : {{a*1000000+b*1000}}."
    exercices:
      - type: nombre
        vars: { a: "2..9", b: "2..9" }
        enonce: "Écris en chiffres : {{a}} millions {{b}} mille."
        reponse: "a*1000000+b*1000"
        niveau: 2
        erreurs:
          - { valeur: "a*1000+b", message: "Attention : chaque classe a 3 chiffres ! {{b}} mille s'écrit 00{{b}} 000 dans la classe des milliers." }
          - { valeur: "a*1000000+b*100", message: "Il manque un zéro : {{b}} mille = {{b*1000}}." }
        correction: "{{nb(a*1000000+b*1000)}}"
      - type: nombre
        vars: { a: "2..99", b: "100..999" }
        enonce: "Écris en chiffres : {{a}} mille {{b}}."
        reponse: "a*1000+b"
        correction: "{{a}} mille = {{a*1000}}, plus {{b}} : {{a*1000+b}}."
      - type: nombre
        vars: { a: "1..9", b: "1..999", c: "1..999" }
        enonce: "Écris en chiffres : {{a}} millions {{b}} mille {{c}}."
        reponse: "a*1000000+b*1000+c"
        indice: "Chaque classe a 3 chiffres : n'oublie pas les zéros pour compléter !"
        correction: "{{nb(a*1000000+b*1000+c)}} : on complète chaque classe avec des zéros."
      - type: nombre
        vars: { n: "1000000..99999999" }
        enonce: "Quel est le chiffre des millions dans {{n}} ?"
        reponse: "chiffre(n,6)"
        correction: "La classe des millions est la 3ᵉ en partant de la droite ; son chiffre des unités de millions est {{chiffre(n,6)}}."
      - type: qcm
        enonce: "Combien de zéros pour écrire un million ?"
        choix: ["6", "3", "9", "7"]
        correction: "1 000 000 : six zéros (deux classes de 3)."
      - type: nombre
        vars: { a: "2..9" }
        enonce: "Combien de milliers dans {{a}} millions ?"
        reponse: "a*1000"
        correction: "1 million = 1 000 milliers, donc {{a}} millions = {{a*1000}} milliers."
      - type: comparer
        vars: { a: "100000..999999", b: "1000000..1200000" }
        enonce: "Choisis le bon signe."
        gauche: "a"
        droite: "b"
        correction: "{{nb(b)}} a 7 chiffres, {{nb(a)}} n'en a que 6."

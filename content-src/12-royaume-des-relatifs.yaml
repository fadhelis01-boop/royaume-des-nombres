id: royaume-des-relatifs
titre: Le Royaume des Relatifs
sous_titre: Les nombres négatifs, le repère et les priorités
emoji: 🌡️
couleur: "#3949ab"
cycle: explorateurs
age: 11-13 ans
niveau: 5ᵉ – 4ᵉ
ordre: 12
prerequis: [port-des-decimaux]
version: 1.0.0
intro:
  - neo: "Bienvenue au Royaume des Relatifs ! Ici, on descend SOUS zéro : −1, −2, −10…"
  - zero: "Enfin un royaume où je suis le centre du monde ! À droite les positifs, à gauche les négatifs. Et moi au milieu. Le roi."
  - mia: "Les nombres négatifs, tu les connais déjà : la température en hiver, le sous-sol d'un immeuble…"

lecons:
  - id: nombres-negatifs
    titre: Les nombres négatifs
    objectif: Je comprends les nombres négatifs et je les place sur une droite graduée.
    mots: [nombre relatif, nombre négatif, opposé]
    etapes:
      - dialogue:
          - mia: "Ce matin il faisait −5 °C : cinq degrés SOUS zéro. Brrr !"
          - neo: "Et l'ascenseur descend au −2 : deux étages sous le rez-de-chaussée."
      - visuel:
          type: droite
          min: -6
          max: 6
          pas: 1
          etiquettes: tout
          marques: [-5, 3]
        legende: "−5 est à 5 unités à gauche de 0 ; 3 est à 3 unités à droite."
      - texte: |
          Les **nombres relatifs** sont :
          - les **positifs** : +3 (ou 3), +7,5…
          - les **négatifs** : −3, −7,5… (à gauche de 0)
          - **zéro**, ni positif ni négatif.

          Deux nombres comme **3 et −3** sont **opposés** : ils sont à la même distance de 0, de chaque côté.
          Cette distance à zéro s'appelle la **distance à zéro** (ou valeur absolue) : celle de −5 est 5.
      - histoire:
          titre: Un peu d'histoire
          texte: "Les mathématiciens chinois utilisaient déjà des nombres négatifs il y a environ 2 000 ans, avec des baguettes rouges et noires. En Inde, au VIIᵉ siècle, Brahmagupta les décrit comme des « dettes » et les positifs comme des « fortunes ». En Europe, on s'en est méfié jusqu'au XVIIᵉ siècle !"
      - a_quoi_ca_sert: "Les températures, l'altitude (la mer Morte est à environ −430 m), les comptes en banque (un découvert), les étages, les années avant J.-C., les scores au golf…"
      - question:
          type: droite
          vars: { n: "-9..9" }
          si: "n != 0"
          enonce: "Place {{nb(n)}} sur la droite."
          min: -10
          max: 10
          pas: 1
          cible: "n"
          tolerance: 0.5
      - astuce:
          texte: "Pense au thermomètre : sous zéro, plus le nombre « a l'air grand », plus il fait froid. −10 °C est plus froid que −2 °C."
          qui: neo
    exercices:
      - type: droite
        vars: { n: "-9..9" }
        si: "n != 0"
        enonce: "Place {{nb(n)}}."
        min: -10
        max: 10
        pas: 1
        cible: "n"
        tolerance: 0.5
      - type: nombre
        vars: { n: "1..50" }
        enonce: "Quel est l'opposé de {{n}} ?"
        reponse: "-n"
        correction: "L'opposé de {{n}} est −{{n}}."
      - type: nombre
        vars: { t: "-15..10", b: "2..12" }
        enonce: "Il fait {{nb(t)}} °C. La température baisse de {{b}} degrés. Quelle température ?"
        reponse: "t-b"
        unite: °C
        correction: "{{nb(t)}} − {{b}} = {{nb(t-b)}} °C."
      - type: nombre
        vars: { e: "-3..-1", m: "2..8" }
        enonce: "L'ascenseur est au niveau {{nb(e)}}. Il monte de {{m}} étages. Où arrive-t-il ?"
        reponse: "e+m"
        correction: "{{nb(e)}} + {{m}} = {{nb(e+m)}}."
      - type: nombre
        vars: { n: "-40..-2" }
        enonce: "Quelle est la distance à zéro de {{nb(n)}} ?"
        reponse: "-n"
        correction: "{{nb(n)}} est à {{-n}} unités de 0."

  - id: comparer-relatifs
    titre: Comparer des nombres relatifs
    objectif: Je compare et je range des nombres relatifs.
    mots: [comparer]
    etapes:
      - dialogue:
          - zero: "−10 est plus grand que −2 ! Parce que 10 est plus grand que 2."
          - mia: "Non ! −10 °C, c'est bien plus froid que −2 °C. Donc −10 < −2."
      - texte: |
          Sur la droite, le plus **grand** est toujours **le plus à droite**.

          - Un positif est toujours plus grand qu'un négatif : −100 < 1.
          - Entre deux négatifs, le plus grand est celui **le plus proche de zéro** : −2 > −10.
      - visuel:
          type: droite
          min: -12
          max: 2
          pas: 1
          etiquettes: [-12, -10, -8, -6, -4, -2, 0, 2]
          marques: [-10, -2]
      - a_quoi_ca_sert: "Savoir quelle ville est la plus froide, quel compte est le plus à découvert, quel golfeur a le meilleur score…"
      - question:
          type: comparer
          vars: { a: "-20..-1", b: "-20..-1" }
          enonce: "Compare."
          gauche: "a"
          droite: "b"
          correction: "Entre deux négatifs, le plus grand est le plus proche de 0."
      - astuce:
          texte: "Sur la droite graduée, le plus grand est toujours celui le plus à droite. −2 est à droite de −7, donc −2 > −7."
          qui: zero
    exercices:
      - type: comparer
        vars: { a: "-30..30", b: "-30..30" }
        enonce: "Compare."
        gauche: "a"
        droite: "b"
        correction: "Le plus grand est le plus à droite sur la droite graduée."
      - type: ordre
        vars: { a: "-20..20", b: "-20..20", c: "-20..20", d: "-20..20" }
        si: "a!=b && a!=c && a!=d && b!=c && b!=d && c!=d && min(a,b,c,d) < 0"
        enonce: "Range du plus petit au plus grand."
        items: ["{{nb(kieme(1,a,b,c,d))}}", "{{nb(kieme(2,a,b,c,d))}}", "{{nb(kieme(3,a,b,c,d))}}", "{{nb(kieme(4,a,b,c,d))}}"]
        correction: "De gauche à droite sur la droite graduée."
      - type: qcm
        enonce: "Quelle est la température la plus froide ?"
        choix: ["−12 °C", "−3 °C", "0 °C", "−8 °C"]
        correction: "−12 est le plus à gauche : c'est le plus froid."

  - id: repere
    titre: Se repérer dans le plan
    objectif: Je lis et je place des points avec leurs coordonnées (abscisse ; ordonnée).
    mots: [repère, abscisse, ordonnée, coordonnées]
    etapes:
      - dialogue:
          - neo: "Avec deux droites graduées qui se croisent en zéro, on peut repérer n'importe quel point du plan !"
          - mia: "Comme à la bataille navale, mais avec des nombres négatifs en plus."
      - visuel:
          type: graphe
          xmin: -5
          xmax: 5
          ymin: -4
          ymax: 4
          pas_x: 1
          pas_y: 1
          points:
            - { x: 3, y: 2, label: "A(3 ; 2)" }
            - { x: -2, y: 3, label: "B(−2 ; 3)" }
            - { x: -4, y: -2, label: "C(−4 ; −2)" }
      - texte: |
          Un point a deux **coordonnées** : **(abscisse ; ordonnée)**.
          - l'**abscisse** se lit sur l'axe horizontal (« de combien je vais à droite ou à gauche ») ;
          - l'**ordonnée** se lit sur l'axe vertical (« de combien je monte ou je descends »).

          L'**origine** O a pour coordonnées (0 ; 0).
      - astuce:
          texte: "Ordre alphabétique : Abscisse avant Ordonnée, comme on marche AVANT de monter l'escalier : d'abord horizontal, puis vertical."
          qui: mia
      - a_quoi_ca_sert: "Le GPS (longitude, latitude), les jeux vidéo (chaque pixel a ses coordonnées), les tableurs (case B3), les graphiques de la météo ou de la bourse…"
      - question:
          type: champs
          vars: { x: "-4..4", y: "-3..3" }
          si: "x != 0 && y != 0"
          enonce: "Quelles sont les coordonnées du point M ?"
          visuel: { type: graphe, xmin: -5, xmax: 5, ymin: -4, ymax: 4, pas_x: 1, pas_y: 1, points: [{ x: "=x", y: "=y", label: "M" }] }
          champs:
            - { avant: "M(", reponse: "x", apres: ";" }
            - { reponse: "y", apres: ")" }
          correction: "M({{nb(x)}} ; {{nb(y)}})."
    exercices:
      - type: champs
        vars: { x: "-4..4", y: "-3..3" }
        si: "x != 0 || y != 0"
        enonce: "Coordonnées du point P ?"
        visuel: { type: graphe, xmin: -5, xmax: 5, ymin: -4, ymax: 4, pas_x: 1, pas_y: 1, points: [{ x: "=x", y: "=y", label: "P" }] }
        champs:
          - { avant: "P(", reponse: "x", apres: ";" }
          - { reponse: "y", apres: ")" }
        correction: "P({{nb(x)}} ; {{nb(y)}})."
      - type: qcm
        vars: { x: "1..5", y: "1..5" }
        enonce: "Le point ({{nb(-x)}} ; {{nb(-y)}}) est situé…"
        choix: ["en bas à gauche", "en haut à droite", "en haut à gauche", "en bas à droite"]
        correction: "Abscisse négative : à gauche ; ordonnée négative : en bas."
      - type: nombre
        vars: { x: "-6..6", y: "-6..6" }
        enonce: "Quelle est l'ordonnée du point ({{nb(x)}} ; {{nb(y)}}) ?"
        reponse: "y"
        correction: "L'ordonnée est le 2ᵉ nombre : {{nb(y)}}."

  - id: additionner-relatifs
    titre: Additionner et soustraire des relatifs
    objectif: J'additionne et je soustrais des nombres relatifs.
    mots: [somme, différence]
    etapes:
      - dialogue:
          - neo: "Je gagne 5 points, puis je perds 8 points. Où j'en suis ?"
          - mia: "+5 + (−8) = −3. Tu as 3 points de dette !"
          - zero: "Et retirer une dette, c'est comme gagner ! −(−3) = +3 !"
      - texte: |
          **Additionner**, c'est **se déplacer** sur la droite : + positif → à droite, + négatif → à gauche.
          - $(+5) + (-8) = -3$
          - $(-4) + (-6) = -10$ (deux dettes s'additionnent)

          **Soustraire un nombre, c'est ajouter son opposé** :
          $$7 - (-3) = 7 + 3 = 10 \qquad -2 - 5 = -2 + (-5) = -7$$
      - visuel:
          type: droite
          min: -5
          max: 6
          pas: 1
          etiquettes: tout
          sauts: [{ de: 0, a: 5, label: "+5" }, { de: 5, a: -3, label: "−8" }]
        legende: "5 + (−8) = −3"
      - astuce:
          texte: "Pense en argent : un positif est un gain, un négatif une dette. « Enlever une dette » rend plus riche : − (−3) = + 3."
          qui: mia
      - a_quoi_ca_sert: "Les comptes en banque, les écarts de température, les variations de cours en bourse, les différences d'altitude…"
      - question:
          type: nombre
          vars: { a: "-9..9", b: "-9..9" }
          si: "a < 0 || b < 0"
          enonce: "${{nb(a)}} + ({{nb(b)}}) = ?$"
          reponse: "a+b"
          correction: "{{nb(a+b)}}."
    exercices:
      - type: nombre
        vars: { a: "2..12", b: "2..12" }
        enonce: "$ {{a}} - ({{nb(-b)}}) = ?$"
        reponse: "a+b"
        niveau: 2
        erreurs:
          - { valeur: "a-b", message: "Soustraire un nombre NÉGATIF, c'est ajouter son opposé : − (−{{b}}) = + {{b}}. Enlever une dette rend plus riche !" }
        correction: "{{a}} + {{b}} = {{a+b}}"
      - type: nombre
        vars: { a: "-15..15", b: "-15..15" }
        si: "a < 0 || b < 0"
        enonce: "$({{nb(a)}}) + ({{nb(b)}}) = ?$"
        reponse: "a+b"
        correction: "{{nb(a+b)}}."
      - type: nombre
        vars: { a: "-15..15", b: "-15..15" }
        si: "b < 0"
        enonce: "$({{nb(a)}}) - ({{nb(b)}}) = ?$"
        reponse: "a-b"
        indice: "Soustraire {{nb(b)}}, c'est ajouter {{nb(-b)}}."
        correction: "({{nb(a)}}) + {{nb(-b)}} = {{nb(a-b)}}."
      - type: nombre
        vars: { a: "-10..-1", b: "2..15" }
        enonce: "Il fait {{nb(a)}} °C le matin et {{b}} °C l'après-midi. De combien de degrés la température a-t-elle augmenté ?"
        reponse: "b-a"
        unite: °C
        correction: "{{b}} − ({{nb(a)}}) = {{b}} + {{-a}} = {{b-a}} °C."
      - type: nombre
        vars: { a: "-9..9", b: "-9..9", c: "-9..9" }
        enonce: "$({{nb(a)}}) + ({{nb(b)}}) - ({{nb(c)}}) = ?$"
        reponse: "a+b-c"
        correction: "{{nb(a+b-c)}}."

  - id: multiplier-relatifs
    titre: Multiplier et diviser des relatifs (la règle des signes)
    objectif: J'applique la règle des signes et je comprends pourquoi « moins par moins donne plus ».
    mots: [règle des signes]
    etapes:
      - dialogue:
          - zero: "Moins fois moins égale plus ?! C'est de la magie noire !"
          - neo: "Non, c'est de la logique. Regarde la suite…"
      - texte: |
          Regardons une suite de multiplications par −2 :

          | | | | | |
          |---|---|---|---|---|
          | 3 × (−2) = −6 | 2 × (−2) = −4 | 1 × (−2) = −2 | 0 × (−2) = 0 | (−1) × (−2) = **?** |

          Chaque résultat augmente de 2… donc **(−1) × (−2) = +2** !

          **Règle des signes** (multiplication ET division) :
          - deux nombres de **même signe** → résultat **positif** ;
          - deux nombres de **signes contraires** → résultat **négatif**.
      - astuce:
          texte: "Les amis de mes amis sont mes amis (+ × + = +), les ennemis de mes ennemis sont mes amis (− × − = +), les amis de mes ennemis sont mes ennemis (+ × − = −)."
          qui: mia
      - retiens: "$(+) \\times (+) = (+)$ · $(-) \\times (-) = (+)$ · $(+) \\times (-) = (-)$ · $(-) \\times (+) = (-)$. Avec plusieurs facteurs : un nombre **pair** de signes − donne +, un nombre **impair** donne −."
      - a_quoi_ca_sert: "La physique (forces et vitesses dans un sens ou dans l'autre), l'économie (pertes répétées), les calculs d'algèbre que tu feras partout plus tard…"
      - question:
          type: nombre
          vars: { a: "-9..9", b: "-9..9" }
          si: "a != 0 && b != 0 && (a < 0 || b < 0)"
          enonce: "$({{nb(a)}}) \\times ({{nb(b)}}) = ?$"
          reponse: "a*b"
          correction: "{{si(a*b>0,'Même signe : positif.','Signes contraires : négatif.')}} {{nb(a*b)}}."
    exercices:
      - type: nombre
        vars: { a: "-12..12", b: "-12..12" }
        si: "a != 0 && b != 0 && (a < 0 || b < 0)"
        enonce: "$({{nb(a)}}) \\times ({{nb(b)}}) = ?$"
        reponse: "a*b"
        correction: "{{nb(a*b)}}."
      - type: nombre
        vars: { a: "-9..9", q: "-9..9" }
        si: "a != 0 && q != 0 && (a < 0 || q < 0)"
        enonce: "$({{nb(a*q)}}) \\div ({{nb(a)}}) = ?$"
        reponse: "q"
        correction: "{{nb(q)}} (règle des signes)."
      - type: qcm
        vars: { n: "2..7" }
        enonce: "Quel est le signe du produit de {{n}} nombres négatifs ?"
        choix: ["{{si(n%2==0,'positif','négatif')}}", "{{si(n%2==0,'négatif','positif')}}", "nul"]
        correction: "{{n}} signes − : un nombre {{si(n%2==0,'pair','impair')}}, donc {{si(n%2==0,'positif','négatif')}}."
      - type: nombre
        vars: { a: "-5..-1", b: "-5..-1", c: "-5..5" }
        si: "c != 0"
        enonce: "$({{nb(a)}}) \\times ({{nb(b)}}) \\times ({{nb(c)}}) = ?$"
        reponse: "a*b*c"
        correction: "{{nb(a*b)}} × ({{nb(c)}}) = {{nb(a*b*c)}}."

  - id: priorites
    titre: Les priorités opératoires
    objectif: J'effectue un calcul en respectant l'ordre des priorités.
    mots: [priorité, parenthèses]
    etapes:
      - dialogue:
          - zero: "2 + 3 × 4 = 5 × 4 = 20 !"
          - neo: "Vérifions… On fait la multiplication d'abord : 3 × 4 = 12, puis 2 + 12 = 14."
          - mia: "Les calculatrices scientifiques et les tableurs suivent tous cette règle : il faut la connaître !"
      - texte: |
          **Ordre des calculs :**
          1. les **parenthèses** (de l'intérieur vers l'extérieur) ;
          2. les **puissances** ;
          3. les **multiplications et divisions** (de gauche à droite) ;
          4. les **additions et soustractions** (de gauche à droite).

          Exemple : $5 + 2 \times (8 - 3)^2 = 5 + 2 \times 5^2 = 5 + 2 \times 25 = 5 + 50 = 55$
      - attention:
          texte: "De gauche à droite pour les opérations de même niveau ! $12 \\div 3 \\times 2 = 4 \\times 2 = 8$ (et pas $12 \\div 6 = 2$)."
          qui: neo
      - a_quoi_ca_sert: "Écrire des formules dans un tableur, programmer, utiliser une calculatrice correctement, et toute l'algèbre !"
      - question:
          type: nombre
          vars: { a: "2..9", b: "2..9", c: "2..9" }
          enonce: "${{a}} + {{b}} \\times {{c}} = ?$"
          reponse: "a+b*c"
          correction: "{{b}} × {{c}} = {{b*c}} d'abord, puis {{a}} + {{b*c}} = {{a+b*c}}."
      - astuce:
          texte: "D'abord les parenthèses, ensuite × et ÷, enfin + et −. Retiens : « Parenthèses, Puis Produits, Plus tard les sommes »."
          qui: neo
    exercices:
      - type: nombre
        vars: { a: "2..9", b: "2..9", c: "2..9" }
        enonce: "${{a}} + {{b}} \\times {{c}} = ?$"
        reponse: "a+b*c"
        niveau: 2
        erreurs:
          - { valeur: "(a+b)*c", message: "La multiplication passe AVANT l'addition : d'abord {{b}} × {{c}} = {{b*c}}, ensuite {{a}} + {{b*c}}." }
        correction: "{{a+b*c}}"
      - type: nombre
        vars: { a: "2..9", b: "2..9", c: "2..9" }
        enonce: "${{a}} \\times {{b}} - {{c}} = ?$"
        reponse: "a*b-c"
        correction: "{{a*b}} − {{c}} = {{a*b-c}}."
      - type: nombre
        vars: { a: "2..9", b: "2..9", c: "2..9" }
        enonce: "$({{a}} + {{b}}) \\times {{c}} = ?$"
        reponse: "(a+b)*c"
        correction: "{{a+b}} × {{c}} = {{(a+b)*c}}."
      - type: nombre
        vars: { a: "2..6", b: "2..5", c: "1..4", d: "2..9" }
        si: "b > c"
        enonce: "${{d}} + {{a}} \\times ({{b}} - {{c}})^2 = ?$"
        reponse: "d + a*(b-c)^2"
        correction: "({{b}} − {{c}})² = {{(b-c)^2}} ; × {{a}} = {{a*(b-c)^2}} ; + {{d}} = {{d+a*(b-c)^2}}."
      - type: nombre
        vars: { q: "2..6", b: "2..5", c: "2..4" }
        enonce: "${{q*b}} \\div {{b}} \\times {{c}} = ?$"
        reponse: "q*c"
        correction: "De gauche à droite : {{q*b}} ÷ {{b}} = {{q}}, puis × {{c}} = {{q*c}}."
      - type: nombre
        vars: { a: "-9..-2", b: "2..9", c: "-5..5" }
        si: "c != 0"
        enonce: "${{nb(a)}} - {{b}} \\times ({{nb(c)}}) = ?$"
        reponse: "a - b*c"
        correction: "{{b}} × ({{nb(c)}}) = {{nb(b*c)}} ; {{nb(a)}} − ({{nb(b*c)}}) = {{nb(a-b*c)}}."

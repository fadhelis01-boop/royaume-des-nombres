id: fete-foraine-des-probabilites
titre: La Fête foraine des Probabilités
sous_titre: Dénombrement, probabilités conditionnelles, lois et espérance
emoji: 🎡
couleur: "#f57f17"
cycle: maitres
age: 15-18 ans et +
niveau: 2nde – supérieur
ordre: 24
prerequis: [observatoire-des-donnees]
version: 1.0.0
intro:
  - neo: "Bienvenue à la Fête foraine des Probabilités ! Chaque stand est un jeu de hasard… et chaque jeu cache des maths."
  - mia: "Est-ce que ce jeu est équitable ? Combien de chances de gagner ? Combien gagnerai-je en moyenne ?"
  - zero: "Je veux le stand où on gagne à tous les coups. …Il n'existe pas ?"

lecons:
  - id: denombrement
    titre: Dénombrer - le principe multiplicatif et les factorielles
    objectif: Je compte des possibilités avec le principe multiplicatif, les arrangements et les permutations.
    mots: [dénombrement, factorielle, permutation]
    etapes:
      - dialogue:
          - mia: "3 pantalons et 4 t-shirts : combien de tenues ?"
          - neo: "Pour chaque pantalon, 4 t-shirts : 3 × 4 = 12 tenues. C'est le principe multiplicatif !"
      - texte: |
          - **Principe multiplicatif** : $n_1$ choix puis $n_2$ choix… → $n_1 \times n_2 \times \cdots$ possibilités.
          - **Listes avec répétition** (codes, mots de passe) : $n^k$. Un code à 4 chiffres : $10^4 = 10\,000$ codes.
          - **Permutations** (ranger $n$ objets) : $n! = n \times (n-1) \times \cdots \times 2 \times 1$ (« factorielle n »). $5! = 120$.
          - **Arrangements** (podium de $k$ parmi $n$) : $n \times (n-1) \times \cdots \times (n-k+1) = \dfrac{n!}{(n-k)!}$.
      - a_quoi_ca_sert: "La sécurité des mots de passe et des codes, les plaques d'immatriculation, l'organisation d'un tournoi, les combinaisons d'un cadenas…"
      - question:
          type: nombre
          vars: { a: "2..6", b: "2..6", c: "2..4" }
          enonce: "Un menu : {{a}} entrées, {{b}} plats et {{c}} desserts. Combien de menus différents ?"
          reponse: "a*b*c"
          correction: "${{a}} \\times {{b}} \\times {{c}} = {{a*b*c}}$"
    exercices:
      - type: nombre
        vars: { n: "3..7" }
        enonce: "De combien de façons peut-on ranger {{n}} livres sur une étagère ?"
        reponse: "fact(n)"
        correction: "${{n}}! = {{nb(fact(n))}}$"
      - type: nombre
        vars: { k: "3..6" }
        enonce: "Combien de codes à {{k}} chiffres (de 0 à 9, répétitions permises) ?"
        reponse: "10^k"
        correction: "$10^{ {{k}} } = {{nb(10^k)}}$"
      - type: nombre
        vars: { n: "5..12" }
        enonce: "{{n}} coureurs. Combien de podiums (or, argent, bronze) possibles ?"
        reponse: "n*(n-1)*(n-2)"
        correction: "${{n}} \\times {{n-1}} \\times {{n-2}} = {{n*(n-1)*(n-2)}}$"
      - type: nombre
        vars: { n: "4..8" }
        enonce: "Calcule $\\frac{ {{n}}! }{ {{n-2}}! }$."
        reponse: "n*(n-1)"
        correction: "$= {{n}} \\times {{n-1}} = {{n*(n-1)}}$"

  - id: combinaisons
    titre: Les combinaisons et le triangle de Pascal
    objectif: Je calcule le nombre de façons de choisir k objets parmi n.
    mots: [combinaison, coefficient binomial, triangle de Pascal]
    etapes:
      - dialogue:
          - neo: "Choisir 2 amis parmi 5 pour un jeu : l'ordre ne compte pas cette fois."
          - mia: "C'est « 2 parmi 5 » : $\\binom{5}{2} = 10$. On le lit dans le triangle de Pascal !"
      - texte: |
          Le nombre de façons de **choisir $k$ objets parmi $n$** (sans ordre) :
          $$\binom{n}{k} = \frac{n!}{k!\,(n-k)!}$$
          - $\binom{n}{0} = \binom{n}{n} = 1$, $\binom{n}{1} = n$, $\binom{n}{k} = \binom{n}{n-k}$.
          - **Relation de Pascal** : $\binom{n}{k} + \binom{n}{k+1} = \binom{n+1}{k+1}$.
      - visuel:
          type: tableau
          entete: false
          lignes:
            - ["", "", "", "", "1", "", "", "", ""]
            - ["", "", "", "1", "", "1", "", "", ""]
            - ["", "", "1", "", "2", "", "1", "", ""]
            - ["", "1", "", "3", "", "3", "", "1", ""]
            - ["1", "", "4", "", "6", "", "4", "", "1"]
        legende: "Le triangle de Pascal : chaque nombre est la somme des deux au-dessus."
      - histoire:
          titre: Un triangle très ancien
          texte: "Blaise Pascal l'a étudié en détail en 1654 (Traité du triangle arithmétique), mais ce triangle était déjà connu en Chine (Yang Hui, XIIIᵉ siècle), en Perse (Omar Khayyam) et en Inde bien avant."
      - a_quoi_ca_sert: "Les tirages du loto, les mains au poker, la composition d'équipes, la génétique, et la loi binomiale juste après !"
      - question:
          type: nombre
          vars: { n: "4..10", k: [2, 3] }
          enonce: "Calcule $\\binom{ {{n}} }{ {{k}} }$."
          reponse: "comb(n,k)"
          correction: "$\\frac{ {{n}}! }{ {{k}}!\\,{{n-k}}! } = {{comb(n,k)}}$"
    exercices:
      - type: nombre
        vars: { n: "5..12", k: [2, 3, 4] }
        enonce: "$\\binom{ {{n}} }{ {{k}} } = ?$"
        reponse: "comb(n,k)"
        correction: "{{comb(n,k)}}"
      - type: nombre
        vars: { n: "6..20" }
        enonce: "Dans une classe de {{n}} élèves, combien de façons de choisir 2 délégués ?"
        reponse: "comb(n,2)"
        correction: "$\\binom{ {{n}} }{2} = {{comb(n,2)}}$"
      - type: nombre
        vars: { n: "5..9" }
        enonce: "Combien de sous-ensembles (parties) a un ensemble de {{n}} éléments ?"
        reponse: "2^n"
        correction: "Somme d'une ligne du triangle : $2^{ {{n}} } = {{2^n}}$"
      - type: nombre
        enonce: "Au Loto, on choisit 5 numéros parmi 49. Combien de grilles différentes ?"
        reponse: "comb(49,5)"
        correction: "$\\binom{49}{5} = 1\\,906\\,884$"

  - id: probabilites-conditionnelles
    titre: Les probabilités conditionnelles
    objectif: Je calcule une probabilité conditionnelle avec un arbre pondéré ou un tableau.
    mots: [probabilité conditionnelle, arbre pondéré]
    etapes:
      - dialogue:
          - mia: "Il pleut un jour sur trois. QUAND il pleut, Néo prend son parapluie 9 fois sur 10."
          - neo: "« Sachant qu'il pleut » : c'est une probabilité CONDITIONNELLE, notée $P_A(B)$."
      - texte: |
          $$P_A(B) = \frac{P(A \cap B)}{P(A)} \qquad\text{donc}\qquad P(A \cap B) = P(A) \times P_A(B)$$

          Dans un **arbre pondéré** : les probabilités sur les branches du 2ᵉ niveau sont des probabilités **conditionnelles** ; on **multiplie** le long d'un chemin ; la somme des branches issues d'un même nœud vaut 1.
      - visuel:
          type: arbre
          branches:
            - label: "Pluie"
              p: "1/3"
              enfants: [{ label: "Parapluie", p: "0,9" }, { label: "Sans", p: "0,1" }]
            - label: "Sec"
              p: "2/3"
              enfants: [{ label: "Parapluie", p: "0,2" }, { label: "Sans", p: "0,8" }]
      - a_quoi_ca_sert: "Les tests médicaux (probabilité d'être malade sachant que le test est positif), les filtres anti-spam, l'assurance, la météo…"
      - question:
          type: nombre
          vars: { pa: [0.2, 0.3, 0.4, 0.5], pb: [0.5, 0.6, 0.8, 0.9] }
          enonce: "$P(A) = {{nb(pa)}}$ et $P_A(B) = {{nb(pb)}}$. Calcule $P(A \\cap B)$."
          reponse: "pa*pb"
          correction: "${{nb(pa)}} \\times {{nb(pb)}} = {{nb(pa*pb)}}$"
    exercices:
      - type: nombre
        vars: { pa: [0.1, 0.2, 0.3, 0.4], pb: [0.5, 0.7, 0.9] }
        enonce: "$P(A) = {{nb(pa)}}$, $P_A(B) = {{nb(pb)}}$. $P(A \\cap B)$ ?"
        reponse: "pa*pb"
        correction: "{{nb(pa*pb)}}"
      - type: nombre
        vars: { pab: [0.12, 0.2, 0.24, 0.3], pa: [0.4, 0.5, 0.6] }
        si: "pab < pa"
        enonce: "$P(A \\cap B) = {{nb(pab)}}$ et $P(A) = {{nb(pa)}}$. Calcule $P_A(B)$."
        reponse: "pab/pa"
        correction: "$\\frac{ {{nb(pab)}} }{ {{nb(pa)}} } = {{nb(pab/pa)}}$"
      - type: nombre
        vars: { g: "6..15", f: "6..15", gl: "2..6", fl: "2..6" }
        si: "gl < g && fl < f"
        enonce: "Une classe : {{g}} garçons dont {{gl}} portent des lunettes, {{f}} filles dont {{fl}} portent des lunettes. On choisit un élève AVEC lunettes. Probabilité que ce soit une fille ?"
        reponse: "fl/(gl+fl)"
        forme: fraction
        correction: "Parmi les {{gl+fl}} élèves à lunettes, {{fl}} sont des filles : {{frac(fl,gl+fl)}}."

  - id: bayes-independance
    titre: Probabilités totales, Bayes et indépendance
    objectif: J'utilise la formule des probabilités totales, j'inverse un conditionnement et je teste l'indépendance.
    mots: [probabilités totales, Bayes, indépendance]
    etapes:
      - dialogue:
          - neo: "Un test détecte une maladie rare (1 % de la population) dans 99 % des cas, mais se trompe 2 % du temps chez les gens sains."
          - mia: "Si mon test est positif, suis-je sûre d'être malade ? Calculons… seulement 1 chance sur 3 environ !"
          - zero: "Quoi ?! Les maths sont plus fortes que les tests !"
      - texte: |
          **Probabilités totales** : $P(B) = P(A)\,P_A(B) + P(\bar A)\,P_{\bar A}(B)$ (on additionne les chemins).

          **Formule de Bayes** : $P_B(A) = \dfrac{P(A)\,P_A(B)}{P(B)}$.

          Exemple du test : $P(+) = 0{,}01 \times 0{,}99 + 0{,}99 \times 0{,}02 = 0{,}0297$, donc $P_+(\text{malade}) = \dfrac{0{,}0099}{0{,}0297} = \dfrac{1}{3}$.

          **Indépendance** : $A$ et $B$ sont indépendants si $P(A \cap B) = P(A) \times P(B)$ (savoir A ne change rien à B).
      - a_quoi_ca_sert: "Interpréter un test médical ou un dépistage, les filtres anti-spam (bayésiens), la justice (preuves ADN), l'intelligence artificielle…"
      - question:
          type: nombre
          vars: { pa: [0.3, 0.4, 0.5], b1: [0.8, 0.9], b2: [0.1, 0.2, 0.3] }
          enonce: "$P(A) = {{nb(pa)}}$, $P_A(B) = {{nb(b1)}}$, $P_{\\bar A}(B) = {{nb(b2)}}$. Calcule $P(B)$."
          reponse: "pa*b1 + (1-pa)*b2"
          correction: "${{nb(pa)}} \\times {{nb(b1)}} + {{nb(1-pa)}} \\times {{nb(b2)}} = {{nb(pa*b1+(1-pa)*b2)}}$"
    exercices:
      - type: nombre
        vars: { pa: [0.2, 0.4, 0.5, 0.6], b1: [0.5, 0.7, 0.9], b2: [0.1, 0.3] }
        enonce: "$P(A) = {{nb(pa)}}$, $P_A(B) = {{nb(b1)}}$, $P_{\\bar A}(B) = {{nb(b2)}}$. $P(B)$ ?"
        reponse: "pa*b1 + (1-pa)*b2"
        correction: "{{nb(pa*b1+(1-pa)*b2)}}"
      - type: nombre
        vars: { pa: [0.2, 0.5], b1: [0.6, 0.8], b2: [0.2, 0.4] }
        enonce: "Même situation : $P(A) = {{nb(pa)}}$, $P_A(B) = {{nb(b1)}}$, $P_{\\bar A}(B) = {{nb(b2)}}$. Calcule $P_B(A)$ (au centième)."
        reponse: "round(pa*b1/(pa*b1+(1-pa)*b2), 2)"
        tolerance: 0.011
        correction: "$\\frac{ {{nb(pa*b1)}} }{ {{nb(pa*b1+(1-pa)*b2)}} } \\approx {{nb(round(pa*b1/(pa*b1+(1-pa)*b2),2))}}$"
      - type: vf
        vars: { pa: [0.2, 0.5, 0.4], pb: [0.3, 0.5, 0.6], t: [0, 1] }
        enonce: "$P(A) = {{nb(pa)}}$, $P(B) = {{nb(pb)}}$ et $P(A \\cap B) = {{nb(pa*pb + t*0.05)}}$. A et B sont-ils indépendants ?"
        reponse: "t == 0"
        correction: "$P(A) \\times P(B) = {{nb(pa*pb)}}$ {{si(t==0,'= P(A ∩ B) : indépendants.','≠ P(A ∩ B) : pas indépendants.')}}"

  - id: variables-aleatoires
    titre: Variables aléatoires et espérance
    objectif: Je calcule l'espérance d'une variable aléatoire et je juge si un jeu est équitable.
    mots: [variable aléatoire, espérance]
    etapes:
      - dialogue:
          - zero: "Le stand : je paie 2 €, je lance un dé. Si je fais 6, je gagne 10 €. C'est une bonne affaire ?"
          - mia: "Calculons le gain MOYEN par partie : c'est l'ESPÉRANCE !"
      - texte: |
          Une **variable aléatoire** $X$ associe un nombre à chaque issue (un gain, un score…).

          $$E(X) = x_1\,p_1 + x_2\,p_2 + \cdots + x_n\,p_n$$
          C'est la **moyenne** des valeurs qu'on obtiendrait sur un très grand nombre de parties.

          Zéro : gain net $+8$ € avec probabilité $\frac{1}{6}$, $-2$ € avec probabilité $\frac{5}{6}$ :
          $E = 8 \times \frac{1}{6} - 2 \times \frac{5}{6} = \frac{8 - 10}{6} = -\frac{1}{3}$ € par partie. **Défavorable !**

          Un jeu est **équitable** si $E = 0$.
      - a_quoi_ca_sert: "Savoir pourquoi les casinos et les loteries gagnent toujours à long terme, calculer une prime d'assurance, prendre des décisions face au risque…"
      - question:
          type: nombre
          vars: { g: [6, 12, 18, 24], m: [1, 2, 3] }
          enonce: "On paie {{m}} € pour lancer un dé ; on reçoit {{g}} € si on fait 6. Espérance du gain net (fraction ou décimal) ?"
          reponse: "g/6 - m"
          correction: "$E = \\frac{ {{g}} }{6} - {{m}} = {{nb(g/6-m,2)}}$ €"
    exercices:
      - type: nombre
        vars: { a: "1..9", b: "1..9", c: "1..9" }
        enonce: "$X$ vaut {{a}}, {{b}} ou {{c}} avec les probabilités 0,2 ; 0,3 ; 0,5. Calcule $E(X)$."
        reponse: "0.2*a + 0.3*b + 0.5*c"
        correction: "$0{,}2 \\times {{a}} + 0{,}3 \\times {{b}} + 0{,}5 \\times {{c}} = {{nb(0.2*a+0.3*b+0.5*c)}}$"
      - type: nombre
        vars: { m: [1, 2, 5] }
        enonce: "Jeu : on paie {{m}} €, on lance une pièce. Face : on reçoit G €. Pile : rien. Quelle valeur de G rend le jeu équitable ?"
        reponse: "2*m"
        unite: €
        correction: "$\\frac{G}{2} - {{m}} = 0 \\iff G = {{2*m}}$ €"
      - type: qcm
        vars: { e: [-0.5, -0.2, 0.3, 0] }
        enonce: "L'espérance de gain d'un jeu est {{nb(e)}} €. Ce jeu est…"
        choix: ["{{si(e<0,'défavorable au joueur',si(e>0,'favorable au joueur','équitable'))}}", "{{si(e<0,'favorable au joueur','défavorable au joueur')}}", "{{si(e==0,'favorable au joueur','équitable')}}"]
        correction: "Le signe de l'espérance décide."

  - id: loi-binomiale
    titre: La loi binomiale
    objectif: J'utilise la loi binomiale pour compter des succès dans des épreuves répétées.
    mots: [loi binomiale, épreuve de Bernoulli]
    etapes:
      - dialogue:
          - neo: "Je tire 10 fois au panier, avec 70 % de réussite à chaque tir. Probabilité d'en marquer exactement 8 ?"
          - mia: "Mêmes épreuves, indépendantes, deux issues : c'est la loi BINOMIALE !"
      - texte: |
          On répète $n$ fois, de façon **indépendante**, une épreuve à deux issues (succès de probabilité $p$). $X$ = nombre de succès suit la **loi binomiale** $\mathcal{B}(n, p)$ :
          $$P(X = k) = \binom{n}{k} p^k (1-p)^{n-k} \qquad E(X) = np$$
          Exemple : $P(X = 8)$ pour $\mathcal{B}(10 ; 0{,}7)$ : $\binom{10}{8} \times 0{,}7^8 \times 0{,}3^2 \approx 0{,}233$.
      - a_quoi_ca_sert: "Contrôle qualité (pièces défectueuses), sondages, résultats d'un QCM répondu au hasard, génétique, efficacité d'un vaccin…"
      - question:
          type: nombre
          vars: { n: [10, 20, 50, 100], p: [0.1, 0.2, 0.5, 0.3] }
          enonce: "$X$ suit $\\mathcal{B}({{n}} ; {{nb(p)}})$. Espérance $E(X)$ ?"
          reponse: "n*p"
          correction: "$np = {{n}} \\times {{nb(p)}} = {{nb(n*p)}}$"
    exercices:
      - type: nombre
        vars: { n: [3, 4], k: [1, 2] }
        enonce: "On lance {{n}} fois une pièce équilibrée. Probabilité d'obtenir exactement {{k}} fois pile ? (fraction)"
        reponse: "comb(n,k)/2^n"
        forme: fraction
        correction: "$\\binom{ {{n}} }{ {{k}} } \\times \\left(\\frac12\\right)^{ {{n}} } = \\frac{ {{comb(n,k)}} }{ {{2^n}} } = {{frac(comb(n,k),2^n)}}$"
      - type: nombre
        vars: { n: [4, 5, 6] }
        enonce: "QCM de {{n}} questions à 4 choix, répondu au hasard. Probabilité de TOUT réussir ? (fraction)"
        reponse: "1/4^n"
        forme: fraction
        correction: "$\\left(\\frac14\\right)^{ {{n}} } = \\frac{1}{ {{4^n}} }$"
      - type: nombre
        vars: { n: [5, 8, 10], p: [0.2, 0.5, 0.7] }
        enonce: "$\\mathcal{B}({{n}} ; {{nb(p)}})$ : calcule $P(X = 0)$ (au millième)."
        reponse: "round((1-p)^n, 3)"
        tolerance: 0.0011
        correction: "$(1 - {{nb(p)}})^{ {{n}} } \\approx {{nb(round((1-p)^n,3))}}$"

  - id: grands-nombres
    titre: La loi des grands nombres et la courbe en cloche
    objectif: Je comprends pourquoi les fréquences se stabilisent et ce qu'est la loi normale.
    mots: [loi des grands nombres, loi normale]
    etapes:
      - dialogue:
          - zero: "J'ai lancé une pièce 10 fois : 7 piles ! La pièce est truquée !"
          - neo: "Pas forcément… Lance-la 10 000 fois : la fréquence de pile sera très proche de 0,5."
      - texte: |
          **Loi des grands nombres** : quand on répète une expérience un très grand nombre de fois, la **fréquence** d'un événement se rapproche de sa **probabilité**. Sur 10 lancers, 7 piles n'a rien d'étonnant ; sur 10 000, la fréquence s'écarte rarement de plus de 0,01 de 0,5.

          **La courbe en cloche (loi normale)** : beaucoup de grandeurs (tailles, erreurs de mesure, sommes de nombreux petits effets) se répartissent selon une courbe en cloche. Environ **95 %** des valeurs sont à moins de **2 écarts-types** de la moyenne.
      - visuel:
          type: graphe
          xmin: -4
          xmax: 4
          ymin: -0.05
          ymax: 0.45
          pas_y: 0.1
          fonctions: [{ f: "exp(-x^2/2)/sqrt(2*pi)", nom: "courbe en cloche" }]
          aire: { f: "exp(-x^2/2)/sqrt(2*pi)", de: -2, a: 2 }
        legende: "L'aire jaune (entre −2 et 2 écarts-types) représente environ 95 %."
      - a_quoi_ca_sert: "Les sondages (marge d'erreur), les assurances, le contrôle de fabrication, la science expérimentale (tout résultat est donné « à ± près »)…"
      - question:
          type: qcm
          enonce: "On lance un dé 60 000 fois. Combien de 6 environ ?"
          choix: ["environ 10 000", "exactement 10 000", "environ 6 000", "environ 30 000"]
          correction: "Fréquence ≈ 1/6, donc environ 60 000 / 6 = 10 000 (mais rarement exactement)."
    exercices:
      - type: nombre
        vars: { n: [600, 1200, 6000] }
        enonce: "On lance un dé {{nb(n)}} fois. Nombre de 6 attendu en moyenne ?"
        reponse: "n/6"
        correction: "{{nb(n)}} × 1/6 = {{nb(n/6)}}"
      - type: qcm
        enonce: "D'après la loi normale, environ quel pourcentage des valeurs est à moins de 2 écarts-types de la moyenne ?"
        choix: ["95 %", "50 %", "68 %", "99,99 %"]
        correction: "Environ 95 % (et environ 68 % à moins d'un écart-type)."
      - type: vf
        enonce: "Vrai ou faux : après 5 « pile » de suite, « face » devient plus probable au lancer suivant."
        reponse: false
        correction: "Faux ! La pièce n'a pas de mémoire : chaque lancer reste à 1/2. C'est « l'erreur du joueur »."

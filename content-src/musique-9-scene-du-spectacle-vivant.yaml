id: mu-scene-du-spectacle-vivant
matiere: musique
titre: La Scène du Spectacle vivant
sous_titre: Série S2TMD - culture et sciences du spectacle, économie du spectacle vivant, création collective, techniques de la scène
emoji: 🎪
couleur: "#4a148c"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 509
specialite: S2TMD
version: 1.0.0
intro:
  - narrateur: "Au cœur de la Cité des Résonances, une grande scène partagée : des musiciens accordent, des danseurs s'échauffent, des comédiens répètent."
  - mia: "La série S2TMD, sciences et techniques du théâtre, de la musique et de la danse, se suit en lien avec un conservatoire."
  - neo: "On y pratique intensément un art, mais on étudie aussi ce qu'il y a autour : l'histoire, les métiers, l'économie, les techniques de la scène."

lecons:
  - id: s2tmd-presentation
    titre: La série S2TMD et le spectacle vivant
    classe: "1ʳᵉ"
    objectif: Je connais l'organisation de la série S2TMD et ce qu'on appelle le spectacle vivant.
    mots: [spectacle vivant, conservatoire, interprète, création]
    etapes:
      - dialogue:
          - zero: "S2TMD, c'est un lycée d'artistes ?"
          - mia: "C'est une série du bac technologique : les cours ont lieu au lycée et au conservatoire, pour pratiquer à haut niveau théâtre, musique ou danse."
      - a_quoi_ca_sert: "Savoir ce qu'est le spectacle vivant et comment il fonctionne aide à préparer un parcours vers les écoles supérieures d'art et les métiers de la scène."
      - texte: |
          **La série S2TMD** : un enseignement de spécialité **« culture et sciences »** de son art (théâtre, musique ou danse) et un enseignement de **pratique**, en partenariat avec un **conservatoire**.

          **Le spectacle vivant** : un art joué **en direct**, devant un public présent : théâtre, musique, danse, cirque, arts de la rue, opéra.

          **Ses caractéristiques** : l'œuvre est **éphémère** (chaque représentation est unique), elle réunit **interprètes** et **public** dans un même lieu et un même temps, et elle demande de nombreux métiers.

          **Pratiquer à haut niveau** : régularité, échauffement, écoute du groupe, soin du corps et de la voix, gestion du trac.
      - astuce: { texte: "Spectacle vivant = en direct, avec le public, jamais deux fois pareil.", qui: neo }
      - retiens: "S2TMD : **culture et sciences** de son art + **pratique**, avec un **conservatoire**. **Spectacle vivant** : en **direct**, **éphémère**, interprètes et public **réunis** ; théâtre, musique, danse, cirque, rue, opéra."
    exercices:
      - type: classer
        enonce: "Range chaque forme : spectacle vivant ou non ?"
        categories: ["Spectacle vivant", "Pas du spectacle vivant"]
        mots: [["Un concert dans une salle", 0], ["Un film au cinéma", 1], ["Un numéro de cirque sous chapiteau", 0], ["Un album écouté en streaming", 1]]
        correction: "En direct devant un public → spectacle vivant ; enregistré → non."
      - type: relier
        enonce: "🔗 Relie chaque caractéristique à son sens."
        paires: [["éphémère", "chaque représentation est unique"], ["en direct", "joué devant le public présent"], ["collectif", "il réunit de nombreux métiers"]]
        correction: "Ce qui fait la spécificité du spectacle vivant."
      - type: qcm
        enonce: "Avec quel établissement la série S2TMD fonctionne-t-elle en partenariat ?"
        choix: ["Un conservatoire", "Un hôpital", "Une banque", "Un lycée agricole"]
        correction: "La pratique se fait en lien avec un **conservatoire**."
      - type: vf
        vars: { t: [["L'opéra fait partie du spectacle vivant.", true], ["Une représentation de théâtre est identique chaque soir.", false], ["L'échauffement fait partie de la pratique régulière.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Opéra = spectacle vivant ; chaque soir est unique ; échauffement indispensable."

  - id: s2tmd-metiers-economie
    titre: Métiers et économie du spectacle vivant
    classe: "1ʳᵉ"
    objectif: Je cite les métiers du spectacle vivant, le statut d'intermittent et les grandes sources de financement d'un spectacle.
    mots: [intermittent, production, diffusion, subvention]
    etapes:
      - dialogue:
          - neo: "Sur un spectacle de danse avec cinq danseurs, combien de personnes travaillent en tout ?"
          - zero: "Cinq ?"
          - mia: "Souvent le double : chorégraphe, régisseurs, éclairagiste, costumière, chargée de production, attachée de presse…"
      - a_quoi_ca_sert: "La plupart des métiers du spectacle ne sont pas sur scène ; les connaître ouvre des pistes d'orientation, et comprendre l'économie aide à monter ses propres projets."
      - texte: |
          **Les métiers** :
          - **artistiques** : comédien, musicien, danseur, metteur en scène, chorégraphe, compositeur ;
          - **techniques** : régisseur général, régisseur lumière et son, machiniste, costumier, accessoiriste ;
          - **administratifs** : chargé de production, de diffusion, de communication, administrateur.

          **De la création au public** : **création** (répétitions), **production** (réunir l'argent et les moyens), **diffusion** (vendre le spectacle aux théâtres et festivals), **tournée**.

          **Le financement** : billetterie, **subventions** publiques (État, régions, villes), mécénat, coproductions entre théâtres.

          **L'intermittence du spectacle** : un régime d'assurance chômage adapté aux artistes et techniciens qui enchaînent des contrats courts.
      - astuce: { texte: "Pense en trois cercles : sur scène (artistes), autour de la scène (techniciens), derrière la scène (administration).", qui: mia }
      - retiens: "Métiers **artistiques**, **techniques**, **administratifs**. Chaîne : **création**, **production**, **diffusion**, tournée. Financement : **billetterie**, **subventions**, mécénat, coproductions. **Intermittence** : contrats courts, chômage adapté."
    exercices:
      - type: classer
        enonce: "Range chaque métier : artistique ou technique ?"
        categories: ["Artistique", "Technique"]
        mots: [["Chorégraphe", 0], ["Régisseur lumière", 1], ["Comédienne", 0], ["Machiniste", 1]]
        correction: "Créer et interpréter → artistique ; faire fonctionner la scène → technique."
      - type: ordre
        enonce: "Range les étapes de la vie d'un spectacle."
        items: ["Création et répétitions", "Production", "Diffusion auprès des théâtres", "Tournée devant le public"]
        correction: "Créer, produire, diffuser, tourner."
      - type: relier
        enonce: "🔗 Relie chaque source de financement à son origine."
        paires: [["la billetterie", "les spectateurs"], ["la subvention", "l'État ou une collectivité"], ["le mécénat", "une entreprise ou un particulier"]]
        correction: "Un spectacle mélange souvent plusieurs financements."
      - type: vf
        vars: { t: [["Le régime de l'intermittence concerne des artistes et des techniciens.", true], ["Le chargé de diffusion vend le spectacle aux théâtres et festivals.", true], ["Un spectacle n'est financé que par les billets vendus.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Intermittents artistes et techniciens ; la diffusion vend le spectacle ; financements multiples."

  - id: s2tmd-techniques-scene
    titre: Les techniques de la scène
    classe: Terminale
    objectif: Je connais les bases de la lumière, du son et de la régie, et je sais lire une fiche technique.
    mots: [régie, projecteur, console, fiche technique]
    etapes:
      - dialogue:
          - mia: "Avant d'accueillir un spectacle, le théâtre reçoit sa fiche technique : la taille de la scène, les projecteurs, les micros, les besoins."
          - zero: "C'est comme une liste de courses ?"
          - neo: "En plus précis ! Sans elle, impossible de préparer la salle."
      - a_quoi_ca_sert: "Un artiste qui comprend la technique travaille mieux avec son équipe ; et les métiers de la régie sont très demandés."
      - texte: |
          **La lumière** : des **projecteurs** (découpe pour un faisceau précis, PC pour une lumière douce, projecteurs à LED de couleur) commandés depuis une **console lumière** ; on enregistre des **effets** (« mémoires ») qui s'enchaînent pendant le spectacle.

          **Le son** : micros, **console de mixage**, enceintes de façade (pour le public) et **retours** (pour que les artistes s'entendent).

          **La régie** : le régisseur suit la **conduite** (la liste des effets et des tops) et lance chaque changement au bon moment.

          **La fiche technique** : dimensions du plateau, plan d'implantation des lumières, liste du matériel son, temps de montage, besoins en personnel.

          **La sécurité** : charges suspendues, câbles, issues de secours, normes des salles.
      - astuce: { texte: "Façade pour le public, retours pour les artistes : deux sons différents dans la même salle.", qui: zero }
      - retiens: "**Lumière** : projecteurs, **console**, mémoires. **Son** : micros, **console de mixage**, **façade** et **retours**. **Régie** : suivre la **conduite**. **Fiche technique** : plateau, implantation, matériel, montage. **Sécurité** avant tout."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque élément à son rôle."
        paires: [["les enceintes de façade", "diffuser le son vers le public"], ["les retours", "permettre aux artistes de s'entendre"], ["la console lumière", "commander les projecteurs"], ["la conduite", "la liste des effets à lancer"]]
        correction: "Les outils de base de la régie."
      - type: qcm
        enonce: "Quel document un théâtre reçoit-il pour préparer l'accueil d'un spectacle ?"
        choix: ["La fiche technique", "Le compte de résultat", "Le programme scolaire", "La partition seule"]
        correction: "La **fiche technique** décrit tous les besoins du spectacle."
      - type: classer
        enonce: "Range chaque matériel : lumière ou son ?"
        categories: ["Lumière", "Son"]
        mots: [["Un projecteur de découpe", 0], ["Un micro sans fil", 1], ["Une console de mixage", 1], ["Un projecteur à LED", 0]]
        correction: "Éclairer → lumière ; capter et diffuser → son."
      - type: vf
        vars: { t: [["Le régisseur lance les effets selon la conduite.", true], ["Les issues de secours peuvent être encombrées par le décor.", false], ["Une mémoire de console enregistre un état lumineux.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Conduite suivie ; issues toujours dégagées ; mémoire = état lumineux enregistré."

  - id: s2tmd-creation-collective
    titre: Création collective et projet artistique
    classe: Terminale
    objectif: Je mène un projet de création collective, de l'idée à la représentation, en travaillant avec d'autres disciplines.
    mots: [projet, création collective, pluridisciplinaire, représentation]
    etapes:
      - dialogue:
          - neo: "Un musicien, une danseuse et un comédien doivent créer ensemble une forme de quinze minutes."
          - zero: "Chacun fait son numéro à la suite ?"
          - mia: "Mieux : ils cherchent ensemble comment la musique, le corps et la parole se répondent. C'est une création pluridisciplinaire."
      - a_quoi_ca_sert: "Le travail de création collective est au cœur de la série et des métiers de la scène, où l'on crée presque toujours en équipe."
      - texte: |
          **Les étapes d'un projet** :
          1. une **idée** ou un thème, une **intention** commune ;
          2. des **recherches** (improvisations, lectures, écoutes, références) ;
          3. une **écriture** (structure, enchaînements, rôles de chacun) ;
          4. des **répétitions**, avec un regard extérieur ;
          5. la **représentation**, puis un **retour** critique.

          **Travailler en groupe** : écouter, proposer, accepter de renoncer à une idée, se répartir les rôles (artistique, technique, communication).

          **La pluridisciplinarité** : faire dialoguer les arts (une musique jouée en direct sur une danse, un texte dit sur une improvisation musicale).

          **Le carnet de création** garde la trace des choix, des essais et des difficultés.
      - astuce: { texte: "À chaque répétition, terminez par trois minutes de retour : ce qui marche, ce qui est à garder, ce qui est à changer.", qui: neo }
      - retiens: "Projet : **intention** commune → **recherches** → **écriture** → **répétitions** → **représentation** et **retour**. Travail en groupe, **pluridisciplinarité**, **carnet de création**."
    exercices:
      - type: ordre
        enonce: "Range les étapes d'un projet de création collective."
        items: ["Définir une intention commune", "Rechercher et improviser", "Écrire la structure", "Répéter avec un regard extérieur", "Représenter et faire un retour"]
        correction: "Intention, recherche, écriture, répétition, représentation."
      - type: classer
        enonce: "Range chaque attitude : elle aide le groupe ou elle le freine ?"
        categories: ["Aide", "Freine"]
        mots: [["Proposer une idée et accepter qu'elle soit transformée", 0], ["Refuser toute idée qui n'est pas la sienne", 1], ["Noter les choix dans le carnet de création", 0], ["Arriver en retard aux répétitions", 1]]
        correction: "Écoute, souplesse, rigueur : les clés de la création collective."
      - type: qcm
        enonce: "Qu'est-ce qu'une création pluridisciplinaire ?"
        choix: ["Une œuvre où plusieurs arts dialoguent", "Une œuvre jouée par une seule personne", "Une œuvre sans public", "Une œuvre copiée d'une autre"]
        correction: "Plusieurs disciplines artistiques se répondent dans la même œuvre."
      - type: vf
        vars: { t: [["Un regard extérieur aide pendant les répétitions.", true], ["Le retour critique après la représentation est inutile.", false], ["Un carnet de création garde la trace des choix.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Regard extérieur, retour critique et carnet font progresser le projet."

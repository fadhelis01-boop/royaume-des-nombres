id: de-galerie-de-l-histoire-des-arts
matiere: dessin
titre: La Galerie de l'Histoire des Arts
sous_titre: Spécialité histoire des arts - analyser une œuvre d'architecture, grands repères, patrimoine et musées, arts et pouvoir
emoji: 🏛️
couleur: "#5d4037"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 610
specialite: Histoire des arts
version: 1.0.0
intro:
  - narrateur: "Une longue galerie traverse le temps : un temple grec, une cathédrale, un palais, une tour de verre. Au bout, une porte ouverte sur la ville."
  - neo: "L'histoire des arts relie toutes les formes : architecture, peinture, sculpture, musique, cinéma, objets."
  - mia: "On y apprend à regarder une œuvre dans son époque, et à se demander à qui elle s'adresse."

lecons:
  - id: hda-architecture
    titre: Analyser une œuvre d'architecture
    classe: "1ʳᵉ"
    objectif: Je décris un édifice - fonction, plan, matériaux, éléments d'architecture - et je le relie à son époque.
    mots: [architecture, plan, colonne, voûte]
    etapes:
      - dialogue:
          - zero: "Un bâtiment, ce n'est pas une œuvre d'art, c'est juste pour habiter."
          - neo: "Un bâtiment doit être utile, solide et beau, disait déjà l'architecte romain Vitruve. C'est la triade de l'architecture."
      - a_quoi_ca_sert: "On vit tous dans l'architecture ; savoir la lire aide à comprendre une ville, et prépare aux métiers de l'architecture, de l'urbanisme et du patrimoine."
      - texte: |
          **La triade de Vitruve** : **utilité** (la fonction), **solidité** (la construction), **beauté** (l'esthétique).

          **Analyser un édifice** :
          1. **fonction** : temple, église, palais, logement, usine, musée ;
          2. **plan** (vu de dessus) et **élévation** (la façade) ;
          3. **matériaux** et techniques : pierre, brique, bois, fer, béton armé, verre ;
          4. **éléments** : colonne, arc, **voûte**, coupole, contrefort, façade-rideau ;
          5. **contexte** : époque, commanditaire, usage.

          **Quelques jalons** : le Parthénon (Vᵉ siècle av. J.-C., colonnes et fronton), la cathédrale gothique (XIIᵉ et XIIIᵉ siècles : arc brisé, croisée d'ogives, vitraux), la tour Eiffel (1889, fer), la villa Savoye de Le Corbusier (1931, béton, pilotis, fenêtres en bandeau).
      - astuce: { texte: "Regarde toujours trois choses : à quoi sert l'édifice, comment il tient debout, et ce qu'il veut montrer.", qui: mia }
      - retiens: "Vitruve : **utilité, solidité, beauté**. Analyser : **fonction**, **plan** et **élévation**, **matériaux**, **éléments** (colonne, arc, voûte, coupole), **contexte**."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque édifice à son matériau ou sa technique emblématique."
        paires: [["la tour Eiffel", "le fer"], ["la cathédrale gothique", "la croisée d'ogives"], ["la villa Savoye", "le béton armé sur pilotis"], ["le Parthénon", "le marbre et les colonnes"]]
        correction: "Chaque époque a ses matériaux et ses techniques."
      - type: ordre
        enonce: "Range ces édifices dans l'ordre chronologique."
        items: ["Le Parthénon", "Une cathédrale gothique", "La tour Eiffel", "La villa Savoye"]
        correction: "Antiquité, Moyen Âge, 1889, 1931."
      - type: relier
        enonce: "🔗 Relie chaque qualité de Vitruve à son sens."
        paires: [["l'utilité", "l'édifice remplit sa fonction"], ["la solidité", "l'édifice tient et dure"], ["la beauté", "l'édifice plaît au regard"]]
        correction: "La triade de l'architecture."
      - type: vf
        vars: { t: [["Le plan représente un édifice vu de dessus.", true], ["La tour Eiffel est construite en béton.", false], ["Les cathédrales gothiques utilisent l'arc brisé.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Plan = vue de dessus ; la tour Eiffel est en fer ; arc brisé gothique."

  - id: hda-reperes
    titre: Les grands repères de l'histoire des arts
    classe: "1ʳᵉ"
    objectif: Je situe les grandes périodes artistiques et je relie les arts d'une même époque entre eux.
    mots: [Renaissance, baroque, impressionnisme, avant-garde]
    etapes:
      - dialogue:
          - mia: "Au XVIIᵉ siècle, Versailles, la musique de Lully et le théâtre de Molière se répondent : même goût du spectacle et de la grandeur."
          - zero: "Les arts d'une époque se ressemblent ?"
          - neo: "Ils partagent souvent des idées et des goûts. L'histoire des arts cherche ces échos."
      - a_quoi_ca_sert: "Situer une œuvre et la relier à d'autres arts est le cœur de la spécialité, et nourrit la culture générale attendue dans les études et les concours."
      - texte: |
          **Antiquité** : idéal de beauté et de proportion (sculpture grecque, architecture romaine).

          **Moyen Âge** : art roman puis **gothique** ; enluminures, vitraux, chant grégorien.

          **Renaissance** (XVᵉ et XVIᵉ siècles, depuis l'Italie) : perspective, retour à l'Antiquité, l'homme au centre (Léonard de Vinci, Michel-Ange).

          **Baroque** (XVIIᵉ siècle) : mouvement, contrastes, émotion (Le Bernin, Caravage) ; en France, le **classicisme** (Versailles).

          **XIXᵉ siècle** : romantisme, réalisme, **impressionnisme** (Monet, 1874 : peindre la lumière et l'instant).

          **XXᵉ siècle** : **avant-gardes** (cubisme, abstraction, surréalisme), puis art contemporain, design, cinéma, photographie.
      - astuce: { texte: "Pour chaque période, retiens une œuvre d'art visuel, une œuvre musicale et un édifice : tu pourras toujours faire des liens.", qui: mia }
      - retiens: "**Antiquité** (idéal), **Moyen Âge** (roman, gothique), **Renaissance** (perspective, Vinci), **Baroque** (mouvement) et **classicisme** (Versailles), **XIXᵉ** (romantisme, impressionnisme), **XXᵉ** (avant-gardes, art contemporain)."
    exercices:
      - type: ordre
        enonce: "Range ces périodes dans l'ordre chronologique."
        items: ["Art gothique", "Renaissance", "Baroque", "Impressionnisme", "Cubisme"]
        correction: "Moyen Âge, XVᵉ et XVIᵉ, XVIIᵉ, XIXᵉ, XXᵉ siècle."
      - type: relier
        enonce: "🔗 Relie chaque artiste à sa période."
        paires: [["Léonard de Vinci", "Renaissance"], ["Le Bernin", "baroque"], ["Claude Monet", "impressionnisme"], ["Pablo Picasso", "cubisme"]]
        correction: "Quatre artistes, quatre moments."
      - type: qcm
        enonce: "Quelle invention marque la peinture de la Renaissance ?"
        choix: ["La perspective", "La photographie", "Le ready-made", "La peinture abstraite"]
        correction: "La **perspective** donne l'illusion de la profondeur."
      - type: vf
        vars: { t: [["Versailles est un exemple de classicisme français.", true], ["L'impressionnisme naît au Moyen Âge.", false], ["Le baroque aime le mouvement et les contrastes.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Versailles classique ; impressionnisme au XIXᵉ siècle ; baroque = mouvement."

  - id: hda-patrimoine
    titre: Patrimoine et musées
    classe: Terminale
    objectif: J'explique ce qu'est le patrimoine, comment on le protège et le rôle des musées et des métiers qui s'en occupent.
    mots: [patrimoine, conservation, restauration, musée]
    etapes:
      - dialogue:
          - zero: "Le patrimoine, ce sont les vieux châteaux ?"
          - neo: "Aussi ! Mais il y a le patrimoine industriel, les paysages, et même le patrimoine immatériel : des savoir-faire, des fêtes, des chants."
      - a_quoi_ca_sert: "Le patrimoine fait vivre le tourisme et les territoires ; conservateurs, restaurateurs, guides, médiateurs et architectes du patrimoine en prennent soin."
      - texte: |
          **Le patrimoine** : ce qu'une société choisit de transmettre. Il peut être **matériel** (monuments, œuvres, objets, paysages) ou **immatériel** (savoir-faire, traditions, musiques).

          **Protéger** : en France, le classement au titre des **monuments historiques** ; dans le monde, la liste du **patrimoine mondial de l'UNESCO** (créée par une convention de 1972).

          **Conserver et restaurer** : préserver l'œuvre (lumière, humidité, température) et la réparer de façon **réversible** et visible pour un œil averti.

          **Le musée** : acquérir, conserver, étudier, exposer et **transmettre** au public. Le Louvre ouvre au public en **1793**, pendant la Révolution.

          **Débats actuels** : restitution d'œuvres à leur pays d'origine, numérisation, accessibilité.
      - astuce: { texte: "Le patrimoine, ce n'est pas que le passé : c'est un choix du présent pour l'avenir.", qui: mia }
      - retiens: "Patrimoine **matériel** et **immatériel**. Protection : **monuments historiques**, **UNESCO** (1972). **Conserver**, **restaurer** de façon **réversible**. Musée : conserver, étudier, exposer, **transmettre** (Louvre, 1793)."
    exercices:
      - type: classer
        enonce: "Range chaque élément : patrimoine matériel ou immatériel ?"
        categories: ["Matériel", "Immatériel"]
        mots: [["Une cathédrale", 0], ["Le savoir-faire de la dentelle", 1], ["Un tableau de musée", 0], ["Une fête traditionnelle", 1]]
        correction: "Ce qui se touche → matériel ; ce qui se transmet par les pratiques → immatériel."
      - type: nombre
        enonce: "En quelle année le musée du Louvre ouvre-t-il au public ?"
        reponse: "1793"
        correction: "En **1793**, pendant la Révolution française."
      - type: relier
        enonce: "🔗 Relie chaque métier à sa mission."
        paires: [["le conservateur", "gérer et étudier les collections"], ["le restaurateur", "réparer une œuvre abîmée"], ["le médiateur culturel", "faire découvrir les œuvres au public"]]
        correction: "Trois métiers du patrimoine."
      - type: vf
        vars: { t: [["Une restauration doit rester réversible.", true], ["Le patrimoine ne comprend que des châteaux.", false], ["L'UNESCO tient une liste du patrimoine mondial.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Restauration réversible ; patrimoine très varié ; liste de l'UNESCO."

  - id: hda-arts-et-pouvoir
    titre: Les arts et le pouvoir
    classe: Terminale
    objectif: J'analyse comment les arts servent, glorifient ou contestent le pouvoir, à travers des exemples de différentes époques.
    mots: [commanditaire, propagande, mécénat, contestation]
    etapes:
      - dialogue:
          - mia: "Louis XIV se fait représenter en majesté par Rigaud, en 1701, avec manteau d'hermine et perruque. Pourquoi ?"
          - neo: "Pour montrer sa puissance à tous ceux qui verront le tableau : l'art est aussi un outil politique."
      - a_quoi_ca_sert: "Repérer comment une image ou un monument veut convaincre aide à décrypter la communication politique d'hier et d'aujourd'hui."
      - texte: |
          **Glorifier** : portraits officiels (*Louis XIV* de Rigaud, *Napoléon* de David), architecture monumentale (Versailles, arcs de triomphe).

          **Le mécénat** : des puissants financent les artistes (les Médicis à Florence) et en tirent du prestige.

          **La propagande** : au XXᵉ siècle, les régimes totalitaires utilisent affiches, films et architecture pour imposer leur idéologie.

          **Contester** : l'art peut dénoncer (Goya, *Le Tres de Mayo*, 1814 ; Picasso, *Guernica*, 1937), critiquer par la caricature ou le street art (Banksy).

          **Questions d'analyse** : qui est le **commanditaire** ? à qui l'œuvre s'adresse-t-elle ? quel message ? par quels moyens (taille, lieu, symboles) ?
      - astuce: { texte: "Face à une œuvre liée au pouvoir, cherche toujours le commanditaire : il explique souvent le message.", qui: zero }
      - retiens: "L'art peut **glorifier** (Rigaud, David, Versailles), être financé par le **mécénat** (Médicis), servir la **propagande** (XXᵉ), ou **contester** (Goya, Guernica, street art). Toujours chercher le **commanditaire** et le **message**."
    exercices:
      - type: classer
        enonce: "Range chaque œuvre : elle glorifie ou elle conteste le pouvoir ?"
        categories: ["Glorifie", "Conteste"]
        mots: [["Le portrait de Louis XIV en majesté par Rigaud", 0], ["Guernica de Picasso", 1], ["Le Sacre de Napoléon par David", 0], ["Une caricature d'un chef d'État dans un journal satirique", 1]]
        correction: "Portraits officiels → glorifier ; dénonciation et satire → contester."
      - type: relier
        enonce: "🔗 Relie chaque notion à sa définition."
        paires: [["le commanditaire", "celui qui commande et paie l'œuvre"], ["le mécénat", "le soutien financier aux artistes"], ["la propagande", "diffuser une idéologie pour convaincre les masses"]]
        correction: "Les mots clés des arts et du pouvoir."
      - type: qcm
        enonce: "Quelle famille de Florence est célèbre pour son mécénat à la Renaissance ?"
        choix: ["Les Médicis", "Les Bourbons", "Les Habsbourg", "Les Tudor"]
        correction: "Les **Médicis** ont soutenu de nombreux artistes."
      - type: vf
        vars: { t: [["Le lieu d'exposition d'une œuvre peut renforcer son message politique.", true], ["Un portrait officiel est toujours neutre.", false], ["Le street art peut servir à critiquer le pouvoir.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le lieu compte ; un portrait officiel met en scène le pouvoir ; le street art peut contester."

id: ph-sommet-de-l-energie
matiere: physique
titre: Le Sommet de l'Énergie
sous_titre: Formes d'énergie, énergie cinétique et potentielle, F = ma, chute libre, gravitation
emoji: 🎢
couleur: "#173a7a"
cycle: maitres
age: 15 ans et +
niveau: Ingénieur – Expert (2nde – Terminale)
ordre: 206
prerequis: [ph-pic-du-mouvement]
version: 1.0.0
intro:
  - neo: "L'énergie ne se crée pas et ne se perd pas : elle se transforme. C'est la loi la plus solide de toute la physique."
  - zero: "Même mon énergie à moi ? Quand je fais la sieste, elle va où ?"
  - mia: "Elle se repose… et elle vient de ce que tu as mangé. Tout est lié."

lecons:
  - id: formes-d-energie
    titre: "Les formes d'énergie et leurs conversions"
    objectif: J'identifie les formes d'énergie et les conversions dans une chaîne énergétique.
    mots: [énergie, conversion, conservation, rendement]
    etapes:
      - dialogue:
          - zero: "L'énergie, c'est ce que j'ai après mon goûter ?"
          - mia: "Aussi ! Mais elle prend plein de formes : chaleur, mouvement, lumière… et elle se transforme."
      - a_quoi_ca_sert: "Comprendre les conversions d'énergie aide à choisir des appareils économes et à comprendre les centrales électriques."
      - texte: |
          Formes d'énergie : **cinétique** (mouvement), **potentielle** (position en hauteur, ressort tendu), **thermique**, **chimique** (aliments, carburants, piles), **électrique**, **lumineuse** (rayonnante), **nucléaire**.
          Un convertisseur transforme une forme en une autre : une lampe convertit l'énergie électrique en lumière… et en chaleur (perdue).
          **Conservation** : l'énergie totale se conserve. **Rendement** = énergie utile / énergie reçue (toujours < 1). Une LED a un bien meilleur rendement qu'une ampoule à filament.
      - visuel: {"type":"frise","titre":"Une chaîne énergétique : le barrage","points":[{"emoji":"💧","label":"eau en hauteur","sous":"énergie de position"},{"emoji":"🌀","label":"turbine","sous":"énergie de mouvement"},{"emoji":"⚡","label":"alternateur","sous":"énergie électrique"},{"emoji":"💡","label":"lampe","sous":"lumière + chaleur perdue"}]}
      - astuce:
          texte: "L'énergie ne se crée pas, elle se transforme. Dessine toujours la chaîne : réservoir → convertisseur → énergie utile + pertes (souvent de la chaleur)."
          qui: mia
      - retiens: "L'énergie se conserve et se transforme. Rendement = utile / reçue, toujours inférieur à 100 %."
    exercices:
      - type: qcm
        vars: { t: [["une éolienne", "cinétique (vent) → électrique", "électrique → cinétique", "chimique → lumineuse"], ["un moteur électrique", "électrique → cinétique", "cinétique → électrique", "thermique → chimique"], ["une pile", "chimique → électrique", "électrique → chimique", "lumineuse → chimique"], ["un panneau solaire photovoltaïque", "lumineuse → électrique", "électrique → lumineuse", "chimique → thermique"], ["la photosynthèse", "lumineuse → chimique", "chimique → lumineuse", "électrique → chimique"]] }
        enonce: "Quelle conversion réalise {{t_0}} ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: nombre
        vars: { r: [100, 200, 500, 1000], u: [20, 40, 50, 80] }
        si: "u < 100"
        enonce: "Un appareil reçoit {{r}} J et fournit {{r*u/100}} J d'énergie utile. Quel est son rendement (en %) ?"
        reponse: "u"
        unite: "%"
        correction: "{{r*u/100}} / {{r}} × 100 = {{u}} %."
      - type: vf
        vars: { "t":[["Une machine peut avoir un rendement de 120 %.",false,"Faux : le rendement est toujours inférieur à 100 %."],["L'énergie perdue par une lampe part surtout sous forme de chaleur.",true,"Vrai : surtout pour les vieilles ampoules à filament."],["L'énergie totale se conserve toujours.",true,"Vrai : elle se transforme, mais ne se perd pas au total."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: cinetique-potentielle
    titre: "Énergie cinétique et énergie potentielle"
    objectif: Je calcule Ec = ½mv² et Ep = mgh.
    mots: [énergie cinétique, énergie potentielle, énergie mécanique]
    etapes:
      - dialogue:
          - zero: "Pourquoi les montagnes russes accélèrent dans les descentes ?"
          - neo: "L'énergie de hauteur se transforme en énergie de vitesse. Calculons-les !"
      - a_quoi_ca_sert: "Ces énergies expliquent les montagnes russes, les barrages hydroélectriques et pourquoi un choc à 90 km/h est bien plus grave qu'à 50 km/h."
      - texte: |
          - **Énergie cinétique** : $E_c = \dfrac{1}{2} m v^2$ (J, avec m en kg, v en m/s). Doubler la vitesse **quadruple** l'énergie : c'est pourquoi les chocs à grande vitesse sont si graves.
          - **Énergie potentielle de pesanteur** : $E_p = m g h$ (h en m, g = 9,8 N/kg).
          - **Énergie mécanique** : $E_m = E_c + E_p$. Sans frottement, elle se **conserve** : sur des montagnes russes, la hauteur se change en vitesse, et inversement.
      - exemple:
          titre: Une voiture en ville
          enonce: "Une voiture de 1 000 kg roule à 50 km/h ≈ 13,9 m/s."
          etapes: ["$E_c = 0{,}5 \\times 1000 \\times 13{,}9^2 \\approx 96\\,600$ J", "À 100 km/h, l'énergie est 4 fois plus grande ≈ 386 000 J : il faut 4 fois plus de distance de freinage."]
      - astuce:
          texte: "Dans Ec = ½mv², la vitesse est au carré : rouler 2 fois plus vite donne 4 fois plus d'énergie au moment d'un choc."
          qui: zero
      - retiens: "$E_c = \\frac12 m v^2$ ; $E_p = mgh$ ; $E_m = E_c + E_p$ conservée sans frottement. Vitesse × 2 ⇒ Ec × 4."
    exercices:
      - type: nombre
        vars: { m: [2, 10, 50, 80], v: [2, 3, 5, 10] }
        enonce: "Calcule l'énergie cinétique d'un objet de {{m}} kg à {{v}} m/s."
        reponse: "0.5*m*v^2"
        unite: J
        correction: "Ec = ½ × {{m}} × {{v}}² = {{0.5*m*v^2}} J."
      - type: nombre
        vars: { m: [1, 2, 5, 40], h: [2, 5, 10, 20] }
        enonce: "Calcule l'énergie potentielle de pesanteur d'un objet de {{m}} kg à {{h}} m de hauteur (g = 9,8 N/kg)."
        reponse: "m*9.8*h"
        tolerance: 0.01
        unite: J
        correction: "Ep = {{m}} × 9,8 × {{h}} = {{m*9.8*h}} J."
      - type: nombre
        vars: { k: [2, 3, 4] }
        enonce: "Si la vitesse d'une voiture est multipliée par {{k}}, par combien est multipliée son énergie cinétique ?"
        reponse: "k^2"
        correction: "Ec dépend du carré de la vitesse : {{k}}² = {{k^2}}."

  - id: deuxieme-loi
    titre: "La deuxième loi de Newton"
    objectif: J'utilise F = m × a.
    mots: [accélération, force résultante, Newton]
    etapes:
      - dialogue:
          - zero: "Pourquoi c'est plus dur de pousser un caddie plein qu'un caddie vide ?"
          - mia: "Plus la masse est grande, plus il faut de force pour accélérer. C'est F = m × a !"
      - a_quoi_ca_sert: "F = m × a sert à calculer la poussée d'une fusée, le freinage d'une voiture ou la force d'un coup de pied dans un ballon."
      - texte: |
          L'**accélération** a (en m/s²) mesure la variation de vitesse par seconde.
          **2ᵉ loi de Newton** : $\vec F = m \vec a$ — la somme des forces est égale à la masse fois l'accélération. Une force donnée accélère **moins** un objet **plus lourd**.
      - exemple:
          titre: Pousser un chariot
          enonce: "On exerce une force résultante de 30 N sur un chariot de 15 kg."
          etapes: ["$a = F / m = 30 / 15 = 2$ m/s²", "Sa vitesse augmente de 2 m/s chaque seconde."]
      - astuce:
          texte: "Plus c'est lourd, plus il faut de force pour accélérer pareil : pousser un caddie vide ou plein, tu sens la différence."
          qui: neo
      - retiens: "$F = m \\times a$ (N = kg × m/s²). Même force, objet plus lourd ⇒ moins d'accélération."
    exercices:
      - type: nombre
        vars: { m: [2, 5, 10, 1000], a: [2, 3, 0.5] }
        enonce: "Quelle force faut-il pour donner une accélération de {{a}} m/s² à une masse de {{m}} kg ?"
        reponse: "m*a"
        unite: N
        correction: "F = m × a = {{m}} × {{a}} = {{m*a}} N."
      - type: nombre
        vars: { F: [10, 20, 60, 100], m: [5, 10, 20] }
        enonce: "Une force de {{F}} N agit sur une masse de {{m}} kg. Accélération ?"
        reponse: "F/m"
        tolerance: 0.01
        unite: "m/s²"
        correction: "a = F / m = {{F}} / {{m}} = {{F/m}} m/s²."
      - type: vf
        vars: { "t":[["Avec la même force, un camion accélère moins qu'une voiture.",true,"Vrai : sa masse est plus grande."],["Une accélération de 0 m/s² signifie que l'objet est forcément immobile.",false,"Faux : à vitesse constante, a = 0, et l'objet peut très bien se déplacer."],["Le newton est égal à un kg·m/s².",true,"Vrai : c'est ce que dit F = m × a."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: chute-libre
    titre: "La chute libre"
    objectif: Je calcule la vitesse et la hauteur de chute sans frottement.
    mots: [chute libre, accélération de la pesanteur]
    etapes:
      - dialogue:
          - zero: "Une plume et un marteau, qui tombe en premier ?"
          - neo: "Sur Terre, le marteau, à cause de l'air. Sur la Lune… surprise !"
      - a_quoi_ca_sert: "La chute libre sert à calculer la trajectoire d'un plongeur, d'un parachutiste avant ouverture ou d'un objet lâché d'un drone."
      - texte: |
          En **chute libre** (seul le poids agit, pas de frottement de l'air), tous les objets ont la **même accélération** g ≈ 9,8 m/s², quelle que soit leur masse.
          Lâché sans vitesse : $v = g\,t$ et la distance parcourue $h = \dfrac{1}{2} g t^2$.
          En 1971, l'astronaute David Scott a lâché un marteau et une plume sur la Lune (sans air) : ils sont arrivés ensemble.
      - astuce:
          texte: "Sans frottement, tous les objets tombent de la même façon, quelle que soit leur masse. Sur la Lune, un marteau et une plume tombent ensemble (l'expérience a été faite par Apollo 15) !"
          qui: mia
      - retiens: "Chute libre : même accélération g pour tous. $v = gt$, $h = \\frac12 g t^2$ (départ sans vitesse)."
    exercices:
      - type: nombre
        vars: { t: [1, 2, 3] }
        enonce: "Une bille est lâchée sans vitesse (chute libre, g = 9,8 m/s²). Quelle est sa vitesse après {{t}} s ?"
        reponse: "9.8*t"
        tolerance: 0.01
        unite: m/s
        correction: "v = g × t = 9,8 × {{t}} = {{9.8*t}} m/s."
      - type: nombre
        vars: { t: [1, 2, 3] }
        enonce: "Quelle distance a-t-elle parcourue après {{t}} s ? ($h = \\frac12 g t^2$)"
        reponse: "0.5*9.8*t^2"
        tolerance: 0.01
        unite: m
        correction: "h = 0,5 × 9,8 × {{t}}² = {{0.5*9.8*t^2}} m."
      - type: qcm
        vars: { t: [["Dans le vide, une boule de pétanque et une bille lâchées ensemble…", "arrivent en même temps", "la boule arrive avant", "la bille arrive avant"], ["Pourquoi, dans l'air, une plume tombe-t-elle lentement ?", "les frottements de l'air la freinent beaucoup", "elle n'a pas de poids", "la Terre l'attire moins"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"

  - id: gravitation
    titre: "La gravitation universelle"
    objectif: J'utilise la loi de la gravitation de Newton.
    mots: [gravitation, attraction, orbite, constante de gravitation]
    etapes:
      - dialogue:
          - zero: "Pourquoi la Lune ne tombe pas sur la Terre ?"
          - mia: "Elle tombe… mais elle va si vite de côté qu'elle tourne autour ! Newton l'a compris."
      - a_quoi_ca_sert: "La gravitation explique les marées, les orbites des satellites et la trajectoire des sondes spatiales."
      - texte: |
          Newton a compris que la force qui fait tomber la pomme est **la même** que celle qui retient la Lune autour de la Terre : la **gravitation**. Deux corps de masses $m_A$ et $m_B$, séparés par une distance d, s'attirent :
          $$F = G\,\frac{m_A\, m_B}{d^2}$$ avec $G \approx 6{,}67 \times 10^{-11}$ N·m²/kg².
          Si la distance **double**, la force est **divisée par 4**. Un satellite en orbite « tombe » en permanence autour de la Terre, mais va assez vite de côté pour ne jamais la toucher.
      - astuce:
          texte: "Masses plus grandes = attraction plus forte. Distance doublée = attraction divisée par 4 (car la distance est au carré)."
          qui: zero
      - retiens: "$F = G m_A m_B / d^2$. Distance × 2 ⇒ force ÷ 4. La même force fait tomber la pomme et tourner la Lune."
    exercices:
      - type: nombre
        vars: { k: [2, 3, 4, 10] }
        enonce: "Si la distance entre deux astres est multipliée par {{k}}, par combien la force de gravitation est-elle divisée ?"
        reponse: "k^2"
        correction: "La force dépend de 1/d² : divisée par {{k}}² = {{k^2}}."
      - type: nombre
        vars: { k: [2, 3, 5] }
        enonce: "Si la masse de l'un des deux corps est multipliée par {{k}}, par combien la force est-elle multipliée ?"
        reponse: "k"
        correction: "La force est proportionnelle à chaque masse : × {{k}}."
      - type: vf
        vars: { "t":[["Un satellite en orbite est en chute permanente autour de la Terre.",true,"Vrai : il tombe, mais va assez vite de côté pour ne jamais toucher le sol."],["Il n'y a pas de gravitation dans la Station spatiale internationale.",false,"Faux : elle y vaut environ 90 % de celle au sol ; les astronautes flottent parce qu'ils tombent avec la station."],["La Terre attire la Lune et la Lune attire la Terre avec la même force.",true,"Vrai : c'est le principe des actions réciproques."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

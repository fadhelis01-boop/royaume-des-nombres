id: de-carnet-de-croquis
matiere: dessin
titre: Le Carnet de Croquis
sous_titre: Observer, s'entraîner chaque jour, le matériel, garder ses progrès, apprendre des maîtres
emoji: 📒
couleur: "#7a34ad"
cycle: astuces
age: 7 ans et +
niveau: Tous niveaux
ordre: 600
version: 1.0.0
intro:
  - zero: "Moi, je ne sais pas dessiner. Je suis nul !"
  - mia: "Personne ne naît en sachant dessiner, Zéro. Le dessin s'apprend, exactement comme la lecture. Et on va le prouver."

lecons:
  - id: tout-le-monde-peut-dessiner
    titre: "Tout le monde peut apprendre à dessiner"
    objectif: Je sais que le dessin s'apprend par l'observation et l'entraînement.
    mots: [observer, croquis, entraînement]
    etapes:
      - dialogue:
          - zero: "Moi, je ne sais pas dessiner. Je fais des patates."
          - mia: "Tout le monde peut apprendre ! Le dessin, c'est de l'observation et de l'entraînement."
      - a_quoi_ca_sert: "Le dessin sert à communiquer une idée, à observer, à se détendre. Les architectes, les scientifiques, les ingénieurs et les créateurs de jeux vidéo dessinent tous."
      - texte: |
          Dessiner, c'est d'abord **bien regarder**. Les dessinateurs passent plus de temps à **observer** qu'à tracer.
          Les secrets de Lya :
          1. **Décomposer** : tout objet compliqué est un assemblage de **formes simples** (cercles, ovales, carrés, triangles).
          2. **Commencer léger** : on trace d'abord des traits de construction très légers, qu'on effacera.
          3. **Un petit croquis chaque jour** (5 minutes suffisent) vaut mieux qu'un grand dessin par mois.
          4. **On ne juge pas** : un dessin n'est pas « moche », c'est une étape. On compare seulement avec ses dessins d'avant.
      - astuce:
          texte: "Dessine un peu chaque jour et garde tous tes dessins, même ceux que tu trouves ratés : dans trois mois, tu verras tes progrès."
          qui: neo
      - retiens: "Observer, décomposer en formes simples, commencer léger, un petit croquis chaque jour, comparer avec soi-même."
    exercices:
      - type: qcm
        vars: { t: [["Quel est le premier secret pour bien dessiner ?", "bien observer", "avoir des crayons chers", "dessiner très vite"], ["Comment dessiner un objet compliqué ?", "le décomposer en formes simples", "commencer par les détails", "le décalquer obligatoirement"], ["Avec qui faut-il comparer ses dessins ?", "avec ses propres dessins d'avant", "avec ceux des autres", "avec ceux des musées"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Le dessin est un don : soit on l'a, soit on ne l'a pas.",false,"Faux : le dessin s'apprend avec de l'entraînement, comme la lecture."],["Les traits de construction se font légèrement.",true,"Vrai : on peut les effacer ou les recouvrir facilement."],["Dessiner 5 minutes par jour aide à progresser.",true,"Vrai : un peu chaque jour vaut mieux que beaucoup une fois."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: classer
        vars: { t: [["observer longtemps le modèle", "appuyer très fort dès le début", "faire un croquis chaque jour", "jeter son dessin parce qu'il n'est pas parfait"]] }
        enonce: "Bonne habitude ou mauvaise habitude ?"
        categories: ["bonne habitude", "à éviter"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "On garde tous ses dessins : ils montrent les progrès."

  - id: le-materiel
    titre: "Le matériel du dessinateur"
    objectif: Je choisis le bon outil selon ce que je veux faire.
    mots: [mine, HB, 2B, gomme, estompe, crayon de couleur]
    etapes:
      - dialogue:
          - zero: "Un crayon, c'est un crayon, non ?"
          - neo: "Pas du tout ! Il y en a des durs, des tendres, des secs, des gras… Choisissons le bon."
      - a_quoi_ca_sert: "Choisir le bon outil rend le dessin plus facile : on ne dessine pas un détail fin avec un gros feutre."
      - texte: |
          - Les **crayons à papier** ont des mines plus ou moins dures : **H** (dure, trait clair et fin), **HB** (moyenne, pour écrire et esquisser), **B, 2B, 4B…** (tendres, traits plus noirs, pour les ombres).
          - La **gomme** sert aussi à dessiner (pour faire des lumières dans les ombres) ; la **gomme mie de pain** s'utilise en tapotant.
          - L'**estompe** (ou un mouchoir) adoucit les ombres.
          - **Crayons de couleur**, **feutres**, **aquarelle**, **gouache** : chacun a son effet (transparent ou couvrant).
          - Sur tablette, on retrouve les mêmes outils en numérique.
      - astuce:
          texte: "Sur un crayon : H = dur et clair (pour les traits légers de construction), B = tendre et foncé (pour les ombres). HB est au milieu."
          qui: zero
      - retiens: "H = dur et clair, HB = moyen, B/2B = tendre et foncé. Gomme, estompe, couleurs : chaque outil a son effet."
    exercices:
      - type: qcm
        vars: { t: [["faire une ombre bien foncée", "un crayon 2B ou 4B", "un crayon H", "une règle"], ["faire un trait de construction léger", "un crayon H ou HB, sans appuyer", "un feutre noir", "un crayon 4B en appuyant"], ["adoucir une ombre", "une estompe ou un mouchoir", "un feutre", "une règle"]] }
        enonce: "Pour {{t_0}}, je prends…"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: ordre
        vars: { t: [["H", "HB", "2B", "4B"]] }
        enonce: "Range ces mines de la plus claire (dure) à la plus foncée (tendre)."
        items: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "H, HB, 2B, 4B."
      - type: vf
        vars: { "t":[["Une gomme peut servir à créer des lumières dans un dessin.",true,"Vrai : on « dessine » des reflets en gommant."],["Un crayon H fait des traits plus noirs qu'un crayon 2B.",false,"Faux : H est dur et clair ; 2B est tendre et plus noir."],["La gouache est une peinture couvrante.",true,"Vrai : elle cache ce qui est dessous."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: garder-ses-progres
    titre: "Garder ses progrès"
    objectif: Je compare mes dessins dans le temps pour voir mes progrès.
    mots: [galerie, progrès, date]
    etapes:
      - dialogue:
          - zero: "J'ai l'impression de ne pas progresser…"
          - mia: "Compare avec ton dessin d'il y a un mois. Tu vas être surpris !"
      - a_quoi_ca_sert: "Voir ses progrès donne envie de continuer : c'est vrai en dessin, en musique, en sport et à l'école."
      - texte: |
          Garde **tous** tes dessins, avec la **date**. Dans quelques semaines, redessine le même sujet et compare la version 1 et la version 5 : tu verras tes progrès !
          Dans l'application, ta **galerie** garde tes dessins (Studio de dessin → « Ranger dans ma galerie »).
      - dessin:
          titre: Mon premier autoportrait-formes (version 1)
          etapes:
            - consigne: "Dessine un grand ovale : c'est ta tête."
              couche: construction
              trace: "M50 50 m-22 0 a22 30 0 1 0 44 0 a22 30 0 1 0 -44 0"
            - consigne: "Trace une ligne horizontale légère à mi-hauteur : les yeux se placent dessus."
              couche: proportions
              trace: "M28 50 L72 50"
            - consigne: "Dessine les deux yeux sur cette ligne."
              trace: "M36 50 a4 2.5 0 1 0 8 0 a4 2.5 0 1 0 -8 0 M56 50 a4 2.5 0 1 0 8 0 a4 2.5 0 1 0 -8 0"
            - consigne: "Ajoute le nez et la bouche, puis tes cheveux comme tu les portes."
              couche: détails
              trace: "M48 62 L52 62 M42 70 Q50 75 58 70"
      - astuce:
          texte: "Date chaque dessin. Une fois par mois, redessine le même objet et compare avec l'ancien."
          qui: mia
      - retiens: "Garder et dater ses dessins ; redessiner le même sujet plus tard pour mesurer ses progrès."
    exercices:
      - type: qcm
        vars: { t: [["Pourquoi dater ses dessins ?", "pour pouvoir comparer et voir ses progrès", "pour les vendre", "ça ne sert à rien"], ["Où se placent les yeux sur un visage vu de face ?", "à peu près à mi-hauteur de la tête", "tout en haut du front", "juste au-dessus de la bouche"], ["Que faire d'un dessin raté ?", "le garder : il montre d'où je pars", "le déchirer", "le cacher pour toujours"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Sur un visage, les yeux sont souvent dessinés trop haut par les débutants.",true,"Vrai : les yeux sont à mi-hauteur de la tête."],["Un dessin raté ne sert à rien.",false,"Faux : il montre ce qu'on peut améliorer et sert à mesurer ses progrès."],["Redessiner le même sujet permet de voir ses progrès.",true,"Vrai : on compare l'ancien et le nouveau."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: ordre
        vars: { t: [["l'ovale de la tête", "la ligne des yeux à mi-hauteur", "les yeux", "le nez et la bouche", "les cheveux"]] }
        enonce: "Remets les étapes du visage dans l'ordre."
        items: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}", "{{t_4}}"]
        correction: "Construction, proportions, puis détails."

  - id: apprendre-des-maitres
    titre: "Apprendre en copiant les maîtres"
    objectif: Je sais que copier un artiste est une façon d'apprendre (en le disant).
    mots: [copie, inspiration, plagiat, musée]
    etapes:
      - dialogue:
          - zero: "Copier un dessin, c'est tricher ?"
          - neo: "Pas si tu le dis ! Les grands artistes ont tous appris en copiant les maîtres."
      - a_quoi_ca_sert: "Tous les grands artistes ont commencé par copier les maîtres : c'est une façon d'apprendre leurs secrets."
      - texte: |
          Pendant des siècles, les apprentis peintres ont appris en **copiant** les œuvres de leurs maîtres. Dans les musées, on voit encore des élèves copier des tableaux.
          Copier pour **apprendre**, c'est très bien… à condition de **dire** qu'on s'est inspiré de quelqu'un. Présenter le dessin d'un autre comme le sien, c'est du **plagiat**.
          Le mieux : s'inspirer de **plusieurs** artistes, puis mélanger avec ses propres idées : c'est comme ça qu'on trouve **son style**.
      - astuce:
          texte: "Quand tu copies une œuvre, écris toujours « d'après » et le nom de l'artiste : copier pour apprendre, oui ; faire passer pour sien, jamais."
          qui: neo
      - retiens: "Copier pour apprendre : oui, en citant l'artiste. Présenter le travail d'un autre comme le sien : plagiat. Plusieurs inspirations → son propre style."
    exercices:
      - type: vf
        vars: { "t":[["Les apprentis peintres apprenaient en copiant leurs maîtres.",true,"Vrai : c'était la méthode des ateliers de la Renaissance."],["On peut signer de son nom le dessin d'un autre.",false,"Faux : on écrit toujours « d'après » et le nom de l'artiste."],["S'inspirer de plusieurs artistes aide à trouver son style.",true,"Vrai : on mélange ce qu'on aime chez chacun."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: qcm
        vars: { t: [["Qu'est-ce que le plagiat ?", "présenter le travail d'un autre comme le sien", "s'entraîner en copiant", "dessiner dans un musée"], ["Comment trouver son propre style ?", "s'inspirer de plusieurs artistes et y mêler ses idées", "copier toujours le même dessinateur", "ne jamais regarder d'autres dessins"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [["copier une œuvre pour s'entraîner en écrivant « d'après Van Gogh »", "signer de son nom le dessin d'un camarade", "s'inspirer de trois illustrateurs différents", "recopier un dessin trouvé en ligne et dire qu'on l'a inventé"]] }
        enonce: "Pratique honnête ou plagiat ?"
        categories: ["honnête", "plagiat"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "On peut copier pour apprendre, à condition de le dire."

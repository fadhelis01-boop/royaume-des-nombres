id: archipel-des-vecteurs
titre: L'Archipel des Vecteurs
sous_titre: Vecteurs, coordonnées, produit scalaire, droites, cercles et espace
emoji: 🧭
couleur: "#00796b"
cycle: maitres
age: 15-18 ans
niveau: 2nde – Terminale
ordre: 25
prerequis: [chateau-de-la-geometrie, labyrinthe-des-fonctions]
version: 1.0.0
intro:
  - neo: "Pour naviguer d'île en île dans l'Archipel, il faut une direction, un sens et une longueur : un VECTEUR !"
  - mia: "Les vecteurs servent à décrire les déplacements, les forces, les vitesses… et à faire de la géométrie avec des calculs."
  - zero: "Moi je suis le vecteur nul. Je ne vais nulle part. Mais je le fais très bien."

lecons:
  - id: vecteurs
    titre: Les vecteurs et la relation de Chasles
    objectif: Je comprends un vecteur comme un déplacement et j'additionne des vecteurs.
    mots: [vecteur, translation, Chasles]
    etapes:
      - dialogue:
          - mia: "Aller de A à B, puis de B à C… c'est comme aller directement de A à C !"
          - neo: "C'est la relation de Chasles : $\\overrightarrow{AB} + \\overrightarrow{BC} = \\overrightarrow{AC}$."
      - texte: |
          Un **vecteur** $\overrightarrow{AB}$ représente le **déplacement** de A vers B : une **direction**, un **sens** et une **longueur** (sa **norme**, notée $\|\overrightarrow{AB}\|$).

          - Deux vecteurs sont **égaux** s'ils ont même direction, même sens, même longueur (ABDC est alors un parallélogramme).
          - **Chasles** : $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$.
          - **Vecteur nul** : $\overrightarrow{AA} = \vec 0$. **Opposé** : $\overrightarrow{BA} = -\overrightarrow{AB}$.
      - visuel:
          type: graphe
          xmin: -1
          xmax: 7
          ymin: -1
          ymax: 5
          pas_x: 1
          pas_y: 1
          points: [{ x: 0, y: 0, label: "A" }, { x: 4, y: 1, label: "B" }, { x: 5, y: 4, label: "C" }]
          segments: [{ x1: 0, y1: 0, x2: 4, y2: 1 }, { x1: 4, y1: 1, x2: 5, y2: 4 }, { x1: 0, y1: 0, x2: 5, y2: 4, pointille: true, couleur: "var(--c-violet)" }]
      - a_quoi_ca_sert: "La navigation (cap et distance), la physique (forces, vitesses), les jeux vidéo (déplacements des personnages), la robotique, l'animation 3D…"
      - question:
          type: qcm
          enonce: "Simplifie $\\overrightarrow{AB} + \\overrightarrow{BC} + \\overrightarrow{CD}$."
          choix: ["$\\overrightarrow{AD}$", "$\\overrightarrow{DA}$", "$\\overrightarrow{AC}$", "$\\vec 0$"]
          correction: "Chasles, deux fois : $\\overrightarrow{AD}$."
    exercices:
      - type: qcm
        enonce: "$\\overrightarrow{AB} + \\overrightarrow{BA} = ?$"
        choix: ["$\\vec 0$", "$2\\overrightarrow{AB}$", "$\\overrightarrow{AA} + \\overrightarrow{BB} + \\overrightarrow{AB}$", "$\\overrightarrow{BB}$ n'existe pas"]
        correction: "Aller de A à B puis revenir : on ne s'est pas déplacé. $\\vec 0$."
      - type: qcm
        enonce: "Si $\\overrightarrow{AB} = \\overrightarrow{DC}$, alors ABCD est…"
        choix: ["un parallélogramme", "un trapèze quelconque", "un triangle", "un cercle"]
        correction: "Deux côtés opposés égaux et parallèles, dans le même sens : ABCD est un parallélogramme."
      - type: qcm
        enonce: "$\\overrightarrow{MA} + \\overrightarrow{AN} = ?$"
        choix: ["$\\overrightarrow{MN}$", "$\\overrightarrow{NM}$", "$\\overrightarrow{AM}$", "$\\overrightarrow{MA}$"]
        correction: "Chasles : de M à A puis de A à N = de M à N."

  - id: coordonnees-vecteurs
    titre: Coordonnées de vecteurs et colinéarité
    objectif: Je calcule les coordonnées d'un vecteur, sa norme, et je teste la colinéarité.
    mots: [coordonnées, norme, colinéaire]
    etapes:
      - dialogue:
          - neo: "De A(1 ; 2) à B(4 ; 6) : j'avance de 3 et je monte de 4. Le vecteur a pour coordonnées (3 ; 4)."
          - mia: "Et sa longueur ? Pythagore ! √(3² + 4²) = 5."
      - texte: |
          - $\overrightarrow{AB}\,(x_B - x_A \;;\; y_B - y_A)$
          - **Norme** : $\|\vec u\| = \sqrt{x^2 + y^2}$
          - **Milieu** de [AB] : $\left(\dfrac{x_A + x_B}{2} \;;\; \dfrac{y_A + y_B}{2}\right)$
          - $\vec u(x ; y)$ et $\vec v(x' ; y')$ sont **colinéaires** (même direction) si $xy' - x'y = 0$ (le **déterminant** est nul).
      - a_quoi_ca_sert: "Calculer des distances sur une carte, vérifier que trois points sont alignés, programmer les déplacements dans un jeu vidéo…"
      - question:
          type: champs
          vars: { xa: "-4..4", ya: "-4..4", xb: "-4..6", yb: "-4..6" }
          enonce: "A({{nb(xa)}} ; {{nb(ya)}}) et B({{nb(xb)}} ; {{nb(yb)}}). Coordonnées de $\\overrightarrow{AB}$ ?"
          champs:
            - { avant: "(", reponse: "xb-xa", apres: ";" }
            - { reponse: "yb-ya", apres: ")" }
          correction: "$({{nb(xb)}} - ({{nb(xa)}}) \\;;\\; {{nb(yb)}} - ({{nb(ya)}})) = ({{nb(xb-xa)}} ; {{nb(yb-ya)}})$"
    exercices:
      - type: nombre
        vars: { t: [[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 6, 10]] }
        enonce: "Norme du vecteur $\\vec u({{t_0}} ; {{t_1}})$ ?"
        reponse: "t_2"
        correction: "$\\sqrt{ {{t_0}}^2 + {{t_1}}^2 } = {{t_2}}$"
      - type: champs
        vars: { xa: "-6..6", ya: "-6..6", xb: "-6..6", yb: "-6..6" }
        si: "(xa + xb) % 2 == 0 && (ya + yb) % 2 == 0"
        enonce: "Milieu de [AB] avec A({{nb(xa)}} ; {{nb(ya)}}) et B({{nb(xb)}} ; {{nb(yb)}}) ?"
        champs:
          - { avant: "(", reponse: "(xa+xb)/2", apres: ";" }
          - { reponse: "(ya+yb)/2", apres: ")" }
        correction: "$({{nb((xa+xb)/2)}} ; {{nb((ya+yb)/2)}})$"
      - type: vf
        vars: { x: "1..5", y: "1..5", k: "2..4", t: [0, 1] }
        enonce: "$\\vec u({{x}} ; {{y}})$ et $\\vec v({{k*x}} ; {{k*y+t}})$ sont-ils colinéaires ?"
        reponse: "t == 0"
        correction: "Déterminant : ${{x}} \\times {{k*y+t}} - {{k*x}} \\times {{y}} = {{x*(k*y+t)-k*x*y}}$ : {{si(t==0,'nul, colinéaires.','non nul, pas colinéaires.')}}"
      - type: nombre
        vars: { xa: "-5..5", ya: "-5..5", dx: [3, 6, 5], dy: [4, 8, 12] }
        si: "(dx == 3 && dy == 4) || (dx == 6 && dy == 8) || (dx == 5 && dy == 12)"
        enonce: "Distance AB avec A({{nb(xa)}} ; {{nb(ya)}}) et B({{nb(xa+dx)}} ; {{nb(ya+dy)}}) ?"
        reponse: "sqrt(dx*dx+dy*dy)"
        correction: "$\\sqrt{ {{dx}}^2 + {{dy}}^2 } = {{sqrt(dx*dx+dy*dy)}}$"

  - id: produit-scalaire
    titre: Le produit scalaire
    objectif: Je calcule un produit scalaire et je l'utilise pour démontrer une orthogonalité.
    mots: [produit scalaire, orthogonal]
    etapes:
      - dialogue:
          - mia: "Comment savoir si deux vecteurs sont perpendiculaires, juste avec leurs coordonnées ?"
          - neo: "Le produit scalaire ! S'il vaut 0, ils sont orthogonaux."
      - texte: |
          Pour $\vec u(x ; y)$ et $\vec v(x' ; y')$ :
          $$\vec u \cdot \vec v = xx' + yy' = \|\vec u\| \times \|\vec v\| \times \cos(\vec u, \vec v)$$
          - $\vec u \cdot \vec v = 0 \iff \vec u \perp \vec v$ (orthogonaux).
          - $\vec u \cdot \vec u = \|\vec u\|^2$.
      - a_quoi_ca_sert: "Le travail d'une force en physique, l'éclairage en 3D (angle entre la lumière et une surface), la reconnaissance d'images, les moteurs de recherche (similarité de documents)…"
      - question:
          type: nombre
          vars: { a: "-5..5", b: "-5..5", c: "-5..5", d: "-5..5" }
          enonce: "$\\vec u({{nb(a)}} ; {{nb(b)}}) \\cdot \\vec v({{nb(c)}} ; {{nb(d)}}) = ?$"
          reponse: "a*c+b*d"
          correction: "${{nb(a)}} \\times ({{nb(c)}}) + {{nb(b)}} \\times ({{nb(d)}}) = {{nb(a*c+b*d)}}$"
    exercices:
      - type: nombre
        vars: { a: "-6..6", b: "-6..6", c: "-6..6", d: "-6..6" }
        enonce: "$\\vec u({{nb(a)}} ; {{nb(b)}}) \\cdot \\vec v({{nb(c)}} ; {{nb(d)}})$ ?"
        reponse: "a*c+b*d"
        correction: "{{nb(a*c+b*d)}}"
      - type: nombre
        vars: { a: "1..6", b: "1..6", k: "1..3" }
        enonce: "Pour quelle valeur de $m$ les vecteurs $\\vec u({{a}} ; {{b}})$ et $\\vec v({{nb(-b*k)}} ; m)$ sont-ils orthogonaux ?"
        reponse: "a*k"
        correction: "${{a}} \\times ({{nb(-b*k)}}) + {{b}}m = 0 \\iff m = {{a*k}}$"
      - type: nombre
        vars: { u: [2, 3, 4], v: [2, 5, 6], ang: [0, 60, 90, 180] }
        enonce: "$\\|\\vec u\\| = {{u}}$, $\\|\\vec v\\| = {{v}}$, angle = {{ang}}°. Produit scalaire ?"
        reponse: "round(u*v*cosd(ang), 6)"
        correction: "${{u}} \\times {{v}} \\times \\cos({{ang}}°) = {{nb(round(u*v*cosd(ang),6))}}$"

  - id: equations-droites
    titre: Équations de droites
    objectif: J'écris l'équation réduite d'une droite passant par deux points.
    mots: [équation de droite, pente]
    etapes:
      - dialogue:
          - neo: "Une droite non verticale a une équation y = mx + p, comme une fonction affine !"
          - mia: "m est la pente : (yB − yA) / (xB − xA)."
      - texte: |
          - **Équation réduite** : $y = mx + p$ (droite non verticale) ; droite verticale : $x = c$.
          - **Pente** passant par A et B : $m = \dfrac{y_B - y_A}{x_B - x_A}$, puis $p = y_A - m\,x_A$.
          - Deux droites sont **parallèles** si elles ont la même pente.
          - **Équation cartésienne** : $ax + by + c = 0$, de vecteur directeur $\vec u(-b ; a)$.
      - a_quoi_ca_sert: "Les trajectoires rectilignes, la programmation graphique, la régression linéaire en statistiques (la « droite qui passe au plus près des points »)…"
      - question:
          type: nombre
          vars: { xa: "-4..2", m: "-3..3", p: "-5..5", dx: "1..4" }
          si: "m != 0"
          enonce: "Pente de la droite passant par A({{nb(xa)}} ; {{nb(m*xa+p)}}) et B({{nb(xa+dx)}} ; {{nb(m*(xa+dx)+p)}}) ?"
          reponse: "m"
          correction: "$\\frac{ {{nb(m*(xa+dx)+p)}} - ({{nb(m*xa+p)}}) }{ {{dx}} } = {{nb(m)}}$"
    exercices:
      - type: expression
        vars: { xa: "-3..2", m: "-3..4", p: "-6..6", dx: "1..3" }
        si: "m != 0"
        enonce: "Équation réduite de la droite (AB) avec A({{nb(xa)}} ; {{nb(m*xa+p)}}) et B({{nb(xa+dx)}} ; {{nb(m*(xa+dx)+p)}}) : $y = \\;?$"
        reponse: "{{m}}x+({{p}})"
        variables: [x]
        correction: "$m = {{nb(m)}}$, $p = {{nb(p)}}$ : $y = {{nb(m)}}x + ({{nb(p)}})$"
      - type: qcm
        vars: { m: "-4..4", p: "-5..5", q: "-5..5" }
        si: "p != q && m != 0"
        enonce: "Les droites $y = {{nb(m)}}x + ({{nb(p)}})$ et $y = {{nb(m)}}x + ({{nb(q)}})$ sont…"
        choix: ["parallèles", "sécantes", "confondues", "perpendiculaires"]
        correction: "Même pente {{nb(m)}}, ordonnées à l'origine différentes : parallèles."
      - type: vf
        vars: { m: "-3..3", p: "-5..5", x: "-3..3", t: [0, 1] }
        enonce: "Le point ({{nb(x)}} ; {{nb(m*x+p+t)}}) est-il sur la droite $y = {{nb(m)}}x + ({{nb(p)}})$ ?"
        reponse: "t == 0"
        correction: "${{nb(m)}} \\times ({{nb(x)}}) + ({{nb(p)}}) = {{nb(m*x+p)}}$ : {{si(t==0,'oui.','non.')}}"

  - id: cercles
    titre: Équations de cercles
    objectif: Je reconnais l'équation d'un cercle et j'en lis le centre et le rayon.
    mots: [cercle, équation]
    etapes:
      - dialogue:
          - mia: "Un cercle, c'est tous les points à la distance r du centre. En coordonnées, c'est Pythagore !"
      - texte: |
          Le cercle de centre $\Omega(a ; b)$ et de rayon $r$ a pour équation :
          $$(x - a)^2 + (y - b)^2 = r^2$$
          Exemple : $(x - 2)^2 + (y + 1)^2 = 9$ : centre $(2 ; -1)$, rayon $3$.
      - visuel:
          type: graphe
          xmin: -3
          xmax: 7
          ymin: -5
          ymax: 4
          pas_x: 1
          pas_y: 1
          fonctions: [{ f: "-1+sqrt(9-(x-2)^2)" }, { f: "-1-sqrt(9-(x-2)^2)" }]
          points: [{ x: 2, y: -1, label: "Ω" }]
      - a_quoi_ca_sert: "La localisation GPS (intersection de sphères autour des satellites), la zone de portée d'une antenne, le dessin assisté par ordinateur…"
      - question:
          type: champs
          vars: { a: "-5..5", b: "-5..5", r: "1..7" }
          enonce: "Cercle $(x - ({{nb(a)}}))^2 + (y - ({{nb(b)}}))^2 = {{r*r}}$ : centre et rayon ?"
          champs:
            - { avant: "Ω(", reponse: "a", apres: ";" }
            - { reponse: "b", apres: ")" }
            - { avant: "r =", reponse: "r" }
          correction: "Centre $({{nb(a)}} ; {{nb(b)}})$, rayon $\\sqrt{ {{r*r}} } = {{r}}$."
    exercices:
      - type: nombre
        vars: { a: "-5..5", b: "-5..5", r: "1..9" }
        enonce: "Rayon du cercle $(x - ({{nb(a)}}))^2 + (y - ({{nb(b)}}))^2 = {{r*r}}$ ?"
        reponse: "r"
        correction: "{{r}}"
      - type: vf
        vars: { r: [5, 10, 13], t: [0, 1] }
        enonce: "Le point ({{si(r==5,3,si(r==10,6,5))}} ; {{si(r==5,4,si(r==10,8,12)) + t}}) est-il sur le cercle de centre O et de rayon {{r}} ?"
        reponse: "t == 0"
        correction: "{{si(t==0,'Ses coordonnées vérifient x² + y² = ' + texte(r*r) + ' : oui.','x² + y² ≠ ' + texte(r*r) + ' : non.')}}"

      - type: champs
        vars: { a: "-4..4", b: "-4..4", r: "1..6" }
        si: "a != 0 && b != 0"
        enonce: "Le cercle d'équation $x^2 + y^2 + ({{nb(-2*a)}})x + ({{nb(-2*b)}})y + ({{nb(a*a+b*b-r*r)}}) = 0$ a pour centre…"
        champs:
          - { avant: "Ω(", reponse: "a", apres: ";" }
          - { reponse: "b", apres: ")" }
        indice: "Complète les carrés : $x^2 - 2ax = (x - a)^2 - a^2$."
        correction: "$(x - ({{nb(a)}}))^2 + (y - ({{nb(b)}}))^2 = {{r*r}}$ : centre $({{nb(a)}} ; {{nb(b)}})$, rayon {{r}}."

  - id: espace
    titre: Géométrie dans l'espace
    objectif: Je repère des points dans l'espace et je calcule des distances en 3D.
    mots: [espace, repère 3D]
    etapes:
      - dialogue:
          - neo: "Dans l'espace, il faut trois coordonnées : x, y… et z pour la hauteur !"
          - mia: "Et la distance ? Pythagore en 3D : √(x² + y² + z²)."
      - texte: |
          Un point de l'espace : $M(x ; y ; z)$. Un vecteur : $\vec u(a ; b ; c)$.
          $$AB = \sqrt{(x_B - x_A)^2 + (y_B - y_A)^2 + (z_B - z_A)^2}$$
          **Diagonale d'un pavé** de dimensions $L, \ell, h$ : $\sqrt{L^2 + \ell^2 + h^2}$.
      - visuel:
          type: solide
          forme: pave
      - a_quoi_ca_sert: "Les jeux vidéo et le cinéma d'animation 3D, l'architecture, les drones, l'imagerie médicale (scanner, IRM)…"
      - question:
          type: nombre
          vars: { t: [[1, 2, 2, 3], [2, 3, 6, 7], [1, 4, 8, 9], [2, 6, 9, 11]] }
          enonce: "Longueur de la diagonale d'un pavé de {{t_0}} × {{t_1}} × {{t_2}} ?"
          reponse: "t_3"
          correction: "$\\sqrt{ {{t_0}}^2 + {{t_1}}^2 + {{t_2}}^2 } = \\sqrt{ {{t_0^2+t_1^2+t_2^2}} } = {{t_3}}$"
    exercices:
      - type: nombre
        vars: { c: "2..9" }
        enonce: "Diagonale d'un cube de côté {{c}} (au centième) ?"
        reponse: "round(c*sqrt(3), 2)"
        tolerance: 0.011
        correction: "$\\sqrt{3 \\times {{c}}^2} = {{c}}\\sqrt{3} \\approx {{nb(round(c*sqrt(3),2))}}$"
      - type: nombre
        vars: { t: [[1, 2, 2, 3], [2, 3, 6, 7], [4, 4, 7, 9]], x: "-3..3", y: "-3..3", z: "-3..3" }
        enonce: "Distance entre A({{nb(x)}} ; {{nb(y)}} ; {{nb(z)}}) et B({{nb(x+t_0)}} ; {{nb(y+t_1)}} ; {{nb(z+t_2)}}) ?"
        reponse: "t_3"
        correction: "$\\sqrt{ {{t_0}}^2 + {{t_1}}^2 + {{t_2}}^2 } = {{t_3}}$"
      - type: champs
        vars: { xa: "-6..6", ya: "-6..6", za: "-6..6", xb: "-6..6", yb: "-6..6", zb: "-6..6" }
        si: "(xa+xb) % 2 == 0 && (ya+yb) % 2 == 0 && (za+zb) % 2 == 0"
        enonce: "Milieu de [AB] avec A({{nb(xa)}} ; {{nb(ya)}} ; {{nb(za)}}) et B({{nb(xb)}} ; {{nb(yb)}} ; {{nb(zb)}}) ?"
        champs:
          - { avant: "(", reponse: "(xa+xb)/2", apres: ";" }
          - { reponse: "(ya+yb)/2", apres: ";" }
          - { reponse: "(za+zb)/2", apres: ")" }
        correction: "$({{nb((xa+xb)/2)}} ; {{nb((ya+yb)/2)}} ; {{nb((za+zb)/2)}})$"

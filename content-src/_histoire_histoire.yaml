# L'histoire de la planète Histoire-géographie et EMC : le Forum des Mémoires (audit « 13-15 ans »).
prologue:
  - narrateur: "Au cœur de la Galaxie se dresse le Forum des Mémoires. Ses murs racontaient l'histoire des peuples, ses cartes montraient le monde, ses tribunes accueillaient les citoyens."
  - narrateur: "Le Grand Neutre y a soufflé un oubli gris : les dates s'effacent, les cartes se vident, les mots « liberté » et « égalité » pâlissent sur les frontons."
  - zero-surprise: "Si on oublie tout, on risque de refaire les mêmes erreurs, non ?"
  - neo: "Exactement. Comprendre le passé et le monde, c'est se donner les moyens de choisir son avenir."
arcs:
  - id: histoire-arc-1
    titre: "Livre I — La frise retrouvée"
    sous_titre: "Les guerres mondiales, la République, la France et l'Europe"
    final: hg-forum-du-brevet
    fin:
      - narrateur: "Les dates reviennent sur la frise, les cartes se colorent, la devise brille à nouveau au fronton du Forum."
      - mia: "Tu connais les repères du brevet. Garde-les : ce sont aussi ceux d'un citoyen."
  - id: histoire-arc-2
    titre: "Livre II — La Galerie des Siècles"
    sous_titre: "Révolution, industrie, République, guerre froide, décolonisation, mondialisation"
    final: hg-galerie-des-siecles
    fin:
      - narrateur: "Les tableaux de la Galerie reprennent leurs couleurs, de 1789 à aujourd'hui."
      - neo: "Tu relies maintenant les causes et les conséquences : c'est ça, comprendre l'histoire."
  - id: histoire-arc-3
    titre: "Livre III — Le Monde en débat"
    sous_titre: "Spécialités HGGSP et SES : puissances, frontières, mémoires, marchés, inégalités"
    final: hg-marche-des-societes
    fin:
      - narrateur: "Du Carrefour au Marché, le Forum entier résonne de débats argumentés. L'Oubli Gris n'a plus prise sur personne."
      - neo: "Tu sais maintenant lire le monde avec plusieurs regards : c'est ça, être un citoyen éclairé."
chapitres:
  hg-forum-du-brevet:
    titre: "Le Forum du Brevet"
    objet: "la page de la frise"
    avant:
      - narrateur: "Sur la grande frise du Forum, il ne reste que des cases vides : le brouillard a tout effacé, de 1914 à aujourd'hui."
      - neo: "Remettons chaque date, chaque lieu, chaque valeur à sa place."
    apres:
      - narrateur: "La frise est complète. Sur le fronton, trois mots brillent de nouveau : Liberté, Égalité, Fraternité."
  hg-galerie-des-siecles:
    titre: "La Galerie des Siècles"
    objet: "la page de la frise"
    avant:
      - narrateur: "Dans la Galerie, les tableaux ont pâli : on ne distingue plus la Révolution de la guerre froide."
      - mia: "Chaque salle demande d'expliquer, pas seulement de dater."
    apres:
      - narrateur: "Salle après salle, les siècles se rallument. La Galerie raconte de nouveau l'histoire du monde."

  hg-carrefour-des-puissances:
    titre: "Le Carrefour des Puissances"
    objet: "la page de la frise"
    avant:
      - narrateur: "Au Carrefour, les panneaux indicateurs ont perdu leurs flèches : démocratie, puissance, frontières, mémoire, plus rien ne mène nulle part."
      - neo: "Chaque rue est une grande question du monde. Pour la rouvrir, il faut définir, comparer et argumenter."
    apres:
      - narrateur: "Les sept rues s'illuminent. Au centre du Carrefour, une carte du monde se redessine, plus nette qu'avant."
  hg-marche-des-societes:
    titre: "Le Marché des Sociétés"
    objet: "la page de la frise"
    avant:
      - narrateur: "Sur la place du Marché, l'Oubli a brouillé les étiquettes : plus de prix, plus de chiffres, plus personne ne sait d'où il vient."
      - mia: "Économie, sociologie, science politique : trois lunettes pour comprendre la société. Mettons-les toutes."
    apres:
      - narrateur: "Les étals se rallument, les graphiques reprennent leurs couleurs. Le Marché bruisse de nouveau de débats."

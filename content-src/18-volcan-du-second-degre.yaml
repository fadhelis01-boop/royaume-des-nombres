id: volcan-du-second-degre
titre: Le Volcan du Second Degré
sous_titre: Paraboles, forme canonique, discriminant et optimisation
emoji: 🌋
couleur: "#d84315"
cycle: maitres
age: 15-17 ans
niveau: 2nde – 1ʳᵉ
ordre: 18
prerequis: [labyrinthe-des-fonctions]
version: 1.0.0
intro:
  - neo: "Au Volcan du Second Degré, les trajectoires dessinent des paraboles… comme la lave qui jaillit !"
  - mia: "Une balle lancée, un jet d'eau, l'antenne satellite : la parabole est partout."
  - zero: "Moi quand je saute, je fais une parabole. Une toute petite."

lecons:
  - id: fonction-carre-paraboles
    titre: La fonction carré et les paraboles
    objectif: Je connais l'allure de la courbe de x ↦ ax² + bx + c et le rôle du signe de a.
    mots: [parabole, sommet, polynôme du second degré]
    etapes:
      - dialogue:
          - mia: "La courbe de x² ressemble à un U. Elle est symétrique par rapport à l'axe vertical !"
          - neo: "Et avec −x², le U se retourne : c'est un ∩."
      - visuel:
          type: graphe
          xmin: -4
          xmax: 4
          ymin: -6
          ymax: 9
          fonctions: [{ f: "x^2", nom: "x²" }, { f: "-0.5*x^2+3", nom: "−0,5x² + 3" }]
      - texte: |
          Une fonction **polynôme du second degré** s'écrit $f(x) = ax^2 + bx + c$ avec $a \neq 0$. Sa courbe est une **parabole**.
          - $a > 0$ : la parabole est « tournée vers le haut » (∪) → elle a un **minimum** ;
          - $a < 0$ : « tournée vers le bas » (∩) → elle a un **maximum**.
          - Le **sommet** a pour abscisse $\alpha = -\dfrac{b}{2a}$ ; la parabole est symétrique par rapport à la droite $x = \alpha$.
      - a_quoi_ca_sert: "La trajectoire d'un ballon ou d'un projectile, les antennes paraboliques et les phares (qui concentrent ou renvoient les rayons), la forme des ponts suspendus…"
      - question:
          type: nombre
          vars: { a: [1, 2, -1, -2], s: "-4..4", c: "-5..5" }
          enonce: "Abscisse du sommet de la parabole $y = {{nb(a)}}x^2 + ({{nb(-2*a*s)}})x + ({{nb(c)}})$ ?"
          reponse: "s"
          correction: "$\\alpha = -\\frac{b}{2a} = -\\frac{ {{nb(-2*a*s)}} }{ {{nb(2*a)}} } = {{nb(s)}}$"
      - astuce:
          texte: "a > 0 : la parabole sourit (☺, ouverte vers le haut). a < 0 : elle fait la moue (ouverte vers le bas)."
          qui: zero
    exercices:
      - type: nombre
        vars: { a: [1, 2, 3, -1, -2, -3], s: "-5..5", c: "-9..9" }
        enonce: "Abscisse du sommet de $f(x) = {{nb(a)}}x^2 + ({{nb(-2*a*s)}})x + ({{nb(c)}})$ ?"
        reponse: "s"
        correction: "$-\\frac{ {{nb(-2*a*s)}} }{ {{nb(2*a)}} } = {{nb(s)}}$"
      - type: qcm
        vars: { a: "-5..5" }
        si: "a != 0"
        enonce: "La parabole $y = {{nb(a)}}x^2 + x - 7$ admet…"
        choix: ["{{si(a>0,'un minimum','un maximum')}}", "{{si(a>0,'un maximum','un minimum')}}", "ni minimum ni maximum"]
        correction: "a = {{nb(a)}} est {{si(a>0,'positif : ∪, minimum.','négatif : ∩, maximum.')}}"
      - type: nombre
        vars: { a: [1, -1, 2], s: "-3..3", k: "-5..5" }
        enonce: "Calcule l'ordonnée du sommet de $f(x) = {{nb(a)}}(x - ({{nb(s)}}))^2 + ({{nb(k)}})$."
        reponse: "k"
        correction: "Le sommet est $({{nb(s)}} ; {{nb(k)}})$ : l'ordonnée est {{nb(k)}}."

  - id: forme-canonique
    titre: La forme canonique
    objectif: J'écris un trinôme sous la forme a(x − α)² + β et je lis le sommet.
    mots: [forme canonique]
    etapes:
      - dialogue:
          - neo: "x² − 6x + 11… où est le sommet ? Astuce : x² − 6x, c'est le début de (x − 3)² !"
          - mia: "(x − 3)² = x² − 6x + 9. Donc x² − 6x + 11 = (x − 3)² + 2. Le sommet est (3 ; 2) !"
      - texte: |
          Tout trinôme s'écrit sous **forme canonique** :
          $$f(x) = a(x - \alpha)^2 + \beta \qquad \alpha = -\frac{b}{2a}, \quad \beta = f(\alpha)$$
          Le **sommet** de la parabole est le point $S(\alpha ; \beta)$.

          **Méthode** (« compléter le carré ») : $x^2 + 2px = (x + p)^2 - p^2$.
      - a_quoi_ca_sert: "Trouver immédiatement le maximum ou le minimum (hauteur max d'un tir, bénéfice maximal, coût minimal), et démontrer la formule du discriminant."
      - question:
          type: champs
          vars: { p: "1..6", q: "-5..9" }
          enonce: "Écris $x^2 - {{2*p}}x + {{nb(p*p+q)}}$ sous la forme $(x - \\alpha)^2 + \\beta$."
          champs:
            - { avant: "α =", reponse: "p" }
            - { avant: "β =", reponse: "q" }
          correction: "$(x - {{p}})^2 = x^2 - {{2*p}}x + {{p*p}}$, donc $f(x) = (x - {{p}})^2 + ({{nb(q)}})$."
      - astuce:
          texte: "Dans a(x − α)² + β, le sommet est (α ; β). Attention au signe : (x − 3)² donne α = 3, et (x + 3)² donne α = −3."
          qui: mia
    exercices:
      - type: champs
        vars: { p: "-6..6", q: "-9..9" }
        si: "p != 0"
        enonce: "Forme canonique de $x^2 + ({{nb(-2*p)}})x + ({{nb(p*p+q)}})$ : $(x - \\alpha)^2 + \\beta$."
        champs:
          - { avant: "α =", reponse: "p" }
          - { avant: "β =", reponse: "q" }
        correction: "$\\alpha = {{nb(p)}}$, $\\beta = {{nb(q)}}$."
      - type: champs
        vars: { a: [2, -1, 3, -2], p: "-4..4", q: "-6..6" }
        enonce: "Coordonnées du sommet de $f(x) = {{nb(a)}}x^2 + ({{nb(-2*a*p)}})x + ({{nb(a*p*p+q)}})$ ?"
        champs:
          - { avant: "S(", reponse: "p", apres: ";" }
          - { reponse: "q", apres: ")" }
        correction: "$\\alpha = {{nb(p)}}$ et $\\beta = f({{nb(p)}}) = {{nb(q)}}$."
      - type: expression
        vars: { p: "1..5", q: "1..9" }
        enonce: "Développe $(x - {{p}})^2 + {{q}}$."
        reponse: "x^2-{{2*p}}x+{{p*p+q}}"
        variables: [x]
        forme: developpee
        correction: "$x^2 - {{2*p}}x + {{p*p}} + {{q}} = x^2 - {{2*p}}x + {{p*p+q}}$"

  - id: discriminant
    titre: Le discriminant et les racines
    objectif: Je résous ax² + bx + c = 0 avec le discriminant Δ.
    mots: [discriminant, racine]
    etapes:
      - dialogue:
          - neo: "Résoudre x² − 5x + 6 = 0 ? Il existe une formule qui marche à TOUS les coups !"
          - mia: "On calcule Δ = b² − 4ac. Son signe dit tout : 2 solutions, 1 solution, ou aucune."
      - texte: |
          Pour $ax^2 + bx + c = 0$ ($a \neq 0$), on calcule le **discriminant** $\Delta = b^2 - 4ac$.
          - $\Delta > 0$ : **deux** solutions $x_1 = \dfrac{-b - \sqrt{\Delta}}{2a}$ et $x_2 = \dfrac{-b + \sqrt{\Delta}}{2a}$
          - $\Delta = 0$ : **une** solution $x_0 = -\dfrac{b}{2a}$
          - $\Delta < 0$ : **aucune** solution réelle.

          **Factorisation** (si $\Delta \ge 0$) : $ax^2 + bx + c = a(x - x_1)(x - x_2)$.
          **Somme et produit** : $x_1 + x_2 = -\frac{b}{a}$ et $x_1 x_2 = \frac{c}{a}$.
      - histoire:
          titre: Un peu d'histoire
          texte: "Des scribes babyloniens résolvaient déjà des problèmes du second degré il y a près de 4 000 ans. Au IXᵉ siècle, al-Khwârizmî expose des méthodes générales avec des figures géométriques (en « complétant le carré »). L'écriture moderne avec des lettres vient de François Viète et René Descartes (XVIᵉ-XVIIᵉ siècles)."
      - a_quoi_ca_sert: "Calculer quand un projectile touche le sol, les dimensions d'un terrain d'aire donnée, le seuil de rentabilité, l'optique, l'électricité…"
      - question:
          type: nombre
          vars: { a: [1, 2, -1], b: "-9..9", c: "-9..9" }
          enonce: "Calcule le discriminant de ${{nb(a)}}x^2 + ({{nb(b)}})x + ({{nb(c)}})$."
          reponse: "b*b - 4*a*c"
          correction: "$\\Delta = ({{nb(b)}})^2 - 4 \\times ({{nb(a)}}) \\times ({{nb(c)}}) = {{nb(b*b-4*a*c)}}$"
      - astuce:
          texte: "Δ = b² − 4ac. Δ > 0 : deux solutions ; Δ = 0 : une seule ; Δ < 0 : aucune solution réelle. Δ comme « Décide combien »."
          qui: neo
    exercices:
      - type: liste
        vars: { r: "-6..6", s: "-6..6" }
        si: "r != s"
        enonce: "Résous $x^2 + ({{nb(-(r+s))}})x + ({{nb(r*s)}}) = 0$ (sépare les solutions par « ; »)."
        reponse: ["r", "s"]
        correction: "$\\Delta = {{nb((r+s)^2-4*r*s)}} = {{nb((r-s)^2)}}$, $\\sqrt{\\Delta} = {{abs(r-s)}}$ : solutions {{tri(r,s)}}."
      - type: nombre
        vars: { a: [1, 2, 3, -1, -2], b: "-8..8", c: "-8..8" }
        enonce: "Combien de solutions réelles a ${{nb(a)}}x^2 + ({{nb(b)}})x + ({{nb(c)}}) = 0$ ?"
        reponse: "si(b*b-4*a*c > 0, 2, si(b*b-4*a*c == 0, 1, 0))"
        correction: "$\\Delta = {{nb(b*b-4*a*c)}}$ : {{si(b*b-4*a*c>0,'positif, 2 solutions.',si(b*b-4*a*c==0,'nul, 1 solution.','négatif, aucune solution réelle.'))}}"
      - type: nombre
        vars: { r: "-6..6", a: [1, 2, -1] }
        enonce: "Résous ${{nb(a)}}x^2 + ({{nb(-2*a*r)}})x + ({{nb(a*r*r)}}) = 0$."
        reponse: "r"
        correction: "$\\Delta = 0$ : une seule solution $x_0 = -\\frac{b}{2a} = {{nb(r)}}$."
      - type: liste
        vars: { r: "-5..5", s: "-5..5", a: [2, -1, 3] }
        si: "r != s"
        enonce: "Résous ${{nb(a)}}x^2 + ({{nb(-a*(r+s))}})x + ({{nb(a*r*s)}}) = 0$."
        reponse: ["r", "s"]
        correction: "Solutions : {{tri(r,s)}} (factorisation ${{nb(a)}}(x - ({{nb(r)}}))(x - ({{nb(s)}}))$)."
      - type: expression
        vars: { r: "1..6", s: "1..6" }
        si: "r != s"
        enonce: "Factorise $x^2 - {{r+s}}x + {{r*s}}$."
        reponse: "(x-{{r}})(x-{{s}})"
        variables: [x]
        forme: factorisee
        correction: "Racines {{r}} et {{s}} : $(x - {{r}})(x - {{s}})$."

  - id: signe-trinome
    titre: Le signe du trinôme et les inéquations
    objectif: Je détermine le signe de ax² + bx + c et je résous une inéquation du second degré.
    mots: [signe, inéquation]
    etapes:
      - dialogue:
          - mia: "Quand est-ce que x² − x − 6 est négatif ?"
          - neo: "Ses racines sont −2 et 3. Comme a > 0, la parabole est en ∪ : elle est sous l'axe ENTRE les racines !"
      - visuel:
          type: graphe
          xmin: -4
          xmax: 5
          ymin: -8
          ymax: 8
          fonctions: [{ f: "x^2-x-6", nom: "x² − x − 6" }]
          points: [{ x: -2, y: 0, label: "−2" }, { x: 3, y: 0, label: "3" }]
      - texte: |
          **Règle** : un trinôme est **du signe de a à l'extérieur des racines**, et du signe contraire **entre** les racines.
          - Si $\Delta < 0$ : il est toujours du signe de $a$.
          - Exemple : $x^2 - x - 6 < 0 \iff x \in \,]-2 ; 3[$.
      - a_quoi_ca_sert: "Savoir pour quelles quantités une entreprise fait des bénéfices, pendant quelle durée un objet lancé est au-dessus d'une hauteur…"
      - question:
          type: qcm
          vars: { r: "-6..0", s: "1..6" }
          enonce: "Solutions de $x^2 + ({{nb(-(r+s))}})x + ({{nb(r*s)}}) < 0$ ?"
          choix: ["$]{{nb(r)}} ; {{nb(s)}}[$", "$]-\\infty ; {{nb(r)}}[ \\cup ]{{nb(s)}} ; +\\infty[$", "$[{{nb(r)}} ; {{nb(s)}}]$", "aucune solution"]
          correction: "Racines {{nb(r)}} et {{nb(s)}}, a > 0 : négatif strictement entre les racines."
      - astuce:
          texte: "Le trinôme est du signe de a partout, SAUF entre les racines. « Signe de a à l'extérieur des racines »."
          qui: zero
    exercices:
      - type: qcm
        vars: { r: "-6..0", s: "1..6" }
        enonce: "Solutions de $x^2 + ({{nb(-(r+s))}})x + ({{nb(r*s)}}) \\ge 0$ ?"
        choix: ["$]-\\infty ; {{nb(r)}}] \\cup [{{nb(s)}} ; +\\infty[$", "$[{{nb(r)}} ; {{nb(s)}}]$", "$]{{nb(r)}} ; {{nb(s)}}[$", "$\\mathbb{R}$"]
        correction: "Positif ou nul à l'extérieur des racines, racines incluses."
      - type: qcm
        vars: { c: "1..9" }
        enonce: "Quel est le signe de $x^2 + {{c}}$ ?"
        choix: ["toujours strictement positif", "toujours négatif", "positif puis négatif", "nul en 0"]
        correction: "$\\Delta = -{{4*c}} < 0$ et a > 0 : toujours positif (et de toute façon x² ≥ 0)."
      - type: nombre
        vars: { r: "-5..-1", s: "1..5" }
        enonce: "Combien d'ENTIERS vérifient $(x - ({{nb(r)}}))(x - {{s}}) < 0$ ?"
        reponse: "s - r - 1"
        correction: "Les entiers strictement entre {{nb(r)}} et {{s}} : {{s-r-1}}."

  - id: optimisation
    titre: Optimiser avec le second degré
    objectif: Je trouve le maximum ou le minimum d'une grandeur modélisée par un trinôme.
    mots: [optimisation, maximum]
    etapes:
      - dialogue:
          - neo: "Avec 40 m de clôture, quel enclos rectangulaire a la plus grande aire ?"
          - mia: "Si un côté mesure x, l'autre mesure 20 − x. Aire : x(20 − x) = −x² + 20x. Maximum en x = 10 : un carré !"
      - texte: |
          **Méthode** :
          1. Choisir la variable $x$ et exprimer la grandeur à optimiser : $A(x) = -x^2 + 20x$.
          2. C'est un trinôme : le maximum (si $a<0$) ou le minimum (si $a>0$) est au **sommet** $\alpha = -\frac{b}{2a}$.
          3. Calculer la valeur optimale $A(\alpha)$ et conclure.
      - a_quoi_ca_sert: "Maximiser une aire, un bénéfice, une portée ; minimiser un coût ou une quantité de matériau : c'est le métier des ingénieurs et des économistes."
      - question:
          type: nombre
          vars: { p: [20, 24, 32, 40, 60] }
          enonce: "Un rectangle a un périmètre de {{p}} m. Quelle aire maximale peut-il avoir ?"
          reponse: "(p/4)^2"
          unite: m²
          correction: "Côtés $x$ et ${{p/2}} - x$ ; aire $-x^2 + {{p/2}}x$ maximale en $x = {{p/4}}$ : ${{p/4}}^2 = {{(p/4)^2}}$ m² (un carré)."
      - astuce:
          texte: "Le maximum ou le minimum d'un trinôme est atteint au sommet, en x = −b / (2a). Pas besoin de tester toutes les valeurs !"
          qui: mia
    exercices:
      - type: nombre
        vars: { v: [10, 20, 30] }
        enonce: "La hauteur d'une balle est $h(t) = -5t^2 + {{v}}t$ (en m, t en s). Hauteur maximale ?"
        reponse: "v*v/20"
        unite: m
        correction: "Sommet en $t = \\frac{ {{v}} }{10} = {{v/10}}$ s ; $h = {{nb(v*v/20)}}$ m."
      - type: nombre
        vars: { a: [1, 2], b: "2..10", c: "1..20" }
        enonce: "Coût de fabrication : $C(x) = {{a}}x^2 - {{2*a*b}}x + {{a*b*b+c}}$. Pour quelle quantité $x$ le coût est-il minimal ?"
        reponse: "b"
        correction: "$x = \\frac{ {{2*a*b}} }{ {{2*a}} } = {{b}}$"
      - type: nombre
        vars: { s: [10, 12, 16, 20] }
        enonce: "Deux nombres ont pour somme {{s}}. Quel est leur produit maximal ?"
        reponse: "(s/2)^2"
        correction: "$x({{s}} - x)$ maximal pour $x = {{s/2}}$ : produit ${{(s/2)^2}}$."

id: nid-des-nombres
titre: Le Nid des Nombres
sous_titre: Compter, reconnaître et ranger les petits nombres (jusqu'à 20)
emoji: 🐣
couleur: "#ffb300"
cycle: graines
age: 5-7 ans
niveau: GS – CP
ordre: 0.5
prerequis: []
version: 1.0.0
intro:
  - zero: "Coucou ! Ici, c'est le nid où naissent tous les nombres. Ils sont tout petits… comme moi !"
  - mia: "On va apprendre à les compter, à les reconnaître d'un seul coup d'œil et à les ranger."
  - neo: "Avec tes doigts et tes yeux, tu vas devenir super fort. Défi accepté ?"

lecons:
  - id: compter-un-par-un
    titre: Compter un par un, en touchant
    objectif: Je compte des objets en les touchant un par un, et le dernier nombre dit combien il y en a.
    mots: [compter]
    etapes:
      - dialogue:
          - zero: "J'ai des graines… 1, 2, 2, 3… euh, j'ai compté deux fois la même !"
          - mia: "Astuce : touche chaque graine UNE seule fois, et dis un nombre à chaque fois."
      - visuel:
          type: objets
          groupes: [5]
          emoji: "🌰"
        legende: "1, 2, 3, 4, 5 : le dernier nombre dit, c'est le nombre de graines. Il y en a 5."
      - astuce:
          texte: "Pousse chaque objet de côté quand tu le comptes : comme ça, tu ne le comptes jamais deux fois."
          qui: zero
      - retiens: "Je touche chaque objet **une seule fois**. Le **dernier nombre** que je dis, c'est **combien il y en a**."
      - a_quoi_ca_sert: "Compter tes jouets, les bougies d'un gâteau d'anniversaire, les marches d'un escalier…"
      - vraie_vie:
          titre: Défi dans la vraie vie
          texte: "Compte les fourchettes de la cuisine en les touchant une par une. Puis demande à un adulte de recompter : vous trouvez pareil ?"
          materiel: "des fourchettes (ou des cuillères)"
      - question:
          type: nombre
          vars: { n: "3..9", e: ["🍎", "🐞", "⭐", "🐟"] }
          enonce: "Combien y en a-t-il ? Touche chaque dessin pour les compter."
          visuel: { type: objets, groupes: ["=n"], emoji: "{{e}}", comptable: true }
          reponse: "n"
          correction: "Il y en a {{n}}."
    exercices:
      - type: nombre
        vars: { n: "2..10", e: ["🍎", "🐞", "⭐", "🐟", "🌸", "🚗"] }
        enonce: "Combien y en a-t-il ? (touche-les pour compter)"
        visuel: { type: objets, groupes: ["=n"], emoji: "{{e}}", comptable: true }
        reponse: "n"
        erreurs:
          - { valeur: "n+1", message: "Tu en as compté un de trop : as-tu touché un dessin deux fois ?" }
          - { valeur: "n-1", message: "Il en manque un : as-tu oublié de toucher un dessin ?" }
        correction: "Il y en a {{n}}."
      - type: nombre
        vars: { n: "11..20" }
        enonce: "Combien d'étoiles ?"
        visuel: { type: objets, groupes: ["=n"], emoji: "⭐", comptable: true }
        reponse: "n"
        niveau: 2
        correction: "Il y a {{n}} étoiles."
      - type: blocs
        vars: { n: "3..9" }
        enonce: "Pose exactement {{n}} petits cubes (touche ＋ dans les unités)."
        cible: "n"
        niveau: 1
        correction: "{{n}} unités = {{n}}."

  - id: reconnaitre-d-un-coup
    titre: Reconnaître d'un coup d'œil (dés et doigts)
    objectif: Je reconnais les petites quantités sans compter, comme sur un dé ou avec mes doigts.
    mots: [quantité]
    etapes:
      - dialogue:
          - neo: "Sur un dé, je vois tout de suite que c'est 5. Je n'ai même pas besoin de compter !"
          - mia: "C'est un super-pouvoir : reconnaître les quantités d'un coup d'œil. Il s'entraîne !"
      - visuel:
          type: motif
          elements: ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"]
        legende: "Les faces d'un dé : 1, 2, 3, 4, 5, 6."
      - texte: |
          Les **doigts** aussi aident : **5** = une main entière ✋. **7** = une main et 2 doigts. **10** = les deux mains !
      - astuce:
          texte: "Pour 8, pas besoin de compter 8 doigts : c'est une main (5) et encore 3 !"
          qui: neo
      - a_quoi_ca_sert: "Jouer aux dés et aux jeux de société plus vite, compter en un éclair… et ça aide pour toutes les additions !"
      - question:
          type: qcm
          vars: { n: [1, 2, 3, 4, 5, 6] }
          enonce: "Quel nombre montre ce dé ?"
          visuel: { type: motif, elements: ["{{si(n==1,'⚀',si(n==2,'⚁',si(n==3,'⚂',si(n==4,'⚃',si(n==5,'⚄','⚅')))))}}"] }
          choix: ["{{n}}", "{{si(n==6,5,n+1)}}", "{{si(n==1,3,n-1)}}"]
          correction: "Ce dé montre {{n}}."
    exercices:
      - type: qcm
        vars: { n: [1, 2, 3, 4, 5, 6] }
        enonce: "Quel nombre montre ce dé ?"
        visuel: { type: motif, elements: ["{{si(n==1,'⚀',si(n==2,'⚁',si(n==3,'⚂',si(n==4,'⚃',si(n==5,'⚄','⚅')))))}}"] }
        choix: ["{{n}}", "{{si(n==6,5,n+1)}}", "{{si(n==1,3,n-1)}}"]
        correction: "{{n}}."
      - type: nombre
        vars: { d: "1..4" }
        enonce: "Une main entière ✋ et encore {{d}} doigt(s). Ça fait combien ?"
        reponse: "5+d"
        correction: "5 + {{d}} = {{5+d}}."
      - type: nombre
        vars: { a: "1..5", b: "1..5" }
        enonce: "Combien de points en tout ?"
        visuel: { type: objets, groupes: ["=a", "=b"], emoji: "🔵" }
        reponse: "a+b"
        correction: "{{a}} et {{b}}, ça fait {{a+b}}."

  - id: avant-apres
    titre: Le nombre d'avant, le nombre d'après
    objectif: Je connais la suite des nombres jusqu'à 20 et je trouve le nombre juste avant et juste après.
    mots: [suivant, précédent]
    etapes:
      - dialogue:
          - zero: "Les nombres font la queue, comme à la cantine : 1, 2, 3, 4…"
          - mia: "Et chacun a un voisin juste avant, et un voisin juste après !"
      - visuel:
          type: droite
          min: 0
          max: 20
          pas: 1
          etiquettes: tout
          point: { v: 12, label: "12" }
        legende: "Juste avant 12 : 11. Juste après 12 : 13."
      - astuce:
          texte: "Juste après, c'est + 1 (un pas en avant). Juste avant, c'est − 1 (un pas en arrière). Tes doigts peuvent faire les pas !"
          qui: mia
      - retiens: "Le nombre **d'après**, c'est **1 de plus**. Le nombre **d'avant**, c'est **1 de moins**."
      - a_quoi_ca_sert: "Savoir quel âge tu auras à ton prochain anniversaire, compter les jours avant les vacances, monter l'escalier marche par marche…"
      - question:
          type: sauts
          vars: { a: "2..15" }
          enonce: "La grenouille est sur {{a}}. Fais-la sauter sur le nombre juste après."
          depart: "a"
          cible: "a+1"
          min: 0
          max: 20
          sauts_permis: [1, -1]
          correction: "Juste après {{a}}, c'est {{a+1}}."
    exercices:
      - type: nombre
        vars: { a: "1..19" }
        enonce: "Quel nombre vient juste après {{a}} ?"
        reponse: "a+1"
        correction: "{{a}} + 1 = {{a+1}}."
      - type: nombre
        vars: { a: "2..20" }
        enonce: "Quel nombre vient juste avant {{a}} ?"
        reponse: "a-1"
        erreurs:
          - { valeur: "a+1", message: "Ça, c'est le nombre d'APRÈS ! Juste avant, c'est 1 de moins." }
        correction: "{{a}} − 1 = {{a-1}}."
      - type: sauts
        vars: { a: "0..10", b: "11..20" }
        enonce: "Fais aller la grenouille de {{a}} à {{b}}."
        depart: "a"
        cible: "b"
        min: 0
        max: 20
        sauts_permis: [1, 2, 5, -1]
        correction: "De {{a}} à {{b}}, il y a {{b-a}} pas."
      - type: ordre
        vars: { a: "1..16" }
        enonce: "Range dans l'ordre, du plus petit au plus grand."
        items: ["{{a}}", "{{a+1}}", "{{a+2}}", "{{a+3}}"]
        correction: "{{a}}, {{a+1}}, {{a+2}}, {{a+3}}."

  - id: plus-moins
    titre: Plus que, moins que, autant
    objectif: Je compare deux collections et je dis où il y en a le plus.
    mots: [plus, moins, autant]
    etapes:
      - dialogue:
          - neo: "J'ai 6 glands, Zéro en a 4. Qui en a le plus ?"
          - zero: "Moi ! Parce que je suis plus rond."
          - mia: "Mettons-les face à face, un pour un : celui à qui il en reste a le PLUS !"
      - visuel:
          type: barres
          lignes:
            - nom: Néo
              parts: [{ v: 6, label: "6" }]
            - nom: Zéro
              parts: [{ v: 4, label: "4" }]
          ecart: "2 de plus"
      - astuce:
          texte: "Aligne les deux collections face à face, un objet en face d'un autre : la ligne qui dépasse en a le plus."
          qui: neo
      - retiens: "Pour comparer, je mets les objets **face à face, un pour un**. Celui qui en a encore en a **plus**."
      - a_quoi_ca_sert: "Savoir qui a gagné au jeu, s'il y a assez de chaises pour tout le monde, assez de parts de gâteau…"
      - question:
          type: qcm
          vars: { a: "2..9", b: "2..9" }
          si: "a != b"
          enonce: "Lya a {{a}} billes et Néo a {{b}} billes. Qui en a le plus ?"
          choix: ["{{si(a>b,'Lya','Néo')}}", "{{si(a>b,'Néo','Lya')}}", "Ils en ont autant"]
          ordre_fixe: true
          correction: "{{max(a,b)}} est plus grand que {{min(a,b)}}."
    exercices:
      - type: comparer
        vars: { a: "1..20", b: "1..20" }
        enonce: "Choisis le bon signe."
        gauche: "a"
        droite: "b"
        correction: "Le plus grand est celui qui est le plus loin sur la file des nombres."
      - type: qcm
        vars: { a: "2..8", b: "2..8" }
        enonce: "Y a-t-il plus de 🍓 ou de 🍌 ?"
        visuel: { type: objets, groupes: ["=a", "=b"], emojis: ["🍓", "🍌"] }
        choix: ["{{si(a>b,'plus de fraises',si(a<b,'plus de bananes','autant'))}}", "{{si(a>b,'plus de bananes','plus de fraises')}}", "{{si(a==b,'plus de bananes','autant')}}"]
        ordre_fixe: true
        correction: "Fraises : {{a}}, bananes : {{b}}."
      - type: partage
        vars: { p: [2, 3], k: "2..4" }
        enonce: "Donne autant de 🍪 à chaque enfant ({{p}} enfants)."
        total: "p*k"
        parts: "p"
        emoji: "🍪"
        correction: "{{p*k}} biscuits pour {{p}} enfants : {{k}} chacun."

  - id: decomposer-5-10
    titre: Les maisons de 5 et de 10
    objectif: Je connais toutes les façons de faire 5 et 10 avec deux nombres.
    mots: [décomposer]
    etapes:
      - dialogue:
          - mia: "Dans la maison de 10 habitent des couples de nombres qui font 10 ensemble : 7 et 3, 6 et 4…"
          - zero: "Et 10 et moi ! 10 + 0 = 10. Je suis dans toutes les maisons."
      - visuel:
          type: grille
          lignes: 2
          colonnes: 5
          emoji: "🟡"
        legende: "La boîte de 10 : 2 rangées de 5."
      - texte: |
          **La maison de 5** : 0 + 5, 1 + 4, 2 + 3, 3 + 2, 4 + 1, 5 + 0.
          **La maison de 10** : 1 + 9, 2 + 8, 3 + 7, 4 + 6, 5 + 5…
      - question:
          type: nombre
          vars: { a: "0..5" }
          enonce: "{{a}} et combien font 5 ?"
          reponse: "5-a"
          correction: "{{a}} + {{5-a}} = 5."
      - a_quoi_ca_sert: "Ces couples sont les briques de TOUS les calculs. Les connaître par cœur, c'est calculer à la vitesse de l'éclair !"
      - astuce:
          texte: "Les amoureux de 10 : 1 et 9, 2 et 8, 3 et 7, 4 et 6, 5 et 5. Montre-les avec tes deux mains : les doigts levés et les doigts baissés font toujours 10."
          qui: zero
    exercices:
      - type: nombre
        vars: { a: "0..10" }
        enonce: "{{a}} et combien font 10 ?"
        reponse: "10-a"
        erreurs:
          - { valeur: "10+a", message: "On cherche ce qu'il MANQUE pour arriver à 10, pas ce qu'on obtient en ajoutant 10." }
        correction: "{{a}} + {{10-a}} = 10."
      - type: colorier
        vars: { n: "1..9" }
        enonce: "Colorie {{n}} parts. Combien en reste-t-il de blanches ? (colorie d'abord !)"
        n: "n"
        d: "10"
        dessin: barre
        correction: "{{n}} coloriées, {{10-n}} blanches : {{n}} + {{10-n}} = 10."
      - type: nombre
        vars: { a: "1..4" }
        enonce: "{{a}} doigts levés sur une main. Combien de doigts baissés ?"
        reponse: "5-a"
        correction: "{{a}} + {{5-a}} = 5 doigts."

  - id: premieres-additions
    titre: Mes premières additions
    objectif: Je calcule de petites additions en réunissant des objets.
    mots: [addition]
    etapes:
      - dialogue:
          - neo: "3 lapins dans le pré. 2 autres arrivent en sautillant. Combien de lapins maintenant ?"
          - mia: "On les met tous ensemble et on compte : 3… 4, 5 ! 3 + 2 = 5."
      - visuel:
          type: objets
          groupes: [3, 2]
          emoji: "🐰"
          signe: "+"
        legende: "3 + 2 = 5"
      - astuce:
          texte: "Pas besoin de tout recompter : pars du plus grand nombre et avance. « 3… 4, 5 ! »"
          qui: mia
      - explique:
          texte: "Comment as-tu trouvé 3 + 2 ?"
          qui: neo
          choix:
            - { texte: "J'ai compté tous les lapins un par un", ok: true, retour: "Ça marche ! Et c'est encore plus rapide en partant de 3." }
            - { texte: "Je suis parti de 3 et j'ai avancé de 2 : 4, 5", ok: true, retour: "Excellente méthode, c'est celle des champions !" }
            - { texte: "J'ai deviné au hasard", ok: false, retour: "Deviner, c'est risqué ! Essaie de compter ou d'avancer à partir de 3." }
      - a_quoi_ca_sert: "Compter tes bonbons quand on t'en donne d'autres, les points d'un jeu, les invités qui arrivent…"
      - question:
          type: nombre
          vars: { a: "1..5", b: "1..4" }
          enonce: "Combien en tout ?"
          visuel: { type: objets, groupes: ["=a", "=b"], emoji: "🐥", signe: "+" }
          reponse: "a+b"
          correction: "{{a}} + {{b}} = {{a+b}}."
    exercices:
      - type: nombre
        vars: { a: "1..6", b: "1..4" }
        enonce: "Combien en tout ?"
        visuel: { type: objets, groupes: ["=a", "=b"], emoji: "🍬", signe: "+" }
        reponse: "a+b"
        correction: "{{a}} + {{b}} = {{a+b}}."
      - type: nombre
        vars: { a: "1..6", b: "1..4" }
        enonce: "$ {{a}} + {{b}} = ?$"
        reponse: "a+b"
        niveau: 2
        correction: "{{a}} + {{b}} = {{a+b}}."
      - type: sauts
        vars: { a: "1..8", b: "1..5" }
        enonce: "Calcule {{a}} + {{b}} en faisant sauter la grenouille."
        depart: "a"
        cible: "a+b"
        min: 0
        max: 15
        sauts_permis: [1, -1]
        correction: "{{a}} + {{b}} = {{a+b}}."
      - type: payer
        vars: { a: "2..9" }
        enonce: "Paie exactement {{a}} € pour une glace."
        cible: "a"
        pieces: [1, 2, 5]
        correction: "Par exemple : {{si(a>=5,'5 € + ' + texte(a-5) + ' €', texte(a) + ' €')}}."

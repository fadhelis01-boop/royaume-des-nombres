id: mu-studio-de-danse
matiere: musique
titre: Le Studio de Danse
sous_titre: Spécialité danse - le corps en mouvement, composer une chorégraphie, histoire de la danse, analyser une pièce chorégraphique
emoji: 🩰
couleur: "#ad1457"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 508
specialite: Danse
version: 1.0.0
intro:
  - narrateur: "Au-dessus de la Salle de Concert, un studio aux grands miroirs, un parquet souple, une enceinte, et le silence avant le premier mouvement."
  - mia: "La spécialité danse, c'est danser, créer, voir des spectacles et comprendre l'histoire de cet art."
  - neo: "Le corps est l'instrument : il dessine l'espace, joue avec le temps et varie son énergie."

lecons:
  - id: danse-corps-mouvement
    titre: Le corps en mouvement - espace, temps, énergie
    classe: "1ʳᵉ"
    objectif: Je décris un mouvement selon l'espace, le temps, l'énergie et la relation aux autres.
    mots: [espace, temps, énergie, relation]
    etapes:
      - dialogue:
          - zero: "Danser, c'est suivre la musique, c'est tout ?"
          - neo: "On peut aussi danser en silence ! Ce qui compte, c'est comment le corps occupe l'espace, joue avec le temps et dose son énergie."
      - a_quoi_ca_sert: "Ces notions servent à danser, à créer et à analyser ; et la conscience du corps sert aussi au sport, au théâtre et à la santé."
      - texte: |
          **L'espace** : niveaux (au sol, debout, en l'air), directions, trajectoires (droites, courbes), espace proche ou lointain autour du corps (la **kinésphère**).

          **Le temps** : rapide ou lent, accélérer, ralentir, **suspendre**, s'arrêter ; suivre une musique ou s'en libérer.

          **L'énergie** (la qualité du mouvement) : fort ou léger, direct ou indirect, fluide ou saccadé. Rudolf **Laban** a classé ces qualités au XXᵉ siècle.

          **La relation** : seul, en duo, en groupe ; à l'unisson, en canon, en question-réponse ; contact ou distance.

          **Le poids** et l'**appui** : tomber, se relever, porter un partenaire.
      - astuce: { texte: "Pour décrire un mouvement, pose quatre questions : où ? quand et à quelle vitesse ? avec quelle énergie ? avec qui ?", qui: mia }
      - retiens: "Décrire un mouvement : **espace** (niveaux, trajectoires, kinésphère), **temps** (vitesse, suspension, arrêt), **énergie** (fort ou léger, fluide ou saccadé, **Laban**), **relation** (unisson, canon, contact)."
    exercices:
      - type: classer
        enonce: "Range chaque description : elle parle de l'espace ou du temps ?"
        categories: ["Espace", "Temps"]
        mots: [["Le danseur passe du sol à un saut", 0], ["Le mouvement ralentit jusqu'à l'arrêt", 1], ["Une trajectoire en spirale", 0], ["Une suspension avant la chute", 1]]
        correction: "Où le corps va → espace ; quand et à quelle vitesse → temps."
      - type: relier
        enonce: "🔗 Relie chaque organisation de groupe à sa définition."
        paires: [["l'unisson", "tous font le même mouvement en même temps"], ["le canon", "le même mouvement, décalé dans le temps"], ["la question-réponse", "un danseur propose, l'autre répond"]]
        correction: "Trois façons de danser ensemble."
      - type: qcm
        enonce: "Qui a étudié et classé les qualités du mouvement (poids, temps, espace, flux) ?"
        choix: ["Rudolf Laban", "Molière", "Claude Monet", "Isaac Newton"]
        correction: "**Rudolf Laban**, théoricien de la danse au XXᵉ siècle."
      - type: vf
        vars: { t: [["On peut danser sans musique.", true], ["La kinésphère est l'espace autour du corps que l'on peut atteindre.", true], ["L'énergie d'un mouvement est toujours la même.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Danse possible en silence ; kinésphère = espace proche ; l'énergie varie."

  - id: danse-composition
    titre: Composer une chorégraphie
    classe: "1ʳᵉ"
    objectif: Je compose une courte pièce à partir d'une intention, avec des procédés de composition, et je la présente.
    mots: [chorégraphie, intention, procédé, phrase chorégraphique]
    etapes:
      - dialogue:
          - mia: "Le thème du projet : « la ville ». Par où commencer ?"
          - zero: "Je mets une musique et j'invente des pas ?"
          - neo: "D'abord une intention : ce que tu veux faire ressentir. Ensuite des gestes, que tu transformes avec des procédés de composition."
      - a_quoi_ca_sert: "Créer en groupe une pièce cohérente, c'est le cœur de l'épreuve ; c'est aussi apprendre à mener un projet artistique collectif."
      - texte: |
          **Partir d'une intention** : une émotion, une image, un thème, une question.

          **Créer du matériau** : improviser, puis fixer des gestes en une **phrase chorégraphique** (une suite de mouvements qu'on peut répéter).

          **Les procédés de composition** :
          - **répétition** et **accumulation** (ajouter un geste à chaque reprise) ;
          - **variation** (changer la vitesse, le niveau, l'orientation, l'énergie) ;
          - **inversion** (jouer la phrase à l'envers) ;
          - **unisson**, **canon**, **contrepoint** (des phrases différentes en même temps) ;
          - **rupture** (un arrêt, un changement brutal).

          **Construire la pièce** : un début, un développement, une fin ; penser l'espace scénique, la musique ou le silence, les costumes, la lumière.
      - astuce: { texte: "Une seule phrase bien travaillée, variée de trois façons, peut suffire à construire toute une pièce.", qui: mia }
      - retiens: "**Intention** → improvisation → **phrase chorégraphique** → procédés : **répétition, accumulation, variation, inversion, unisson, canon, contrepoint, rupture** → construction (début, développement, fin)."
    exercices:
      - type: ordre
        enonce: "Range les étapes de la création d'une chorégraphie."
        items: ["Choisir une intention", "Improviser pour trouver des gestes", "Fixer une phrase chorégraphique", "Transformer la phrase avec des procédés", "Construire et présenter la pièce"]
        correction: "Intention, improvisation, phrase, procédés, pièce."
      - type: relier
        enonce: "🔗 Relie chaque procédé à sa définition."
        paires: [["l'accumulation", "ajouter un geste à chaque reprise"], ["l'inversion", "jouer la phrase à l'envers"], ["le contrepoint", "des phrases différentes en même temps"], ["la rupture", "un changement brutal"]]
        correction: "Des outils pour transformer le matériau."
      - type: qcm
        enonce: "On reprend une phrase en la dansant deux fois plus lentement et au sol. Quel procédé ?"
        choix: ["Une variation", "Un unisson", "Une accumulation", "Une inversion"]
        correction: "Changer la vitesse et le niveau, c'est une **variation**."
      - type: vf
        vars: { t: [["Une chorégraphie part souvent d'une intention.", true], ["Une phrase chorégraphique ne peut jamais être répétée.", false], ["Le silence peut accompagner une chorégraphie.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Intention de départ ; une phrase se répète et se transforme ; le silence est un choix."

  - id: danse-histoire
    titre: Repères d'histoire de la danse
    classe: Terminale
    objectif: Je situe les grandes étapes de la danse en Occident, du ballet de cour à la danse contemporaine et au hip-hop.
    mots: [ballet, danse moderne, danse contemporaine, hip-hop]
    etapes:
      - dialogue:
          - neo: "Louis XIV dansait lui-même, et il a fondé une Académie royale de danse en 1661."
          - zero: "Le roi en collant ?"
          - mia: "Le roi en Soleil ! C'est de là que viennent les cinq positions du ballet classique."
      - a_quoi_ca_sert: "Situer une pièce dans l'histoire aide à la comprendre ; ces repères sont attendus à l'écrit et à l'oral de la spécialité."
      - texte: |
          **Le ballet de cour** (XVIIᵉ siècle) : Louis XIV fonde l'**Académie royale de danse** (1661) ; les **cinq positions** sont codifiées.

          **Le ballet romantique** (XIXᵉ siècle) : pointes, tutu, monde féerique (*Giselle*, 1841). Puis le ballet académique russe (*Le Lac des cygnes*).

          **La danse moderne** (début du XXᵉ siècle) : refus des codes du ballet, pieds nus, expression (Isadora Duncan, Martha Graham).

          **Les Ballets russes** de Diaghilev : *Le Sacre du printemps* (1913, musique de Stravinsky, chorégraphie de Nijinski) fait scandale.

          **La danse contemporaine** (après 1950) : Merce Cunningham (le mouvement pour lui-même), Pina Bausch (danse-théâtre), Anne Teresa De Keersmaeker, Angelin Preljocaj.

          **Le hip-hop** (années 1970, New York) : breakdance, popping, locking ; il entre sur les scènes de théâtre (Mourad Merzouki).
      - astuce: { texte: "Retiens trois dates : 1661 (l'Académie de Louis XIV), 1913 (le Sacre du printemps), années 1970 (le hip-hop).", qui: zero }
      - retiens: "**Ballet de cour** (Louis XIV, 1661, cinq positions) → **ballet romantique** (pointes, Giselle) → **danse moderne** (Duncan, Graham) → **Sacre du printemps** (1913) → **danse contemporaine** (Cunningham, Bausch) ; **hip-hop** (années 1970)."
    exercices:
      - type: ordre
        enonce: "Range ces étapes de l'histoire de la danse."
        items: ["L'Académie royale de danse de Louis XIV", "Le ballet romantique et les pointes", "Le Sacre du printemps", "La danse-théâtre de Pina Bausch"]
        correction: "1661, XIXᵉ siècle, 1913, après 1970."
      - type: relier
        enonce: "🔗 Relie chaque artiste à son courant."
        paires: [["Martha Graham", "la danse moderne"], ["Pina Bausch", "la danse-théâtre"], ["Merce Cunningham", "la danse contemporaine"], ["Mourad Merzouki", "le hip-hop sur scène"]]
        correction: "Quatre figures, quatre courants."
      - type: nombre
        enonce: "En quelle année Le Sacre du printemps est-il créé à Paris ?"
        reponse: "1913"
        correction: "En **1913**, par les Ballets russes."
      - type: vf
        vars: { t: [["Isadora Duncan dansait pieds nus.", true], ["Le hip-hop est né à la cour de Louis XIV.", false], ["Giselle est un ballet romantique.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Duncan pieds nus ; hip-hop né à New York dans les années 1970 ; Giselle est romantique."

  - id: danse-analyser-piece
    titre: Analyser une pièce chorégraphique
    classe: Terminale
    objectif: J'analyse une pièce dansée - mouvement, espace, interprètes, scénographie, musique - et j'en propose une interprétation.
    mots: [pièce chorégraphique, interprète, scénographie, interprétation]
    etapes:
      - dialogue:
          - zero: "Je n'ai rien compris à la pièce d'hier, il n'y avait pas d'histoire."
          - neo: "Une pièce de danse ne raconte pas toujours une histoire. Regarde comment les corps bougent et se rencontrent : le sens naît de là."
      - a_quoi_ca_sert: "L'analyse d'une œuvre chorégraphique est évaluée en spécialité ; elle aide aussi à apprécier les spectacles et à en parler."
      - texte: |
          **Identifier** : titre, chorégraphe, compagnie, date, durée, nombre d'interprètes.

          **Décrire** :
          - le **mouvement** (espace, temps, énergie, relation) ;
          - les **interprètes** (solo, duo, groupe ; corps différents ou semblables) ;
          - la **scénographie** (décor, lumière, costumes) ;
          - la **musique** ou le **son** (silence, texte, bruit) ;
          - le **rapport au public**.

          **Interpréter** : quelles émotions, quelles idées, quels contrastes ? Qu'est-ce que la pièce dit du corps, des relations, du monde ?

          **Situer** : courant, influences, autres œuvres en lien.
      - attention: "Ne cherche pas à « traduire » chaque geste en mots : décris d'abord précisément, puis propose une interprétation argumentée."
      - astuce: { texte: "Si tu ne comprends pas, décris : un bon relevé précis mène souvent tout seul à une interprétation.", qui: mia }
      - retiens: "Analyser : **identifier**, **décrire** (mouvement, interprètes, scénographie, son, rapport au public), **interpréter** (émotions, idées, contrastes), **situer** (courant, influences)."
    exercices:
      - type: ordre
        enonce: "Range les étapes de l'analyse d'une pièce chorégraphique."
        items: ["Identifier la pièce", "Décrire le mouvement et la scénographie", "Interpréter le sens", "Situer dans un courant"]
        correction: "Identifier, décrire, interpréter, situer."
      - type: classer
        enonce: "Range chaque phrase : description ou interprétation ?"
        categories: ["Description", "Interprétation"]
        mots: [["Les danseurs tombent et se relèvent sans cesse.", 0], ["Ces chutes répétées évoquent l'épuisement d'une vie de travail.", 1], ["La scène est éclairée par une seule lampe au sol.", 0], ["Cette lumière faible crée une impression d'intimité fragile.", 1]]
        correction: "Décrire ce qu'on voit, puis interpréter ce que cela signifie."
      - type: qcm
        enonce: "Une pièce de danse sans histoire racontée…"
        choix: ["peut avoir un sens grâce aux mouvements, aux relations et aux images", "n'a aucun sens", "n'est pas de la danse", "doit être interdite"]
        correction: "Le sens naît des corps, de l'espace et des contrastes."
      - type: vf
        vars: { t: [["La musique fait partie des éléments à analyser.", true], ["Il faut traduire chaque geste par un mot précis.", false], ["Le nombre d'interprètes peut changer le sens d'une pièce.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Musique analysée ; pas de traduction mot à mot ; solo et groupe ne disent pas la même chose."

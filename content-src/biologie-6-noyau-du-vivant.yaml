id: bio-noyau-du-vivant
matiere: biologie
titre: Le Noyau du Vivant
sous_titre: Réplication, transcription, traduction, enzymes, neurones, régulation de la glycémie
emoji: 🔬
couleur: "#215c1b"
cycle: maitres
age: 16 ans et +
niveau: Expert (1ʳᵉ – Terminale)
ordre: 306
prerequis: [bio-tour-de-l-adn]
version: 1.0.0
intro:
  - narrateur: "Au cœur du noyau, le Virus Glitch copie de travers les messages. Il faut fabriquer des anticorps parfaits, base après base."
  - neo: "On va lire le code génétique comme un vrai biologiste moléculaire."

lecons:
  - id: replication
    titre: "La réplication de l'ADN"
    objectif: J'explique comment l'ADN est copié avant la division cellulaire.
    mots: [réplication, semi-conservative, ADN polymérase, mutation]
    etapes:
      - dialogue:
          - zero: "Quand une cellule se divise en deux, comment elle copie son ADN ?"
          - mia: "Comme une fermeture éclair qui s'ouvre, et chaque côté sert de modèle pour en fabriquer un nouveau."
      - a_quoi_ca_sert: "Chaque jour, ton corps fabrique des milliards de nouvelles cellules ; une erreur de copie peut causer une maladie. La réplication est au cœur de la médecine du cancer."
      - texte: |
          Avant qu'une cellule se divise, son ADN est **copié** : c'est la **réplication**. Les deux brins de la double hélice se séparent ; chacun sert de **modèle** pour fabriquer un brin complémentaire (A en face de T, G en face de C), grâce à une enzyme, l'**ADN polymérase**.
          Chaque nouvelle molécule contient **un brin ancien et un brin neuf** : la réplication est **semi-conservative** (démontré par Meselson et Stahl en 1958).
          Rarement, une erreur de copie non réparée crée une **mutation**.
      - astuce:
          texte: "Les bases vont par couples : A avec T, G avec C. Retiens « Agent Tigre et Gros Chat » : chaque brin sert de modèle pour fabriquer l'autre."
          qui: zero
      - retiens: "Réplication : chaque brin sert de modèle (A-T, G-C). Semi-conservative : un brin ancien + un brin neuf. Erreurs rares = mutations."
    exercices:
      - type: mot
        vars: { t: [["ATGC", "TACG"], ["GGCA", "CCGT"], ["TTAC", "AATG"], ["CATG", "GTAC"], ["AGCT", "TCGA"]] }
        enonce: "Écris le brin d'ADN complémentaire de : {{t_0}}"
        reponse: "{{t_1}}"
        correction: "A↔T, G↔C : {{t_0}} → {{t_1}}."
      - type: qcm
        vars: { t: [["Que veut dire « semi-conservative » ?", "chaque nouvelle molécule garde un brin ancien", "on garde la moitié de l'ADN seulement", "l'ADN est conservé au frigo"], ["Quelle enzyme fabrique le nouveau brin ?", "l'ADN polymérase", "l'amylase", "l'insuline"], ["Quand a lieu la réplication ?", "avant la division de la cellule", "après la mort de la cellule", "pendant la digestion"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Une mutation est une modification de la séquence d'ADN.",true,"Vrai : un changement dans l'ordre des bases."],["Toutes les mutations sont dangereuses.",false,"Faux : beaucoup sont neutres, quelques-unes utiles, d'autres nuisibles."],["Après la réplication, chaque molécule d'ADN a deux brins neufs.",false,"Faux : chaque molécule garde un brin ancien et un brin neuf (réplication semi-conservative)."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: transcription
    titre: "La transcription : de l'ADN à l'ARN messager"
    objectif: Je transcris une séquence d'ADN en ARN messager.
    mots: [transcription, ARN messager, uracile]
    etapes:
      - dialogue:
          - zero: "L'ADN reste enfermé dans le noyau. Alors comment la cellule lit ses recettes ?"
          - neo: "Elle fait une photocopie : l'ARN messager, qui peut sortir du noyau."
      - a_quoi_ca_sert: "La transcription est la première étape pour fabriquer les protéines. Les vaccins à ARN messager s'appuient directement sur ce mécanisme."
      - texte: |
          L'ADN reste dans le noyau. Pour utiliser un gène, la cellule en fait une **copie de travail** : l'**ARN messager** (ARNm), qui sort du noyau. C'est la **transcription**.
          L'ARN utilise la base **U (uracile)** à la place de T. On lit le brin d'ADN **matrice** et on écrit la base complémentaire :
          **A → U**, **T → A**, **G → C**, **C → G**.
          Exemple : brin matrice TACGGA → ARNm **AUGCCU**.
      - astuce:
          texte: "Dans l'ARN, le T est remplacé par U : A s'associe avec U. L'ARN messager est une photocopie d'une seule recette, que l'on peut emporter hors du noyau."
          qui: mia
      - retiens: "Transcription : ADN (noyau) → ARNm. Correspondances : A→U, T→A, G→C, C→G (l'ARN a U à la place de T)."
    exercices:
      - type: mot
        vars: { t: [["TAC", "AUG"], ["GGA", "CCU"], ["ATT", "UAA"], ["CAT", "GUA"], ["TACGGA", "AUGCCU"], ["AAAT", "UUUA"]] }
        enonce: "Brin matrice d'ADN : {{t_0}}. Quel est l'ARN messager transcrit ?"
        reponse: "{{t_1}}"
        correction: "A→U, T→A, G→C, C→G : {{t_1}}."
      - type: qcm
        vars: { t: [["Quelle base remplace T dans l'ARN ?", "U (uracile)", "A", "G"], ["Où se fait la transcription ?", "dans le noyau", "dans l'estomac", "dans le sang"], ["Pourquoi faire une copie en ARNm ?", "l'ADN reste protégé dans le noyau ; l'ARNm porte le message vers la fabrication des protéines", "pour détruire l'ADN", "pour respirer"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["L'ARN messager contient la base T.",false,"Faux : dans l'ARN, U remplace T."],["La transcription d'un A de l'ADN donne un U dans l'ARN.",true,"Vrai : A de l'ADN s'associe avec U dans l'ARN."],["L'ARNm sort du noyau.",true,"Vrai : il va jusqu'aux ribosomes, dans le cytoplasme."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: traduction
    titre: "La traduction : le code génétique"
    objectif: Je lis des codons et je comprends la fabrication d'une protéine.
    mots: [traduction, codon, acide aminé, ribosome, protéine]
    etapes:
      - dialogue:
          - zero: "Comment une recette écrite avec des lettres devient une protéine ?"
          - mia: "On lit trois lettres à la fois : chaque mot de trois lettres désigne une brique."
      - a_quoi_ca_sert: "La traduction transforme le message génétique en protéines : enzymes, anticorps, hormones… tout ce qui fait fonctionner ton corps."
      - texte: |
          Dans le cytoplasme, des **ribosomes** lisent l'ARNm **trois bases par trois bases** : chaque triplet est un **codon**. Chaque codon correspond à un **acide aminé** ; les acides aminés s'enchaînent pour former une **protéine**.
          - 4 bases → 4³ = **64 codons** possibles pour **20 acides aminés** : le code est **redondant** (plusieurs codons pour un même acide aminé).
          - **AUG** = codon de **départ** (méthionine). **UAA, UAG, UGA** = codons **stop**.
          - Le code génétique est **quasi universel** : le même chez la bactérie, le chêne et l'humain — une preuve de notre origine commune.
      - astuce:
          texte: "Lis l'ARN 3 lettres par 3 lettres : chaque codon correspond à un acide aminé. AUG pour démarrer, et UAA, UAG ou UGA pour s'arrêter."
          qui: neo
      - retiens: "Traduction (ribosomes) : codons de 3 bases → acides aminés → protéine. 64 codons, 20 acides aminés. AUG départ ; UAA, UAG, UGA stop."
    exercices:
      - type: nombre
        vars: { b: [9, 12, 15, 30, 300] }
        enonce: "Un ARNm codant fait {{b}} bases (sans compter le codon stop). Combien d'acides aminés dans la protéine ?"
        reponse: "b/3"
        correction: "{{b}} ÷ 3 = {{b/3}} codons = {{b/3}} acides aminés."
      - type: qcm
        vars: { t: [["AUG", "le codon de départ (méthionine)", "un codon stop", "il n'existe pas"], ["UAA", "un codon stop", "le codon de départ", "le codon de l'uracile"], ["UGA", "un codon stop", "le codon de départ", "un codon d'ADN"]] }
        enonce: "Le codon {{t_0}} est…"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Le code génétique est presque le même chez tous les êtres vivants.",true,"Vrai : c'est un argument fort pour une origine commune du vivant."],["Un codon contient 2 bases.",false,"Faux : un codon contient 3 bases."],["Plusieurs codons peuvent coder le même acide aminé.",true,"Vrai : le code est redondant (64 codons pour 20 acides aminés)."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: enzymes
    titre: "Les enzymes"
    objectif: Je décris le fonctionnement d'une enzyme.
    mots: [enzyme, substrat, site actif, spécificité]
    etapes:
      - dialogue:
          - zero: "Pourquoi mon pain devient sucré si je le mâche longtemps ?"
          - neo: "Une enzyme de ta salive découpe l'amidon en sucre. Les enzymes sont de petites machines !"
      - a_quoi_ca_sert: "Les enzymes digèrent les aliments, servent dans les lessives et dans la fabrication des médicaments et des fromages."
      - texte: |
          Les **enzymes** sont des **protéines** qui **accélèrent** les réactions chimiques du vivant (ce sont des catalyseurs). Chaque enzyme a un **site actif** dont la forme correspond à un **substrat** précis : c'est la **spécificité** (comme une clé et une serrure).
          Elles fonctionnent dans des conditions précises : une température trop élevée (la fièvre très forte, la cuisson) ou un pH inadapté **déforme** l'enzyme qui ne marche plus.
          Exemples : l'**amylase** de la salive coupe l'amidon en sucres ; la **lactase** coupe le lactose du lait.
      - astuce:
          texte: "L'enzyme et son substrat, c'est une clé et une serrure : chaque enzyme n'agit que sur une molécule précise, et la chaleur excessive déforme la serrure."
          qui: zero
      - retiens: "Enzyme = protéine catalyseur, spécifique de son substrat (clé/serrure). Sensible à la température et au pH."
    exercices:
      - type: qcm
        vars: { t: [["Que fait l'amylase salivaire ?", "elle découpe l'amidon en sucres", "elle fabrique des os", "elle transporte l'oxygène"], ["Pourquoi une enzyme ne fonctionne-t-elle plus à 80 °C ?", "elle est déformée (dénaturée)", "elle gèle", "elle se multiplie trop"], ["Que signifie « spécificité » d'une enzyme ?", "elle n'agit que sur un substrat précis", "elle agit sur tout", "elle est spéciale pour chaque personne"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Les enzymes sont des protéines.",true,"Vrai : de longues chaînes d'acides aminés repliées."],["Une enzyme est consommée pendant la réaction.",false,"Faux : comme tout catalyseur, elle se retrouve intacte à la fin."],["Le pH peut empêcher une enzyme de fonctionner.",true,"Vrai : un pH trop différent déforme l'enzyme."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: qcm
        vars: { t: [["Pourquoi mâcher longtemps un morceau de pain le rend-il un peu sucré ?", "l'amylase de la salive découpe l'amidon en sucres", "le pain contient du sucre en poudre", "la langue produit du sucre"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"

  - id: neurones-et-glycemie
    titre: "Neurones, hormones et glycémie"
    objectif: Je compare communication nerveuse et hormonale, avec l'exemple de la glycémie.
    mots: [neurone, synapse, neurotransmetteur, hormone, insuline, glycémie, homéostasie]
    etapes:
      - dialogue:
          - zero: "Après un gros goûter, où va tout ce sucre ?"
          - mia: "Ton corps le régule grâce à une hormone, l'insuline. Voyons comment."
      - a_quoi_ca_sert: "Comprendre la régulation de la glycémie, c'est comprendre le diabète, une maladie qui touche des millions de personnes."
      - texte: |
          **Communication nerveuse** : un **neurone** transmet un message électrique le long de son axone ; à la **synapse**, il libère des **neurotransmetteurs** qui activent la cellule suivante. Très **rapide**, très **ciblé**.
          **Communication hormonale** : une glande libère une **hormone** dans le **sang** ; elle agit sur les cellules qui ont le bon **récepteur**. Plus **lente**, plus **durable**.
          **Homéostasie** : le corps garde certaines valeurs stables. Exemple, la **glycémie** (sucre dans le sang, ≈ 1 g/L à jeun) :
          - trop de sucre → le pancréas libère de l'**insuline** → le sucre est stocké → la glycémie baisse ;
          - pas assez → le **glucagon** libère les réserves → elle remonte.
          Dans le **diabète**, cette régulation fonctionne mal.
      - astuce:
          texte: "Insuline = elle fait baisser le sucre dans le sang (elle range le sucre dans les cellules). Glucagon = elle le fait remonter."
          qui: mia
      - retiens: "Nerveux : rapide, synapses, neurotransmetteurs. Hormonal : par le sang, plus lent. Glycémie ≈ 1 g/L, régulée par l'insuline (baisse) et le glucagon (hausse)."
    exercices:
      - type: qcm
        vars: { t: [["Quelle hormone fait baisser la glycémie ?", "l'insuline", "le glucagon", "l'adrénaline"], ["Quelle hormone fait remonter la glycémie ?", "le glucagon", "l'insuline", "la mélatonine"], ["Quel organe produit l'insuline ?", "le pancréas", "le cœur", "les poumons"], ["Comment s'appelle la jonction entre deux neurones ?", "la synapse", "le noyau", "la membrane plasmique"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [["très rapide", "passe par le sang", "utilise des synapses", "effet durable"]] }
        enonce: "Ce caractère correspond-il plutôt à la communication nerveuse ou hormonale ?"
        categories: [nerveuse, hormonale]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Nerveux : rapide et ciblé. Hormonal : par le sang, plus lent et durable."
      - type: nombre
        vars: { t: [["Quelle est environ la glycémie normale à jeun (en g/L) ?", 1]] }
        enonce: "{{t_0}}"
        reponse: "t_1"
        tolerance: 0.2
        unite: g/L
        correction: "Environ 1 g/L (entre 0,7 et 1,1 g/L à jeun)."

id: bio-maison-de-la-sante
matiere: biologie
titre: La Maison de la Santé
sous_titre: Série ST2S - santé et bien-être, indicateurs de santé, protection sociale, physiopathologie humaine
emoji: 🩺
couleur: "#00695c"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 308
specialite: ST2S
version: 1.0.0
intro:
  - narrateur: "Au pied de l'Arbre-Monde, une maison accueillante : un cabinet médical, un bureau d'assistante sociale, un tableau de chiffres sur la santé du village."
  - mia: "La série ST2S, sciences et technologies de la santé et du social, prépare aux métiers du soin, du social et de la santé publique."
  - neo: "On y étudie le corps humain, mais aussi la société : qui tombe malade, pourquoi, et comment on s'entraide."

lecons:
  - id: st2s-sante-determinants
    titre: La santé et ses déterminants
    classe: "1ʳᵉ"
    objectif: Je définis la santé selon l'OMS et je classe les déterminants de santé.
    mots: [santé, OMS, déterminant, bien-être]
    etapes:
      - dialogue:
          - zero: "Être en bonne santé, c'est ne pas être malade, non ?"
          - neo: "Pas seulement ! Pour l'Organisation mondiale de la santé, c'est aussi se sentir bien dans sa tête et parmi les autres."
      - a_quoi_ca_sert: "Les métiers du soin et du social agissent sur tous les aspects de la santé ; comprendre ce qui l'influence aide aussi à prendre soin de soi."
      - texte: |
          **Définition de l'OMS (1946)** : « La santé est un état de complet bien-être **physique**, **mental** et **social**, et ne consiste pas seulement en une absence de maladie ou d'infirmité. »

          **Les déterminants de santé** : tout ce qui influence l'état de santé.
          - **biologiques** : âge, sexe, hérédité ;
          - **comportementaux** : alimentation, activité physique, tabac, sommeil ;
          - **environnementaux** : qualité de l'air, logement, bruit ;
          - **socio-économiques** : revenus, emploi, niveau d'études ;
          - **liés au système de soins** : accès aux médecins, coût des soins.

          Les **inégalités sociales de santé** : en moyenne, les personnes aux revenus modestes vivent moins longtemps en bonne santé.
      - astuce: { texte: "Pour chaque déterminant, demande-toi : la personne peut-elle agir dessus seule, ou faut-il une action collective ?", qui: mia }
      - retiens: "Santé (OMS, 1946) : bien-être **physique**, **mental** et **social**. Déterminants **biologiques**, **comportementaux**, **environnementaux**, **socio-économiques**, **système de soins**. Il existe des **inégalités sociales de santé**."
    exercices:
      - type: classer
        enonce: "Range chaque déterminant : comportemental ou environnemental ?"
        categories: ["Comportemental", "Environnemental"]
        mots: [["Fumer des cigarettes", 0], ["Vivre près d'une route très polluée", 1], ["Faire du sport chaque semaine", 0], ["Habiter un logement humide", 1]]
        correction: "Ce que la personne fait → comportemental ; son milieu de vie → environnemental."
      - type: relier
        enonce: "🔗 Relie chaque dimension de la santé à un exemple."
        paires: [["physique", "ne pas avoir de douleur"], ["mentale", "se sentir serein"], ["sociale", "avoir des relations et une place dans la société"]]
        correction: "Les trois dimensions de la définition de l'OMS."
      - type: qcm
        enonce: "Quelle est la date de la définition de la santé par l'OMS ?"
        choix: ["1946", "1789", "1998", "2020"]
        correction: "**1946**, dans la Constitution de l'OMS."
      - type: vf
        vars: { t: [["L'hérédité est un déterminant biologique.", true], ["Le revenu n'a aucun effet sur la santé.", false], ["La santé ne se résume pas à l'absence de maladie.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Hérédité = biologique ; le revenu influence la santé ; la santé est un bien-être global."

  - id: st2s-indicateurs
    titre: Mesurer l'état de santé d'une population
    classe: "1ʳᵉ"
    objectif: Je calcule et j'interprète des indicateurs - taux de natalité, de mortalité, prévalence, incidence, espérance de vie.
    mots: [taux, prévalence, incidence, espérance de vie]
    etapes:
      - dialogue:
          - mia: "Dans une ville de 50 000 habitants, 500 décès en un an. C'est beaucoup ?"
          - neo: "Pour comparer avec d'autres villes, on calcule un taux : ici 10 pour 1 000 habitants."
      - a_quoi_ca_sert: "Ces indicateurs guident les politiques de santé (où ouvrir un hôpital, quelle campagne de prévention) ; ils sont au cœur de l'épreuve de ST2S."
      - texte: |
          **Taux de mortalité** = nombre de décès ÷ population × 1 000 (pour 1 000 habitants).

          **Taux de natalité** = nombre de naissances ÷ population × 1 000.

          **Prévalence** : le nombre de personnes **malades à un moment donné** (anciens et nouveaux cas).

          **Incidence** : le nombre de **nouveaux cas** apparus pendant une période.

          **Espérance de vie à la naissance** : la durée de vie moyenne d'une génération si les conditions de mortalité restaient celles de l'année. En France, plus de 80 ans.

          **Espérance de vie en bonne santé** : les années vécues sans incapacité.
      - attention: "Prévalence et incidence sont souvent confondues : la prévalence est une photo (tous les malades), l'incidence un flux (les nouveaux)."
      - astuce: { texte: "Incidence = « incident » : ce qui vient d'arriver. Prévalence = ce qui « prévaut » : tout ce qui existe.", qui: zero }
      - retiens: "Taux de **mortalité** et de **natalité** pour 1 000 habitants. **Prévalence** = tous les cas à un instant ; **incidence** = nouveaux cas sur une période. **Espérance de vie** à la naissance et **en bonne santé**."
    exercices:
      - type: nombre
        vars: { t: [[500, 50000, 10], [300, 50000, 6], [900, 100000, 9], [120, 10000, 12]] }
        enonce: "Une ville de {{t_1}} habitants compte {{t_0}} décès dans l'année. Quel est le taux de mortalité, pour 1 000 habitants ?"
        reponse: "t_2"
        correction: "{{t_0}} ÷ {{t_1}} × 1 000 = **{{t_2}} pour 1 000**."
      - type: classer
        enonce: "Range chaque donnée : prévalence ou incidence ?"
        categories: ["Prévalence", "Incidence"]
        mots: [["Le nombre total de diabétiques en France au 1er janvier", 0], ["Le nombre de nouveaux cas de grippe cette semaine", 1], ["Le nombre de personnes vivant avec l'asthme aujourd'hui", 0], ["Le nombre de cancers diagnostiqués cette année", 1]]
        correction: "Tous les cas à un instant → prévalence ; nouveaux cas sur une période → incidence."
      - type: nombre
        vars: { t: [[600, 50000, 12], [450, 50000, 9], [1100, 100000, 11], [80, 10000, 8]] }
        enonce: "Une ville de {{t_1}} habitants compte {{t_0}} naissances dans l'année. Quel est le taux de natalité, pour 1 000 habitants ?"
        reponse: "t_2"
        correction: "{{t_0}} ÷ {{t_1}} × 1 000 = **{{t_2}} pour 1 000**."
      - type: vf
        vars: { t: [["L'espérance de vie en bonne santé est plus courte que l'espérance de vie.", true], ["L'incidence compte tous les malades, anciens et nouveaux.", false], ["Un taux permet de comparer des populations de tailles différentes.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "La vie en bonne santé est plus courte ; l'incidence ne compte que les nouveaux cas ; le taux rend les populations comparables."

  - id: st2s-protection-sociale
    titre: La protection sociale
    classe: Terminale
    objectif: J'explique les risques couverts par la protection sociale, ses branches et son financement.
    mots: [Sécurité sociale, risque social, cotisation, solidarité]
    etapes:
      - dialogue:
          - zero: "Quand je vais chez le médecin, je ne paie presque rien. Qui paie le reste ?"
          - neo: "La Sécurité sociale, créée en 1945, financée par les cotisations des salariés et des employeurs, et par des impôts : c'est la solidarité."
      - a_quoi_ca_sert: "Les métiers du social accompagnent les personnes dans leurs droits ; et chacun utilise la protection sociale toute sa vie."
      - texte: |
          **Les risques sociaux** : maladie, accident du travail, vieillesse, famille (charges des enfants), chômage, perte d'autonomie, pauvreté.

          **La Sécurité sociale (1945)** comprend plusieurs **branches** : **maladie**, **accidents du travail et maladies professionnelles**, **vieillesse** (retraites), **famille** (allocations familiales), **autonomie** (créée en 2021). Le chômage relève de l'**assurance chômage**.

          **Deux logiques** :
          - **assurance** : on cotise, on est couvert (retraites, chômage) ;
          - **assistance** : on aide ceux qui en ont besoin, sans cotisation préalable (RSA, minimum vieillesse).

          **Financement** : **cotisations sociales** (sur les salaires) et **impôts** (dont la CSG).

          La **mutuelle** (complémentaire santé) rembourse une partie de ce que la Sécurité sociale ne prend pas en charge.
      - astuce: { texte: "Assurance = j'ai cotisé, donc j'ai droit ; assistance = j'en ai besoin, donc on m'aide.", qui: mia }
      - retiens: "Risques : **maladie, accident du travail, vieillesse, famille, chômage, autonomie, pauvreté**. Sécurité sociale (**1945**), branches **maladie, AT-MP, vieillesse, famille, autonomie**. Logiques d'**assurance** et d'**assistance**. Financement : **cotisations** et **impôts** (CSG)."
    exercices:
      - type: classer
        enonce: "Range chaque prestation : logique d'assurance ou d'assistance ?"
        categories: ["Assurance", "Assistance"]
        mots: [["La pension de retraite après avoir cotisé", 0], ["Le RSA versé aux personnes sans ressources", 1], ["L'allocation chômage après avoir travaillé", 0], ["Le minimum vieillesse", 1]]
        correction: "Lié aux cotisations → assurance ; lié au besoin → assistance."
      - type: relier
        enonce: "🔗 Relie chaque risque à sa branche ou à son régime."
        paires: [["la retraite", "branche vieillesse"], ["les allocations familiales", "branche famille"], ["la perte d'emploi", "assurance chômage"], ["une consultation chez le médecin", "branche maladie"]]
        correction: "Chaque risque a sa protection."
      - type: nombre
        enonce: "En quelle année la Sécurité sociale est-elle créée en France ?"
        reponse: "1945"
        correction: "En **1945**, à la Libération."
      - type: vf
        vars: { t: [["La protection sociale est financée par des cotisations et des impôts.", true], ["La mutuelle remplace entièrement la Sécurité sociale.", false], ["La branche autonomie concerne la perte d'autonomie des personnes âgées ou handicapées.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Cotisations et impôts ; la mutuelle est complémentaire ; branche autonomie depuis 2021."

  - id: st2s-physiopathologie
    titre: Physiopathologie, l'exemple du diabète
    classe: Terminale
    objectif: J'explique la régulation de la glycémie et je distingue diabète de type 1 et de type 2, leurs causes et leur prise en charge.
    mots: [glycémie, insuline, diabète, prévention]
    etapes:
      - dialogue:
          - mia: "Après un repas, le sucre dans le sang augmente. Puis il redescend. Qui s'en occupe ?"
          - neo: "Le pancréas, avec une hormone : l'insuline. Quand ce système ne marche plus, c'est le diabète."
      - a_quoi_ca_sert: "Le diabète touche plus de 4 millions de personnes en France ; les soignants, éducateurs et diététiciens accompagnent ces patients au quotidien."
      - texte: |
          **La glycémie** : le taux de glucose dans le sang, normalement autour de **1 g/L** à jeun.

          **La régulation** : après un repas, le **pancréas** libère de l'**insuline**, qui fait entrer le glucose dans les cellules et le stocke (foie, muscles) : la glycémie baisse.

          **Diabète de type 1** : le pancréas ne fabrique plus d'insuline (maladie auto-immune), souvent chez l'enfant ou le jeune adulte. Traitement : **injections d'insuline**.

          **Diabète de type 2** (le plus fréquent) : l'insuline agit mal (insulinorésistance), favorisé par le **surpoids**, la **sédentarité**, l'âge et l'hérédité. Prise en charge : **alimentation**, **activité physique**, médicaments.

          **Complications** à long terme : atteintes des yeux, des reins, du cœur, des pieds. D'où l'importance de la **prévention** et de l'**éducation thérapeutique**.
      - attention: "Type 1 et type 2 n'ont pas la même cause : on ne « mérite » pas un diabète de type 1, il n'est pas lié au mode de vie."
      - astuce: { texte: "Type 1 = plus d'insuline ; type 2 = insuline qui agit mal.", qui: zero }
      - retiens: "Glycémie ≈ **1 g/L** à jeun, régulée par l'**insuline** du **pancréas**. **Type 1** : plus d'insuline (auto-immun) → injections. **Type 2** : insuline inefficace, lié au surpoids et à la sédentarité → hygiène de vie et médicaments. Prévention et éducation thérapeutique."
    exercices:
      - type: classer
        enonce: "Range chaque caractéristique : diabète de type 1 ou de type 2 ?"
        categories: ["Type 1", "Type 2"]
        mots: [["Le pancréas ne produit plus d'insuline", 0], ["Favorisé par le surpoids et la sédentarité", 1], ["Souvent découvert chez l'enfant ou le jeune adulte", 0], ["Le plus fréquent chez les adultes", 1]]
        correction: "Type 1 : absence d'insuline, souvent jeune ; type 2 : insuline inefficace, lié au mode de vie."
      - type: ordre
        enonce: "Range les étapes de la régulation après un repas."
        items: ["Le repas apporte du glucose", "La glycémie augmente", "Le pancréas libère de l'insuline", "Le glucose entre dans les cellules et la glycémie baisse"]
        correction: "Apport, hausse, insuline, baisse."
      - type: qcm
        enonce: "Quel organe produit l'insuline ?"
        choix: ["Le pancréas", "Le foie", "Le cœur", "L'estomac"]
        correction: "Le **pancréas**."
      - type: vf
        vars: { t: [["Le diabète de type 1 est causé par une mauvaise alimentation.", false], ["L'activité physique aide à prévenir le diabète de type 2.", true], ["Le diabète peut abîmer les yeux et les reins.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le type 1 est auto-immun ; le sport prévient le type 2 ; les complications touchent yeux, reins, cœur, pieds."

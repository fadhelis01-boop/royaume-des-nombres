id: temple-de-la-logique
titre: Le Temple de la Logique
sous_titre: Propositions, implications, ensembles et démonstrations
emoji: 🏛️
couleur: "#455a64"
cycle: maitres
age: 14-18 ans et +
niveau: 3ᵉ – supérieur
ordre: 28
prerequis: [grotte-de-l-algebre]
version: 1.0.0
intro:
  - neo: "Au Temple de la Logique, on ne croit rien sans PREUVE. C'est le cœur des mathématiques."
  - mia: "Un exemple ne prouve rien… mais un contre-exemple suffit à tout renverser !"
  - zero: "Je propose une proposition : « Zéro est génial. » …Est-ce que j'ai besoin d'une preuve ?"
  - neo: "Oui, Zéro. Toujours."

lecons:
  - id: propositions
    titre: Propositions, et, ou, non
    objectif: Je détermine si une proposition est vraie ou fausse et j'utilise les connecteurs et/ou/non.
    mots: [proposition, négation, connecteur]
    etapes:
      - dialogue:
          - mia: "« 7 est premier » : c'est VRAI. « 9 est premier » : c'est FAUX. Ce sont des propositions."
          - neo: "Et « Fais tes devoirs ! » n'est pas une proposition : ce n'est ni vrai ni faux."
      - texte: |
          Une **proposition** est un énoncé qui est soit **vrai**, soit **faux**.
          - **NON P** (négation) : vraie quand P est fausse.
          - **P ET Q** : vraie seulement si **les deux** sont vraies.
          - **P OU Q** : vraie si **au moins une** est vraie (le « ou » mathématique est **inclusif** : les deux peuvent être vraies).

          **Lois de De Morgan** : NON (P ET Q) = (NON P) OU (NON Q) ; NON (P OU Q) = (NON P) ET (NON Q).
      - visuel:
          type: tableau
          lignes:
            - ["P", "Q", "P ET Q", "P OU Q"]
            - ["V", "V", "V", "V"]
            - ["V", "F", "F", "V"]
            - ["F", "V", "F", "V"]
            - ["F", "F", "F", "F"]
        legende: "Table de vérité."
      - a_quoi_ca_sert: "La programmation (les conditions if, &&, ||), les circuits électroniques des ordinateurs (portes logiques), les moteurs de recherche, le raisonnement juridique…"
      - question:
          type: vf
          vars: { a: "2..20", b: "2..20" }
          enonce: "« {{a}} est pair ET {{b}} est pair. » Cette proposition est-elle vraie ?"
          reponse: "a % 2 == 0 && b % 2 == 0"
          correction: "{{a}} est {{si(a%2==0,'pair','impair')}}, {{b}} est {{si(b%2==0,'pair','impair')}}. Le ET exige les deux."
      - astuce:
          texte: "« A ou B » en maths est vrai si au moins l'une est vraie (les deux, c'est permis !). Ce n'est pas le « ou » du menu « fromage ou dessert »."
          qui: zero
    exercices:
      - type: vf
        vars: { a: "2..30", b: "2..30" }
        enonce: "« {{a}} est un multiple de 3 OU {{b}} est un multiple de 3. » Vrai ou faux ?"
        reponse: "a % 3 == 0 || b % 3 == 0"
        correction: "Le OU est vrai si au moins une des deux est vraie."
      - type: qcm
        enonce: "Quelle est la négation de « Tous les élèves ont réussi » ?"
        choix: ["Au moins un élève n'a pas réussi", "Aucun élève n'a réussi", "Tous les élèves ont échoué", "Certains élèves ont réussi"]
        correction: "Pour contredire « tous », il suffit d'UN contre-exemple."
      - type: qcm
        enonce: "Négation de « il pleut ET il fait froid » ?"
        choix: ["il ne pleut pas OU il ne fait pas froid", "il ne pleut pas ET il ne fait pas froid", "il pleut OU il fait froid", "il fait beau ET chaud"]
        correction: "Loi de De Morgan : NON (P ET Q) = (NON P) OU (NON Q)."

  - id: implication
    titre: Implication, réciproque et contraposée
    objectif: Je distingue une implication, sa réciproque et sa contraposée.
    mots: [implication, réciproque, contraposée, équivalence]
    etapes:
      - dialogue:
          - zero: "« Si je suis un hamster, alors j'ai des moustaches. » Donc… si j'ai des moustaches, je suis un hamster !"
          - mia: "Non ! Moi aussi j'ai des moustaches, et je suis une chatte. La RÉCIPROQUE n'est pas toujours vraie."
      - texte: |
          **Implication** « P ⇒ Q » : si P est vraie, alors Q est vraie.
          - **Réciproque** : « Q ⇒ P » (peut être fausse !).
          - **Contraposée** : « NON Q ⇒ NON P » (toujours **équivalente** à l'implication de départ).
          - Si l'implication et sa réciproque sont vraies : **équivalence** « P ⟺ Q ».

          Exemple : « Si un nombre est multiple de 4, alors il est pair » : vraie. Réciproque « s'il est pair, il est multiple de 4 » : fausse (6). Contraposée « s'il est impair, il n'est pas multiple de 4 » : vraie.
      - a_quoi_ca_sert: "Le théorème de Pythagore et sa réciproque, les raisonnements scientifiques et juridiques, éviter les erreurs de logique dans les débats (« tous les X font Y, donc si quelqu'un fait Y c'est un X »)…"
      - question:
          type: qcm
          enonce: "Contraposée de « S'il pleut, alors le sol est mouillé » ?"
          choix: ["Si le sol n'est pas mouillé, alors il ne pleut pas", "Si le sol est mouillé, alors il pleut", "S'il ne pleut pas, alors le sol n'est pas mouillé", "Il pleut et le sol est mouillé"]
          correction: "On inverse et on nie : NON Q ⇒ NON P."
      - astuce:
          texte: "La contraposée dit la même chose que l'implication ; la réciproque, non. « S'il pleut, le sol est mouillé » ne veut pas dire « si le sol est mouillé, il pleut »."
          qui: mia
    exercices:
      - type: qcm
        enonce: "Réciproque de « Si ABC est rectangle en A, alors BC² = AB² + AC² » ?"
        choix: ["Si BC² = AB² + AC², alors ABC est rectangle en A", "Si ABC n'est pas rectangle, alors BC² ≠ AB² + AC²", "ABC est rectangle", "BC² = AB² + AC²"]
        correction: "On échange les deux parties : c'est la réciproque de Pythagore (qui est vraie !)."
      - type: vf
        enonce: "« Si un nombre est pair, alors il est multiple de 4. » Vrai ou faux ?"
        reponse: false
        correction: "Faux : 6 est pair mais n'est pas multiple de 4. Un seul contre-exemple suffit."
      - type: vf
        enonce: "Une implication et sa contraposée ont toujours la même valeur de vérité."
        reponse: true
        correction: "Oui, elles sont logiquement équivalentes. C'est très utile pour démontrer !"

  - id: quantificateurs
    titre: Les quantificateurs « pour tout » et « il existe »
    objectif: Je lis et j'écris des énoncés avec ∀ et ∃, et je les nie.
    mots: [quantificateur]
    etapes:
      - dialogue:
          - neo: "« Pour tout réel x, x² ≥ 0 » : vrai. « Il existe un réel x tel que x² = 2 » : vrai aussi (√2) !"
          - mia: "∀ se lit « pour tout » et ∃ « il existe ». Ce sont des A et E renversés."
      - texte: |
          - $\forall x \in \mathbb{R},\ x^2 \ge 0$ : « pour **tout** réel $x$… »
          - $\exists x \in \mathbb{R},\ x^2 = 2$ : « il **existe** (au moins) un réel $x$ tel que… »

          **Négation** : on échange ∀ et ∃ et on nie la propriété.
          NON ($\forall x,\ P(x)$) = $\exists x,\ \text{NON } P(x)$ : un **contre-exemple** suffit !

          **Attention à l'ordre** : « ∀ élève ∃ un livre qu'il aime » (chacun le sien) ≠ « ∃ un livre ∀ élève l'aime » (un livre que tout le monde aime).
      - a_quoi_ca_sert: "Écrire précisément une définition, une règle ou un contrat, les bases de données (« tous les clients qui… »), la logique des programmes…"
      - question:
          type: vf
          enonce: "« Pour tout réel x, x² > x. » Vrai ou faux ?"
          reponse: false
          correction: "Faux : pour x = 0,5, x² = 0,25 < 0,5. Un contre-exemple suffit."
      - astuce:
          texte: "Pour nier : « pour tout » devient « il existe », et inversement. « Tous les chats sont gris » se nie en « il existe un chat qui n'est pas gris »."
          qui: neo
    exercices:
      - type: vf
        enonce: "« Il existe un entier n tel que n² = 50. » Vrai ou faux ?"
        reponse: false
        correction: "7² = 49 et 8² = 64 : aucun entier ne convient."
      - type: qcm
        enonce: "Négation de « ∀x ∈ ℝ, f(x) > 0 » ?"
        choix: ["∃x ∈ ℝ, f(x) ≤ 0", "∀x ∈ ℝ, f(x) ≤ 0", "∃x ∈ ℝ, f(x) > 0", "∀x ∈ ℝ, f(x) < 0"]
        correction: "On remplace ∀ par ∃ et on nie « > 0 » en « ≤ 0 »."
      - type: vf
        enonce: "« Pour tout entier n, n² + n est pair. » Vrai ou faux ?"
        reponse: true
        correction: "Vrai : n² + n = n(n + 1), produit de deux entiers consécutifs, dont l'un est pair."

  - id: absurde
    titre: Le raisonnement par l'absurde - √2 est irrationnel
    objectif: Je comprends une démonstration par l'absurde.
    mots: [raisonnement par l'absurde, irrationnel]
    etapes:
      - dialogue:
          - mia: "Pour prouver que quelque chose est vrai, on suppose que c'est FAUX… et on arrive à une contradiction !"
          - neo: "Comme un détective : « Si le suspect était coupable, il aurait été à deux endroits en même temps. Impossible. Donc il est innocent. »"
      - texte: |
          **Théorème** : $\sqrt{2}$ n'est pas une fraction (il est **irrationnel**).

          **Démonstration par l'absurde** :
          1. Supposons que $\sqrt{2} = \dfrac{p}{q}$, fraction **irréductible**.
          2. Alors $p^2 = 2q^2$ : $p^2$ est pair, donc $p$ est pair : $p = 2k$.
          3. Alors $4k^2 = 2q^2$, soit $q^2 = 2k^2$ : $q$ est pair aussi.
          4. $p$ et $q$ sont tous les deux pairs : la fraction n'était **pas** irréductible. **Contradiction !**
          5. Donc $\sqrt{2}$ n'est pas une fraction. ∎
      - histoire:
          titre: Une découverte dérangeante
          texte: "Selon la tradition, c'est un disciple de Pythagore (on cite souvent Hippase de Métaponte) qui aurait découvert l'irrationalité de √2, au Vᵉ siècle av. J.-C. — une découverte qui contredisait l'idée pythagoricienne que « tout est nombre » entier ou fraction. La légende raconte même qu'il fut puni pour l'avoir révélée !"
      - a_quoi_ca_sert: "C'est l'une des méthodes de preuve les plus puissantes : infinité des nombres premiers, impossibilité de certains algorithmes en informatique, et même en philosophie et en droit."
      - question:
          type: ordre
          enonce: "Remets dans l'ordre les étapes d'un raisonnement par l'absurde."
          items: ["Supposer que l'affirmation est fausse", "En déduire des conséquences logiques", "Arriver à une contradiction", "Conclure que l'affirmation est vraie"]
          correction: "Supposer le contraire → déduire → contradiction → conclure."
      - astuce:
          texte: "Par l'absurde : suppose le contraire de ce que tu veux prouver, puis tire le fil jusqu'à une contradiction. Comme un détective qui démonte un faux alibi."
          qui: zero
    exercices:
      - type: qcm
        enonce: "Dans la preuve de l'irrationalité de √2, quelle est la contradiction ?"
        choix: ["p et q sont tous les deux pairs alors que p/q est irréductible", "p² est négatif", "√2 est plus grand que 2", "q vaut zéro"]
        correction: "On avait supposé la fraction irréductible, mais on trouve 2 qui divise p et q."
      - type: vf
        enonce: "Si $n^2$ est pair, alors $n$ est pair. Vrai ou faux ?"
        reponse: true
        correction: "Vrai (par contraposée : si n est impair, n = 2k + 1, alors n² = 4k² + 4k + 1 est impair)."
      - type: qcm
        enonce: "Quelle méthode utilise Euclide pour prouver qu'il y a une infinité de nombres premiers ?"
        choix: ["le raisonnement par l'absurde", "la récurrence", "le calcul de tous les premiers", "un dessin"]
        correction: "Il suppose qu'il y en a un nombre fini, multiplie-les tous et ajoute 1 : ce nouveau nombre n'est divisible par aucun d'eux. Contradiction !"

  - id: ensembles
    titre: Les ensembles - ∈, ⊂, ∩, ∪
    objectif: J'utilise le vocabulaire des ensembles et je connais les ensembles de nombres.
    mots: [ensemble, intersection, réunion, inclusion]
    etapes:
      - dialogue:
          - mia: "Les nombres entiers sont dans les décimaux, qui sont dans les rationnels, qui sont dans les réels, qui sont dans les complexes. Comme des poupées russes !"
          - zero: "Et moi je suis dans TOUS ! Je suis entier, décimal, rationnel, réel ET complexe !"
      - texte: |
          $$\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R} \subset \mathbb{C}$$
          - $\mathbb{N}$ : entiers naturels (0, 1, 2…) · $\mathbb{Z}$ : entiers relatifs · $\mathbb{D}$ : décimaux · $\mathbb{Q}$ : rationnels (fractions) · $\mathbb{R}$ : réels · $\mathbb{C}$ : complexes.
          - $x \in A$ : « $x$ appartient à $A$ » ; $A \subset B$ : « $A$ est inclus dans $B$ ».
          - $A \cap B$ (**intersection**) : éléments communs ; $A \cup B$ (**réunion**) : éléments de l'un **ou** de l'autre.
      - a_quoi_ca_sert: "Les bases de données (requêtes SQL : intersections, unions), les filtres de recherche, les probabilités (événements), la classification…"
      - question:
          type: qcm
          enonce: "Le nombre $\\frac{1}{3}$ appartient à…"
          choix: ["$\\mathbb{Q}$ mais pas $\\mathbb{D}$", "$\\mathbb{D}$", "$\\mathbb{Z}$", "$\\mathbb{N}$"]
          correction: "1/3 = 0,333… n'a pas d'écriture décimale finie : il est rationnel mais pas décimal."
      - astuce:
          texte: "Les ensembles de nombres s'emboîtent : ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ. Naturels, entiers relatifs, rationnels, réels, complexes."
          qui: mia
    exercices:
      - type: nombre
        vars: { a: "3..8", b: "3..8", c: "1..2" }
        si: "c < a && c < b"
        enonce: "A a {{a}} éléments, B en a {{b}}, et ils ont {{c}} éléments en commun. Combien d'éléments dans $A \\cup B$ ?"
        reponse: "a+b-c"
        correction: "On ne compte pas deux fois les communs : {{a}} + {{b}} − {{c}} = {{a+b-c}}."
      - type: qcm
        enonce: "$\\sqrt{2}$ appartient à…"
        choix: ["$\\mathbb{R}$ mais pas $\\mathbb{Q}$", "$\\mathbb{Q}$", "$\\mathbb{D}$", "$\\mathbb{Z}$"]
        correction: "√2 est réel mais irrationnel (pas une fraction)."
      - type: liste
        enonce: "A = {1 ; 2 ; 3 ; 4 ; 5 ; 6} et B = les nombres pairs. Écris $A \\cap B$ (sépare par « ; »)."
        reponse: [2, 4, 6]
        correction: "Les éléments de A qui sont pairs : 2 ; 4 ; 6."

  - id: contre-exemple
    titre: Conjecturer, vérifier, contredire
    objectif: Je formule une conjecture, je la teste et je cherche un contre-exemple.
    mots: [conjecture, contre-exemple]
    etapes:
      - dialogue:
          - neo: "n² + n + 41 donne un nombre premier pour n = 0, 1, 2, 3… jusqu'à 39 ! Est-ce toujours premier ?"
          - mia: "Testons n = 40 : 40² + 40 + 41 = 1 681 = 41². Pas premier ! 40 exemples ne prouvaient rien."
      - texte: |
          - Une **conjecture** est une affirmation qu'on pense vraie mais qu'on n'a pas encore démontrée.
          - Des **exemples** rendent une conjecture plausible, mais **ne la prouvent pas**.
          - Un seul **contre-exemple** suffit à prouver qu'elle est **fausse**.

          Célèbre : la **conjecture de Goldbach** (1742) : « tout nombre pair supérieur à 2 est la somme de deux nombres premiers ». Vérifiée par ordinateur sur d'immenses quantités de nombres… mais toujours **pas démontrée** !
      - histoire:
          titre: Le dernier théorème de Fermat
          texte: "Vers 1637, Pierre de Fermat écrit dans une marge qu'il n'existe pas d'entiers non nuls tels que $x^n + y^n = z^n$ pour $n \\ge 3$, et qu'il en a une « démonstration merveilleuse » que la marge est trop étroite pour contenir. Il a fallu attendre 1994 pour qu'Andrew Wiles le démontre, après plus de 350 ans d'efforts !"
      - a_quoi_ca_sert: "C'est la démarche scientifique : observer, conjecturer, tester, prouver. Elle protège aussi contre les généralisations hâtives et les fausses informations."
      - question:
          type: nombre
          enonce: "Trouve un contre-exemple : « tout nombre impair est premier » (donne le plus petit impair > 1 qui n'est pas premier)."
          reponse: "9"
          correction: "9 = 3 × 3 est impair mais pas premier."
      - astuce:
          texte: "Pour prouver qu'une affirmation est fausse, un seul contre-exemple suffit. Pour prouver qu'elle est vraie, mille exemples ne suffisent pas : il faut une démonstration."
          qui: neo
    exercices:
      - type: nombre
        enonce: "Pour n = 40, que vaut n² + n + 41 ?"
        reponse: "1681"
        correction: "1 600 + 40 + 41 = 1 681 = 41 × 41."
      - type: champs
        vars: { n: [10, 14, 20, 22, 28, 30, 34, 50] }
        enonce: "Goldbach : écris {{n}} comme la somme de deux nombres premiers p ≤ q (le plus petit p possible)."
        champs:
          - { avant: "p =", reponse: "si(estpremier(3) && estpremier(n-3), 3, si(estpremier(n-5), 5, si(estpremier(n-7), 7, si(estpremier(n-11), 11, 13))))" }
          - { avant: "q =", reponse: "n - si(estpremier(3) && estpremier(n-3), 3, si(estpremier(n-5), 5, si(estpremier(n-7), 7, si(estpremier(n-11), 11, 13))))" }
        correction: "Par exemple {{n}} = {{si(estpremier(n-3),3,si(estpremier(n-5),5,si(estpremier(n-7),7,si(estpremier(n-11),11,13))))}} + {{n - si(estpremier(n-3),3,si(estpremier(n-5),5,si(estpremier(n-7),7,si(estpremier(n-11),11,13))))}}."
      - type: vf
        enonce: "Vérifier une propriété sur 1 000 000 d'exemples suffit à la démontrer."
        reponse: false
        correction: "Non ! Seule une démonstration générale prouve. (n² + n + 41 marche 40 fois de suite puis échoue.)"

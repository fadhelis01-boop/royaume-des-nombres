id: bio-reserve-de-l-ecologue
matiere: biologie
titre: La Réserve de l'Écologue
sous_titre: Spécialité biologie-écologie (lycées agricoles) - écosystèmes, biodiversité et services, dynamique des populations, agroécosystèmes et santé
emoji: 🦉
couleur: "#33691e"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 310
specialite: Biologie-écologie
version: 1.0.0
intro:
  - narrateur: "À l'orée de la forêt, une réserve naturelle : une mare, une prairie fleurie, une haie, et un observatoire en bois pour compter les oiseaux."
  - mia: "La spécialité biologie-écologie, proposée dans les lycées agricoles, étudie le vivant dans son milieu, des cellules aux paysages."
  - neo: "Observer, mesurer, compter, comprendre : c'est le travail des écologues sur le terrain."

lecons:
  - id: bioeco-ecosystemes
    titre: Le fonctionnement d'un écosystème
    classe: "1ʳᵉ"
    objectif: Je décris un écosystème - biotope, biocénose, réseau trophique, flux d'énergie et cycle de la matière.
    mots: [écosystème, réseau trophique, producteur, décomposeur]
    etapes:
      - dialogue:
          - zero: "Une mare, c'est juste de l'eau ?"
          - neo: "C'est un écosystème entier : des algues, des larves, des grenouilles, des hérons, et des bactéries qui recyclent tout."
      - a_quoi_ca_sert: "Comprendre un écosystème permet de le gérer : protéger une rivière, restaurer une zone humide, cultiver sans épuiser le milieu."
      - texte: |
          **Un écosystème** = un **biotope** (le milieu physique : eau, sol, climat) + une **biocénose** (l'ensemble des êtres vivants), et leurs interactions.

          **Le réseau trophique** (qui mange qui) :
          - les **producteurs** (végétaux, algues) fabriquent leur matière grâce à la **photosynthèse** ;
          - les **consommateurs** primaires (herbivores), secondaires (carnivores) ;
          - les **décomposeurs** (bactéries, champignons) recyclent la matière morte en sels minéraux.

          **L'énergie** circule dans un seul sens (soleil → producteurs → consommateurs) et une grande partie se perd à chaque niveau : environ **10 %** seulement passe au niveau suivant.

          **La matière** est recyclée en **cycles** (carbone, azote).
      - astuce: { texte: "L'énergie traverse l'écosystème comme une rivière ; la matière y tourne en rond comme une roue.", qui: mia }
      - retiens: "Écosystème = **biotope** + **biocénose**. Réseau trophique : **producteurs** (photosynthèse), **consommateurs**, **décomposeurs**. **Énergie** : un seul sens, environ **10 %** transmis par niveau. **Matière** : recyclée en **cycles**."
    exercices:
      - type: classer
        enonce: "Range chaque être vivant de la mare : producteur, ou consommateur et décomposeur ?"
        categories: ["Producteur", "Consommateur ou décomposeur"]
        mots: [["Une algue", 0], ["Une grenouille", 1], ["Un nénuphar", 0], ["Un champignon", 1]]
        correction: "Les végétaux produisent leur matière ; les animaux et les champignons la consomment ou la recyclent."
      - type: nombre
        vars: { e: [1000, 5000, 10000, 2000] }
        enonce: "Les producteurs d'un écosystème contiennent {{e}} kJ d'énergie. Environ combien en reçoivent les herbivores, si 10 % passent au niveau suivant ?"
        reponse: "e/10"
        unite: kJ
        correction: "10 % de {{e}} = **{{e/10}} kJ**."
      - type: relier
        enonce: "🔗 Relie chaque terme à sa définition."
        paires: [["le biotope", "le milieu physique"], ["la biocénose", "l'ensemble des êtres vivants"], ["les décomposeurs", "recyclent la matière morte"]]
        correction: "Les mots clés de l'écosystème."
      - type: vf
        vars: { t: [["L'énergie est recyclée dans l'écosystème comme la matière.", false], ["Les producteurs réalisent la photosynthèse.", true], ["Les bactéries du sol participent au cycle de l'azote.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "L'énergie circule dans un seul sens ; producteurs = photosynthèse ; bactéries et cycle de l'azote."

  - id: bioeco-biodiversite
    titre: Biodiversité et services écosystémiques
    classe: "1ʳᵉ"
    objectif: Je décris les trois niveaux de la biodiversité, les services que rendent les écosystèmes et les causes de leur érosion.
    mots: [biodiversité, service écosystémique, pollinisation, érosion]
    etapes:
      - dialogue:
          - mia: "Sans abeilles ni autres pollinisateurs, une grande partie des fruits et légumes disparaîtrait de nos assiettes."
          - zero: "Donc protéger la biodiversité, c'est aussi protéger nos repas ?"
          - neo: "Exactement : la nature nous rend des services, gratuitement."
      - a_quoi_ca_sert: "La protection de la biodiversité est au cœur des métiers de l'environnement, de l'agriculture et de l'aménagement du territoire."
      - texte: |
          **Trois niveaux de biodiversité** :
          - **génétique** : la diversité au sein d'une espèce (variétés de pommes) ;
          - **spécifique** : la diversité des espèces ;
          - **écosystémique** : la diversité des milieux (forêts, prairies, zones humides).

          **Les services écosystémiques** :
          - d'**approvisionnement** (nourriture, bois, eau potable) ;
          - de **régulation** (pollinisation, épuration de l'eau, stockage du carbone, protection contre les crues) ;
          - **culturels** (paysages, loisirs, bien-être).

          **Les causes de l'érosion** de la biodiversité : destruction des habitats, pollutions, changement climatique, espèces exotiques envahissantes, surexploitation.

          **Protéger** : aires protégées, corridors écologiques (trame verte et bleue), pratiques agricoles favorables.
      - astuce: { texte: "Pour les causes de l'érosion, pense à cinq menaces : habitat, pollution, climat, envahisseurs, surexploitation.", qui: zero }
      - retiens: "Biodiversité **génétique**, **spécifique**, **écosystémique**. Services d'**approvisionnement**, de **régulation**, **culturels**. Menaces : **habitats**, **pollutions**, **climat**, **espèces envahissantes**, **surexploitation**. Protéger : aires protégées, **trame verte et bleue**."
    exercices:
      - type: classer
        enonce: "Range chaque service : approvisionnement ou régulation ?"
        categories: ["Approvisionnement", "Régulation"]
        mots: [["Le bois d'une forêt", 0], ["La pollinisation des vergers", 1], ["Le poisson pêché en mer", 0], ["L'épuration de l'eau par une zone humide", 1]]
        correction: "Ce qu'on prélève → approvisionnement ; ce que la nature régule → régulation."
      - type: relier
        enonce: "🔗 Relie chaque niveau de biodiversité à un exemple."
        paires: [["génétique", "plusieurs variétés de pommiers"], ["spécifique", "le nombre d'espèces d'oiseaux d'un bois"], ["écosystémique", "une mosaïque de forêts, prairies et mares"]]
        correction: "Trois niveaux, du gène au paysage."
      - type: qcm
        enonce: "Qu'est-ce qu'un corridor écologique ?"
        choix: ["Un passage qui relie des milieux et permet aux espèces de circuler", "Une autoroute", "Un mur pour protéger une forêt", "Un champ cultivé sans haie"]
        correction: "Haies, rivières, passages à faune relient les habitats : c'est la trame verte et bleue."
      - type: vf
        vars: { t: [["Les espèces exotiques envahissantes menacent la biodiversité.", true], ["Les zones humides n'ont aucun rôle contre les crues.", false], ["La beauté d'un paysage est un service culturel.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Espèces envahissantes, rôle des zones humides, service culturel."

  - id: bioeco-populations
    titre: La dynamique des populations
    classe: Terminale
    objectif: J'explique comment évolue l'effectif d'une population (natalité, mortalité, migrations) et j'estime un effectif par capture-recapture.
    mots: [population, effectif, capture-recapture, capacité limite]
    etapes:
      - dialogue:
          - zero: "Comment on sait combien il y a de grenouilles dans une mare ? On les compte une par une ?"
          - neo: "Impossible ! On en capture, on les marque, on les relâche, puis on en recapture : la proportion de marquées donne une estimation."
      - a_quoi_ca_sert: "Suivre les populations sert à protéger les espèces menacées, à gérer la chasse et la pêche, et à surveiller les ravageurs des cultures."
      - texte: |
          **Une population** : les individus d'une même espèce vivant au même endroit.

          **Son effectif varie** selon les **naissances**, les **morts**, les **arrivées** et les **départs**.

          **La croissance** : rapide quand les ressources sont abondantes, puis elle ralentit et se stabilise autour de la **capacité limite** du milieu (nourriture, place, prédateurs).

          **Les relations entre espèces** : **prédation** (les cycles lynx et lièvres), **compétition**, **parasitisme**, **mutualisme** (fleurs et pollinisateurs).

          **Estimer un effectif par capture-recapture** : on marque M individus, on les relâche, puis on en capture C, dont R sont marqués. Effectif estimé : **N = M × C ÷ R**.
      - attention: "La capture-recapture suppose que les individus marqués se mélangent bien et que la population ne change pas entre les deux captures."
      - astuce: { texte: "Si un quart des individus recapturés sont marqués, c'est que tes marqués représentent un quart de la population.", qui: mia }
      - retiens: "Effectif : **naissances**, **morts**, **arrivées**, **départs** ; croissance qui se stabilise à la **capacité limite**. Relations : **prédation**, **compétition**, **parasitisme**, **mutualisme**. Capture-recapture : **N = M × C ÷ R**."
    exercices:
      - type: nombre
        vars: { t: [[40, 50, 10, 200], [30, 60, 12, 150], [20, 40, 8, 100], [50, 80, 20, 200]] }
        enonce: "On marque {{t_0}} grenouilles. Plus tard, on en capture {{t_1}}, dont {{t_2}} sont marquées. Quel est l'effectif estimé de la population ?"
        reponse: "t_3"
        correction: "N = {{t_0}} × {{t_1}} ÷ {{t_2}} = **{{t_3}}** grenouilles."
      - type: relier
        enonce: "🔗 Relie chaque relation à un exemple."
        paires: [["la prédation", "le renard mange le lapin"], ["le mutualisme", "l'abeille pollinise la fleur qui la nourrit"], ["le parasitisme", "le gui vit aux dépens de l'arbre"], ["la compétition", "deux plantes se disputent la lumière"]]
        correction: "Quatre relations entre espèces."
      - type: classer
        enonce: "Range chaque événement : il augmente ou il diminue l'effectif ?"
        categories: ["Augmente", "Diminue"]
        mots: [["Des naissances au printemps", 0], ["Un hiver très rude", 1], ["L'arrivée d'individus d'une autre mare", 0], ["Le départ de jeunes vers un nouveau territoire", 1]]
        correction: "Naissances et arrivées augmentent l'effectif ; morts et départs le diminuent."
      - type: vf
        vars: { t: [["Une population ne peut pas croître indéfiniment.", true], ["La capture-recapture compte chaque individu un par un.", false], ["Le prédateur et sa proie peuvent avoir des effectifs qui varient en cycles.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Capacité limite ; estimation statistique ; cycles prédateur-proie."

  - id: bioeco-agroecosysteme-sante
    titre: Agroécosystèmes et santé commune
    classe: Terminale
    objectif: Je compare un agroécosystème et un écosystème naturel, et j'explique le lien entre santé humaine, animale et environnementale.
    mots: [agroécosystème, intrant, Une seule santé, zoonose]
    etapes:
      - dialogue:
          - neo: "Un champ de blé, c'est un écosystème ?"
          - mia: "Un écosystème simplifié et piloté par l'agriculteur : un agroécosystème. On y exporte la récolte, il faut donc compenser."
      - a_quoi_ca_sert: "Gérer une exploitation agricole, prévenir les épidémies animales ou humaines : ces notions sont au cœur des métiers agricoles, vétérinaires et environnementaux."
      - texte: |
          **Un agroécosystème** (champ, prairie pâturée, verger) :
          - une **biodiversité réduite** (souvent une seule espèce cultivée) ;
          - une **exportation** de matière (la récolte), compensée par des **intrants** (engrais, eau, traitements) ;
          - des **régulations** naturelles affaiblies (moins d'auxiliaires).

          **Rapprocher l'agroécosystème du naturel** : rotations, cultures associées, haies, couverts végétaux, auxiliaires de culture.

          **« Une seule santé »** (*One Health*) : la santé des humains, des animaux et des écosystèmes est liée. Exemples :
          - les **zoonoses** (maladies transmises de l'animal à l'humain : grippe aviaire, rage) ;
          - l'**antibiorésistance**, favorisée par l'usage excessif d'antibiotiques chez l'humain et l'animal ;
          - les **pollutions** qui touchent à la fois les sols, les animaux et les humains.
      - astuce: { texte: "Une seule santé : trois cercles qui se recoupent, l'humain, l'animal, l'environnement.", qui: zero }
      - retiens: "**Agroécosystème** : biodiversité réduite, **exportation** de la récolte, **intrants**, régulations affaiblies ; le rapprocher du naturel (rotations, haies, couverts). **Une seule santé** : humains, animaux, environnement liés (**zoonoses**, **antibiorésistance**, pollutions)."
    exercices:
      - type: classer
        enonce: "Range chaque caractéristique : écosystème naturel ou agroécosystème ?"
        categories: ["Naturel", "Agroécosystème"]
        mots: [["Une grande diversité d'espèces sauvages", 0], ["La récolte est exportée chaque année", 1], ["Des engrais sont apportés", 1], ["La matière morte reste sur place et est recyclée", 0]]
        correction: "L'agroécosystème exporte la récolte et reçoit des intrants."
      - type: relier
        enonce: "🔗 Relie chaque notion à sa définition."
        paires: [["une zoonose", "une maladie transmise de l'animal à l'humain"], ["un intrant", "un apport extérieur : engrais, eau, traitement"], ["l'antibiorésistance", "des bactéries qui ne sont plus tuées par les antibiotiques"]]
        correction: "Des notions clés de l'agriculture et de la santé."
      - type: qcm
        enonce: "Que signifie l'approche « Une seule santé » ?"
        choix: ["La santé humaine, animale et environnementale sont liées", "Il n'existe qu'une seule maladie", "Seule la santé humaine compte", "Un seul médecin par village"]
        correction: "Humains, animaux et environnement forment un tout."
      - type: vf
        vars: { t: [["La rage est une zoonose.", true], ["Un champ cultivé a en général plus d'espèces qu'une forêt naturelle.", false], ["Les haies favorisent les auxiliaires de culture.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Rage = zoonose ; un champ a moins d'espèces ; haies favorables aux auxiliaires."

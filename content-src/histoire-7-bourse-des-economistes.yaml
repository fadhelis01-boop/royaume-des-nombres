id: hg-bourse-des-economistes
matiere: histoire
titre: La Bourse des Économistes
sous_titre: Licence d'économie - élasticités, choix du producteur, multiplicateur keynésien, avantage comparatif, théorie des jeux
emoji: 💹
couleur: "#1b5e20"
cycle: maitres
age: 18-21 ans
niveau: Supérieur – Bac+3
ordre: 807
specialite: Licence d'économie
version: 1.0.0
intro:
  - narrateur: "À côté du Marché des Sociétés, une ancienne bourse aux colonnes de marbre. Sur les tableaux, des courbes d'offre, des matrices de jeux, des chiffres de croissance."
  - mia: "En licence d'économie, on passe des constats aux modèles : on formalise les choix des individus, des entreprises et des États."
  - neo: "Les maths servent à raisonner, mais l'économie reste une science sociale : chaque modèle a ses hypothèses et ses limites."

lecons:
  - id: elasticite-prix
    titre: L'élasticité-prix de la demande
    classe: Supérieur
    objectif: Je calcule et j'interprète une élasticité-prix, et j'en déduis l'effet d'une hausse de prix sur le chiffre d'affaires.
    mots: [élasticité, demande, élastique, inélastique]
    etapes:
      - dialogue:
          - zero: "Si le prix de l'essence augmente de 10 %, les gens en achètent 10 % de moins ?"
          - neo: "Bien moins que ça : il faut bien aller travailler. La demande d'essence est peu sensible au prix : elle est inélastique."
      - a_quoi_ca_sert: "Les entreprises fixent leurs prix, et les États leurs taxes (tabac, carburant), en s'appuyant sur les élasticités."
      - texte: |
          **Élasticité-prix de la demande** : $e = \dfrac{\text{variation en \% de la quantité demandée}}{\text{variation en \% du prix}}$. Elle est en général **négative**.

          - $|e| > 1$ : demande **élastique** (très sensible au prix : biens de luxe, produits ayant des substituts) ;
          - $|e| < 1$ : demande **inélastique** (peu sensible : biens de première nécessité, carburant, tabac).

          **Conséquence sur le chiffre d'affaires** : si la demande est **inélastique**, une **hausse** de prix **augmente** le chiffre d'affaires ; si elle est **élastique**, elle le **diminue**.

          **Élasticité-revenu** : la sensibilité de la demande au revenu ; positive pour les biens normaux, supérieure à 1 pour les biens de luxe.
      - astuce: { texte: "Élastique comme un ressort : un petit changement de prix, un grand changement de quantité.", qui: mia }
      - retiens: "$e = \\dfrac{\\%\\,\\Delta Q}{\\%\\,\\Delta P}$, en général négative. $|e| > 1$ : **élastique** ; $|e| < 1$ : **inélastique**. Demande inélastique : une hausse de prix **augmente** le chiffre d'affaires. Élasticité-revenu : luxe > 1."
    exercices:
      - type: nombre
        vars: { t: [[10, 5, 0.5], [10, 20, 2], [5, 2, 0.4], [20, 30, 1.5]] }
        enonce: "Le prix augmente de {{t_0}} % et la quantité demandée baisse de {{t_1}} %. Quelle est la valeur absolue de l'élasticité-prix ?"
        reponse: "t_2"
        correction: "{{t_1}} ÷ {{t_0}} = **{{t_2}}**."
      - type: classer
        enonce: "Range chaque bien : demande plutôt élastique ou inélastique ?"
        categories: ["Élastique", "Inélastique"]
        mots: [["Un voyage de luxe", 0], ["Le carburant pour aller travailler", 1], ["Une marque de soda parmi beaucoup d'autres", 0], ["Un médicament indispensable", 1]]
        correction: "Substituts nombreux ou luxe → élastique ; nécessité → inélastique."
      - type: qcm
        enonce: "La demande de tabac est inélastique. Que produit une hausse des taxes sur le paquet ?"
        choix: ["Les recettes fiscales augmentent, la consommation baisse peu", "Tout le monde arrête de fumer immédiatement", "Les recettes baissent fortement", "Rien du tout"]
        correction: "Demande inélastique : la quantité baisse moins que le prix n'augmente."
      - type: vf
        vars: { t: [["Une élasticité de valeur absolue 2 indique une demande élastique.", true], ["Pour une demande élastique, une hausse de prix augmente toujours le chiffre d'affaires.", false], ["Les biens de luxe ont une élasticité-revenu supérieure à 1.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "|e| > 1 = élastique ; le chiffre d'affaires baisse alors ; luxe > 1."

  - id: choix-producteur
    titre: Le producteur - coût marginal et maximisation du profit
    classe: Supérieur
    objectif: J'explique pourquoi une entreprise en concurrence parfaite produit jusqu'à ce que le coût marginal égale le prix.
    mots: [coût marginal, recette marginale, profit, concurrence parfaite]
    etapes:
      - dialogue:
          - mia: "Une boulangerie vend la baguette 1 €. Produire une baguette de plus coûte de plus en plus cher en fin de journée. Jusqu'où produire ?"
          - neo: "Tant que la baguette supplémentaire rapporte plus qu'elle ne coûte. On s'arrête quand le coût de la dernière unité égale son prix."
      - a_quoi_ca_sert: "Le raisonnement « à la marge » guide les décisions de production, de prix et d'investissement, dans toutes les entreprises."
      - texte: |
          **Coût marginal** (Cm) : le coût de production d'**une unité supplémentaire**. Il finit souvent par **augmenter** (rendements décroissants).

          **Recette marginale** (Rm) : ce que rapporte une unité supplémentaire. En **concurrence parfaite**, l'entreprise ne fixe pas le prix : $Rm = P$.

          **Maximisation du profit** : produire tant que $Rm > Cm$ ; l'optimum est atteint quand $Cm = Rm$, soit $Cm = P$ en concurrence parfaite.

          **Profit** = recette totale − coût total.

          **En monopole**, l'entreprise fixe son prix : elle produit moins et vend plus cher qu'en concurrence, ce qui justifie le droit de la concurrence.
      - astuce: { texte: "Raisonner à la marge : la question n'est jamais « est-ce rentable en moyenne ? », mais « la prochaine unité rapporte-t-elle plus qu'elle ne coûte ? ».", qui: zero }
      - retiens: "**Coût marginal** : coût d'une unité de plus. En concurrence parfaite, **Rm = P**. Profit maximal quand **Cm = Rm** (donc Cm = P). Profit = recette totale − coût total. Le **monopole** produit moins et plus cher."
    exercices:
      - type: nombre
        vars: { t: [[100, 1200, 1000, 200], [50, 900, 600, 300], [200, 3000, 2500, 500], [80, 400, 100, 300]] }
        enonce: "Une entreprise vend {{t_0}} unités pour une recette totale de {{t_1}} € ; son coût total est de {{t_2}} €. Quel est son profit ?"
        reponse: "t_3"
        unite: "€"
        correction: "{{t_1}} − {{t_2}} = **{{t_3}} €**."
      - type: qcm
        vars: { t: [["4 €", "6 €", "produire davantage"], ["8 €", "6 €", "produire moins"], ["6 €", "6 €", "garder cette quantité"]] }
        enonce: "Prix de marché : 6 €. Coût marginal actuel : {{t_0}}. Que doit faire l'entreprise ?"
        choix: ["{{t_2}}", "fermer immédiatement", "doubler son prix"]
        correction: "Elle compare le coût marginal ({{t_0}}) au prix ({{t_1}}) : **{{t_2}}**."
      - type: relier
        enonce: "🔗 Relie chaque notion à sa définition."
        paires: [["le coût marginal", "le coût d'une unité supplémentaire"], ["la recette marginale", "ce que rapporte une unité supplémentaire"], ["le profit", "recette totale moins coût total"]]
        correction: "Les trois notions du choix du producteur."
      - type: vf
        vars: { t: [["En concurrence parfaite, l'entreprise fixe librement son prix.", false], ["Le profit est maximal quand le coût marginal égale la recette marginale.", true], ["Un monopole produit généralement moins qu'un marché concurrentiel.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "En concurrence parfaite, le prix s'impose ; Cm = Rm ; le monopole restreint la production."

  - id: multiplicateur-keynesien
    titre: Le multiplicateur keynésien et la politique budgétaire
    classe: Bac+2
    objectif: Je calcule le multiplicateur d'investissement et j'explique les effets et les limites d'une relance budgétaire.
    mots: [multiplicateur, propension à consommer, relance, politique budgétaire]
    etapes:
      - dialogue:
          - zero: "Si l'État dépense 10 milliards de plus, le PIB augmente de 10 milliards ?"
          - neo: "Peut-être de plus ! Les 10 milliards deviennent des revenus, qui sont en partie dépensés, et ainsi de suite. C'est l'effet multiplicateur de Keynes."
      - a_quoi_ca_sert: "Le multiplicateur est au cœur des débats sur les plans de relance, l'austérité et la dette publique, en particulier lors des crises."
      - texte: |
          **La propension marginale à consommer** $c$ : la part d'un revenu supplémentaire qui est dépensée (entre 0 et 1).

          **Le multiplicateur** : $k = \dfrac{1}{1 - c}$. Une dépense supplémentaire $\Delta G$ augmente le revenu de $\Delta Y = k \times \Delta G$.

          **Exemple** : $c = 0{,}8$ donne $k = \dfrac{1}{0{,}2} = 5$ : 10 milliards de dépenses publiques peuvent augmenter le revenu de 50 milliards (dans le modèle simple).

          **Keynes** (1936) : en période de chômage, la demande est insuffisante ; l'État peut la **relancer** par la dépense publique.

          **Les limites** : les **importations** (une partie de la dépense profite à l'étranger), l'**épargne** de précaution, la hausse des taux d'intérêt et de la **dette** (effet d'éviction), l'inflation si l'économie est déjà au plein emploi.
      - astuce: { texte: "Plus les ménages dépensent ce qu'ils reçoivent, plus le multiplicateur est grand : c = 0,5 donne 2, c = 0,9 donne 10.", qui: mia }
      - retiens: "$k = \\dfrac{1}{1 - c}$ ; $\\Delta Y = k \\times \\Delta G$. **Keynes** (1936) : relance par la demande en période de chômage. Limites : **importations**, épargne, **éviction**, dette, inflation."
    exercices:
      - type: nombre
        vars: { t: [[0.8, 5], [0.5, 2], [0.75, 4], [0.9, 10]] }
        enonce: "La propension marginale à consommer vaut {{t_0}}. Que vaut le multiplicateur ?"
        reponse: "t_1"
        correction: "$k = \\dfrac{1}{1 - {{t_0}}} = {{t_1}}$."
      - type: nombre
        vars: { t: [[5, 10, 50], [2, 20, 40], [4, 5, 20], [10, 3, 30]] }
        enonce: "Le multiplicateur vaut {{t_0}}. L'État dépense {{t_1}} milliards d'euros de plus. De combien augmente le revenu national, en milliards ?"
        reponse: "t_2"
        correction: "{{t_0}} × {{t_1}} = **{{t_2}} milliards**."
      - type: classer
        enonce: "Range chaque facteur : il renforce ou il affaiblit l'effet multiplicateur ?"
        categories: ["Renforce", "Affaiblit"]
        mots: [["Les ménages dépensent presque tout leur revenu supplémentaire", 0], ["Une grande partie des achats est importée", 1], ["Les ménages épargnent par précaution", 1], ["L'économie a beaucoup de capacités inutilisées", 0]]
        correction: "Plus la dépense reste dans l'économie nationale, plus l'effet est fort."
      - type: vf
        vars: { t: [["Keynes a publié sa Théorie générale en 1936.", true], ["Un multiplicateur de 5 signifie que 1 € dépensé crée jusqu'à 5 € de revenu dans le modèle simple.", true], ["Les importations augmentent l'effet multiplicateur.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "1936 ; k = 5 ; les importations font « fuir » une partie de la dépense."

  - id: avantage-comparatif
    titre: L'avantage comparatif et le commerce international
    classe: Bac+2
    objectif: Je détermine l'avantage comparatif de deux pays avec les coûts d'opportunité, selon la théorie de Ricardo.
    mots: [avantage comparatif, coût d'opportunité, spécialisation, libre-échange]
    etapes:
      - dialogue:
          - mia: "Le Portugal produit le vin et le drap plus efficacement que l'Angleterre. Il a intérêt à tout produire lui-même ?"
          - neo: "Non, montre Ricardo en 1817 : chacun gagne à se spécialiser là où son avantage est relativement le plus grand, puis à échanger."
      - a_quoi_ca_sert: "L'avantage comparatif explique la spécialisation des pays et nourrit les débats sur le libre-échange, le protectionnisme et la mondialisation."
      - texte: |
          **Avantage absolu** (Smith) : un pays produit un bien avec moins de travail qu'un autre.

          **Avantage comparatif** (Ricardo, 1817) : un pays a un avantage comparatif dans le bien qu'il produit avec le plus petit **coût d'opportunité** (ce à quoi il renonce pour en produire une unité).

          **Exemple** : le Portugal produit 1 unité de vin en 80 heures et 1 de drap en 90 heures ; l'Angleterre, 120 et 100 heures. Pour le Portugal, 1 vin « coûte » $\dfrac{80}{90} \approx 0{,}89$ drap ; pour l'Angleterre, $\dfrac{120}{100} = 1{,}2$ drap. Le Portugal a un avantage comparatif dans le **vin**, l'Angleterre dans le **drap**.

          **Conclusion** : la spécialisation et l'échange augmentent la production totale, même pour un pays qui n'a aucun avantage absolu.

          **Les limites et débats** : gagnants et perdants à l'intérieur de chaque pays, dépendance, coûts environnementaux, protection d'industries stratégiques.
      - astuce: { texte: "Avantage comparatif : chacun fait ce qu'il fait « le moins mal » relativement, même s'il est moins bon partout.", qui: zero }
      - retiens: "Avantage **absolu** (Smith) ≠ **comparatif** (Ricardo, 1817). On compare les **coûts d'opportunité** : se spécialiser dans le bien au plus faible coût relatif, puis échanger. Gains globaux, mais gagnants et perdants internes."
    exercices:
      - type: qcm
        enonce: "Pays A : 1 tissu = 2 heures, 1 blé = 4 heures. Pays B : 1 tissu = 6 heures, 1 blé = 6 heures. Dans quel bien A a-t-il un avantage comparatif ?"
        choix: ["Le tissu", "Le blé", "Aucun", "Les deux à égalité"]
        correction: "Pour A, 1 tissu coûte 0,5 blé ; pour B, 1 tissu coûte 1 blé. A a l'avantage comparatif dans le **tissu**, B dans le blé."
      - type: relier
        enonce: "🔗 Relie chaque économiste à sa notion."
        paires: [["Adam Smith", "l'avantage absolu"], ["David Ricardo", "l'avantage comparatif"], ["John Maynard Keynes", "la relance par la demande"]]
        correction: "Trois fondateurs de l'économie politique."
      - type: nombre
        enonce: "En quelle année Ricardo publie-t-il sa théorie de l'avantage comparatif ?"
        reponse: "1817"
        correction: "En **1817**, dans *Des principes de l'économie politique et de l'impôt*."
      - type: vf
        vars: { t: [["Un pays sans aucun avantage absolu peut gagner à l'échange.", true], ["Le coût d'opportunité est ce à quoi on renonce pour produire un bien.", true], ["Le libre-échange ne fait aucun perdant à l'intérieur des pays.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Avantage comparatif ; coût d'opportunité ; il existe des perdants internes."

  - id: theorie-des-jeux
    titre: La théorie des jeux et l'équilibre de Nash
    classe: Bac+3
    objectif: Je trouve un équilibre de Nash dans un jeu simple et j'explique le dilemme du prisonnier.
    mots: [théorie des jeux, stratégie dominante, équilibre de Nash, dilemme du prisonnier]
    etapes:
      - dialogue:
          - zero: "Deux entreprises qui baissent toutes les deux leurs prix gagnent moins. Pourquoi le font-elles quand même ?"
          - neo: "Parce que chacune craint que l'autre baisse les siens. C'est un dilemme du prisonnier : l'intérêt individuel mène à un résultat collectif moins bon."
      - a_quoi_ca_sert: "La théorie des jeux éclaire la concurrence entre entreprises, les négociations, les enchères, la coopération internationale sur le climat et même l'évolution biologique."
      - texte: |
          **Un jeu** : des joueurs, des stratégies, des gains qui dépendent des choix de tous.

          **Stratégie dominante** : la meilleure quelle que soit la stratégie de l'autre.

          **Équilibre de Nash** (John Nash, 1950) : une situation où **aucun joueur n'a intérêt à changer seul** de stratégie.

          **Le dilemme du prisonnier** : deux suspects interrogés séparément. S'ils se taisent tous les deux, peine légère pour chacun ; si l'un dénonce l'autre, il est libéré et l'autre prend une lourde peine ; s'ils se dénoncent mutuellement, peine moyenne. **Dénoncer** est une stratégie dominante : l'équilibre de Nash est que les deux dénoncent, alors que se taire tous les deux serait meilleur pour les deux.

          **Sortir du dilemme** : la **répétition** du jeu (réputation, réciprocité), les contrats, la confiance.
      - astuce: { texte: "Pour tester un équilibre de Nash, place-toi à la place de chaque joueur : « Si l'autre ne change rien, ai-je intérêt à changer ? » Si personne ne répond oui, c'est un équilibre.", qui: mia }
      - retiens: "**Stratégie dominante** : meilleure quoi que fasse l'autre. **Équilibre de Nash** : personne n'a intérêt à dévier seul. **Dilemme du prisonnier** : l'intérêt individuel mène à un résultat collectif sous-optimal. Coopération possible si le jeu se **répète**."
    exercices:
      - type: qcm
        enonce: "Dans le dilemme du prisonnier, quel est l'équilibre de Nash ?"
        choix: ["Les deux joueurs dénoncent", "Les deux joueurs se taisent", "Un seul joueur dénonce", "Il n'y en a pas"]
        correction: "Dénoncer est dominant pour chacun : l'équilibre est la dénonciation mutuelle."
      - type: relier
        enonce: "🔗 Relie chaque notion à sa définition."
        paires: [["la stratégie dominante", "la meilleure, quoi que fasse l'autre"], ["l'équilibre de Nash", "personne n'a intérêt à changer seul"], ["le jeu répété", "la même interaction se reproduit plusieurs fois"]]
        correction: "Les notions de base de la théorie des jeux."
      - type: classer
        enonce: "Range chaque situation : ressemble à un dilemme du prisonnier ou non ?"
        categories: ["Dilemme du prisonnier", "Autre"]
        mots: [["Deux pays qui hésitent à réduire leurs émissions sans garantie que l'autre le fasse", 0], ["Deux entreprises qui se lancent dans une guerre des prix", 0], ["Une personne seule qui choisit son menu", 1], ["Un tirage au sort", 1]]
        correction: "Le dilemme suppose plusieurs acteurs dont l'intérêt individuel contredit l'intérêt collectif."
      - type: vf
        vars: { t: [["Un équilibre de Nash est toujours le meilleur résultat pour tous.", false], ["La répétition du jeu peut favoriser la coopération.", true], ["John Nash a défini son équilibre vers 1950.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le dilemme du prisonnier montre le contraire ; la répétition aide ; Nash, 1950."

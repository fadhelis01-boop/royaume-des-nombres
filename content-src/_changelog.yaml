- version: "2.6.0"
  date: "2026-10-09"
  notes:
    - "Nouvel accueil : la Galaxie est grise… Touche les planètes pour leur rendre leurs couleurs ! Le ciel se colore, le Grand Neutre rapetisse, puis Lya, Néo et Zéro arrivent sur une comète."
    - "Combats contre les Gardiens : un décor peint pour chaque adversaire (l'orage du Grignoteur, la brume d'Ixe, la bibliothèque du Grand Oubli, la mer d'encre de Gribouille, le pays gris du Grand Neutre), une arène qui brille et un éclat de lumière à chaque coup."
    - "Rayons dorés pour les étoiles de fin de défi, le cristal gagné et le diplôme ; la veillée à la bougie pour le Livre de l'aventure."
    - "Correctif : passer d'un Gardien à un autre recommence bien un nouveau combat. Le Gardien ne demande plus de rédaction (rappel libre) en plein combat."
- version: "2.5.0"
  date: "2026-10-09"
  notes:
    - "Nouvel habillage : chaque planète a son ciel et sa vie (chiffres qui flottent, bulles du marais, feuilles qui tombent, étoiles, notes de musique, gouttes d'encre, taches de peinture, mots anglais)."
    - "L'histoire se voit : le brouillard gris du Grand Neutre recule et les décors reprennent leurs couleurs à chaque leçon réussie, avec une vague arc-en-ciel. Sur la carte, la jauge « Couleurs rendues » montre le Grand Neutre qui rapetisse."
    - "La Galaxie devient un vrai ciel étoilé, avec des planètes qui flottent sur leur orbite. L'accueil aussi."
    - "Pages de carnet avec marque-page, rubans de titre, boutons aux couleurs de la planète, mascottes qui respirent."
    - "Nouvelles illustrations : la planète Anglais, l'Île des Premiers Mots et le ciel de la Galaxie."
    - "Pour les parents : réglage « Ambiance visuelle » (enchantée, épurée pour les plus grands, calme sans animation). Automatique : épurée à partir de 12 ans."
- version: "2.4.0"
  date: "2026-10-09"
  notes:
    - "Ta progression ne se perd plus : enregistrement immédiat, copie de secours chaque jour, code de transfert pour changer d'appareil, et synchronisation automatique par fichier sur ordinateur. Si tu as joué sur deux appareils, tout est fusionné."
    - "« Continuer là où tu t'étais arrêté » sur la Galaxie : un bouton te ramène à la leçon en cours, à la bonne étape."
    - "Trois jeux où la notion EST le jeu : la Balance des Mystères (les équations), le Bus de la Dizaine (passer la dizaine) et la Fabrique de Phrases (accorder le verbe)."
    - "Une surprise chaque jour : coffre mystère, comète, visiteur avec une énigme… avec des récompenses qui changent."
    - "Défi entre amis : les mêmes 8 questions pour toi et un ami, même sur un autre appareil, grâce à un petit code."
    - "Moins de QCM : de nouveaux exercices où il faut relier, ranger et écrire ce qu'on a retenu (même au micro). Chaque défi contient au moins un exercice de production."
    - "Nouvelle planète : l'Archipel de l'Écho, pour apprendre ses premiers mots d'anglais en écoutant et en répétant."
    - "Pour les parents : vue d'ensemble de tous les profils, et tests automatiques supplémentaires."
- version: "2.3.0"
  date: "2026-10-09"
  notes:
    - "« Je ne comprends pas : explique-moi autrement » : après une erreur ou pendant le cours, l'enfant choisit une autre porte d'entrée : un dessin, une image de la vie, un exemple résolu pas à pas, la manipulation, le cours relu lentement, l'assistant ou un adulte. 168 leçons ont leur propre analogie et leur schéma."
    - "Contenu vérifié objectif par objectif avec les programmes officiels de maths (cycles 2 et 3) : 13 nouvelles leçons, dont les nombres ordinaux, les nombres en lettres, les tableaux et diagrammes, combien de façons, les patrons du cube, les droites perpendiculaires et parallèles, la médiatrice et la bissectrice, les égalités à trous, les programmes de calcul, les boucles d'instructions et le diagramme circulaire."
    - "En français : comprendre ce que je lis, écrire ma phrase, et la lecture chronométrée (fluence) avec les repères officiels de fin de CP, CE1 et CE2."
    - "Pour les parents : la fluence et les notions qui résistent dans le bilan, un tableau de suivi de tous les profils (CSV), un rappel régulier à ajouter à son agenda, et la grille de correspondance avec les programmes."
- version: "2.2.0"
  date: "2026-10-09"
  notes:
    - "Six nouveaux jeux, un par planète : les potions de Dame Acidia, Allume la lampe, la chaîne alimentaire, le grand tour du Soleil, Devine la silhouette, et Frappe et chante (rythme et note chantée au micro)."
    - "Quêtes du jour, album des habitants libérés, et un habitant sauvé à la moitié de chaque monde."
    - "Dans les leçons : un indice après une erreur, des textes à trous pour se souvenir, « Explique à Zéro », une question souvenir dans chaque défi, et « Je suis sûr / pas sûr » avant de valider."
    - "93 nouveaux schémas : phrases en couleurs, frises, phases de la Lune, saisons, intérieur de la Terre, cycles, schémas légendés."
    - "Chaque « vrai ou faux » a maintenant sa propre explication."
    - "Accueil de planète plus simple : l'histoire d'abord, puis une seule grande action."
    - "Pour les parents : bilans à imprimer, fiche sécurité des expériences, confidentialité, limite de questions à l'assistant, rappel de sauvegarde, mode hors connexion complet, sons visibles pour les enfants malentendants."
- version: "2.1.0"
  date: "2026-10-08"
  notes:
    - "Mia s'appelle désormais Lya ! Même personnage, même π sur le sweat, nouveau prénom."
    - "Chaque leçon de chaque planète a maintenant son astuce pour retenir la règle et son « À quoi ça sert ? » (plus de 700 ajouts)."
    - "Lya, Néo et Zéro ouvrent désormais toutes les leçons de sciences, de musique et de dessin par une petite scène."
    - "Les Muses des planètes ont leur portrait et prennent la parole dans les histoires. Gribouille a ses vraies illustrations."
    - "Toutes les îles de l'Archipel des Mots ont leur décor illustré, et les derniers badges ont leur médaille."
    - "Plus facile à utiliser au clavier et au doigt : contour visible sur le bouton actif, boutons plus grands."
- version: "2.0.0"
  date: "2026-10-08"
  notes:
    - "Le Royaume des Nombres devient « La Galaxie des Savoirs » : 8 planètes en trois familles. Les fondamentaux (maths, français), les sciences (chimie, physique, biologie, Terre et Univers) et les arts (musique, dessin). On change de planète quand on veut ; la progression est gardée partout."
    - "6 nouvelles planètes, de 7 ans au niveau supérieur : 46 nouveaux mondes et plus de 200 leçons. Chacune a son monde « méthode », son histoire, ses gardiens (le Grand Neutre et ses avatars : Dame Bulle, le Mythe du Poids, la Fanfare Muette…) et ses Muses."
    - "Expériences à faire pour de vrai, avec un niveau de sécurité (seul, avec un adulte, à regarder seulement), un pari avant de commencer et l'explication après."
    - "Dessin pas à pas : on suit un guide au doigt ou au stylet, couche par couche, avec miroir, gomme, couleurs ; une galerie garde tous les dessins."
    - "Musique : sons à écouter dans les exercices, portée et clavier interactifs, studio avec un piano où rien ne sonne faux et une boîte à rythmes, jeu de l'Oreille d'or."
    - "Quiz éclair et échauffement pour chaque planète, test de niveau automatique pour toutes les matières, Grand Livre par planète (139 mots), nouveaux badges."
    - "Nouveaux visuels : médaillons des planètes, décors des mondes de sciences, le Grand Neutre. Les décors en double ont été supprimés (site plus léger)."
- version: "1.3.0"
  date: "2026-10-08"
  notes:
    - "Nouveau royaume : l'Archipel des Mots, pour apprendre le français du CP au lycée. 18 îles (sons, noms, ponctuation, verbes, accords, temps, homophones, vocabulaire, phrases, conjugaison, participes, propositions, écriture, lecture, style, poésie, orthographe fine, Académie des Lettres) et le Grimoire des Astuces."
    - "Une histoire à part : Gribouille, la tache qui mangeait les lettres, le Sablier fêlé, puis la Plume d'or. Gribouille devient un allié ; les îles suivantes sont gardées par des Taches sauvages."
    - "Nouveaux exercices : mot à écrire avec barre d'accents, dictée lue à voix haute (mode lent avec la ponctuation dite, correction mot à mot), mots à toucher dans une phrase, mots à classer."
    - "Un dictionnaire de plus de 500 mots écrits pour les enfants, avec exemples, synonymes, contraires, familles et étymologie, un conjugueur complet (tous les temps, plus de 60 verbes irréguliers) et un carnet de mots à collectionner."
    - "Trois jeux de mots (Conjugaison éclair, Mot mystère, Dictée flash), un échauffement de conjugaison, un test de niveau et un défi du jour propres au français."
    - "Nouveaux visuels : poses des mascottes, décors des mondes, personnages de l'histoire."
    - "Correction : la touche Entrée valide de nouveau la réponse au clavier, en maths comme en français ; « l'hippopotame », « l'hiver » s'écrivent avec l'élision."
- version: "1.2.0"
  date: "2026-10-08"
  notes:
    - "La carte du Royaume : un vrai chemin du Nid jusqu'au Temple. Chaque cristal rallumé redonne ses couleurs au lieu, et ton personnage t'attend là où tu en es."
    - "Gemmes et boutique : chaque bonne réponse rapporte des gemmes (plus en série). On les dépense pour habiller son personnage (chapeaux, lunettes, compagnons) et décorer sa cabane. Rien ne s'achète avec de l'argent."
    - "Le Défi du Gardien devient un combat : le Grignoteur esquive, encaisse et croque des gemmes ; Lya, Néo et Zéro ont chacun un pouvoir (indice, coup de queue ou bouclier, gemmes doublées)."
    - "Combos, gerbes d'étoiles, sons de victoire propres à chaque monde ; le Grignoteur ou Ixe surgissent parfois en pleine leçon."
    - "Quatre nouveaux jeux : la Défense du Royaume (tables et additions), le Pont des Fractions, la Course de la Grenouille et le Duel en famille sur le même écran."
    - "Des choix dans l'histoire, un « Précédemment dans le Royaume » à chaque retour, une pause proposée vers 15 minutes."
    - "Mode « je ne lis pas encore » (gros pictogrammes, tout est lu), habitants du monde qui présentent les questions, arrivée par l'histoire avant le test (devenu une première quête)."
    - "Au QCM, réussir au hasard au 2ᵉ essai ne rapporte plus rien. Pour les parents : où l'enfant décroche et la durée de ses séances."
- version: "1.1.0"
  date: "2026-10-08"
  notes:
    - "Une grande histoire encadre l'apprentissage : le Grignoteur éteint les cristaux du Royaume ; chaque monde est un chapitre, chaque Défi du Gardien rallume un cristal. Trois livres, un prologue, des scènes en bande dessinée et un livre de l'aventure à relire."
    - "Nouveau monde pour les plus jeunes : le Nid des Nombres (GS – CP), avec des objets à toucher pour compter."
    - "On manipule : construire un nombre avec des blocs, partager dans des paniers, faire sauter la grenouille, colorier une fraction, régler une horloge, payer avec des pièces."
    - "Les questions arrivent dès le début du cours, et plus seulement à la fin. Moments « Explique à Néo » et défis dans la vraie vie."
    - "Les erreurs classiques reçoivent une explication ciblée (retenue oubliée, soustraction à l'envers, aire et périmètre, 2,15 contre 2,5, fractions…)."
    - "Une leçon est validée à 80 % ; le défi s'adapte après deux erreurs de suite ; Défi du Gardien et diplôme à imprimer pour chaque monde."
    - "Échauffement de 2 minutes, Tour des Additions, Calcul éclair en mode zen sans chrono, musique douce facultative, police OpenDyslexic, clavier simplifié pour les petits."
- version: "1.0.0"
  date: "2026-10-08"
  notes:
    - "Première version : 29 mondes, de la Forêt des Nombres (7 ans) au Temple de la Logique (supérieur), plus l'École des Astuces."
    - "Exercices générés à l'infini et corrigés automatiquement, cours écrits et lus à voix haute par Lya, Néo et Zéro."
    - "Jeux (Calcul éclair, Tour des Tables, Le compte est bon, Vise juste, énigmes), défi du jour, révisions espacées, badges et album."
    - "Espace parents : suivi, temps d'écran, voix, assistant IA sourcé, ajout de domaines sans programmer, sauvegarde."

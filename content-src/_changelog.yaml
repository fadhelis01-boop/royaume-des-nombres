- version: "1.3.0"
  date: "2026-10-08"
  notes:
    - "Nouveau royaume : l'Archipel des Mots, pour apprendre le français du CP au lycée. 18 îles (sons, noms, ponctuation, verbes, accords, temps, homophones, vocabulaire, phrases, conjugaison, participes, propositions, écriture, lecture, style, poésie, orthographe fine, Académie des Lettres) et le Grimoire des Astuces."
    - "Une histoire à part : Gribouille, la tache qui mangeait les lettres, le Sablier fêlé, puis la Plume d'or. Gribouille devient un allié ; les îles suivantes sont gardées par des Taches sauvages."
    - "Nouveaux exercices : mot à écrire avec barre d'accents, dictée lue à voix haute (mode lent avec la ponctuation dite, correction mot à mot), mots à toucher dans une phrase, mots à classer."
    - "Un dictionnaire de plus de 500 mots écrits pour les enfants, avec exemples, synonymes, contraires, familles et étymologie, un conjugueur complet (tous les temps, plus de 60 verbes irréguliers) et un carnet de mots à collectionner."
    - "Trois jeux de mots (Conjugaison éclair, Mot mystère, Dictée flash), un échauffement de conjugaison, un test de niveau et un défi du jour propres au français."
    - "Nouveaux visuels : poses des mascottes, décors des mondes, personnages de l'histoire."
    - "Correction : la touche Entrée valide de nouveau la réponse au clavier, en maths comme en français ; « l'hippopotame », « l'hiver » s'écrivent avec l'élision."
- version: "1.2.0"
  date: "2026-10-08"
  notes:
    - "La carte du Royaume : un vrai chemin du Nid jusqu'au Temple. Chaque cristal rallumé redonne ses couleurs au lieu, et ton personnage t'attend là où tu en es."
    - "Gemmes et boutique : chaque bonne réponse rapporte des gemmes (plus en série). On les dépense pour habiller son personnage (chapeaux, lunettes, compagnons) et décorer sa cabane. Rien ne s'achète avec de l'argent."
    - "Le Défi du Gardien devient un combat : le Grignoteur esquive, encaisse et croque des gemmes ; Mia, Néo et Zéro ont chacun un pouvoir (indice, coup de queue ou bouclier, gemmes doublées)."
    - "Combos, gerbes d'étoiles, sons de victoire propres à chaque monde ; le Grignoteur ou Ixe surgissent parfois en pleine leçon."
    - "Quatre nouveaux jeux : la Défense du Royaume (tables et additions), le Pont des Fractions, la Course de la Grenouille et le Duel en famille sur le même écran."
    - "Des choix dans l'histoire, un « Précédemment dans le Royaume » à chaque retour, une pause proposée vers 15 minutes."
    - "Mode « je ne lis pas encore » (gros pictogrammes, tout est lu), habitants du monde qui présentent les questions, arrivée par l'histoire avant le test (devenu une première quête)."
    - "Au QCM, réussir au hasard au 2ᵉ essai ne rapporte plus rien. Pour les parents : où l'enfant décroche et la durée de ses séances."
- version: "1.1.0"
  date: "2026-10-08"
  notes:
    - "Une grande histoire encadre l'apprentissage : le Grignoteur éteint les cristaux du Royaume ; chaque monde est un chapitre, chaque Défi du Gardien rallume un cristal. Trois livres, un prologue, des scènes en bande dessinée et un livre de l'aventure à relire."
    - "Nouveau monde pour les plus jeunes : le Nid des Nombres (GS – CP), avec des objets à toucher pour compter."
    - "On manipule : construire un nombre avec des blocs, partager dans des paniers, faire sauter la grenouille, colorier une fraction, régler une horloge, payer avec des pièces."
    - "Les questions arrivent dès le début du cours, et plus seulement à la fin. Moments « Explique à Néo » et défis dans la vraie vie."
    - "Les erreurs classiques reçoivent une explication ciblée (retenue oubliée, soustraction à l'envers, aire et périmètre, 2,15 contre 2,5, fractions…)."
    - "Une leçon est validée à 80 % ; le défi s'adapte après deux erreurs de suite ; Défi du Gardien et diplôme à imprimer pour chaque monde."
    - "Échauffement de 2 minutes, Tour des Additions, Calcul éclair en mode zen sans chrono, musique douce facultative, police OpenDyslexic, clavier simplifié pour les petits."
- version: "1.0.0"
  date: "2026-10-08"
  notes:
    - "Première version : 29 mondes, de la Forêt des Nombres (7 ans) au Temple de la Logique (supérieur), plus l'École des Astuces."
    - "Exercices générés à l'infini et corrigés automatiquement, cours écrits et lus à voix haute par Mia, Néo et Zéro."
    - "Jeux (Calcul éclair, Tour des Tables, Le compte est bon, Vise juste, énigmes), défi du jour, révisions espacées, badges et album."
    - "Espace parents : suivi, temps d'écran, voix, assistant IA sourcé, ajout de domaines sans programmer, sauvegarde."

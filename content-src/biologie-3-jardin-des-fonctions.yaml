intro:
  - neo: "Comment une plante fabrique-t-elle du bois avec de l'air et de la lumière ? Comment ton sandwich devient-il de l'énergie pour courir ? C'est ce qu'on va découvrir."
  - zero: "Le sandwich, je sais où il va : dans mon ventre. Fin de l'enquête."

lecons:
  - id: photosynthese
    titre: "La photosynthèse"
    objectif: J'explique comment une plante fabrique sa matière.
    mots: [photosynthèse, chlorophylle, dioxyde de carbone, glucose, dioxygène]
    etapes:
      - dialogue:
          - zero: "Une plante grandit sans manger. Comment c'est possible ?"
          - neo: "Elle fabrique son sucre avec de la lumière, de l'eau et de l'air. C'est la photosynthèse !"
      - texte: |
          Les feuilles contiennent un pigment vert, la **chlorophylle**, qui capte la **lumière**. Avec cette énergie, la plante fabrique des **sucres** (sa nourriture et sa matière) à partir :
          - du **dioxyde de carbone** (CO₂) de l'**air**, qui entre par de minuscules trous des feuilles ;
          - de l'**eau** puisée par les racines.
          Elle rejette du **dioxygène** (O₂) : c'est grâce aux plantes et aux algues que l'air contient de l'oxygène !
          Bilan : eau + dioxyde de carbone + lumière → sucres + dioxygène.
          Le bois d'un arbre vient donc surtout… de l'air !
      - visuel: {"type":"schema","titre":"La photosynthèse","emoji":"🍃","legendes":[{"label":"lumière","detail":"l'énergie"},{"label":"sucre","detail":"fabriqué par la feuille"},{"label":"eau + CO₂","detail":"entrent"},{"label":"dioxygène","detail":"sort"}]}
      - astuce:
          texte: "La plante fait de la cuisine avec de la lumière : eau + dioxyde de carbone + lumière → sucre + dioxygène. Elle mange de l'air et de la lumière !"
          qui: zero
      - retiens: "Photosynthèse : CO₂ (air) + eau + lumière → sucres + O₂. La matière des plantes vient surtout de l'air."
      - a_quoi_ca_sert: "Toute notre nourriture vient, directement ou non, de la photosynthèse. Les forêts et les océans absorbent une partie du CO₂ que nous rejetons."
    exercices:
      - type: qcm
        vars: { t: [["Quel gaz la plante prend-elle dans l'air pour la photosynthèse ?", "le dioxyde de carbone", "le dioxygène", "l'azote"], ["Quel gaz la plante rejette-t-elle pendant la photosynthèse ?", "le dioxygène", "le dioxyde de carbone", "la vapeur d'essence"], ["Quel pigment capte la lumière ?", "la chlorophylle", "le sang", "la mélanine"], ["D'où vient surtout la matière du bois d'un arbre ?", "du dioxyde de carbone de l'air", "de la terre", "de l'engrais"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Les plantes mangent la terre pour grandir.",false,"Faux : leur matière vient surtout du CO₂ de l'air."],["La photosynthèse a besoin de lumière.",true,"Vrai : la lumière apporte l'énergie."],["Sans photosynthèse, il n'y aurait presque pas d'oxygène dans l'air.",true,"Vrai : presque tout le dioxygène de l'air vient de la photosynthèse."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: classer
        vars: { t: [["la lumière", "le dioxygène", "l'eau", "les sucres", "le dioxyde de carbone"]] }
        enonce: "Dans la photosynthèse, est-ce ce que la plante utilise ou ce qu'elle produit ?"
        categories: ["utilisé", "produit"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1], ["{{t_4}}", 0]]
        correction: "Utilisés : lumière, eau, CO₂. Produits : sucres et dioxygène."

  - id: respiration
    titre: "La respiration"
    objectif: Je sais que tous les êtres vivants respirent pour produire de l'énergie.
    mots: [respiration, poumons, branchies, énergie]
    etapes:
      - dialogue:
          - zero: "Pourquoi je suis tout essoufflé quand je cours dans ma roue ?"
          - mia: "Tes muscles ont besoin de plus d'énergie, donc de plus de dioxygène. C'est la respiration !"
      - a_quoi_ca_sert: "La respiration explique pourquoi on est essoufflé en courant et pourquoi on a besoin de manger et de respirer pour avoir de l'énergie."
      - texte: |
          **Tous** les êtres vivants respirent, y compris les plantes (jour et nuit) : ils utilisent le **dioxygène** pour « brûler » doucement les sucres et obtenir de l'**énergie**, et rejettent du **dioxyde de carbone** et de l'eau.
          Les organes changent selon l'animal : **poumons** (mammifères, oiseaux), **branchies** (poissons, têtards), la **peau** aussi chez la grenouille, des petits tubes (**trachées**) chez les insectes.
          Chez nous, l'air entre par le nez, descend par la trachée jusqu'aux **poumons**, où l'oxygène passe dans le **sang**.
      - astuce:
          texte: "Respiration = le contraire de la photosynthèse : sucre + dioxygène → énergie + dioxyde de carbone + eau. Les plantes font les deux !"
          qui: mia
      - retiens: "Respirer = utiliser O₂ et rejeter CO₂ pour produire de l'énergie. Poumons, branchies, peau, trachées selon les espèces."
    exercices:
      - type: qcm
        vars: { t: [["le poisson", "des branchies", "des poumons", "des trachées"], ["le chien", "des poumons", "des branchies", "des feuilles"], ["la sauterelle", "des trachées", "des branchies", "des poumons"], ["le têtard", "des branchies", "des poumons", "des trachées"]] }
        enonce: "Avec quoi respire {{t_0}} ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Les plantes respirent aussi.",true,"Vrai : jour et nuit, comme tous les êtres vivants."],["On expire plus de dioxyde de carbone qu'on n'en inspire.",true,"Vrai : le corps produit du CO₂ en fabriquant de l'énergie."],["La respiration sert à produire de l'énergie.",true,"Vrai : les cellules utilisent le dioxygène pour libérer l'énergie des aliments."],["Le poisson respire l'oxygène de l'air à la surface.",false,"Faux : il utilise le dioxygène dissous dans l'eau, grâce à ses branchies."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: qcm
        vars: { t: [["Où l'oxygène passe-t-il dans le sang ?", "dans les poumons", "dans l'estomac", "dans le cœur"], ["Quel gaz rejetons-nous en expirant ?", "du dioxyde de carbone (et de la vapeur d'eau)", "uniquement de l'oxygène", "de l'azote pur"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"

  - id: digestion
    titre: "Le voyage des aliments"
    objectif: Je décris le trajet et la transformation des aliments.
    mots: [digestion, œsophage, estomac, intestin, nutriments]
    etapes:
      - dialogue:
          - zero: "Où va ma noisette après que je l'ai avalée ?"
          - neo: "Elle part en voyage dans un long tube. Suivons-la !"
      - a_quoi_ca_sert: "Comprendre la digestion aide à bien manger, à comprendre les maux de ventre et l'importance des fibres et de l'eau."
      - texte: |
          1. **Bouche** : les dents broient, la salive commence à transformer les aliments.
          2. **Œsophage** : le tube qui descend à l'estomac.
          3. **Estomac** : il brasse les aliments avec des sucs acides.
          4. **Intestin grêle** (environ 6 à 7 m !) : les aliments sont découpés en **nutriments** minuscules qui passent dans le **sang**.
          5. **Gros intestin** : on récupère l'eau ; ce qui n'est pas digéré forme les selles.
          Le sang apporte les nutriments à toutes les cellules du corps.
      - visuel: {"type":"frise","titre":"Le trajet des aliments","fleche":"le tube digestif","points":[{"emoji":"👄","label":"bouche"},{"emoji":"⬇️","label":"œsophage"},{"emoji":"🥣","label":"estomac"},{"emoji":"〰️","label":"intestin grêle","sous":"les nutriments passent dans le sang"},{"emoji":"🌀","label":"gros intestin"}]}
      - astuce:
          texte: "Le trajet dans l'ordre : Bouche, Œsophage, Estomac, Intestin grêle, Gros intestin. « Bob Est Encore Il Grandit »."
          qui: neo
      - retiens: "Bouche → œsophage → estomac → intestin grêle (passage dans le sang) → gros intestin. Digérer = découper en nutriments."
    exercices:
      - type: ordre
        vars: { t: [["la bouche", "l'œsophage", "l'estomac", "l'intestin grêle", "le gros intestin"]] }
        enonce: "Remets le trajet des aliments dans l'ordre."
        items: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}", "{{t_4}}"]
        correction: "Bouche, œsophage, estomac, intestin grêle, gros intestin."
      - type: qcm
        vars: { t: [["Où les nutriments passent-ils dans le sang ?", "dans l'intestin grêle", "dans l'œsophage", "dans la bouche"], ["Quel est le rôle de l'estomac ?", "brasser les aliments avec des sucs", "respirer", "fabriquer le sang"], ["Combien mesure environ l'intestin grêle d'un adulte ?", "6 à 7 mètres", "30 centimètres", "100 mètres"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Les aliments passent par les poumons.",false,"Faux : les aliments passent dans le tube digestif, l'air dans les poumons."],["Les nutriments sont transportés par le sang.",true,"Vrai : depuis l'intestin, les nutriments passent dans le sang."],["La digestion commence dans la bouche.",true,"Vrai : on mâche et la salive commence à digérer."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: classification
    titre: "Classer en groupes emboîtés"
    objectif: Je range des êtres vivants dans des groupes emboîtés.
    mots: [classification, groupe, vertébré, arthropode]
    etapes:
      - dialogue:
          - zero: "Je suis cousin avec le requin ? Non, pas possible !"
          - mia: "Un cousin très, très éloigné : vous avez tous les deux une colonne vertébrale !"
      - a_quoi_ca_sert: "La classification montre que tous les êtres vivants sont cousins plus ou moins éloignés, et elle aide les médecins et les chercheurs à comparer les espèces."
      - texte: |
          Les scientifiques rangent les êtres vivants dans des **boîtes emboîtées**, selon les caractères qu'ils **partagent** :
          - **Vertébrés** (un squelette interne avec une colonne vertébrale) : poissons, amphibiens, reptiles, oiseaux, mammifères.
          - Parmi eux, les **tétrapodes** (4 membres) : amphibiens, reptiles, oiseaux, mammifères (les ailes et les bras sont des membres).
          - **Arthropodes** (squelette externe et pattes articulées) : insectes (6 pattes), arachnides (8 pattes), crustacés (crabe), mille-pattes.
          Plus deux êtres partagent de caractères, plus ils sont **apparentés**.
      - astuce:
          texte: "Les groupes s'emboîtent comme des poupées russes : on définit chaque boîte par un caractère partagé (vertébrés, puis tétrapodes, puis mammifères…)."
          qui: zero
      - retiens: "Groupes emboîtés selon des caractères partagés. Vertébrés : colonne vertébrale. Arthropodes : squelette externe, pattes articulées."
    exercices:
      - type: classer
        vars: { t: [["le chat", "la fourmi", "le serpent", "le crabe"], ["le saumon", "l'araignée", "le pigeon", "le scarabée"], ["la grenouille", "la crevette", "l'humain", "le mille-pattes"]] }
        enonce: "Vertébré ou arthropode ?"
        categories: [vertébré, arthropode]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Colonne vertébrale → vertébré ; squelette externe et pattes articulées → arthropode."
      - type: qcm
        vars: { t: [["le crabe", "un crustacé (arthropode)", "un poisson", "un insecte"], ["le scorpion", "un arachnide (8 pattes)", "un insecte", "un reptile"], ["la chauve-souris", "un mammifère", "un oiseau", "un insecte"]] }
        enonce: "{{t_0}} est…"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Les ailes d'un oiseau sont des membres, comme nos bras.",true,"Vrai : même organisation des os que nos bras."],["Le serpent est un vertébré.",true,"Vrai : il a une colonne vertébrale."],["Les insectes ont une colonne vertébrale.",false,"Faux : ils ont un squelette externe, pas de colonne vertébrale."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"

  - id: ecosystemes
    titre: "Les écosystèmes"
    objectif: Je décris un écosystème et l'effet d'une perturbation.
    mots: [écosystème, réseau alimentaire, biodiversité]
    etapes:
      - dialogue:
          - zero: "Si on enlève les loups, la forêt sera plus tranquille, non ?"
          - neo: "Pas si simple ! Tout est relié : enlever une espèce peut bouleverser toutes les autres."
      - a_quoi_ca_sert: "Comprendre un écosystème aide à prévoir les conséquences de nos actions : pesticides, déforestation, introduction d'espèces."
      - texte: |
          Un **écosystème** = un milieu (mare, forêt, prairie) + tous les êtres vivants qui y vivent + leurs relations.
          Les chaînes alimentaires s'entremêlent en un **réseau alimentaire**. Si une espèce disparaît, les autres sont touchées : moins d'insectes pollinisateurs → moins de fruits → moins de nourriture pour les oiseaux…
          La **biodiversité** (la variété des espèces) rend les écosystèmes plus solides. L'humain la menace (pollution, destruction des milieux, espèces invasives) mais peut aussi la protéger (haies, mares, réserves).
      - visuel: {"type":"cycle","centre":"écosystème","etapes":[{"emoji":"🌿","label":"producteurs"},{"emoji":"🐇","label":"consommateurs"},{"emoji":"🍄","label":"décomposeurs"},{"emoji":"⛰️","label":"sels minéraux du sol"}]}
      - astuce:
          texte: "Écosystème = un milieu + les êtres vivants qui y vivent + leurs relations. Retire une pièce et tout le reste bouge, comme un mobile suspendu."
          qui: mia
      - retiens: "Écosystème = milieu + êtres vivants + relations. Tout est lié : une disparition a des effets en chaîne. Biodiversité = solidité."
    exercices:
      - type: qcm
        vars: { t: [["Les abeilles disparaissent d'un verger.", "il y aura moins de fruits (moins de pollinisation)", "il y aura plus de fruits", "rien ne change"], ["On supprime tous les renards d'une région.", "les lapins risquent de pulluler et de manger trop de plantes", "les lapins disparaissent", "rien ne change"], ["On plante des haies entre les champs.", "les oiseaux et insectes y trouvent abri : la biodiversité augmente", "la biodiversité diminue", "les champs disparaissent"]] }
        enonce: "{{t_0}} Que peut-il se passer ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["Dans un écosystème, les espèces sont reliées entre elles.",true,"Vrai : elles se mangent, s'abritent, se pollinisent…"],["La disparition d'une seule espèce n'a jamais d'effet.",false,"Faux : une disparition peut se répercuter sur tout le réseau."],["Une mare dans un jardin peut augmenter la biodiversité.",true,"Vrai : elle attire grenouilles, libellules, oiseaux…"]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: classer

        enonce: "Cette action protège-t-elle ou menace-t-elle la biodiversité ?"
        categories: [protège, menace]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Relâcher un animal exotique peut créer une espèce invasive qui chasse les espèces locales."

  - id: microbes-utiles
    titre: "Les micro-organismes utiles"
    objectif: Je connais le rôle des levures et des bactéries dans l'alimentation.
    mots: [levure, fermentation, bactérie lactique]
    etapes:
      - dialogue:
          - zero: "Les microbes, c'est tous des méchants !"
          - mia: "Pas du tout ! Sans eux, pas de yaourt, pas de pain, pas de fromage."
      - a_quoi_ca_sert: "Sans microbes, pas de pain, de yaourt, de fromage ni de chocolat ! Et notre intestin en abrite des milliards qui nous aident à digérer."
      - texte: |
          - La **levure** (un champignon microscopique) se nourrit de sucre et rejette du **dioxyde de carbone** : les bulles font **gonfler la pâte à pain**. C'est une **fermentation**.
          - Des **bactéries lactiques** transforment le lait en **yaourt** ou en fromage.
          - Notre **intestin** abrite des milliards de bactéries utiles (le **microbiote**) qui aident à digérer et nous protègent.
      - experience:
          titre: Le ballon de la levure
          securite: orange
          materiel: ["une petite bouteille", "un sachet de levure de boulanger", "2 cuillères de sucre", "de l'eau tiède (pas chaude)", "un ballon de baudruche"]
          prediction:
            question: "Levure + sucre + eau tiède dans une bouteille fermée par un ballon : que fera le ballon au bout de 30 minutes ?"
            choix: ["Il se gonfle peu à peu", "Il reste plat", "Il éclate tout de suite"]
          etapes:
            - "Verse l'eau tiède, le sucre et la levure dans la bouteille ; mélange doucement."
            - "Fixe le ballon sur le goulot."
            - "Laisse dans un endroit tiède et observe toutes les 10 minutes."
          observation: "Des bulles apparaissent et le ballon se gonfle lentement."
          explication: "La levure est vivante : elle mange le sucre et rejette du CO₂, qui remplit le ballon. Dans le four, ce gaz fait lever la pâte. Avec de l'eau trop chaude, la levure meurt et rien ne se passe."
      - astuce:
          texte: "Les levures font des bulles (pain qui gonfle), les bactéries lactiques rendent le lait acide et épais (yaourt). Les microbes sont surtout nos alliés."
          qui: neo
      - retiens: "Levures et bactéries utiles : pain, yaourt, fromage, microbiote. La fermentation produit du gaz (CO₂)."
    exercices:
      - type: qcm
        vars: { t: [["Qu'est-ce qui fait gonfler la pâte à pain ?", "le CO₂ produit par la levure", "la chaleur du four seulement", "l'air qu'on souffle dedans"], ["Qui transforme le lait en yaourt ?", "des bactéries lactiques", "le réfrigérateur", "le sucre"], ["Qu'est-ce que le microbiote intestinal ?", "les bactéries utiles de notre intestin", "une maladie", "un organe"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { "t":[["La levure est un être vivant.",true,"Vrai : c'est un champignon microscopique, elle se nourrit et se reproduit."],["Toutes les bactéries sont nuisibles.",false,"Faux : beaucoup sont utiles (yaourt, fromage, digestion)."],["Si l'eau est trop chaude, la levure meurt.",true,"Vrai : au-delà d'environ 50 °C, la levure meurt."]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "{{t_2}}"
      - type: classer
        vars: { t: [["le pain", "la salade nature", "le yaourt", "la pomme crue"], ["le fromage", "le riz cuit", "la choucroute", "l'eau"]] }
        enonce: "Cet aliment est-il fabriqué grâce à des micro-organismes ?"
        categories: ["oui (fermentation)", "non"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Pain, yaourt, fromage, choucroute : fermentations par des levures ou des bactéries."

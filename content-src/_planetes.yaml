      graines:
        sprite: nuage
        nom: Le Grignoteur
        qui: nuage
        ouverture: "Hi hi ! Le cristal est caché derrière dix nuages. Pour chaque bonne réponse, un nuage s'envole… Tu n'y arriveras jamais ! (enfin… peut-être que si)"
        cri: "Viens donc, petit calculateur !"
        aie: ["Aïe ! Mon nuage s'effiloche !", "Hé ! Tu calcules trop vite !", "Pfff… encore un nuage envolé.", "Comment tu as su ?!"]
        nargue: ["Hi hi ! Raté ! Je croque tes gemmes !", "Miam ! Merci pour les gemmes !", "Trop lent ! Crunch !"]
        jeton: "☁️"
      explorateurs:
        sprite: ixe
        nom: Ixe
        qui: ixe
        ouverture: "Dix énigmes gardent le fragment de carte. Montre-moi que tu sais trouver les inconnues !"
        cri: "Attrape-moi si tu peux !"
        aie: ["Démasquée ! Bon, d'accord…", "Tu as trouvé ma valeur !", "Hi hi, bien joué !"]
        nargue: ["Je change de couleur… raté !", "x peut valoir n'importe quoi, hi hi !"]
        jeton: "☁️"
      maitres:
        sprite: oubli
        nom: Le Grand Oubli
        qui: narrateur
        ouverture: "Le Grand Oubli a effacé dix pages. Pour chaque bonne réponse, une page se réécrit…"
        cri: "Je vais tout effacer…"
        aie: ["Cette page… se réécrit…", "Ce qui est démontré me résiste !", "Non… pas une preuve !"]
        nargue: ["Encore une page blanche…", "Oublié ! Oublié !"]

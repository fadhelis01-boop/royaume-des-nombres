# La Galaxie des Savoirs : une planète = une matière.
# AJOUTER UNE MATIÈRE SANS RECODER : ajouter une entrée ici, puis des mondes avec `matiere: <id>`
# (et, si on veut, une histoire `histoire: _histoire_<id>.yaml`). Voir docs/FORMAT-CONTENU.md.
#
# Champs :
#   id, famille (fondamentaux | sciences | arts), titre (nom de la planète), matiere (nom court),
#   emoji, couleur, accroche (une phrase pour la galaxie),
#   histoire (fichier) + prologue { id, titre, appel },
#   objet { emoji, un, des, fait } : ce que rapporte chaque Défi du Gardien (« 💎 3 cristaux rallumés »),
#   echauffement, astuces (sous-titre du monde « astuces »), liens (raccourcis en bas de la carte),
#   gardiens { graines | explorateurs | maitres } : sprite (nuage, ixe, oubli, gribouille, tache, neutre),
#     nom, qui (personnage qui parle à l'ouverture), ouverture, cri (au début du combat),
#     aie (quand il perd un point), nargue (quand l'enfant se trompe), jeton (case de vie)
#   jeux : les jeux mis en avant pour cette planète (ordre d'affichage).

familles:
  fondamentaux: { titre: "Les fondamentaux", emoji: "📐", accroche: "Compter, lire, écrire : les clés de tout le reste." }
  sciences: { titre: "Les sciences", emoji: "🔬", accroche: "Comprendre la matière, la vie, les forces et le ciel." }
  arts: { titre: "Les arts", emoji: "🎨", accroche: "Écouter, jouer, dessiner, créer." }

planetes:
  - id: maths
    famille: fondamentaux
    titre: Le Royaume des Nombres
    matiere: Maths
    emoji: "🔢"
    couleur: "#5b4bdb"
    accroche: "Compter, calculer, raisonner, jusqu'aux mathématiques des grands."
    histoire: _histoire.yaml
    prologue: { id: prologue, titre: "Prologue — Le Royaume s'éteint", appel: "Le Royaume des Nombres s'éteint… Écoute l'histoire." }
    objet: { emoji: "💎", un: "cristal rallumé", des: "cristaux rallumés" }
    echauffement: "2 minutes de calcul rapide"
    astuces: "Méthodes et calcul rapide"
    liens:
      - { texte: "📖 Le Grand Livre", vers: "/livre" }
      - { texte: "✍️ Inventer un problème", vers: "/inventer" }
    jeux: [defense, pont, course, duel, eclair, additions, tables, compte, vise, enigmes]

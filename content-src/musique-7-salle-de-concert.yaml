id: mu-salle-de-concert
matiere: musique
titre: La Salle de Concert
sous_titre: Spécialité musique - commentaire d'écoute, périodes et styles, musiques actuelles, pratique et création
emoji: 🎻
couleur: "#4e342e"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 507
specialite: Musique
version: 1.0.0
intro:
  - narrateur: "Au cœur de la Cité des Résonances, une grande salle de concert attend son public. Sur scène, un orchestre, une batterie, un ordinateur."
  - mia: "La spécialité musique, c'est écouter, comprendre, jouer et créer, de Bach au hip-hop."
  - neo: "Ici, on apprend à mettre des mots précis sur ce qu'on entend."

lecons:
  - id: mus-commentaire-ecoute
    titre: Le commentaire d'écoute
    classe: "1ʳᵉ"
    objectif: Je décris une œuvre entendue avec un vocabulaire précis - formation, tempo, nuances, texture, forme.
    mots: [formation, tempo, texture, forme]
    etapes:
      - dialogue:
          - zero: "J'écoute et je dis « c'est joli, c'est calme »…"
          - neo: "C'est un début ! Mais quels instruments ? Quel tempo ? Une mélodie seule ou plusieurs voix ? Comment la pièce est-elle construite ?"
      - a_quoi_ca_sert: "Le commentaire d'écoute est un exercice central de la spécialité ; savoir décrire un son sert aussi aux métiers du son, de la radio, du jeu vidéo et du cinéma."
      - texte: |
          **La formation** : voix ou instruments, soliste, petit ensemble, orchestre, groupe.

          **Le tempo** : lent (adagio, largo), modéré (moderato), rapide (allegro, presto) ; **accelerando** (accélère), **ritardando** (ralentit).

          **Les nuances** : de **pianissimo** (pp, très doux) à **fortissimo** (ff, très fort) ; **crescendo** (de plus en plus fort), **decrescendo**.

          **La texture** :
          - **monodie** : une seule mélodie (chant grégorien) ;
          - **mélodie accompagnée** (homophonie) : une mélodie et des accords ;
          - **polyphonie** : plusieurs mélodies indépendantes en même temps (fugue).

          **La forme** : couplet-refrain, **ABA**, thème et variations, rondo (A B A C A…).
      - attention: "Décris d'abord ce que tu entends (paramètres du son), puis interprète (l'effet, l'émotion) : l'interprétation doit s'appuyer sur la description."
      - astuce: { texte: "Méthode en quatre questions : qui joue ? à quelle vitesse ? combien de lignes musicales ? comment c'est construit ?", qui: mia }
      - retiens: "Décrire : **formation**, **tempo** (adagio, allegro…), **nuances** (pp à ff, crescendo), **texture** (**monodie**, **mélodie accompagnée**, **polyphonie**), **forme** (couplet-refrain, ABA, variations, rondo)."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque terme à son sens."
        paires: [["allegro", "rapide"], ["adagio", "lent"], ["crescendo", "de plus en plus fort"], ["pianissimo", "très doux"]]
        correction: "Le vocabulaire italien du tempo et des nuances."
      - type: classer
        enonce: "Range chaque exemple : monodie ou polyphonie ?"
        categories: ["Monodie", "Polyphonie"]
        mots: [["Un chant grégorien à l'unisson", 0], ["Une fugue de Bach à quatre voix", 1], ["Une berceuse chantée seule, sans accompagnement", 0], ["Un canon à trois voix", 1]]
        correction: "Une seule ligne → monodie ; plusieurs lignes indépendantes → polyphonie."
      - type: qcm
        enonce: "Une pièce fait entendre un thème A, puis un passage B différent, puis le thème A revient. Quelle forme ?"
        choix: ["ABA", "Thème et variations", "Monodie", "Rondo ABACA"]
        correction: "Retour du thème après un contraste : forme **ABA**."
      - type: ordre
        enonce: "Range les nuances de la plus douce à la plus forte."
        items: ["pianissimo (pp)", "piano (p)", "forte (f)", "fortissimo (ff)"]
        correction: "pp, p, f, ff."

  - id: mus-periodes-styles
    titre: Périodes et styles de la musique savante
    classe: "1ʳᵉ"
    objectif: Je situe une œuvre dans les grandes périodes - Moyen Âge, Renaissance, baroque, classique, romantique, XXᵉ siècle - et j'en reconnais les traits.
    mots: [baroque, classique, romantique, basse continue]
    etapes:
      - dialogue:
          - mia: "Bach, Mozart, Chopin : trois génies, trois époques, trois façons de penser la musique."
          - zero: "Mais c'est tout de la « musique classique », non ?"
          - neo: "Dans la vie de tous les jours, oui. Pour un musicien, « classique » désigne une période précise, autour de Mozart."
      - a_quoi_ca_sert: "Situer une œuvre aide à la comprendre et à l'interpréter ; ces repères sont attendus dans les commentaires et à l'oral."
      - texte: |
          **Moyen Âge** (jusqu'au XVᵉ siècle) : chant grégorien, troubadours, premières polyphonies.

          **Renaissance** (XVᵉ et XVIᵉ siècles) : polyphonie vocale (Josquin des Prés).

          **Baroque** (vers 1600-1750) : **basse continue**, ornements, contrastes, naissance de l'opéra (Monteverdi, Vivaldi, Bach, Haendel).

          **Classique** (vers 1750-1820) : clarté, équilibre, **forme sonate**, symphonie et quatuor (Haydn, Mozart, Beethoven à ses débuts).

          **Romantique** (XIXᵉ) : expression des émotions, grand orchestre, virtuosité (Chopin, Schubert, Berlioz, Wagner).

          **XXᵉ siècle et après** : impressionnisme (Debussy), atonalité (Schoenberg), musique concrète et électronique, minimalisme (Steve Reich).
      - astuce: { texte: "Clavecin et basse continue → baroque ; phrases équilibrées et claires → classique ; grand orchestre et émotions débordantes → romantique.", qui: neo }
      - retiens: "**Baroque** (1600-1750 : basse continue, Bach, Vivaldi) ; **classique** (1750-1820 : équilibre, forme sonate, Mozart) ; **romantique** (XIXᵉ : émotion, Chopin, Wagner) ; **XXᵉ** : Debussy, Schoenberg, électronique, minimalisme."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque compositeur à sa période."
        paires: [["Vivaldi", "baroque"], ["Mozart", "classique"], ["Chopin", "romantique"], ["Steve Reich", "minimalisme (XXᵉ siècle)"]]
        correction: "Vivaldi, Mozart, Chopin, Reich : quatre époques."
      - type: ordre
        enonce: "Range les périodes dans l'ordre chronologique."
        items: ["Renaissance", "Baroque", "Classique", "Romantique"]
        correction: "Renaissance, baroque, classique, romantique."
      - type: qcm
        enonce: "Qu'est-ce qui caractérise surtout la musique baroque ?"
        choix: ["La basse continue", "La guitare électrique", "L'atonalité", "Le sampling"]
        correction: "La **basse continue** (clavecin, violoncelle…) soutient l'harmonie à l'époque baroque."
      - type: vf
        vars: { t: [["La période classique se situe vers 1750-1820.", true], ["Debussy est un compositeur baroque.", false], ["L'opéra naît à l'époque baroque.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Classique 1750-1820 ; Debussy est du début du XXᵉ siècle ; l'opéra naît vers 1600."

  - id: mus-musiques-actuelles
    titre: Jazz, blues, rock, hip-hop, électro
    classe: Terminale
    objectif: Je reconnais les traits des grandes musiques populaires du XXᵉ siècle et leurs filiations.
    mots: [blues, swing, riff, sample]
    etapes:
      - dialogue:
          - neo: "Le rock, le jazz, le hip-hop ont un ancêtre commun : le blues, né chez les Afro-Américains du sud des États-Unis."
          - zero: "Même le rap ?"
          - mia: "Oui ! Par la soul et le funk, puis par les DJ du Bronx dans les années 1970."
      - a_quoi_ca_sert: "Les musiques actuelles sont celles que tu écoutes ; comprendre leur histoire et leurs techniques aide à les jouer, les produire et en parler."
      - texte: |
          **Le blues** : grille de **12 mesures** (trois accords : I, IV et V), « blue notes », thème de la mélancolie.

          **Le jazz** (Nouvelle-Orléans, début du XXᵉ siècle) : **swing**, **improvisation**, **standards** (Louis Armstrong, Duke Ellington, Miles Davis).

          **Le rock** (années 1950) : guitare électrique, **riff** (motif répété), batterie très présente (Elvis Presley, The Beatles).

          **Le hip-hop** (Bronx, années 1970) : rap (texte scandé), **DJing**, **sample** (extrait d'un morceau réutilisé), **beat**.

          **L'électro** : sons de synthèse, **boucles**, production sur ordinateur (MAO), house et techno nées à Chicago et Détroit.
      - astuce: { texte: "Un riff se répète, une improvisation s'invente sur le moment, un sample se recycle.", qui: zero }
      - retiens: "**Blues** (12 mesures, accords I, IV et V) → **jazz** (swing, improvisation) → **rock** (guitare électrique, riff) ; **hip-hop** (Bronx, années 1970 : rap, DJ, sample) ; **électro** (synthèse, boucles, MAO)."
    exercices:
      - type: nombre
        enonce: "Combien de mesures compte la grille de blues classique ?"
        reponse: "12"
        correction: "La grille de blues compte **12** mesures."
      - type: relier
        enonce: "🔗 Relie chaque style à un trait caractéristique."
        paires: [["le jazz", "le swing et l'improvisation"], ["le rock", "le riff de guitare électrique"], ["le hip-hop", "le sample et le rap"], ["l'électro", "les boucles de sons de synthèse"]]
        correction: "Chaque style a sa signature sonore."
      - type: qcm
        enonce: "Où et quand naît le hip-hop ?"
        choix: ["Dans le Bronx, à New York, dans les années 1970", "À Vienne au XVIIIᵉ siècle", "À Liverpool en 1960", "À Paris en 1895"]
        correction: "Dans le Bronx, au début des années 1970."
      - type: vf
        vars: { t: [["Un sample est un extrait d'un morceau réutilisé dans un autre.", true], ["Le jazz est né à Chicago dans les années 1990.", false], ["Le blues utilise souvent trois accords.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Sample = extrait réutilisé ; jazz né à La Nouvelle-Orléans au début du XXᵉ siècle ; blues : I, IV, V."

  - id: mus-pratique-creation
    titre: Jouer, arranger, créer
    classe: Terminale
    objectif: Je construis une grille d'accords, j'arrange un morceau pour une formation et je présente un projet musical.
    mots: [accord, grille, arrangement, interprétation]
    etapes:
      - dialogue:
          - mia: "Pour ton projet, tu veux reprendre une chanson connue avec un quatuor à cordes."
          - zero: "Je recopie la partition ?"
          - neo: "Tu l'arranges : tu répartis la mélodie, l'harmonie et la basse entre les instruments, et tu fais des choix personnels."
      - a_quoi_ca_sert: "La pratique et la création sont au cœur de la spécialité ; arranger et produire un morceau, c'est le métier des arrangeurs, réalisateurs et compositeurs à l'image."
      - texte: |
          **Les accords de base** (en do majeur) : **do, mi, sol** (I, do majeur), **fa, la, do** (IV), **sol, si, ré** (V). Un accord majeur = tierce majeure + tierce mineure.

          **Une grille** : la suite des accords d'un morceau (I, V, VI, IV : très fréquente dans la pop).

          **Arranger** : répartir les rôles (**mélodie**, **accompagnement**, **basse**, **rythme**), choisir les timbres, ajouter une introduction, un pont, varier la texture.

          **Interpréter** : tempo, nuances, phrasé, intention ; s'écouter dans le groupe.

          **Présenter un projet** : l'intention, les choix musicaux, les difficultés, ce qu'on a appris.
      - attention: "Un arrangement n'est pas une copie : on doit pouvoir dire ce qu'on a changé et pourquoi (timbres, tempo, structure)."
      - astuce: { texte: "Pour trouver les accords d'une chanson, cherche d'abord la basse : elle donne souvent la note de l'accord.", qui: neo }
      - retiens: "Accords en do : **I = do, mi, sol**, **IV = fa, la, do**, **V = sol, si, ré**. **Grille** = suite d'accords. **Arranger** = répartir mélodie, accompagnement, basse, rythme et faire des choix. Présenter : **intention**, **choix**, **recul**."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque accord à ses notes (tonalité de do majeur)."
        paires: [["I (do)", "do, mi, sol"], ["IV (fa)", "fa, la, do"], ["V (sol)", "sol, si, ré"]]
        correction: "Les trois accords principaux de do majeur."
      - type: classer
        enonce: "Range chaque rôle dans l'arrangement d'un groupe : mélodie ou accompagnement ?"
        categories: ["Mélodie", "Accompagnement"]
        mots: [["La voix qui chante le refrain", 0], ["Les accords plaqués au piano", 1], ["Le solo de saxophone", 0], ["La ligne de basse", 1]]
        correction: "La mélodie porte le thème ; l'accompagnement le soutient (harmonie, basse, rythme)."
      - type: qcm
        enonce: "Quelle phrase décrit le mieux un arrangement ?"
        choix: ["Adapter un morceau à une formation en faisant des choix de timbres et de structure", "Recopier la partition d'origine", "Jouer plus fort", "Changer seulement le titre"]
        correction: "Arranger, c'est adapter et réinterpréter."
      - type: ordre
        enonce: "Range les moments de la présentation d'un projet musical."
        items: ["L'intention de départ", "Les choix musicaux", "Les difficultés rencontrées", "Ce que j'ai appris"]
        correction: "Intention, choix, difficultés, bilan."

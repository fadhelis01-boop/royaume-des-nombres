id: fr-archipel-des-propositions
matiere: francais
titre: L'Archipel des Propositions
sous_titre: Phrase complexe, coordination, relatives, subordonnées, discours rapporté
emoji: 🏝️
couleur: "#00838f"
cycle: explorateurs
age: 11-15 ans
niveau: 5ᵉ – 3ᵉ
ordre: 53
prerequis: [fr-port-des-phrases]
version: 1.0.0
intro:
  - neo: "Chaque île est une proposition : un verbe conjugué et ses compagnons. Des ponts relient les îles."
  - mia: "Ponts de virgule, ponts « et, mais, donc », et ponts secrets « qui, que, dont, où ». Reconstruisons-les !"

lecons:
  - id: phrase-simple-complexe
    titre: "Phrase simple, phrase complexe"
    objectif: Je compte les propositions d'une phrase (une par verbe conjugué).
    mots: [proposition, phrase complexe]
    etapes:
      - dialogue:
          - neo: "Un verbe conjugué = une proposition. « Le chat dort. » : une proposition, phrase simple."
          - mia: "« Le chat dort pendant que la souris danse. » : deux verbes conjugués, deux propositions. Phrase complexe !"
      - a_quoi_ca_sert: "Repérer les propositions, c'est comprendre comment sont construites les longues phrases des textes difficiles."
      - texte: |
          - **Phrase simple** : **un seul** verbe conjugué → une seule proposition.
          - **Phrase complexe** : **plusieurs** verbes conjugués → plusieurs propositions.

          *[Il pleut] [et le vent souffle].* → 2 propositions.
          Attention : un **infinitif** ou un **participe** seul ne forme pas une proposition à lui seul ici.
      - astuce:
          texte: "Une proposition = un verbe conjugué. Compte les verbes conjugués et tu connais le nombre de propositions."
          qui: zero
      - retiens: "Je **compte les verbes conjugués** : autant de verbes conjugués, autant de **propositions**."
    exercices:
      - type: nombre
        vars: { t: [["Le chat dort.", 1], ["Le chat dort et la souris danse.", 2], ["Je pense qu'il viendra demain.", 2], ["Quand il pleut, je lis, j'écris et je rêve.", 4], ["Nous allons jouer dehors.", 1], ["Le livre que tu m'as prêté est passionnant.", 2], ["Il court, il saute, il rit.", 3]] }
        enonce: "Combien de propositions dans : « {{t_0}} » ?"
        reponse: "t_1"
        correction: "{{t_1}} verbe(s) conjugué(s) → {{t_1}} proposition(s)."
      - type: surligner
        vars: { t: ["Le chat [dort] et la souris [danse].", "Je [pense] qu'il [viendra].", "Quand il [pleut], nous [restons] à la maison.", "La maison qu'il [habite] [est] ancienne."] }
        enonce: "Touche les verbes conjugués."
        phrase: "{{t}}"
        correction: "Chaque verbe conjugué est le cœur d'une proposition."
      - type: classer
        vars: { t: [["Il pleut.", "Il pleut et il vente.", "Nous partons demain matin.", "Je sais que tu mens."], ["Le soleil brille.", "Elle rit parce qu'il plaisante.", "Les enfants jouent au ballon.", "Viens quand tu veux."]] }
        enonce: "Phrase simple ou complexe ?"
        categories: [simple, complexe]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Complexe = plusieurs verbes conjugués."

  - id: coordination
    titre: "Juxtaposer et coordonner : mais, ou, et, donc, or, ni, car"
    objectif: Je relie des propositions par une ponctuation (juxtaposition) ou une conjonction de coordination.
    mots: [juxtaposition, coordination, conjonction]
    etapes:
      - dialogue:
          - zero: "Mais où est donc Ornicar ? …C'est qui, Ornicar ? 😳"
          - mia: "C'est la phrase magique pour retenir les conjonctions de coordination : mais, ou, et, donc, or, ni, car !"
      - a_quoi_ca_sert: "Relier des idées avec les bons mots rend un texte logique et agréable à lire."
      - texte: |
          - **Juxtaposition** : propositions reliées par une **ponctuation** (virgule, point-virgule, deux-points) : *Il pleut, je reste.*
          - **Coordination** : reliées par une **conjonction de coordination** : **mais, ou, et, donc, or, ni, car** (*Mais où est donc Ornicar ?*) : *Il pleut **donc** je reste.*

          Chaque conjonction a un sens : **mais** (opposition), **car** (cause), **donc** (conséquence), **ou** (choix), **et** (ajout), **ni** (négation), **or** (argument).
      - astuce:
          texte: "Les conjonctions de coordination tiennent dans une phrase : « Mais où est donc Ornicar ? » (mais, ou, et, donc, or, ni, car)."
          qui: mia
      - retiens: "**Mais où est donc Ornicar** : mais, ou, et, donc, or, ni, car. Chacune a un **sens**."
    exercices:
      - type: qcm
        vars: { t: [["Il pleut, … nous restons à l'intérieur.", "donc", "mais", "car"], ["Je voulais venir … j'étais malade.", "mais", "donc", "ou"], ["Il est fatigué … il a mal dormi.", "car", "donc", "ni"], ["Tu viens avec nous … tu restes ?", "ou", "car", "donc"], ["Il n'aime … le thé … le café.", "ni … ni", "et … et", "ou … ou"]] }
        enonce: "Complète : {{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [[mais, quand, donc, parce que], [car, si, et, lorsque], [ou, qui, ni, puisque]] }
        enonce: "Conjonction de coordination ou non ? (pense à Ornicar)"
        categories: ["coordination", "autre mot"]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Mais, ou, et, donc, or, ni, car."
      - type: qcm
        vars: { t: [["mais", "opposition", "cause", "conséquence"], ["car", "cause", "opposition", "choix"], ["donc", "conséquence", "cause", "ajout"], ["ou", "choix", "conséquence", "cause"]] }
        enonce: "Quel sens exprime « {{t_0}} » ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "« {{t_0}} » exprime : {{t_1}}."

  - id: relatives
    titre: "Les propositions relatives : qui, que, dont, où"
    objectif: Je choisis le bon pronom relatif et je repère l'antécédent.
    mots: [proposition relative, pronom relatif, antécédent]
    etapes:
      - dialogue:
          - neo: "« Le livre. Je lis le livre. » → « Le livre que je lis ». Le pronom relatif « que » remplace « le livre » et relie les deux îles."
      - a_quoi_ca_sert: "Les relatives permettent d'apporter des précisions sans faire deux phrases : « Le livre que tu m'as prêté est génial »."
      - texte: |
          La **proposition relative** complète un nom (son **antécédent**) et commence par un **pronom relatif** :
          - **qui** = sujet : *le chien **qui** aboie* (le chien aboie)
          - **que** = COD : *le livre **que** je lis* (je lis le livre)
          - **dont** = complément introduit par **de** : *l'ami **dont** je parle* (je parle de l'ami)
          - **où** = lieu ou temps : *la ville **où** je vis*, *le jour **où** il est né*
      - astuce:
          texte: "Qui remplace un sujet, que un COD, dont un complément avec « de », où un lieu ou un temps. Teste en refaisant deux phrases."
          qui: neo
      - retiens: "**qui** sujet, **que** COD, **dont** = de…, **où** = lieu/temps. L'**antécédent** est le nom remplacé."
    exercices:
      - type: qcm
        vars: { t: [["Le garçon … court est mon frère.", qui, que, dont], ["Le gâteau … tu as fait est délicieux.", que, qui, où], ["Le film … je t'ai parlé est sorti.", dont, que, qui], ["La maison … j'ai grandi est vendue.", où, que, dont], ["L'ami … je pense arrive demain.", "à qui", dont, où], ["Les fleurs … tu m'as offertes sont fanées.", que, qui, dont]] }
        enonce: "Complète avec le bon pronom relatif : {{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: surligner
        vars: { t: ["Le [chien] qui aboie appartient au voisin.", "La [ville] où je suis né est au bord de la mer.", "J'ai lu le [livre] que tu m'as conseillé.", "C'est l'[ami] dont je t'ai parlé."] }
        enonce: "Touche l'antécédent (le nom que remplace le pronom relatif)."
        phrase: "{{t}}"
        niveau: 2
        correction: "L'antécédent est juste avant le pronom relatif."
      - type: mot
        vars: { t: [["J'ai un chat. Ce chat est roux.", "J'ai un chat qui est roux."], ["Voici le livre. Je lis ce livre.", "Voici le livre que je lis."], ["C'est la ville. J'habite dans cette ville.", "C'est la ville où j'habite."], ["Je connais l'auteur. Tu parles de cet auteur.", "Je connais l'auteur dont tu parles."]] }
        enonce: "Relie les deux phrases avec un pronom relatif : {{t_0}}"
        reponse: "{{t_1}}"
        niveau: 2
        correction: "{{t_1}}"

  - id: conjonctives
    titre: "Les subordonnées conjonctives : que, quand, parce que, pour que, si"
    objectif: Je reconnais la subordonnée complétive (que) et les circonstancielles (temps, cause, but, condition).
    mots: [subordonnée conjonctive, complétive, circonstancielle]
    etapes:
      - dialogue:
          - mia: "« Je sais que tu viendras » : la subordonnée « que tu viendras » est COD du verbe savoir."
          - neo: "« Je viendrai quand tu voudras » : la subordonnée dit QUAND. C'est une circonstancielle de temps."
      - a_quoi_ca_sert: "Les subordonnées expriment des liens logiques (cause, but, condition) : elles sont indispensables pour argumenter et expliquer."
      - texte: |
          - **Complétive** (introduite par **que**), souvent COD : *Je pense **qu'il a raison**.*
          - **Circonstancielles** : elles jouent le rôle d'un complément circonstanciel :
            - **temps** : quand, lorsque, pendant que, avant que, dès que
            - **cause** : parce que, puisque, comme
            - **but** : pour que, afin que (+ subjonctif)
            - **condition** : si
            - **conséquence** : si bien que, de sorte que
            - **opposition / concession** : bien que, alors que, même si
      - astuce:
          texte: "Demande-toi quelle question répond la subordonnée : pourquoi ? (cause), dans quel but ? (but), à quelle condition ? (condition), quand ? (temps)."
          qui: zero
      - retiens: "**que** + complétive (COD) ; **quand / parce que / pour que / si…** → circonstancielle (temps, cause, but, condition…)."
    exercices:
      - type: qcm
        vars: { t: [["Je partirai quand tu arriveras.", "temps", "cause", "but"], ["Il reste chez lui parce qu'il est malade.", "cause", "temps", "condition"], ["Parle fort pour qu'on t'entende.", "but", "cause", "temps"], ["Si tu viens, je serai content.", "condition", "but", "temps"], ["Bien qu'il pleuve, nous sortons.", "concession", "cause", "condition"]] }
        enonce: "« {{t_0}} » — Quel sens a la subordonnée ?"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [["Je crois qu'il ment.", "Je pars quand il arrive.", "Elle dit que tout va bien.", "Il pleure parce qu'il a mal."], ["Nous savons que c'est vrai.", "Viens si tu veux.", "J'espère que tu vas bien.", "Il travaille pour que tu réussisses."]] }
        enonce: "Complétive (COD) ou circonstancielle ?"
        categories: [complétive, circonstancielle]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "La complétive répond à « quoi ? » après le verbe."
      - type: qcm
        vars: { t: [["Je travaille pour que tu (réussis/réussisses).", "réussisses", "réussis"], ["Bien qu'il (est/soit) tard, je lis.", "soit", "est"], ["Je pense qu'il (viendra/vienne).", "viendra", "vienne"], ["Afin qu'elle (comprend/comprenne), je répète.", "comprenne", "comprend"]] }
        enonce: "Indicatif ou subjonctif ? {{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}"]
        niveau: 2
        explications: ["", "Pour que, afin que, bien que → subjonctif ; je pense que → indicatif."]
        correction: "{{t_1}}"

  - id: discours-rapporte
    titre: "Discours direct et discours indirect"
    objectif: Je transforme des paroles au discours indirect en changeant les pronoms et les temps.
    mots: [discours direct, discours indirect, concordance des temps]
    etapes:
      - dialogue:
          - neo: "Discours direct : Lya dit : « Je suis contente. » Discours indirect : Lya dit qu'elle est contente."
          - mia: "Les guillemets disparaissent, les pronoms changent, et si le verbe introducteur est au passé, les temps reculent !"
      - a_quoi_ca_sert: "Rapporter les paroles de quelqu'un, on le fait tous les jours : « Il m'a dit qu'il viendrait »."
      - texte: |
          - **Direct** : les paroles sont citées entre **guillemets** : *Il dit : « Je viendrai demain. »*
          - **Indirect** : les paroles sont intégrées dans une **subordonnée** : *Il dit **qu'il viendra** le lendemain.*

          Si le verbe introducteur est au **passé**, les temps changent (concordance) :
          présent → **imparfait** ; futur → **conditionnel** ; passé composé → **plus-que-parfait** ; *demain* → *le lendemain*, *hier* → *la veille*.
          *Il a dit : « Je suis fatigué. »* → *Il a dit **qu'il était** fatigué.*
      - astuce:
          texte: "Au discours indirect, mets-toi à la place du narrateur : « je » devient « il », « ici » devient « là », « demain » devient « le lendemain »."
          qui: mia
      - retiens: "Indirect = **que** + changements de **pronoms**, de **temps** (si passé) et d'**indicateurs** (demain → le lendemain)."
    exercices:
      - type: mot
        vars: { t: [["Léa dit : « Je suis contente. »", "Léa dit qu'elle est contente."], ["Tom a dit : « J'ai faim. »", "Tom a dit qu'il avait faim."], ["Elle a dit : « Je viendrai. »", "Elle a dit qu'elle viendrait."], ["Il demande : « As-tu fini ? »", "Il demande si j'ai fini."], ["Papa a dit : « Je suis parti tôt. »", "Papa a dit qu'il était parti tôt."]] }
        enonce: "Mets au discours indirect : {{t_0}}"
        reponse: "{{t_1}}"
        correction: "{{t_1}}"
      - type: qcm
        vars: { t: [["Il a dit qu'il (viendra/viendrait).", "viendrait", "viendra"], ["Elle a annoncé qu'elle (est/était) malade.", "était", "est"], ["Il a promis qu'il (avait rangé/a rangé) sa chambre.", "avait rangé", "a rangé"], ["Elle dit qu'elle (viendra/viendrait) demain.", "viendra", "viendrait"]] }
        enonce: "Concordance des temps : {{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}"]
        explications: ["", "Regarde le temps du verbe introducteur : au passé, le futur devient conditionnel, le présent devient imparfait."]
        niveau: 2
        correction: "{{t_1}}"
      - type: classer
        vars: { t: [["Il a dit : « Je pars. »", "Il a dit qu'il partait.", "Elle demande : « Où vas-tu ? »", "Elle demande où je vais."]] }
        enonce: "Discours direct ou indirect ?"
        categories: [direct, indirect]
        mots: [["{{t_0}}", 0], ["{{t_1}}", 1], ["{{t_2}}", 0], ["{{t_3}}", 1]]
        correction: "Direct : guillemets ; indirect : une subordonnée."

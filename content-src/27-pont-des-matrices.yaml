id: pont-des-matrices
titre: Le Pont des Matrices
sous_titre: Tableaux de nombres, produit, systèmes et graphes
emoji: 🧮
couleur: "#37474f"
cycle: maitres
age: 17-18 ans et +
niveau: Terminale (maths expertes) – supérieur
ordre: 27
prerequis: [grotte-de-l-algebre]
version: 1.0.0
intro:
  - neo: "Le Pont des Matrices relie l'algèbre, la géométrie et l'informatique !"
  - mia: "Une matrice, c'est un tableau de nombres… mais on peut l'additionner, la multiplier, l'inverser !"
  - zero: "Et la matrice nulle ? Elle est remplie de moi ! C'est la plus belle matrice du monde."

lecons:
  - id: matrices-tableaux
    titre: Les matrices, des tableaux de nombres
    objectif: Je lis une matrice, sa taille et ses coefficients, et j'additionne deux matrices.
    mots: [matrice, coefficient]
    etapes:
      - dialogue:
          - mia: "Les ventes de glaces de deux magasins, trois parfums : un tableau à 2 lignes et 3 colonnes. C'est une matrice 2 × 3 !"
      - texte: |
          Une **matrice** de taille $n \times p$ a $n$ **lignes** et $p$ **colonnes**. Le coefficient $a_{ij}$ est à la ligne $i$, colonne $j$.
          $$A = \begin{pmatrix} 3 & 5 & 2 \\ 4 & 1 & 6 \end{pmatrix} \qquad a_{23} = 6$$
          - **Addition** (même taille) : coefficient par coefficient.
          - **Multiplication par un nombre** : on multiplie chaque coefficient.
      - a_quoi_ca_sert: "Les tableurs, les images numériques (chaque pixel est un coefficient), les jeux vidéo 3D, les réseaux de neurones de l'intelligence artificielle…"
      - question:
          type: nombre
          vars: { a: "1..9", b: "1..9", c: "1..9", d: "1..9" }
          enonce: "$A = \\begin{pmatrix} {{a}} & {{b}} \\\\ {{c}} & {{d}} \\end{pmatrix}$. Que vaut $a_{21}$ ?"
          reponse: "c"
          correction: "Ligne 2, colonne 1 : {{c}}."
      - astuce:
          texte: "Une matrice « n × p » a n lignes et p colonnes. Retiens « Lignes puis Colonnes », comme lire un livre : d'abord la ligne, puis la position dans la ligne."
          qui: neo
    exercices:
      - type: champs
        vars: { a: "-5..9", b: "-5..9", c: "-5..9", d: "-5..9", e: "-5..9", f: "-5..9", g: "-5..9", h: "-5..9" }
        enonce: "$\\begin{pmatrix} {{nb(a)}} & {{nb(b)}} \\\\ {{nb(c)}} & {{nb(d)}} \\end{pmatrix} + \\begin{pmatrix} {{nb(e)}} & {{nb(f)}} \\\\ {{nb(g)}} & {{nb(h)}} \\end{pmatrix}$"
        champs:
          - { avant: "haut gauche", reponse: "a+e" }
          - { avant: "haut droite", reponse: "b+f" }
          - { avant: "bas gauche", reponse: "c+g" }
          - { avant: "bas droite", reponse: "d+h" }
        correction: "$\\begin{pmatrix} {{nb(a+e)}} & {{nb(b+f)}} \\\\ {{nb(c+g)}} & {{nb(d+h)}} \\end{pmatrix}$"
      - type: nombre
        vars: { n: "2..5", p: "2..5" }
        enonce: "Combien de coefficients a une matrice de taille {{n}} × {{p}} ?"
        reponse: "n*p"
        correction: "{{n}} × {{p}} = {{n*p}}"
      - type: nombre
        vars: { k: "2..5", a: "-5..5" }
        enonce: "Dans ${{k}}A$, si $a_{11} = {{nb(a)}}$, que vaut le coefficient en haut à gauche ?"
        reponse: "k*a"
        correction: "{{nb(k*a)}}"

  - id: produit-matrices
    titre: Le produit de matrices
    objectif: Je calcule le produit de deux matrices 2 × 2 et d'une matrice par un vecteur.
    mots: [produit matriciel]
    etapes:
      - dialogue:
          - neo: "Le produit de matrices, c'est « ligne fois colonne » : on multiplie terme à terme et on additionne."
          - mia: "Attention, en général AB ≠ BA ! L'ordre compte."
      - texte: |
          $$\begin{pmatrix} a & b \\ c & d \end{pmatrix}\begin{pmatrix} e & f \\ g & h \end{pmatrix} = \begin{pmatrix} ae + bg & af + bh \\ ce + dg & cf + dh \end{pmatrix}$$
          Le coefficient (ligne $i$, colonne $j$) du produit = ligne $i$ de A « fois » colonne $j$ de B.

          **Matrice identité** $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$ : $AI = IA = A$.
      - attention:
          texte: "Le produit n'est pas commutatif : en général $AB \\neq BA$. C'est comme enchaîner deux transformations : tourner puis agrandir n'est pas toujours pareil qu'agrandir puis tourner."
          qui: neo
      - a_quoi_ca_sert: "Enchaîner des transformations géométriques en 3D (chaque image d'un jeu vidéo en calcule des millions !), les calculs des réseaux de neurones, les chaînes de Markov…"
      - question:
          type: nombre
          vars: { a: "-3..4", b: "-3..4", e: "-3..4", g: "-3..4" }
          enonce: "Coefficient en haut à gauche de $\\begin{pmatrix} {{nb(a)}} & {{nb(b)}} \\\\ 1 & 2 \\end{pmatrix}\\begin{pmatrix} {{nb(e)}} & 0 \\\\ {{nb(g)}} & 1 \\end{pmatrix}$ ?"
          reponse: "a*e + b*g"
          correction: "${{nb(a)}} \\times ({{nb(e)}}) + {{nb(b)}} \\times ({{nb(g)}}) = {{nb(a*e+b*g)}}$"
      - astuce:
          texte: "Ligne × colonne : chaque coefficient du produit est la rencontre d'une ligne de la 1ʳᵉ matrice avec une colonne de la 2ᵉ. Et AB ≠ BA en général !"
          qui: zero
    exercices:
      - type: champs
        vars: { a: "-3..3", b: "-3..3", c: "-3..3", d: "-3..3", e: "-3..3", f: "-3..3", g: "-3..3", h: "-3..3" }
        enonce: "Calcule $\\begin{pmatrix} {{nb(a)}} & {{nb(b)}} \\\\ {{nb(c)}} & {{nb(d)}} \\end{pmatrix}\\begin{pmatrix} {{nb(e)}} & {{nb(f)}} \\\\ {{nb(g)}} & {{nb(h)}} \\end{pmatrix}$."
        champs:
          - { avant: "haut gauche", reponse: "a*e+b*g" }
          - { avant: "haut droite", reponse: "a*f+b*h" }
          - { avant: "bas gauche", reponse: "c*e+d*g" }
          - { avant: "bas droite", reponse: "c*f+d*h" }
        correction: "$\\begin{pmatrix} {{nb(a*e+b*g)}} & {{nb(a*f+b*h)}} \\\\ {{nb(c*e+d*g)}} & {{nb(c*f+d*h)}} \\end{pmatrix}$"
      - type: champs
        vars: { a: "-4..4", b: "-4..4", c: "-4..4", d: "-4..4", x: "-4..4", y: "-4..4" }
        enonce: "Calcule $\\begin{pmatrix} {{nb(a)}} & {{nb(b)}} \\\\ {{nb(c)}} & {{nb(d)}} \\end{pmatrix}\\begin{pmatrix} {{nb(x)}} \\\\ {{nb(y)}} \\end{pmatrix}$."
        champs:
          - { avant: "haut", reponse: "a*x+b*y" }
          - { avant: "bas", reponse: "c*x+d*y" }
        correction: "$\\begin{pmatrix} {{nb(a*x+b*y)}} \\\\ {{nb(c*x+d*y)}} \\end{pmatrix}$"
      - type: vf
        enonce: "Vrai ou faux : pour toutes matrices carrées A et B de même taille, AB = BA."
        reponse: false
        correction: "Faux. Exemple : $\\begin{pmatrix} 0 & 1 \\\\ 0 & 0 \\end{pmatrix}\\begin{pmatrix} 0 & 0 \\\\ 1 & 0 \\end{pmatrix} = \\begin{pmatrix} 1 & 0 \\\\ 0 & 0 \\end{pmatrix}$ mais dans l'autre ordre on obtient $\\begin{pmatrix} 0 & 0 \\\\ 0 & 1 \\end{pmatrix}$."

  - id: inverse-systemes
    titre: Déterminant, inverse et systèmes
    objectif: Je calcule un déterminant 2 × 2, l'inverse d'une matrice et je résous un système avec AX = B.
    mots: [déterminant, matrice inverse]
    etapes:
      - dialogue:
          - mia: "Le système 2x + y = 5 et x + 3y = 10 s'écrit AX = B avec des matrices !"
          - neo: "Et si A est inversible, X = A⁻¹B. Le déterminant nous dit si c'est possible."
      - texte: |
          Pour $A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$ :
          - **Déterminant** : $\det A = ad - bc$.
          - Si $\det A \neq 0$, $A$ est **inversible** et $$A^{-1} = \frac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$$
          - Le système $AX = B$ a alors une unique solution $X = A^{-1}B$.
      - a_quoi_ca_sert: "Résoudre de grands systèmes (des milliers d'équations en météo, en économie, en ingénierie), le chiffrement de Hill, la photographie (correction des déformations)…"
      - question:
          type: nombre
          vars: { a: "-5..5", b: "-5..5", c: "-5..5", d: "-5..5" }
          enonce: "$\\det\\begin{pmatrix} {{nb(a)}} & {{nb(b)}} \\\\ {{nb(c)}} & {{nb(d)}} \\end{pmatrix} = ?$"
          reponse: "a*d - b*c"
          correction: "${{nb(a)}} \\times ({{nb(d)}}) - {{nb(b)}} \\times ({{nb(c)}}) = {{nb(a*d-b*c)}}$"
      - astuce:
          texte: "Déterminant d'une matrice 2 × 2 : ad − bc. S'il vaut 0, la matrice n'a pas d'inverse et le système n'a pas de solution unique."
          qui: mia
    exercices:
      - type: nombre
        vars: { a: "-6..6", b: "-6..6", c: "-6..6", d: "-6..6" }
        enonce: "Déterminant de $\\begin{pmatrix} {{nb(a)}} & {{nb(b)}} \\\\ {{nb(c)}} & {{nb(d)}} \\end{pmatrix}$ ?"
        reponse: "a*d-b*c"
        correction: "{{nb(a*d-b*c)}}"
      - type: champs
        vars: { x: "-5..5", y: "-5..5", a: "1..4", b: "1..3", c: "1..3", d: "1..4" }
        si: "a*d - b*c != 0"
        enonce: "Résous $\\begin{cases} {{a}}x + {{b}}y = {{nb(a*x+b*y)}} \\\\ {{c}}x + {{d}}y = {{nb(c*x+d*y)}} \\end{cases}$"
        champs:
          - { avant: "x =", reponse: "x" }
          - { avant: "y =", reponse: "y" }
        correction: "$\\det = {{a*d-b*c}} \\neq 0$ ; $x = {{nb(x)}}$, $y = {{nb(y)}}$."
      - type: vf
        vars: { a: "1..6", k: "2..4" }
        enonce: "La matrice $\\begin{pmatrix} {{a}} & {{k*a}} \\\\ 1 & {{k}} \\end{pmatrix}$ est-elle inversible ?"
        reponse: false
        correction: "$\\det = {{a}} \\times {{k}} - {{k*a}} \\times 1 = 0$ : non inversible (les lignes sont proportionnelles)."

  - id: graphes-markov
    titre: Graphes et chaînes de Markov
    objectif: J'utilise une matrice pour compter des chemins dans un graphe ou faire évoluer des probabilités.
    mots: [graphe, matrice d'adjacence, chaîne de Markov]
    etapes:
      - dialogue:
          - neo: "Trois îles reliées par des ponts. La matrice d'adjacence indique quels ponts existent."
          - mia: "Et en la mettant au carré, on compte les chemins en deux étapes ! Magique."
      - texte: |
          - **Matrice d'adjacence** d'un graphe : $m_{ij} = 1$ s'il y a une arête de $i$ vers $j$, 0 sinon. Le coefficient $(i, j)$ de $M^k$ compte les **chemins de longueur $k$** de $i$ à $j$.
          - **Chaîne de Markov** : on passe d'un état à un autre avec des probabilités fixes (matrice de transition $P$). Si $\pi_n$ est la répartition à l'étape $n$ (ligne), alors $\pi_{n+1} = \pi_n P$.
      - visuel:
          type: tableau
          lignes:
            - ["vers →", "Soleil", "Pluie"]
            - ["Soleil", "0,8", "0,2"]
            - ["Pluie", "0,4", "0,6"]
        legende: "Matrice de transition météo : s'il fait beau, il fait beau le lendemain avec probabilité 0,8."
      - a_quoi_ca_sert: "Le classement des pages web (l'algorithme PageRank de Google était fondé sur une chaîne de Markov), les prévisions météo, les GPS (plus courts chemins), les réseaux sociaux…"
      - question:
          type: nombre
          vars: { p: [0.7, 0.8, 0.9], q: [0.3, 0.4, 0.5] }
          enonce: "Beau temps → beau temps : {{nb(p)}} ; pluie → beau temps : {{nb(q)}}. Aujourd'hui il fait beau. Probabilité qu'il fasse beau dans 2 jours ?"
          reponse: "p*p + (1-p)*q"
          correction: "$ {{nb(p)}} \\times {{nb(p)}} + {{nb(1-p)}} \\times {{nb(q)}} = {{nb(p*p+(1-p)*q)}}$"
      - astuce:
          texte: "Dans une matrice de transition, chaque ligne additionne des probabilités : leur somme doit toujours faire 1."
          qui: neo
    exercices:
      - type: nombre
        vars: { p: [0.6, 0.8], q: [0.2, 0.4] }
        enonce: "Beau → beau : {{nb(p)}} ; pluie → beau : {{nb(q)}}. Il pleut aujourd'hui. Probabilité de beau temps demain ?"
        reponse: "q"
        correction: "Directement sur la matrice : {{nb(q)}}."
      - type: nombre
        vars: { p: [0.6, 0.7, 0.8], q: [0.2, 0.3, 0.4] }
        enonce: "Même chaîne : beau → beau {{nb(p)}}, pluie → beau {{nb(q)}}. Probabilité de beau temps « à long terme » (état stable) ?"
        reponse: "q/(1-p+q)"
        tolerance: 0.001
        indice: "À l'équilibre, $\\pi = {{nb(p)}}\\pi + {{nb(q)}}(1 - \\pi)$."
        correction: "$\\pi = \\frac{ {{nb(q)}} }{1 - {{nb(p)}} + {{nb(q)}}} \\approx {{nb(round(q/(1-p+q),3))}}$"
      - type: nombre
        enonce: "Triangle de 3 îles, chacune reliée aux deux autres (sans boucle). Combien de chemins de longueur 2 partent de l'île A et y reviennent ?"
        reponse: "2"
        correction: "A → B → A et A → C → A : 2 chemins (coefficient diagonal de $M^2$)."

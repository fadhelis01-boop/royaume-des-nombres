id: forge-informatique
titre: La Forge informatique
sous_titre: Licence d'informatique - complexité des algorithmes, programmation orientée objet, cryptographie et sécurité
emoji: 🖥️
couleur: "#263238"
cycle: maitres
age: 18-21 ans
niveau: Supérieur – Bac+3
ordre: 33
specialite: Licence d'informatique
version: 1.0.0
intro:
  - narrateur: "Derrière la Citadelle du Code, une forge où l'on fabrique des logiciels : des serveurs qui ronronnent, des écrans couverts de code, un coffre-fort numérique."
  - neo: "En licence d'informatique, on ne se contente plus de programmer : on mesure l'efficacité des algorithmes, on conçoit de grands logiciels, on les sécurise."
  - mia: "Ces bases servent dans tous les métiers du numérique, du développement à la cybersécurité."

lecons:
  - id: complexite-algorithmes
    titre: La complexité des algorithmes
    classe: Supérieur
    objectif: J'estime la complexité d'un algorithme avec la notation O et je compare les classes usuelles.
    mots: [complexité, notation O, logarithmique, quadratique]
    etapes:
      - dialogue:
          - zero: "Mon programme marche très bien sur 100 données. Sur un million, il tourne depuis une heure…"
          - neo: "Il est sans doute quadratique : multiplier les données par 10 000 multiplie son temps par 100 millions. La complexité permet de le prévoir."
      - a_quoi_ca_sert: "Choisir un algorithme efficace fait la différence entre un service qui répond instantanément et un service inutilisable dès que les données grossissent."
      - texte: |
          **La complexité en temps** : le nombre d'opérations en fonction de la taille $n$ des données, dans le pire des cas. On ne garde que le terme dominant : la **notation O**.

          **Les classes usuelles** (de la plus rapide à la plus lente) :
          - $O(1)$ : constant (lire une case d'un tableau) ;
          - $O(\log n)$ : logarithmique (recherche dichotomique) ;
          - $O(n)$ : linéaire (parcourir une liste) ;
          - $O(n \log n)$ : tri fusion, tri rapide en moyenne ;
          - $O(n^2)$ : quadratique (tri par sélection, deux boucles imbriquées) ;
          - $O(2^n)$ : exponentiel (tester toutes les parties d'un ensemble).

          **Exemple** : pour $n = 1\,000\,000$, un algorithme en $O(n \log n)$ fait environ 20 millions d'opérations ; un algorithme en $O(n^2)$, mille milliards.

          **La complexité en espace** mesure la mémoire utilisée.
      - astuce: { texte: "Deux boucles imbriquées sur n éléments donnent souvent du n² ; diviser le problème par deux à chaque étape donne du log n.", qui: mia }
      - retiens: "Notation **O** : terme dominant, pire des cas. $O(1)$ < $O(\\log n)$ < $O(n)$ < $O(n \\log n)$ < $O(n^2)$ < $O(2^n)$. Boucles imbriquées → $n^2$ ; division par deux → $\\log n$. Les tris efficaces sont en $O(n \\log n)$."
    exercices:
      - type: ordre
        enonce: "Range ces complexités de la plus rapide à la plus lente."
        items: ["$O(1)$", "$O(\\log n)$", "$O(n)$", "$O(n \\log n)$", "$O(n^2)$"]
        correction: "Constant, logarithmique, linéaire, quasi linéaire, quadratique."
      - type: nombre
        vars: { k: [2, 3, 10] }
        enonce: "Un algorithme quadratique traite $n$ données en 1 seconde. Combien de secondes lui faut-il pour {{k}} fois plus de données ?"
        reponse: "k^2"
        unite: s
        correction: "Temps proportionnel à $n^2$ : ${{k}}^2 = {{k^2}}$ secondes."
      - type: relier
        enonce: "🔗 Relie chaque algorithme à sa complexité."
        paires: [["la recherche dichotomique", "O(log n)"], ["le parcours d'une liste", "O(n)"], ["le tri fusion", "O(n log n)"], ["le tri par sélection", "O(n²)"]]
        correction: "Les complexités à connaître par cœur."
      - type: vf
        vars: { t: [["Deux boucles imbriquées sur n éléments donnent souvent une complexité en n².", true], ["Un algorithme exponentiel reste rapide pour de grandes données.", false], ["La notation O ne garde que le terme dominant.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "n² pour deux boucles ; l'exponentiel explose ; on garde le terme dominant."

  - id: programmation-objet
    titre: La programmation orientée objet
    classe: Bac+2
    objectif: Je définis classe, objet, attribut, méthode, encapsulation, héritage et polymorphisme.
    mots: [classe, objet, héritage, encapsulation]
    etapes:
      - dialogue:
          - mia: "Dans un jeu vidéo, il y a des centaines de personnages. On écrit le même code pour chacun ?"
          - neo: "Non : on écrit une classe Personnage, un modèle, puis on crée autant d'objets qu'on veut. Et un Mage peut hériter de Personnage."
      - a_quoi_ca_sert: "La programmation objet organise les grands logiciels (Java, Python, C++, C#) : jeux, applications, logiciels d'entreprise ; elle est au programme de toutes les licences d'informatique."
      - texte: |
          **Une classe** : un **modèle** qui décrit des **attributs** (les données) et des **méthodes** (les actions). Exemple : la classe `Compte` avec l'attribut `solde` et les méthodes `deposer` et `retirer`.

          **Un objet** : une **instance** de la classe (le compte de Léa, celui de Tom).

          **L'encapsulation** : on cache les attributs (privés) et on n'y accède que par des méthodes, ce qui protège les données (on ne peut pas mettre un solde négatif par erreur).

          **L'héritage** : une classe **fille** reprend les attributs et méthodes d'une classe **mère** et peut les compléter (`CompteEpargne` hérite de `Compte` et ajoute un taux d'intérêt).

          **Le polymorphisme** : une même méthode se comporte différemment selon l'objet (`calculer_frais` n'a pas le même effet pour un compte courant et un compte épargne).
      - astuce: { texte: "Classe = moule à gâteau ; objet = gâteau. Avec un seul moule, on fait autant de gâteaux qu'on veut.", qui: zero }
      - retiens: "**Classe** = modèle (attributs et méthodes) ; **objet** = instance. **Encapsulation** : protéger les données. **Héritage** : une classe fille reprend et complète la classe mère. **Polymorphisme** : une même méthode, des comportements différents."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque notion à sa définition."
        paires: [["la classe", "un modèle qui décrit données et actions"], ["l'objet", "une instance concrète de la classe"], ["l'héritage", "une classe reprend et complète une autre classe"], ["l'encapsulation", "cacher les données et y accéder par des méthodes"]]
        correction: "Les quatre piliers de la programmation objet."
      - type: classer
        enonce: "Classe `Voiture` : range chaque élément, attribut ou méthode ?"
        categories: ["Attribut", "Méthode"]
        mots: [["`couleur`", 0], ["`demarrer()`", 1], ["`vitesse`", 0], ["`freiner()`", 1]]
        correction: "Une donnée → attribut ; une action → méthode."
      - type: qcm
        enonce: "`Chien` et `Chat` héritent de `Animal`, et chacun redéfinit `crier()`. Quelle notion cela illustre-t-il ?"
        choix: ["Le polymorphisme", "La complexité", "Le chiffrement", "La récursivité"]
        correction: "Une même méthode, des comportements différents selon l'objet : **polymorphisme**."
      - type: vf
        vars: { t: [["Une classe peut servir à créer plusieurs objets.", true], ["L'encapsulation consiste à rendre toutes les données publiques.", false], ["Une classe fille peut ajouter des attributs à la classe mère.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Plusieurs instances ; encapsulation = protection ; héritage complété."

  - id: cryptographie-securite
    titre: Cryptographie et sécurité informatique
    classe: Bac+3
    objectif: Je distingue chiffrement symétrique, asymétrique et hachage, et je comprends leur usage pour sécuriser les communications et les mots de passe.
    mots: [chiffrement symétrique, chiffrement asymétrique, hachage, clé publique]
    etapes:
      - dialogue:
          - zero: "Quand je me connecte à ma banque, quelqu'un peut lire mon mot de passe sur le réseau ?"
          - neo: "Non, grâce au HTTPS : les échanges sont chiffrés. Et la banque ne stocke pas ton mot de passe en clair, mais son empreinte, son haché."
      - a_quoi_ca_sert: "La cryptographie protège les paiements, les messageries, les données de santé et les mots de passe ; la cybersécurité est l'un des métiers du numérique les plus recherchés."
      - texte: |
          **Le chiffrement symétrique** : la **même clé** chiffre et déchiffre (AES). Rapide, mais il faut partager la clé secrètement.

          **Le chiffrement asymétrique** : une **clé publique** (pour chiffrer, diffusée à tous) et une **clé privée** (pour déchiffrer, gardée secrète) ; exemple : RSA. Il sert aussi à la **signature numérique** (prouver l'auteur d'un message).

          **En pratique (HTTPS)** : l'asymétrique sert à échanger une clé de session, puis l'échange se fait en symétrique, plus rapide.

          **Le hachage** : une fonction à sens unique qui transforme une donnée en **empreinte** de taille fixe (SHA-256). On ne peut pas revenir en arrière. Les sites stockent l'empreinte des mots de passe (avec un **sel**), jamais le mot de passe lui-même.

          **Les bonnes pratiques** : mots de passe longs et uniques, gestionnaire de mots de passe, **double authentification**, mises à jour.
      - attention: "Un hachage n'est pas un chiffrement : on ne « déchiffre » pas un mot de passe haché, on compare des empreintes."
      - astuce: { texte: "Clé publique = cadenas ouvert que tout le monde peut fermer ; clé privée = la seule clé qui l'ouvre.", qui: mia }
      - retiens: "**Symétrique** : une seule clé (AES), rapide. **Asymétrique** : clé **publique** et clé **privée** (RSA), signature numérique. HTTPS combine les deux. **Hachage** : empreinte à sens unique (SHA-256), mots de passe stockés hachés et salés. **Double authentification**."
    exercices:
      - type: classer
        enonce: "Range chaque élément : chiffrement symétrique ou asymétrique ?"
        categories: ["Symétrique", "Asymétrique"]
        mots: [["Une seule clé secrète partagée", 0], ["Une clé publique et une clé privée", 1], ["AES", 0], ["RSA", 1]]
        correction: "Une clé → symétrique ; deux clés → asymétrique."
      - type: qcm
        enonce: "Comment un site sérieux stocke-t-il les mots de passe ?"
        choix: ["Sous forme d'empreinte hachée et salée", "En clair dans une base de données", "Chiffrés avec une clé affichée sur la page", "Dans un fichier texte public"]
        correction: "On stocke l'empreinte, jamais le mot de passe lui-même."
      - type: relier
        enonce: "🔗 Relie chaque outil à son rôle."
        paires: [["la signature numérique", "prouver l'auteur d'un message"], ["le hachage", "produire une empreinte à sens unique"], ["la double authentification", "exiger une seconde preuve d'identité"]]
        correction: "Trois outils de sécurité."
      - type: vf
        vars: { t: [["Un hachage peut être inversé pour retrouver la donnée d'origine.", false], ["HTTPS utilise à la fois chiffrement asymétrique et symétrique.", true], ["La clé privée doit rester secrète.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le hachage est à sens unique ; HTTPS combine les deux ; clé privée secrète."

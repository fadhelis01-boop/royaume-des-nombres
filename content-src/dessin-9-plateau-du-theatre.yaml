id: de-plateau-du-theatre
matiere: dessin
titre: Le Plateau du Théâtre
sous_titre: Spécialité théâtre - le jeu de l'acteur, la mise en scène, l'histoire du théâtre, analyser un spectacle
emoji: 🎭
couleur: "#880e4f"
cycle: maitres
age: 16-18 ans
niveau: 1ʳᵉ – Terminale
ordre: 609
specialite: Théâtre
version: 1.0.0
intro:
  - narrateur: "Derrière le Musée, un plateau de bois noir, trois projecteurs et un rideau rouge. Ici, l'art se fait avec le corps, la voix et l'espace."
  - mia: "La spécialité théâtre, c'est jouer, mettre en scène, aller voir des spectacles et apprendre à en parler."
  - neo: "Au théâtre, tout est signe : un geste, un silence, une lumière qui baisse."

lecons:
  - id: theatre-jeu-acteur
    titre: Le jeu de l'acteur
    classe: "1ʳᵉ"
    objectif: Je travaille la présence, la voix, le corps et l'écoute du partenaire, et je connais quelques grandes approches du jeu.
    mots: [présence, diction, improvisation, personnage]
    etapes:
      - dialogue:
          - zero: "Jouer, c'est faire semblant ?"
          - neo: "C'est plutôt être vraiment là, avec ton corps, ta voix et ton partenaire. Le public sent tout de suite quand un acteur n'écoute pas."
      - a_quoi_ca_sert: "La pratique est le cœur de la spécialité ; et la confiance à l'oral, l'écoute et l'expression du corps servent pour tous les oraux et dans tous les métiers."
      - texte: |
          **Les outils de l'acteur** :
          - la **présence** : être ancré, disponible, regard et respiration ;
          - la **voix** : projection, diction, rythme, silences ;
          - le **corps** : posture, gestes, déplacements, immobilité ;
          - l'**écoute** : réagir à ce que fait le partenaire, pas réciter son texte.

          **L'improvisation** entraîne l'écoute et l'imagination : accepter la proposition de l'autre et la prolonger (« oui, et… »).

          **Quelques approches** : **Stanislavski** (incarner le personnage de l'intérieur, sa vérité psychologique), **Brecht** (la **distanciation** : montrer le personnage pour faire réfléchir le spectateur plutôt que l'émouvoir).
      - astuce: { texte: "Avant d'entrer en scène : pieds bien posés, trois respirations lentes, un regard vers ton partenaire.", qui: mia }
      - retiens: "Acteur : **présence**, **voix**, **corps**, **écoute**. Improvisation : « **oui, et…** ». **Stanislavski** : vérité intérieure ; **Brecht** : **distanciation**, faire réfléchir."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque outil de l'acteur à un exercice."
        paires: [["la voix", "articuler un texte en exagérant chaque syllabe"], ["le corps", "traverser la scène comme un vieil homme"], ["l'écoute", "réagir à une proposition inattendue du partenaire"]]
        correction: "Chaque outil se travaille par des exercices précis."
      - type: relier
        enonce: "🔗 Relie chaque metteur en scène à son approche."
        paires: [["Stanislavski", "vivre le personnage de l'intérieur"], ["Brecht", "mettre à distance pour faire réfléchir"], ["Peter Brook", "un « espace vide » où tout peut naître"]]
        correction: "Trois grandes visions du jeu et du théâtre."
      - type: classer
        enonce: "Range chaque réaction en improvisation : elle aide la scène ou la bloque ?"
        categories: ["Aide", "Bloque"]
        mots: [["« Oui, et en plus le train part dans cinq minutes ! »", 0], ["« Non, ce n'est pas un train. »", 1], ["Reprendre l'idée du partenaire et l'enrichir", 0], ["Ignorer ce que vient de dire le partenaire", 1]]
        correction: "On accepte et on prolonge la proposition de l'autre."
      - type: vf
        vars: { t: [["Le silence fait partie du jeu de l'acteur.", true], ["Écouter son partenaire est moins important que connaître son texte.", false], ["La distanciation brechtienne cherche à faire réfléchir le public.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Silence, écoute et distanciation font partie du métier."

  - id: theatre-mise-en-scene
    titre: La mise en scène et la scénographie
    classe: "1ʳᵉ"
    objectif: Je nomme l'espace scénique et les éléments d'une mise en scène - décor, lumière, son, costumes - et j'en explique les choix.
    mots: [mise en scène, scénographie, cour, jardin]
    etapes:
      - dialogue:
          - mia: "Le même texte de Molière peut se jouer en costumes d'époque ou dans un bureau moderne."
          - zero: "C'est toujours la même pièce ?"
          - neo: "Le texte est le même, mais la mise en scène en propose une lecture. C'est tout l'art du metteur en scène."
      - a_quoi_ca_sert: "Comprendre les choix d'une mise en scène aide à créer ses propres projets et à analyser un spectacle ; ces métiers (régie, lumière, costumes, décor) recrutent dans tout le spectacle vivant."
      - texte: |
          **L'espace scénique** : le **plateau** ; **cour** (à droite vu du public) et **jardin** (à gauche vu du public) ; **lointain** (le fond) et **avant-scène** (près du public) ; les **coulisses**.

          **Le rapport scène-salle** : frontal (théâtre à l'italienne), bifrontal, circulaire, déambulatoire.

          **Les éléments de la mise en scène** :
          - la **scénographie** (décor, organisation de l'espace) ;
          - la **lumière** (créer une ambiance, isoler un personnage, marquer le temps) ;
          - le **son** et la musique ;
          - les **costumes**, le maquillage, les **accessoires** ;
          - la **direction d'acteurs** (déplacements, rythme, intentions).

          **Le metteur en scène** propose une **lecture** du texte : un choix d'époque, de ton, de sens.
      - attention: "Cour et jardin se repèrent depuis la salle : pour s'en souvenir, « J. C. » (Jésus-Christ) : Jardin à gauche, Cour à droite."
      - astuce: { texte: "Devant chaque choix de mise en scène, demande-toi : qu'est-ce que ça me fait comprendre de la pièce ?", qui: zero }
      - retiens: "Espace : **cour** (droite vue de la salle), **jardin** (gauche), **lointain**, **avant-scène**. Mise en scène : **scénographie**, **lumière**, **son**, **costumes**, **direction d'acteurs** ; une **lecture** du texte."
    exercices:
      - type: relier
        enonce: "🔗 Relie chaque mot à sa position, vue depuis le public."
        paires: [["cour", "à droite"], ["jardin", "à gauche"], ["lointain", "au fond de la scène"], ["avant-scène", "près du public"]]
        correction: "On se repère toujours depuis la salle."
      - type: classer
        enonce: "Range chaque élément : scénographie ou jeu de l'acteur ?"
        categories: ["Scénographie", "Jeu de l'acteur"]
        mots: [["Un escalier géant au centre du plateau", 0], ["Un personnage qui chuchote en tremblant", 1], ["Des panneaux de tissu qui changent de couleur", 0], ["Une démarche lente et lourde", 1]]
        correction: "L'espace et le décor → scénographie ; la voix et le corps → jeu."
      - type: qcm
        enonce: "Une lumière qui se resserre sur un seul personnage sert surtout à…"
        choix: ["l'isoler et attirer le regard sur lui", "éclairer le public", "économiser l'électricité", "cacher le décor par erreur"]
        correction: "La lumière guide le regard du spectateur."
      - type: vf
        vars: { t: [["Un même texte peut donner des mises en scène très différentes.", true], ["Le théâtre à l'italienne a un rapport frontal entre scène et salle.", true], ["Le côté cour est à gauche vu du public.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Plusieurs lectures sont possibles ; l'italienne est frontale ; cour = droite vue du public."

  - id: theatre-histoire
    titre: Repères d'histoire du théâtre
    classe: Terminale
    objectif: Je situe les grandes formes théâtrales, de la tragédie grecque au théâtre contemporain.
    mots: [tragédie, commedia dell'arte, classicisme, théâtre de l'absurde]
    etapes:
      - dialogue:
          - neo: "À Athènes, au Vᵉ siècle avant J.-C., des milliers de citoyens assistaient aux tragédies en plein air."
          - zero: "Et aujourd'hui, on joue encore leurs pièces ?"
          - mia: "Oui, Antigone de Sophocle se joue toujours, et elle a même été réécrite par Anouilh en 1944."
      - a_quoi_ca_sert: "Situer un spectacle dans l'histoire aide à comprendre ses choix ; ces repères sont attendus à l'écrit comme à l'oral de la spécialité."
      - texte: |
          **L'Antiquité grecque** : tragédie (Eschyle, Sophocle, Euripide) et comédie (Aristophane), avec un **chœur** et des acteurs masqués.

          **Le Moyen Âge** : mystères religieux, farces.

          **La commedia dell'arte** (Italie, XVIᵉ siècle) : improvisation, masques, personnages types (Arlequin, Pantalon).

          **Le classicisme français** (XVIIᵉ siècle) : règle des **trois unités** (temps, lieu, action) ; Corneille, Racine, Molière.

          **Le drame romantique** (XIXᵉ siècle) : Victor Hugo, *Hernani* (1830), refus des règles.

          **Le XXᵉ siècle** : la mise en scène devient un art ; **théâtre de l'absurde** (Beckett, *En attendant Godot*, 1953 ; Ionesco) ; théâtre engagé (Brecht).

          **Aujourd'hui** : écritures contemporaines, théâtre documentaire, mélange avec la vidéo, la danse, le cirque.
      - astuce: { texte: "Trois unités du classicisme : un seul jour, un seul lieu, une seule intrigue.", qui: neo }
      - retiens: "**Grèce** : tragédie, comédie, chœur. **Commedia dell'arte** : masques, improvisation. **Classicisme** : trois unités (Corneille, Racine, Molière). **Drame romantique** (Hugo, 1830). **XXᵉ** : mise en scène, **absurde** (Beckett), engagement (Brecht)."
    exercices:
      - type: ordre
        enonce: "Range ces formes théâtrales dans l'ordre chronologique."
        items: ["La tragédie grecque", "La commedia dell'arte", "Le classicisme français", "Le théâtre de l'absurde"]
        correction: "Antiquité, XVIᵉ, XVIIᵉ, XXᵉ siècle."
      - type: relier
        enonce: "🔗 Relie chaque auteur à son mouvement."
        paires: [["Sophocle", "la tragédie grecque"], ["Racine", "le classicisme"], ["Victor Hugo", "le drame romantique"], ["Samuel Beckett", "le théâtre de l'absurde"]]
        correction: "Quatre époques, quatre auteurs."
      - type: qcm
        enonce: "Quelles sont les trois unités du théâtre classique ?"
        choix: ["Temps, lieu, action", "Masque, chœur, décor", "Jardin, cour, lointain", "Comédie, tragédie, farce"]
        correction: "Une seule journée, un seul lieu, une seule intrigue."
      - type: vf
        vars: { t: [["La commedia dell'arte utilise des masques et des personnages types.", true], ["En attendant Godot est une tragédie grecque.", false], ["Les tragédies grecques comportaient un chœur.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Masques et types ; Godot relève de l'absurde (1953) ; le chœur est grec."

  - id: theatre-analyser-spectacle
    titre: Analyser un spectacle
    classe: Terminale
    objectif: J'analyse un spectacle vu - ce que j'ai vu et entendu, les choix de mise en scène, leur effet et ma réception.
    mots: [analyse, réception, signe, intention]
    etapes:
      - dialogue:
          - zero: "J'ai vu une pièce hier. Je dis juste si j'ai aimé ?"
          - neo: "Ton avis compte, mais il doit s'appuyer sur ce que tu as vu : l'espace, les acteurs, la lumière, et ce que cela t'a fait comprendre."
      - a_quoi_ca_sert: "L'analyse de spectacle est évaluée en spécialité ; et savoir parler d'une œuvre vivante, c'est le travail des critiques, des programmateurs et des médiateurs culturels."
      - texte: |
          **Avant** : se renseigner sur la pièce, l'auteur, la compagnie.

          **Pendant** : être attentif, retenir quelques images fortes.

          **Après**, organiser son analyse :
          1. **identifier** : titre, auteur, metteur en scène, compagnie, lieu, date ;
          2. **décrire** : espace et scénographie, lumière, son, costumes, jeu des acteurs, rapport au public ;
          3. **interpréter** : quelle lecture du texte ? quelles intentions ? quels effets sur le spectateur ?
          4. **réception** : ce que j'ai ressenti, en le **justifiant** par des moments précis.

          Un **carnet de bord** garde la trace des spectacles vus, avec croquis, notes et programmes.
      - attention: "« J'ai aimé » ou « je me suis ennuyé » ne suffit pas : explique quel moment, quel choix a produit cet effet."
      - astuce: { texte: "Juste après le spectacle, note trois images, trois sons et une phrase entendue : ce sera la base de ton analyse.", qui: mia }
      - retiens: "Analyser : **identifier**, **décrire** (espace, lumière, son, costumes, jeu), **interpréter** (lecture, intentions, effets), exprimer sa **réception** en la **justifiant**. Tenir un **carnet de bord**."
    exercices:
      - type: ordre
        enonce: "Range les étapes de l'analyse d'un spectacle."
        items: ["Identifier le spectacle", "Décrire ce que l'on a vu et entendu", "Interpréter les choix de mise en scène", "Exprimer et justifier sa réception"]
        correction: "Identifier, décrire, interpréter, recevoir."
      - type: classer
        enonce: "Range chaque phrase : description ou interprétation ?"
        categories: ["Description", "Interprétation"]
        mots: [["Le plateau est entièrement couvert de terre.", 0], ["Cette terre rappelle que les personnages sont prisonniers de leur condition.", 1], ["Les acteurs ne regardent jamais le public.", 0], ["Ce refus du regard isole chaque personnage dans sa solitude.", 1]]
        correction: "Décrire = ce que l'on voit ; interpréter = ce que cela signifie."
      - type: qcm
        enonce: "Quelle phrase exprime une réception justifiée ?"
        choix: ["La scène finale, plongée dans le noir avec la seule voix d'Antigone, m'a profondément ému.", "C'était bien.", "Je n'ai pas aimé.", "Il y avait des acteurs."]
        correction: "On relie son ressenti à un moment précis du spectacle."
      - type: vf
        vars: { t: [["Un carnet de bord garde la trace des spectacles vus.", true], ["L'analyse ne parle jamais de la lumière.", false], ["Son avis personnel doit s'appuyer sur des éléments précis.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Carnet de bord, lumière analysée, avis justifié."

id: uni-vie-des-etoiles
matiere: univers
titre: La Nébuleuse des Étoiles
sous_titre: La vie des étoiles, les galaxies, le Big Bang, les exoplanètes, les lois de Kepler
emoji: 🌟
couleur: "#241f6e"
cycle: maitres
age: 15 ans et +
niveau: Expert (2nde – Terminale)
ordre: 405
prerequis: [uni-systeme-solaire]
version: 1.0.0
intro:
  - narrateur: "Le Grand Neutre veut éteindre les étoiles elles-mêmes. Pour les rallumer, il faut savoir comment elles brillent, vivent et meurent."
  - mia: "Nous sommes faits de poussières d'étoiles. Littéralement !"

lecons:
  - id: comment-brille-une-etoile
    titre: "Comment brille une étoile"
    objectif: J'explique la fusion nucléaire et le lien couleur-température.
    mots: [fusion nucléaire, hydrogène, hélium, température de surface]
    etapes:
      - dialogue:
          - zero: "Le Soleil, c'est un énorme feu de bois ?"
          - mia: "Non, c'est bien plus fort : de la fusion nucléaire !"
      - a_quoi_ca_sert: "La fusion nucléaire fait briller le Soleil ; la reproduire sur Terre pourrait un jour fournir une énergie presque inépuisable."
      - texte: |
          Une **étoile** est une énorme boule de gaz très chaud. En son cœur (environ **15 millions de °C** pour le Soleil), les noyaux d'**hydrogène** fusionnent en **hélium** : c'est la **fusion nucléaire**. Une petite partie de la masse se transforme en énergie ($E = mc^2$) : le Soleil « perd » environ 4 millions de tonnes de masse par seconde !
          La **couleur** d'une étoile indique sa **température de surface** : **bleue** = très chaude (plus de 20 000 °C), **blanche**, **jaune** (le Soleil, environ 5 500 °C), **rouge** = plus froide (environ 3 000 °C).
      - astuce:
          texte: "Couleur des étoiles : bleu = très chaud, jaune = moyen (comme le Soleil), rouge = plus froid. C'est l'inverse des robinets !"
          qui: mia
      - retiens: "Étoile = fusion de l'hydrogène en hélium dans le cœur. Couleur ↔ température : bleu (très chaud) → rouge (moins chaud). Soleil : jaune, ≈ 5 500 °C en surface."
    exercices:
      - type: ordre
        vars: { t: [["une étoile rouge", "une étoile jaune comme le Soleil", "une étoile blanche", "une étoile bleue"]] }
        enonce: "Range ces étoiles de la plus froide à la plus chaude (en surface)."
        items: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "Rouge < jaune < blanche < bleue."
      - type: qcm
        vars: { t: [["Quelle réaction produit l'énergie du Soleil ?", "la fusion de l'hydrogène en hélium", "la combustion du charbon", "l'électricité statique"], ["Quelle est environ la température de surface du Soleil ?", "5 500 °C", "550 °C", "55 millions de °C"], ["Qu'indique la couleur d'une étoile ?", "sa température de surface", "son âge exact", "sa distance"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { t: [["Le Soleil brûle comme un feu de bois.", false], ["Une étoile bleue est plus chaude qu'une étoile rouge.", true], ["Le Soleil perd de la masse en brillant.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Ce n'est pas une combustion (il n'y a pas d'oxygène pour brûler) : c'est une fusion nucléaire."

  - id: vie-et-mort-des-etoiles
    titre: "La vie et la mort des étoiles"
    objectif: Je décris le destin d'une étoile selon sa masse.
    mots: [nébuleuse, géante rouge, naine blanche, supernova, étoile à neutrons, trou noir]
    etapes:
      - dialogue:
          - zero: "Les étoiles peuvent mourir ? Même le Soleil ?"
          - neo: "Oui, mais dans très longtemps : environ 5 milliards d'années. Chaque étoile a son destin."
      - a_quoi_ca_sert: "Les atomes de ton corps (le carbone, l'oxygène, le fer) ont été fabriqués dans des étoiles : tu es fait de poussière d'étoiles."
      - texte: |
          1. Une étoile **naît** dans une **nébuleuse** (un nuage de gaz et de poussières) qui s'effondre sous son propre poids.
          2. Elle passe l'essentiel de sa vie à fusionner de l'hydrogène (le Soleil a environ **4,6 milliards d'années** et en a encore à peu près autant devant lui).
          3. Sa **fin** dépend de sa **masse** :
          - une étoile comme le Soleil gonfle en **géante rouge**, puis devient une **naine blanche** qui refroidit lentement ;
          - une étoile **très massive** explose en **supernova** et laisse une **étoile à neutrons** ou un **trou noir**.
          Les supernovas dispersent les éléments fabriqués dans les étoiles (carbone, oxygène, fer…) : les atomes de notre corps ont été forgés dans des étoiles.
      - astuce:
          texte: "Plus une étoile est massive, plus elle vit vite et meurt de façon spectaculaire (supernova). Les petites étoiles finissent tranquillement en naines blanches."
          qui: neo
      - retiens: "Nébuleuse → étoile → (Soleil) géante rouge → naine blanche ; (très massive) supernova → étoile à neutrons ou trou noir. Nos atomes viennent des étoiles."
    exercices:
      - type: ordre
        vars: { t: [["une nébuleuse", "une jeune étoile", "une géante rouge", "une naine blanche"]] }
        enonce: "Remets dans l'ordre la vie d'une étoile comme le Soleil."
        items: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "Nébuleuse, étoile, géante rouge, naine blanche."
      - type: qcm
        vars: { t: [["Que devient le Soleil à la fin de sa vie ?", "une géante rouge puis une naine blanche", "un trou noir", "une supernova"], ["Que peut laisser une supernova ?", "une étoile à neutrons ou un trou noir", "une planète", "une comète"], ["Quel âge a environ le Soleil ?", "4,6 milliards d'années", "4 600 ans", "46 millions d'années"], ["D'où viennent le carbone et le fer de notre corps ?", "ils ont été fabriqués dans des étoiles", "ils ont toujours existé", "ils viennent de la Lune"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { t: [["Le Soleil deviendra un trou noir.", false], ["Une étoile naît dans un nuage de gaz et de poussières.", true], ["Les étoiles très massives finissent en explosant.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le Soleil n'est pas assez massif pour devenir un trou noir."

  - id: galaxies-et-big-bang
    titre: "Galaxies et Big Bang"
    objectif: Je situe notre galaxie et je connais l'histoire de l'Univers.
    mots: [galaxie, Voie lactée, expansion, Big Bang]
    etapes:
      - dialogue:
          - zero: "L'Univers a toujours existé ?"
          - mia: "Les scientifiques pensent qu'il a une histoire de 13,8 milliards d'années. Remontons le temps !"
      - a_quoi_ca_sert: "Comprendre l'histoire de l'Univers, c'est répondre à l'une des plus vieilles questions humaines : d'où venons-nous ?"
      - texte: |
          - Une **galaxie** est un immense ensemble d'étoiles, de gaz et de poussières. La nôtre, la **Voie lactée**, contient **100 à 400 milliards d'étoiles** ; elle a la forme d'un disque spiral d'environ **100 000 années-lumière** de diamètre. Le Soleil est à l'écart du centre.
          - Il existe des **centaines de milliards** de galaxies. La plus grande voisine de la nôtre, **Andromède**, est à environ 2,5 millions d'années-lumière.
          - Dans les années 1920, **Edwin Hubble** (et **Georges Lemaître**) montrent que les galaxies **s'éloignent** les unes des autres : l'Univers est en **expansion**.
          - En remontant le temps, l'Univers était très chaud et très dense : c'est le **Big Bang**, il y a environ **13,8 milliards d'années**. Ce n'est pas une explosion « dans » l'espace : c'est l'espace lui-même qui se dilate.
      - astuce:
          texte: "L'Univers a environ 13,8 milliards d'années. Si toute son histoire tenait en une année, l'humanité serait apparue le 31 décembre, dans les dernières minutes."
          qui: zero
      - retiens: "Voie lactée : 100 à 400 milliards d'étoiles, 100 000 al. Des centaines de milliards de galaxies. Univers en expansion, Big Bang il y a ≈ 13,8 milliards d'années."
    exercices:
      - type: qcm
        vars: { t: [["Comment s'appelle notre galaxie ?", "la Voie lactée", "Andromède", "le Système solaire"], ["Quel âge a l'Univers environ ?", "13,8 milliards d'années", "4,6 milliards d'années", "6 000 ans"], ["Que signifie « l'Univers est en expansion » ?", "les galaxies lointaines s'éloignent les unes des autres", "l'Univers rétrécit", "les étoiles grossissent"], ["Combien d'étoiles environ dans la Voie lactée ?", "100 à 400 milliards", "8", "1 million"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: ordre
        vars: { t: [["la Terre", "le Système solaire", "la Voie lactée", "l'Univers observable"]] }
        enonce: "Range du plus petit au plus grand."
        items: ["{{t_0}}", "{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "Terre < Système solaire < Voie lactée < Univers observable."
      - type: vf
        vars: { t: [["Le Big Bang est une explosion qui a eu lieu en un point de l'espace.", false], ["Le Système solaire est dans la Voie lactée.", true], ["Il existe des centaines de milliards de galaxies.", true]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Le Big Bang décrit un état très chaud et dense de tout l'Univers, dont l'espace s'est dilaté depuis."

  - id: exoplanetes-et-kepler
    titre: "Exoplanètes et lois de Kepler"
    objectif: Je connais les exoplanètes et j'utilise la 3ᵉ loi de Kepler.
    mots: [exoplanète, transit, loi de Kepler, période, demi-grand axe]
    etapes:
      - dialogue:
          - zero: "Il existe d'autres Terres autour d'autres étoiles ?"
          - neo: "On a déjà trouvé des milliers d'exoplanètes ! Partons à leur recherche."
      - a_quoi_ca_sert: "Chercher des exoplanètes, c'est chercher s'il existe d'autres mondes habitables. Plus de 5 000 ont déjà été découvertes."
      - texte: |
          - Une **exoplanète** tourne autour d'une autre étoile que le Soleil. La première autour d'une étoile semblable au Soleil (51 Pegasi b) a été découverte en **1995** par **Michel Mayor** et **Didier Queloz** (prix Nobel 2019). On en connaît aujourd'hui **plus de 5 000**. On les détecte souvent par **transit** : la planète passe devant son étoile et fait baisser légèrement sa lumière.
          - **Lois de Kepler** (début du XVIIᵉ siècle) : les planètes décrivent des **ellipses** dont le Soleil occupe un foyer ; elles vont plus vite près du Soleil ; et **3ᵉ loi** : $\dfrac{T^2}{a^3}$ est la même pour toutes les planètes (T : période de révolution, a : demi-grand axe). En années et en UA, pour le Système solaire : $T^2 = a^3$.
      - exemple:
          titre: L'année de Jupiter
          enonce: "Jupiter est à environ 5,2 UA du Soleil. Combien dure son année ?"
          etapes: ["$T^2 = a^3 = 5{,}2^3 \\approx 140{,}6$", "$T \\approx \\sqrt{140{,}6} \\approx 11{,}9$ ans"]
      - astuce:
          texte: "3ᵉ loi de Kepler : T² / a³ est le même pour toutes les planètes d'une même étoile. Plus une planète est loin, plus son année est longue."
          qui: mia
      - retiens: "Exoplanètes : plus de 5 000 connues, découvertes depuis 1995 (Mayor et Queloz). Kepler : ellipses ; $T^2 = a^3$ (années, UA)."
    exercices:
      - type: nombre
        vars: { a: [1, 4, 9, 16] }
        enonce: "Avec $T^2 = a^3$ (années et UA), quelle est la période T d'une planète à a = {{a}} UA ?"
        reponse: "a^1.5"
        tolerance: 0.01
        unite: ans
        correction: "T = √({{a}}³) = {{a^1.5}} ans."
      - type: qcm
        vars: { t: [["Comment détecte-t-on souvent une exoplanète ?", "par la petite baisse de lumière quand elle passe devant son étoile", "en la voyant au télescope comme la Lune", "en écoutant son bruit"], ["En quelle année a-t-on découvert la première exoplanète autour d'une étoile semblable au Soleil ?", "1995", "1905", "1609"], ["Quelle forme ont les orbites des planètes selon Kepler ?", "des ellipses", "des carrés", "des lignes droites"]] }
        enonce: "{{t_0}}"
        choix: ["{{t_1}}", "{{t_2}}", "{{t_3}}"]
        correction: "{{t_1}}"
      - type: vf
        vars: { t: [["On connaît aujourd'hui plus de 5 000 exoplanètes.", true], ["Une planète va plus vite quand elle est près de son étoile.", true], ["Plus une planète est loin du Soleil, plus son année est courte.", false]] }
        enonce: "Vrai ou faux : {{t_0}}"
        reponse: "t_1"
        correction: "Plus une planète est loin, plus son orbite est longue et lente : son année est plus longue."
